<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI level map</title>
<style>
  :root{--bg:#0b0e13;--ink:#e8ecf1;--muted:#8b95a3;--line:rgba(232,236,241,.12);--inc:#8fa2ff;--ch:#ff6b2c;--hz:#3fd0b6;--us:#ffc35c;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Arial,sans-serif;padding:32px max(16px,4vw)}
  h1{font-weight:300;font-size:32px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px}
  .legend{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:16px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
  .board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
  .col{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(143,162,255,var(--a))}
  .col h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em}
  .col .n{font-family:ui-monospace,Menlo,monospace;color:var(--muted);font-size:12px}
  .chip{border-radius:999px;padding:4px 10px;font-size:13px;border:1px solid var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 14%,transparent);overflow-wrap:anywhere}
  .chip.us{font-weight:700;box-shadow:0 0 0 2px var(--us)}
  .chip.low{opacity:.6;border-style:dashed}
  .axis{margin-top:10px;padding:8px 14px;border-radius:8px;background:linear-gradient(90deg,rgba(143,162,255,.08),rgba(143,162,255,.25));color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
  @media (max-width:820px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1 id="title">AI level map</h1>
<p class="sub" id="sub"></p>
<div class="legend"><span style="--c:var(--inc)">Incumbent</span><span style="--c:var(--ch)">AI-native challenger</span><span style="--c:var(--hz)">Horizontal player</span><span style="--c:var(--us)">Us</span><span>Dashed: low confidence</span></div>
<div class="board" id="board"></div>
<div class="axis">Degree software expands into the work above it →</div>

<!-- Replace only the JSON below. group: incumbent | challenger | horizontal. level: 1–6. confidence: high | medium | low. -->
<script type="application/json" id="data">
{

  "date": "27 Oct 2026",
  "companies": [
    {

    },
    {

    },
    {

      "confidence": "low"
    },
    {
      "name": "Samsara",
      "group": "horizontal",
      "level": 3,
      "confidence": "medium"
    },
    {
      "name": "Motive",
      "group": "horizontal",
      "level": 3,
      "confidence": "medium"
    },
    {
      "name": "Geotab",
      "group": "horizontal",
      "level": 3,
      "confidence": "medium"
    },
    {
      "name": "MaintainX",
      "group": "horizontal",
      "level": 3,
      "confidence": "medium"
    },
    {
      "name": "RTA Fleet",
      "group": "incumbent",
      "level": 3,
      "confidence": "high"
    },
    {
      "name": "Collective Data",
      "group": "incumbent",
      "level": 3,
      "confidence": "medium"
    },
    {
      "name": "Trimble TMT",
      "group": "incumbent",
      "level": 3,
      "confidence": "low"
    },
    {
      "name": "Fullbay",
      "group": "incumbent",
      "level": 2,
      "confidence": "medium"
    },
    {
      "name": "Whip Around",
      "group": "incumbent",
      "level": 2,
      "confidence": "medium"
    },
    {
      "name": "Cetaris",
      "group": "incumbent",

      "confidence": "low"
    },
    {
      "name": "Chevin FleetWave",

    },
    {

  ]
}
</script>
<script>
  const LEVELS = ["System of Record", "AI Assisted", "AI Directed", "AI Delegated", "AI Domain Intelligence", "System of Understanding"];
  const C = { incumbent: "var(--inc)", challenger: "var(--ch)", horizontal: "var(--hz)" };
  const d = JSON.parse(document.getElementById("data").textContent);
  document.getElementById("title").textContent = `AI level map · ${d.vertical}`;
  document.getElementById("sub").textContent = `Snapshot from public sources on ${d.date}. Each company sits at the highest level it has shipped.`;
  document.getElementById("board").innerHTML = LEVELS.map((name, i) => {
    const here = d.companies.filter((c) => c.level === i + 1);
    return `<div class="col" style="--a:${0.03 + i * 0.03};min-height:${140 + i * 40}px"><span class="n">Level ${i + 1}</span><h2>${name}</h2>${here.map((c) => `<span class="chip ${c.us ? "us" : ""} ${c.confidence === "low" ? "low" : ""}" style="--c:${c.us ? "var(--us)" : C[c.group] || "var(--inc)"}">${c.name}</span>`).join("")}</div>`;
  }).join("");
</script>
</body>
</html>
