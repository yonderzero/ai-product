 [PM, illustrative]\npanel_role: influencer (adjacent segment)\n\n## Background\n- organisation: independent heavy-duty repair shop; 8 people, 5 technicians, the median shop in Fullbay's survey [source: https://www.freightwaves.com/?p=571607]\n- group position: independent, owner-run [source: https://www.freightwaves.com/?p=571607]\n- role and tenure: owner and service writer, 12 years since opening [assumed]\n- runs on: shop software for estimates, invoices and notes, such as Fullbay; the fleets' portals and email for approvals [source: https://fullbay.com/pricing/] [PM, illustrative]\n\n## Business\n- who signs: Tess [PM, illustrative]\n- budget route: new line in the shop's software spend [PM, illustrative]\n- what they are measured on: billed hours; labour rate, at a median $149 an hour; margin [source: https://www.freightwaves.com/?p=571607]\n- renewal or contract moment: annual agreement with her shop software [source: https://fullbay.com/pricing/]\n\n## Psychology\n- attitude to change: pragmatist; pays for tools that bill more hours [assumed]\n- trust in AI: uses AI to clean up notes, wary of anything that sets her prices [source: https://fullbay.com/pricing/] [PM, illustrative]\n- burned by: fleet portals that each want the job entered their own way [PM, illustrative]\n- will not tolerate: a fleet's system deciding her price or her schedule [PM, illustrative]\n- would pay for: complete, pre-approved jobs from fleets, and paid faster [PM, illustrative]\n\n## Capability\n- tech comfort: medium [assumed]\n- data they hold: her own estimates and invoices; little about the fleet's truck history [PM, illustrative]\n- time they can give a new tool: very little; a median 46-hour week already [source: https://www.freightwaves.com/?p=571607]\n\n## The problem, through their eyes\n- the problem in their words: \"A truck shows up with 'check engine' and a phone number. Then I wait for someone to approve.\" [PM, illustrative]\n- how often it hits them, and what it costs them: on most fleet jobs; bay time lost to waiting for approval [PM, illustrative]\n- what they do about it today: calls the fleet, re-enters the job, emails the estimate [PM, illustrative]\n- options they've tried or considered: AI note clean-up in her shop software [source: https://fullbay.com/pricing/]\n- what would make them switch: jobs that arrive with codes, history and an approval limit [PM, illustrative]\n- what worries them about a new way: giving fleets a view of her margins; another portal [PM, illustrative]\n\n## Behaviour\n- a normal day: opens the shop, checks which fleet trucks are booked, writes estimates and chases approvals between jobs [PM, illustrative]\n- workarounds: phone and email with each fleet [PM, illustrative]\n- last time it went wrong: a fleet truck sat in her bay waiting for approval while another job waited outside [PM, illustrative]\n- how they buy: a peer's recommendation and a trial [assumed]\n\n## Voice\n- sounds like: \"Send me the codes, the history and how much I can spend. I'll have it out today.\" [PM, illustrative]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| market | Median shop: 8 employees, 5 technicians; 70% independent | https://www.freightwaves.com/?p=571607 |\n| market | Labour at a median $149 an hour; 54% understaffed; 46-hour median week | https://www.freightwaves.com/?p=571607 |\n| market | Shop software at $188–$318 a month with AI notes | https://fullbay.com/pricing/ |\n| market | Agentic networks route and approve outside repairs for fleets | https://www.serviceup.com/blog/serviceup-launches-the-agentic-repair-platform-for-modern-fleets |\n| workaround | Fleets send outside work; half one distributor's repair spend goes outside | documents/interview-fleet-ops-director-distribution.md, line 22 |\n\nFields tagged: 28 · `[assumed]` 4 (14%). Nothing in `documents/` comes from a repair shop: this persona leans on public sources and `[PM, illustrative]`.\n", "roadmap/features.md": "# FleetDesk · Features, prioritised\n\n> Fictional example. FleetDesk, its customers and the product manager's answers are invented, tagged `[PM, illustrative]`. The personas are synthetic: what they say is a hypothesis, not evidence.\n\nFeatures for the flows taken forward in `../flows/flows.md` (the morning shortlist first, then say it, sign it), plus the best ideas from ideation, prioritised. Built on 27 Oct 2026.\n\n## Ideas\n\nWhere the features came from: the flows, the opportunities, the Imagine section, what customers and the panel asked for, and ideation with the product manager.\n\n| Idea | From | Flow it serves | Keep? |\n|---|---|---|---|\n| Read every overnight code, write-up and PM due, and group by truck | flow (shortlist, moment 1) | The morning shortlist | yes |\n| Rank trucks by risk with one line of why and the evidence behind it | flow (moments 2, 5); real customers (\"the actual codes, not a summary\") | The morning shortlist | yes |\n| Draft the work order: complaint, likely cause, VMRS code, expected parts | flow (moment 5); `../vision/opportunities.md` #1 | The morning shortlist | yes |\n| Approve, edit or reject with a one-line reason; the work order opens with the approver's name | flow (moment 6); panel (\"a named person on every action\", `../research/panel.md`) | The morning shortlist | yes |\n| The lead tech's one-tap strike with preset reasons, that truck only | panel round 1 and 2; real customer (shop supervisor) | The morning shortlist | yes |\n| \"Watching\": nothing hidden, days there, trucks come back when a code repeats | flow (moment 7); panel; real customer (maintenance manager) | The morning shortlist | yes |\n| A feed warning when codes or meters stop | flow (when it goes wrong); 18% of tickets are meter sync [documents/support-tickets-q3-2026.csv] | The morning shortlist | yes |\n| Parts on the shelf, read only, on each draft | `../research/panel.md` (for the buyer); panel round 2 (Glen) | The morning shortlist | yes |\n| A log of every decision, and whether the draft matched what the technician found | flow; `../discovery/discovery.md` (\"how we'll know\") | Both | yes |\n| A noise rule per model, approved by the manager, in a list she can review | panel round 2 (Rosa, Glen, Dwayne); both real customers | The morning shortlist | yes |\n| The buyer's weekly card: trucks pulled in, \"Watching\" trucks that broke down, trucks down at 5 am | panel (Glen, rounds 1 and 2); [documents/interview-fleet-ops-director-distribution.md] (\"prove it to the CFO\") | The morning shortlist | yes |\n| A morning text or email with the shortlist | ideation | The morning shortlist | merge into the shortlist page's morning message |\n| Hold to talk: the technician's words to complaint, cause and correction | flow (say it, sign it, moments 2–3); `../vision/opportunities.md` #3 | Say it, sign it | yes |\n| The technician confirms his time and signs; the recording stays with the truck; the promise in the customer agreement | flow; real customers (union, \"who listens to it?\"); panel round 2 | Say it, sign it | yes |\n| Suggest the VMRS code from the note | flow (moment 3) | Say it, sign it | yes |\n| End-of-shift list of notes the agent couldn't complete | flow (moment 5); panel (Rosa) | Say it, sign it | merge into \"hold to talk\" |\n| Flag parts still under warranty | `../research/experiences.md` #4; `../vision/opportunities.md` #5 | Say it, sign it | yes, later |\n| Reserve stock and draft purchase orders within limits | flow 3 (parts, later) | Parts on the bench | yes, later |\n| Rebook a missed PM | flow 4 (dispatch slot, later) | A slot that survives dispatch | yes, later |\n| Tune the ranking from rejections on its own | ideation | The morning shortlist | yes, later |\n| PTO hours for refuse trucks in the ranking | real customer (maintenance manager) | The morning shortlist | yes, later |\n| Freeze-frame data in \"Why this truck\" | real customer (shop supervisor) | The morning shortlist | yes, later |\n| The signed note as a page that travels with the truck to an outside shop | panel round 2 (Tess) | Say it, sign it | yes, later |\n| Small known jobs approved by rule, without a person | `../vision/vision.md` (level 4) | The morning shortlist | drop for now: no persona or customer would let a work order open without a named person |\n| Send overflow jobs to outside shops | flow 5 | Overflow | drop: real customers' outside shops won't use a new tool |\n| Message dispatch to ask when a truck is back | flow 4 | A slot that survives dispatch | drop: \"they'll never answer a message from a computer\" |\n\n## The features, prioritised\n\n| # | Feature | Kind | Flow | Value | Pay | Confidence | Effort | Priority | Horizon |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | Read and group overnight signals by truck | agent capability | Shortlist | 4 | 3 | Strong | 1 | 17.5 | Now |\n| 2 | Approve, edit or reject with a reason; opens with the approver's name | control | Shortlist | 4 | 3 | Strong | 1 | 17.5 | Now |\n| 3 | Feed warning when codes or meters stop | visibility | Shortlist | 3 | 2 | Strong | 1 | 12.5 | Now |\n| 4 | Rank trucks with one line of why and the evidence | agent capability | Shortlist | 5 | 4 | Good | 2 | 12.0 | Now |\n| 5 | Drafted work order | agent capability | Shortlist | 5 | 4 | Good | 2 | 12.0 | Now |\n| 6 | \"Watching\", with days there and trucks coming back | visibility | Shortlist | 4 | 2 | Good | 1 | 12.0 | Now |\n| 7 | Parts on the shelf, read only | visibility | Shortlist | 3 | 3 | Good | 1 | 12.0 | Now |\n| 8 | Lead tech's one-tap strike, that truck only | control | Shortlist | 4 | 2 | Good | 1 | 12.0 | Now |\n| 9 | Decision log, and whether the draft matched what was found | data | Both | 3 | 2 | Good | 1 | 10.0 | Now |\n| 10 | VMRS code from the note | agent capability | Say it, sign it | 3 | 2 | Good | 1 | 10.0 | Next |\n| 11 | Hold to talk: words to complaint, cause and correction | agent capability | Say it, sign it | 5 | 3 | Good | 3 | 8.0 | Next |\n| 12 | Technician confirms time and signs; recording with the truck; promise in the agreement | control | Say it, sign it | 4 | 2 | Good | 2 | 8.0 | Next |\n| 13 | The buyer's weekly card | visibility | Shortlist | 3 | 4 | Good | 3 | 7.0 | Next |\n| 14 | Noise rules per model, approved by the manager | control | Shortlist | 3 | 2 | Good | 2 | 6.7 | Next |\n| 15 | Flag parts still under warranty | agent capability | Say it, sign it | 4 | 4 | Thin | 3 | 4.0 | Later |\n| 16 | Reserve stock and draft purchase orders within limits | agent capability | Parts on the bench | 4 | 4 | Thin | 3 | 4.0 | Later |\n| 17 | PTO hours in the ranking | data | Shortlist | 3 | 2 | Thin | 2 | 3.3 | Later |\n| 18 | Rebook a missed PM | agent capability | Dispatch slot | 4 | 3 | Thin | 4 | 2.8 | Later |\n| 19 | Freeze-frame data in \"Why this truck\" | data | Shortlist | 3 | 2 | Thin | 3 | 2.5 | Later |\n| 20 | Tune the ranking from rejections on its own | agent capability | Shortlist | 4 | 2 | Assumption | 3 | 1.5 | Later |\n| 21 | The signed note as a page for outside shops | visibility | Say it, sign it | 2 | 1 | Assumption | 1 | 1.5 | Later |\n\n- **Value:** the hours it gives back and how much customers want it (real customers, then the panel).\n- **Pay:** how likely customers pay for it.\n- **Confidence:** the evidence grade (Strong 5, Good 4, Thin 2, Assumption 1).\n- **Effort:** 1 small, on data we already hold … 5 needs data or rights we don't have. Agreed with the product manager and the engineering lead `[PM, illustrative]`.\n- **Priority** = (value + pay) × confidence points ÷ (effort + 1).\n\n**The working:**\n\n- 1: (4 + 3) × 5 ÷ 2 = 17.5. 2: (4 + 3) × 5 ÷ 2 = 17.5. 3: (3 + 2) × 5 ÷ 2 = 12.5.\n- 4 and 5: (5 + 4) × 4 ÷ 3 = 12.0. 6: (4 + 2) × 4 ÷ 2 = 12.0. 7: (3 + 3) × 4 ÷ 2 = 12.0. 8: (4 + 2) × 4 ÷ 2 = 12.0.\n- 9 and 10: (3 + 2) × 4 ÷ 2 = 10.0. 11: (5 + 3) × 4 ÷ 4 = 8.0. 12: (4 + 2) × 4 ÷ 3 = 8.0. 13: (3 + 4) × 4 ÷ 4 = 7.0. 14: (3 + 2) × 4 ÷ 3 = 6.7.\n- 15 and 16: (4 + 4) × 2 ÷ 4 = 4.0. 17: (3 + 2) × 2 ÷ 3 = 3.3. 18: (4 + 3) × 2 ÷ 5 = 2.8. 19: (3 + 2) × 2 ÷ 4 = 2.5. 20: (4 + 2) × 1 ÷ 4 = 1.5. 21: (2 + 1) × 1 ÷ 2 = 1.5.\n\n**Why the horizons don't follow the order exactly:** the VMRS code from the note (10.0) scores above two Now features but needs the note first, so it moves with \"Say it, sign it\" into Next. The buyer's weekly card is Next because it needs the shortlist's own log to count anything, and trucks down at 5 am aren't recorded today.\n\n**Confidence, explained:** Strong where the evidence is past behaviour across several sources (the morning code list, meter-sync tickets, the named-person rule). Good where it rests on our interviews, the two new real interviews and the beta. Thin where only one source or the panel backs it. Assumption where nothing does.\n\n## This product update\n\nThe morning shortlist: the features in Now, the thinnest version in `../flows/flows.md`.\n\n1. Read and group overnight signals by truck.\n2. Approve, edit or reject with a one-line reason; the work order opens with the approver's name.\n3. A feed warning when codes or meters stop.\n4. Rank trucks with one line of why and the evidence.\n5. The drafted work order.\n6. \"Watching\", with days there and trucks coming back.\n7. Parts on the shelf, read only.\n8. The lead tech's one-tap strike, for that truck only.\n9. A log of every decision, and whether the draft matched what the technician found.\n\nPriced at $3 per powered vehicle a month as an add-on (`roi.md`).\n\n### The build-day slice\n\nThe smallest end-to-end slice of this update that developers can start with, to make the flow real and testable:\n\n- **The flow:** the morning shortlist, from the overnight signals to an approved work order.\n- **In:** one pilot fleet's last day of fault codes, driver write-ups and PMs due, read through the public API; grouped by truck; ranked with simple rules (severity from Fault Code Assist's library, repeats, a linked write-up, a PM due); one page with \"Pull in today\" (three to five trucks, each with one line of why and its raw codes) and \"Watching\" (everything else); a drafted work order for each pick; \"Approve\" opens it through the API with the approver's name; \"Reject\" saves a one-line reason; every decision written to a log.\n- **Out (for now):** the lead tech's strike, the parts line, the feed warning, days in \"Watching\" and trucks coming back, \"Plan this week\", the morning message, any learning from rejections, more than one fleet.\n- **Done when:** on the pilot fleet's real data in a test copy of its FleetDesk account, the page shows three to five trucks with reasons, approving one creates a real work order with the approver's name, rejecting one saves the reason, and the log holds every decision, so the waste hauler's maintenance manager can mark it against the trucks she would have pulled.\n- **Design:** follow `../flows/DESIGN.md`; it should look like `../flows/mockups/`.\n", "roadmap/roadmap.md": "# FleetDesk · Roadmap\n\n> Fictional example. FleetDesk, its documents, prices and the product manager's answers are invented, tagged `[PM, illustrative]`. Assumptions are tagged `[assumed]`.\n\nFrom the thinnest version to the BHAG, in three horizons. Outcomes first, features second. Built from `features.md`, `roi.md`, `../flows/flows.md`, `../research/experiences.md`, `../vision/vision.md` and `../problem/problem.md` on 27 Oct 2026.\n\n**The BHAG:** by 2029, every truck in a FleetDesk fleet is ready when dispatch needs it: road calls halved against 2026, and no one at a FleetDesk fleet reads a fault code by hand (`../problem/problem.md`).\n**The vision:** level 4, AI Delegated, by the end of 2028 (`../vision/vision.md`).\n\n| | Now | Next | Later |\n|---|---|---|---|\n| **The outcome for customers** | No one reads the overnight code list by hand; the manager approves a short list of trucks, with the reasons | Every work order closes with cause and correction, in the technician's words | Parts on the bench before the truck, and a plan that survives dispatch |\n| **Agentic experiences** | The morning shortlist, thinnest version | Say it, sign it, thinnest version | Parts on the bench; a slot that survives dispatch |\n| **Key features** | Read and group; rank with why; drafted work order; approve with a name; the lead tech's strike; \"Watching\"; feed warning; parts line, read only; decision log | Hold to talk; the technician confirms and signs; VMRS from the note; noise rules approved by the manager; the buyer's weekly card | Warranty flag; reserve stock and draft orders within limits; rebook a missed PM; PTO hours and freeze-frame data in the ranking |\n| **AI level** | 3 | 3 | 4 |\n| **Hours given back per customer** | About 300 a year | About 1,420 a year | About 1,945 a year |\n| **What customers pay for** | Trucks chosen and work orders drafted: $3 per powered vehicle a month | The shortlist and the notes: $6 | The full shop agent: $8 |\n| **New agent revenue per customer** | $7,200 a year | $14,400 a year | $19,200 a year |\n| **What we must learn first** | Will managers approve drafts without re-reading the codes? Who strikes, and when? Does the lead tech's hour really come back? | Will technicians talk to it in a loud shop? Can we write the notes promise into the agreement? Does the note match what the draft predicted? | Are counts after receiving right? Can we see dispatch's plan? Do our contracts allow learning across fleets? |\n| **How we'll know it worked** | Share of drafts approved unchanged; \"Watching\" trucks that later broke down; minutes the lead tech spends on codes; pilot fleets that pay $3 after the pilot | Work orders closed with cause and correction; warranty claims rejected for missing information; drafts whose likely cause matched the finding | Trucks waiting for parts each month; PMs found overdue rather than rebooked; road calls per million miles |\n\nHours and revenue per customer are for the ideal customer of about 200 powered vehicles (`roi.md`, `../research/experiences.md`). Across the 93 customers we assume would buy (`roi.md`): about $670,000 a year Now, $1.3M Next and $1.8M Later. The Next and Later prices are the plan, to be set from what the pilots show. `[PM, illustrative]`\n\n## Now\n\n**This product update: the morning shortlist.** One page before the shop opens: three to five trucks to pull in, each with one line of why, the evidence and a drafted work order; the lead tech strikes in one tap; the manager approves with her name; everything else stays in \"Watching\" and comes back if it gets worse. No parts ordering, bays or dispatch.\n\nIt comes first because it tests the riskiest assumption in `../problem/problem.md`, whether managers will let something else decide which trucks need work, and every later flow starts from a job it picks. It proves trust, not money: it gives back about 300 hours and saves a typical customer $9,900 a year after the $7,200 it costs (`roi.md`).\n\n**Start with** the build-day slice in `features.md`: one pilot fleet's real day of codes, write-ups and PMs, ranked onto one page, where \"Approve\" opens a real work order and every decision is logged. Then the waste hauler replays its own recent codes through the shortlist and marks it against the trucks it would have pulled [documents/interview-maintenance-manager-waste-hauler-flows.md], and the rest of the update fills in around what the pilot shows. The pilot is free; the price starts after it.\n\n## Next\n\n**The notes, and the number for the buyer.** \"Say it, sign it\" on the work orders the shortlist opened: the technician says what he found, the agent writes cause and correction, he confirms his time and signs. It gives back the most hours (about 1,120 a year) and records what the technician actually found, which tells us whether the shortlist picked the right trucks.\n\nBefore it ships, the promise goes into the customer agreement: notes and recordings stay with the truck's record, never timesheets or grading (`../flows/panel-tests.md`). With the notes and the shortlist's log, the buyer's weekly card becomes possible: trucks pulled in, \"Watching\" trucks that broke down, and trucks down at 5 am, for the CFO. That's what Glen needs before his renewal, with a bundled offer on the table [documents/interview-fleet-ops-director-distribution.md].\n\n## Later\n\n**The bench and the bays, toward level 4.** Parts on the bench before the truck, once counts after receiving can be trusted, so the agent reserves stock and drafts orders within limits the buyer sets. A slot that survives dispatch, once there's a way to see dispatch's plan. Warranty flags from complete notes, the first step toward a share of warranty money recovered (`../discovery/value.md`). Together these are the four in-shop experiences priced at $8 in `../research/experiences.md`, where a typical customer saves $82,700 a year.\n\n**Toward the BHAG.** Halving road calls needs ranking that learns from what codes led to across fleets: level 5. That waits on two things this roadmap builds and one it doesn't: the notes (Next) and the decision log (Now) make the record; legal must confirm that contracts allow learning across customers (`../discovery/discovery.md`, \"Don't\").\n\n## Not on the roadmap\n\n- **Overflow to a trusted shop.** Real customers' outside shops won't use a new tool. If it comes back, it lands in the shop's own software and is charged per job (`../flows/panel-tests.md`).\n- **Messaging dispatch from FleetDesk.** \"They'll never answer a message from a computer.\" The dispatch slot waits for dispatch's data instead.\n- **Small known jobs approved by rule, without a person.** No persona or customer would let a work order open without a named person yet.\n- **Outside invoices read and checked**, and **cost-per-mile benchmarks.** Still bets in `../discovery/discovery.md` and `../vision/opportunities.md`, but they solve a different problem from this one.\n- **Fleets under 75 vehicles and fleets without a telematics feed.** The shortlist needs the codes, and smaller fleets buy bundles on price (`../research/icp.md`).\n", "roadmap/roi.md": "# FleetDesk · ROI and pricing\n\n> Fictional example. FleetDesk, its documents, prices and the product manager's answers are invented, tagged `[PM, illustrative]`. Assumptions are tagged `[assumed]`. The personas are synthetic: their price vote is a hypothesis, not evidence.\n\nWhat this product update, the morning shortlist, is worth, to customers and to us, and how we charge for it. Built from `../research/experiences.md` (the double cost and the new economics), `../discovery/value.md`, `features.md` and the product manager's answers on 27 Oct 2026. Every number shows its working; assumptions are labelled.\n\n## For a typical customer\n\nThe ideal customer in `../research/icp.md`: about 200 powered vehicles on Pro, one or two shops, a telematics feed. Today's figures are the double cost in `../research/experiences.md`.\n\n| | Today | With this update |\n|---|---|---|\n| Licence | $31,200 | $31,200 |\n| Agents | – | $7,200 |\n| People's time using the product | $132,800 | $115,700 |\n| **Total a year** | **$164,000** | **$154,100** |\n\n- **They save:** $9,900 a year (6%); their people get about 300 hours back: the lead tech's morning code list drops from 250 hours to about 25, and the manager's review from 125 to about 50.\n- **Their return:** every $1 they pay for agents saves them $2.40 of labour ($17,100 ÷ $7,200).\n- **Not counted:** road calls avoided. One missed code at Rosa's carrier meant a tow, a rental tractor and a late load (`../research/panel.md`); at the waste hauler, a tow of about $1,400 and two late routes [documents/interview-maintenance-manager-waste-hauler-flows.md]. That's what the buyer pays for (\"I'd pay more if it cut downtime\", [documents/interview-fleet-ops-director-distribution.md]), but we have no measured rate of road calls avoided yet. The pilot measures it.\n\n**Working.** Labour saved: lead tech 225 h × $52 = $11,700, plus manager 75 h × $72 = $5,400, total $17,100, as in experience 1 of `../research/experiences.md`. People's time with the update: $132,800 − $17,100 = $115,700. Agents: $3 × 200 vehicles × 12 months = $7,200. The 200 vehicles is the ideal customer's typical size `[PM, illustrative]`; hourly costs and hours are measured or labelled in `../research/experiences.md`.\n\n**As the agents grow** (from `../research/experiences.md`, \"The new economics\"): with the notes added (Next), labour saved rises to $75,300 ($17,100 + $58,200) against $14,400 for agents at $6. With all four in-shop experiences live (Later), the customer saves $82,700 a year (50%), paying $19,200 for agents at $8.\n\n## For us\n\n| | Per customer a year | Across 93 customers who'd buy |\n|---|---|---|\n| New agent revenue | $7,200 | $669,600 |\n| Cost to run | $1,100 | $102,300 |\n| Cost to build (once) | $4,090 | $380,000 |\n| **Net, first year** | **$2,010** | **$187,300** |\n| **Net, each year after** | **$6,100** | **$567,300** |\n\n- **Customers who'd buy:** 93 = 310 customers with a telematics feed (measured, [documents/fault-code-assist-beta-feedback.md]) × 30% who'd buy (assumption) `[assumed]`. The shortlist needs the codes, so the base is the 310, not all 812.\n- **Revenue per customer:** $3 × 200 vehicles (assumption: the ideal customer's typical size; the 310's real average isn't known) × 12 = $7,200.\n- **Cost to build and run:** $380,000 to build: the agent as a service beside the monolith, the shortlist page, and an owner for AI quality and evaluation, the gap named in `../discovery/discovery.md` `[PM, illustrative]`. $1,100 per customer a year to run: model calls on a few hundred codes a night, plus hosting `[assumed]`.\n- **Fits the earlier sizing:** $669,600 sits inside the $524,000–$1,047,000 a year the problem's bigger job was sized at (`../problem/problem.md`). Not counted: revenue kept from the 37 customers with a bundled offer at renewal, $143,000–$286,000 a year (`../problem/framings.md`).\n\n## How we charge\n\n| Option | How it works | Fits when | Risk |\n|---|---|---|---|\n| Per outcome | per work order the manager approves from the shortlist | value is easy to count | rewards opening work orders, the opposite of what Dwayne wants; revenue swings with the season |\n| Per agent | a fixed price per agent, like a seat | buyers want predictable bills | one agent at a 200-vehicle fleet and at a 500-vehicle fleet does very different work |\n| Usage | per code read or per shortlist | usage varies a lot | hundreds of codes a night: bills feel unpredictable and punish noisy trucks |\n| Tier | the shortlist included in Pro | simple to sell; answers \"What does your AI do?\" | gives away the first agent before we know what it's worth; the vision proposed testing it (`../vision/vision.md`) |\n| **Per vehicle add-on** | a monthly price per powered vehicle, on top of the plan | customers already buy per vehicle [documents/product-one-pager.md]; scales with fleet size | a price rise last year cost 12 customers [documents/churn-note-2026.md] |\n\n**Our choice:** a per-vehicle add-on, at **$3 per powered vehicle a month**, trailers not counted, on Pro, where the telematics feed lives. After a free pilot on the customer's own trucks. `[PM, illustrative]`\n\nBecause:\n\n- customers already buy per vehicle, and both the manager and the buyer think in trucks; Rosa: \"Charge per tractor, not per trailer\";\n- $3 is a bargain for the user and the buyer personas, and well under where they'd find it expensive ($5–$7);\n- a real maintenance manager said \"a few dollars a truck\" is in her own budget; \"another Pro plan on top\" needs her general manager [documents/interview-maintenance-manager-waste-hauler-flows.md];\n- the panel asked to prove it on their own trucks before the price (`../research/panel.md`), so the pilot is free.\n\n- **Value-based check:** the price is 42% of the labour it saves ($7,200 of $17,100), before a single road call avoided. That's a larger share than the rule in `../research/experiences.md` (agents at about a fifth of the labour saved), because the shortlist's value is mostly trust and road calls, not hours. It falls back to about a fifth as the notes join ($14,400 of $75,300, 19%).\n- **Panel price vote** (Van Westendorp, $ per powered vehicle a month, for the shortlist only). *Synthetic vote: hypotheses, not evidence.*\n\n  | Persona | Too cheap to trust | A bargain | Getting expensive | Too expensive |\n  |---|---|---|---|---|\n  | Dwayne (sceptic) | $0.50 | $2 | $5 | $9 |\n  | Glen (buyer) | $1 | $3 | $7 | $12 |\n  | Rosa (user) | $1 | $3 | $7 | $14 |\n\n  An acceptable range of about $2 to $7, with $3 at the bargain point for two of three. Dwayne: \"Not my money. This is a guess at what Rosa could defend.\" Glen: \"It has to show fewer trucks down to be worth more than $3.\" Tess voted per overflow job, not per vehicle ($3 / $15 / $40 / $90): useful if overflow comes back, not for this update.\n- **Real customers said:** \"If it's a few dollars a truck, it's my budget. If it's another Pro plan on top, it's the general manager, and he'll ask what it replaces.\" (maintenance manager, waste hauler). The shop supervisor: \"Not my call. My manager would ask what it replaces.\" No buyer has been asked yet.\n- **What would change our mind:** a director of fleet operations who won't pay without a downtime number (then the buyer's weekly card moves into Now); pilot fleets approving few drafts unchanged (then it's not worth $3 yet); many Core customers with a feed outside FleetDesk, like Glen's fleet, who'd need Pro first (then offer the add-on on Core).\n\n## One pricing story\n\nEarlier files floated different numbers. Here is how they fit, and the one story we're keeping:\n\n- **$3 per powered vehicle a month for the morning shortlist, now.** It's the add-on the vision proposed to test (`../vision/vision.md`), and about 23% of Pro's $13, in line with the 25% uplift in the problem's sizing (`../problem/problem.md`). We chose the add-on over \"included in Pro\" because buyers will pay \"a few dollars a truck\" and we need to learn what the agent is worth.\n- **$6 when the notes join, in Next.** About a fifth of the labour the two flows save.\n- **$8 for the full shop agent, Later,** when the four in-shop experiences are live. That's the price in the new economics of `../research/experiences.md`; it was never the price for the shortlist alone, and no persona would pay it before a pilot.\n- **A share of warranty money recovered, later still,** as in `../discovery/value.md`, once notes make warranty claims possible.\n", "vision/ai-levels.md": "# FleetDesk · value at each AI level\n\n> Fictional example. FleetDesk and its features, customers and numbers are invented. The product manager's answers are tagged `[PM, illustrative]`.\n\n**Level today:** 1, System of Record: the highest level with value that is shipped and used. FleetDesk stores and runs the maintenance work; people do all of it.\n**Planned or in beta:** level 2, Fault Code Assist, in beta with 46 customers since May 2026 [documents/fault-code-assist-beta-feedback.md]. Beta doesn't count towards the level today.\n\n## Summary\n\n| Level | Value today? | Main features | For whom | How they pay |\n|---|---|---|---|---|\n| 1 System of Record | Yes, shipped and used by about 800 fleets | PM schedules, work orders, DVIR, parts, outside repairs, DOT records, reports | Maintenance manager, technician, parts manager, director of fleet operations | Per vehicle per month: Core $8, Pro $13, trailers $3 |\n| 2 AI Assisted | Beta only | Fault Code Assist: explains codes, rates urgency, suggests a repair code | Maintenance manager, lead technician | Free in beta; price undecided |\n| 3 AI Directed | No | none | | |\n| 4 AI Delegated | No | none | | |\n| 5 AI Domain Intelligence | No | none; 15 years of repair history is unused for this | | |\n| 6 System of Understanding | No | none | | |\n\n## Level 1 · System of Record\n\nPeople do the work; the product stores and runs it.\n\n| Feature | For whom | The value they get | How they pay | Status | Source |\n|---|---|---|---|---|---|\n| Preventive maintenance schedules by miles, engine hours or days, meters synced from Samsara, Motive and Geotab | Maintenance manager (user, influences the buy) | PMs done on time instead of \"off a wall calendar\"; fewer road calls | Included in Core | shipped and used | [documents/product-one-pager.md] [documents/interview-maintenance-manager-regional-carrier.md] |\n| Work orders with labor, parts, VMRS codes and sign-off, on desktop or tablet | Technician (user), maintenance manager | One record of every repair per vehicle | Included in Core | shipped and used | [documents/product-one-pager.md] |\n| Driver inspections (DVIR) in the Driver app, defects routed to the shop | Drivers, maintenance manager | Defects reach the shop the same day, with photos | Included in Core | shipped and used | [documents/interview-fleet-ops-director-distribution.md] |\n| Parts inventory and purchasing across shops, vendor price history | Parts manager (user) | Stock in the right shop; purchase orders tracked. The stickiest feature: churn 3% where used in two or more shops | Pro, $13 per vehicle per month | shipped and used | [documents/product-one-pager.md] [documents/churn-note-2026.md] |\n| Outside vendor repairs and invoices | Director of fleet operations, office staff | Every repair on one record, including dealers and roadside | Included in Core; invoices typed in by hand | shipped and used | [documents/interview-fleet-ops-director-distribution.md] |\n| DOT annual inspection records and audit reports | Maintenance manager, director of fleet operations | An audit file in ten minutes instead of a week | Included in Core | shipped and used | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Warranty tracking | Parts manager, maintenance manager | Sees warranty dates on parts, if someone checks | Pro | shipped, little used (4% of tickets) | [documents/support-tickets-q3-2026.csv] `[PM, illustrative]` |\n| Reports: cost per vehicle, PM compliance, technician productivity | Director of fleet operations | Monthly numbers, though cost per mile is still rebuilt in Excel | Included in Core | shipped and used | [documents/interview-fleet-ops-director-distribution.md] |\n\n## Level 2 · AI Assisted\n\nPeople do the work; AI suggests.\n\n| Feature | For whom | The value they get | How they pay | Status | Source |\n|---|---|---|---|---|---|\n| Fault Code Assist: explains a fault code in plain English, rates it act now / plan in / watch, suggests a VMRS repair code | Maintenance manager, lead technician | \"Saves my lead tech an hour a morning on the bad days\"; the person still opens and types the work order | Free during beta; add-on or Pro undecided | beta, 46 customers, 31 active in the last 30 days | [documents/fault-code-assist-beta-feedback.md] |\n\n## Level 3 · AI Directed\n\nA person asks; AI does one task; the person checks each result.\n\nnone. `[PM, illustrative]` Nothing planned yet. The beta's users already ask for it: \"If it already knows what the code is, why can't it start the work order and pull the parts?\" [documents/fault-code-assist-beta-feedback.md]\n\n## Level 4 · AI Delegated\n\nAI does the job end to end; people handle exceptions.\n\nnone.\n\n## Level 5 · AI Domain Intelligence\n\nAI brings expertise learned from data across many customers.\n\nnone. `[PM, illustrative]` FleetDesk holds about 2 million work orders a year across 800 fleets, and buyers ask \"How do we compare to fleets like us?\", but nothing uses this data across customers yet. [documents/lost-deals-h1-2026.md]\n\n## Level 6 · System of Understanding\n\nThe product understands how the domain works, anticipates and acts.\n\nnone.\n", "vision/market-map.md": "# AI level map · US fleet maintenance software\n\n> Fictional example: FleetDesk is invented. Every other company here is real, and placed from public sources retrieved on 27 Oct 2026.\n\nFleetDesk owns preventive maintenance, work orders, parts and DOT records for US trucking and delivery fleets of 50 to 500 vehicles that run their own shops (`../product.md`). Snapshot from public sources on 27 Oct 2026. Most metrics below are the vendors' own claims.\n\n## The market on the curve\n\n| Level | Incumbents | AI-native challengers | Horizontal players |\n|---|---|---|---|\n| 6 System of Understanding | | | |\n| 5 AI Domain Intelligence | | Uptake (low confidence) | |\n| 4 AI Delegated | Fleetio | ServiceUp | |\n| 3 AI Directed | RTA Fleet, Collective Data, Trimble TMT (low confidence) | | Samsara, Motive, Geotab, MaintainX |\n| 2 AI Assisted | Fullbay, Whip Around | | |\n| 1 System of Record | **FleetDesk (us)**, Cetaris, Chevin FleetWave, Decisiv | | |\n\n**Us:** level 1, because nothing AI is shipped and used. Fault Code Assist, in beta with 46 customers, would be level 2 once shipped; under the placement rules a beta counts as half a level at most, so we don't round up (`ai-levels.md`, `../documents/fault-code-assist-beta-feedback.md`). There is no public evidence for FleetDesk to check this against: it's the product manager's own reading, with the same rules applied. `[PM, illustrative]`\n\n## Company by company\n\n| Company | Group | Level | Its highest AI feature | Shipped / beta / announced | Confidence | Source | Heading towards |\n|---|---|---|---|---|---|---|---|\n| Fleetio | Incumbent | 4 | AI Service Advisor: prioritises issues, drafts work orders and approves low-risk repairs within limits the fleet sets; bigger repairs go to a person. The vendor reports over 2,000 issues a month resolved automatically and a named customer, Ramos Oil, saving about 1.5 hours a day | Shipped (generally available 25 Sep 2026, after a beta from March) | High | https://itbrief.co.uk/story/fleetio-opens-ai-service-advisor-after-maintenance-beta | Higher auto-approval limits: one customer raised its limit from $250 to $2,000 (search result: https://www.fleetio.com/resources/press/first-half-of-2026) |\n| ServiceUp | AI-native challenger | 4 | Agentic repair platform: intake, shop routing, estimate, approval and fraud agents; \"Autopilot\" runs outsourced repairs end to end against the fleet's policy | Shipped (launched 21 Jul 2026) | Medium | https://www.serviceup.com/blog/serviceup-launches-the-agentic-repair-platform-for-modern-fleets | Full autonomy for repairs done outside the fleet's shop; sits next to the fleet's maintenance system |\n| Uptake | AI-native challenger | 5 | Predictive failure models built on data from many fleets, each prediction tied to severity and cost; completed repairs feed back into the models | Shipped (long-standing); Bosch announced it is acquiring Uptake in March 2026 | Low: customer results are old and undated; a stricter reading would put it at 2 | https://www.fleetmaintenance.com/shop-operations/ai-and-software/article/55365401/robert-bosch-llc-bosch-acquires-uptake-to-strengthen-vehicle-health-predictive-maintenance-tools | Combined with Bosch's connectivity and fleet tools for fault-to-repair vehicle health (announced) |\n| Samsara | Horizontal | 3 | Agent Studio: no-code agents with maintenance templates, such as a daily maintenance and DVIR digest. June 2026 also brought a warranty claim agent, Shop Planner and automatic purchase orders | Agent Studio shipped (generally available 13 Oct 2026, per a search result: https://futurumgroup.com/?p=96840); the status of each maintenance feature isn't stated | Medium | https://www.samsara.com/company/news/press-releases/samsara-launches-new-agentic-capabilities-to-automate-tedious-operational-tasks · https://www.fleetmaintenance.com/shop-operations/ai-and-software/article/55386202/samsara-samsara-unleashes-agentic-ai-to-free-maintenance-teams-from-monotony | Level 4 in maintenance: purchase orders and warranty claims done by agents |\n| Motive | Horizontal | 3 | Motive Maintenance: AI reads repair invoices into records, explains fault codes with a severity rank, and turns defects and fault codes into work orders | Shipped 18 Aug 2026 | Medium | https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/ · https://www.freightwaves.com/news/fleet-repair-costs-ai-maintenance | Cost per mile and total cost of ownership, joining maintenance, telematics and fuel-card spend |\n| Geotab | Horizontal | 3 | Geotab Ace: an assistant that answers questions over fleet data, including maintenance trends, included in MyGeotab | Shipped; voice agent and predictive maintenance announced (Feb 2026) | Medium | https://fleetinsights.emkay.com/insights/geotab-connect-2026-ai-safety-and-the-future-of-fleet-management | Predictive maintenance (announced) |\n| MaintainX | Horizontal | 3 | CoPilot: answers from OEM manuals and work-order history, writes procedures; reporting AI | Shipped | Medium; fleet is a secondary market for it | https://www.nasdaq.com/articles/ai-effect-maintainx-sees-valuation-jump-25b-150m-series-d-raise (search result) | Agents for frontline teams (seen in a job posting only) |\n| RTA Fleet | Incumbent | 3 | Ron360: an assistant that answers questions on maintenance, cost and compliance data with charts and saves them to dashboards; it reports but doesn't act | Shipped Jun 2026, in all plans | High | https://worktruckonline.com/news/rta-introduces-ron360-ai-assistant-for-fleet360-users-at-government-fleet-expo-2026 | Spotting trends and recommending actions (announced) |\n| Collective Data | Incumbent | 3 | Document Intelligence: turns uploaded repair invoices into work orders with VMRS codes; \"Ask Anything\" over fleet data | Shipped (launched Apr 2026) | Medium | https://www.fleetmaintenance.com/shop-operations/data-and-telematics/article/55370589/collective-data-collective-data-ai-assistant | More document types (announced) |\n| Trimble TMT Fleet Maintenance | Incumbent | 3 | AI invoice scanning in release 2026.1 | Shipped, per a release webinar only | Low | https://transportation.trimble.com/en/asset-fleet-maintenance/videos/tmt-2026-latest-in-asset-maintenance | Not found |\n| Fullbay | Incumbent | 2 | Fullbay AI turns technicians' typed or dictated notes into clean repair records | Shipped May 2025; \"AI-native\" Fullbay Next rolling out from Aug 2026 | Medium | https://www.worktruckonline.com/news/fullbay-debuts-ai-tool-and-key-platform-upgrades | Predictive maintenance and parts forecasting from 5,000+ shops, after buying Pitstop in March 2026 (announced): https://www.motor.com/2026/03/fullbay-acquires-pitstop-to-advance-ai-predictive-maintenance/ |\n| Whip Around | Incumbent | 2 | AI Inspections Pro: checks inspection photos and flags defects the driver missed; paid add-on | Shipped | Medium | https://whiparound.com/inspect | Not found |\n| Cetaris | Incumbent | 1 | No AI feature described | n/a | Low | https://cetaris.com/events-blog/5-maintenance-management-takeaways-from-cetaris-summit-2025 (search result) | Clean data first, AI later |\n| Chevin FleetWave | Incumbent | 1 | None found; 2026 launches are a dashboard and apps | n/a | Medium | https://transportoperator.co.uk/2026/03/09/cv-show-2026-chevin-fleetwave-dashboard-preview/ (search result) | Dashboards and configuration |\n| Decisiv | Incumbent | 1 | None found; service cases open from fault codes by fixed rules | n/a | Low; sources from 2022–23 | https://www.forconstructionpros.com/construction-technology/product/21002995/decisiv-service-relationship-management-srm-system (search result) | Not found |\n\n## Not placed\n\n| Company | Why |\n|---|---|\n| Pitstop | Acquired by Fullbay in March 2026; its predictive maintenance is now part of Fullbay's plans (https://www.motor.com/2026/03/fullbay-acquires-pitstop-to-advance-ai-predictive-maintenance/) |\n| Platform Science | Bought Trimble's telematics units, not TMT; its maintenance AI comes through partners |\n| AssetWorks | No AI announcement found |\n| Fleetpal | Named in `market-moves.md`: free inspection app with AI repair coding on top; the AI coding wasn't checked closely enough to place it |\n| Penske Catalyst AI | Named in `market-moves.md`: a leasing company's fleet intelligence tool, sold as part of leasing, not maintenance software |\n| Microsoft Copilot, ChatGPT and other general assistants | No evidence they reach fleet maintenance work directly yet; see `market-moves.md` |\n| Newly funded AI-native fleet maintenance startups | Searches found no verifiable 2024–2026 funding round in this niche |\n\n## Openings\n\n- **Empty or thin levels:** nobody is at level 6, and level 5 has one low-confidence player that sells mostly to large fleets and OEMs. Level 4 has two, and neither runs the in-house shop end to end: Fleetio approves repairs, ServiceUp coordinates outside repairs. Turning a fault code into a planned, parted and scheduled job in the fleet's own shop is open.\n- **Moving up fastest:** Fleetio, from a beta in March to delegated approvals in September 2026; Samsara and Motive, which shipped maintenance AI in June and August 2026 and sell it with telematics.\n- **Where we could lead:** the mid-size fleet with its own shops and parts rooms, where FleetDesk already wins half its deals (`../documents/lost-deals-h1-2026.md`). Fifteen years of repair outcomes could support level 5 benchmarks and predictions for that segment, if contracts allow it.\n\n*Placements are a snapshot from public sources. Check the ones you act on.*\n", "vision/market-moves.md": "# FleetDesk · Who's moving in your market\n\n> Fictional example: FleetDesk is invented. Every company, product and number about the market here is real and sourced. \"Search result\" means the page was seen in search results but not opened.\n\nSnapshot from public sources on 27 Oct 2026.\n\n**In short:** all five ways into fleet maintenance are in use, and the strongest is the telematics vendors. Motive and Samsara now sell maintenance with AI in the same bill as their trackers, which matches what FleetDesk hears in lost deals and churn (`../documents/lost-deals-h1-2026.md`, `../documents/churn-note-2026.md`). This opens a clear space for FleetDesk: the fleet with its own shop, parts room and technicians, where the work after the fault code is still done by hand and nobody yet does it end to end.\n\n## Five ways others move into a market\n\n| Way in | What we found | Who | Seen / early signs / not seen | Source | What it means for us |\n|---|---|---|---|---|---|\n| A focused tool for one part of the product | Free or cheap driver inspection apps; parts-matching and tire tools; AI diagnostic help for technicians | Fleetpal made its inspection app free for fleets with 30+ trucks (22 Jul 2026) and sells AI repair coding on top. Whip Around sells inspections from $5 per asset per month. Gearflow (parts), PressurePro (tires), Preteckt (diagnosis) | Seen | https://www.worktruckonline.com/news/fleetpal-makes-its-driver-inspection-app-free-for-qualified-fleets · https://help.whiparound.com/en/articles/6925626-how-whip-around-s-plans-work · https://www.fleetmaintenance.com/shop-operations/article/53042552/preteckt-how-ai-can-empower-diagnostic-technicians (search result) | Inspections are becoming free. Our value is what happens after the defect: the repair, the parts and the record |\n| A simpler product for smaller customers | Lower per-vehicle prices, free trials and free tiers | Fleetio at $4 / $7 / $10 per vehicle per month with a 14-day trial; Simply Fleet with a free tier; Fullbay Next, \"AI-native\", for small shops first | Seen | https://www.fleetio.com/pricing · https://fullbay.com/blog/fullbay-next-heavy-duty-repair-shop-software/ | Below 75 vehicles we win a third of deals and lose most churn (`../documents/lost-deals-h1-2026.md`). Focus on fleets with their own shops rather than compete on price |\n| A layer that connects to the product and adds to it | Service networks and predictive layers that sit between fleets, dealers and OEMs | Decisiv connects 74,000 fleets and 5,000+ service locations and launched an alliance with PACCAR, Isuzu and Hino (Mar 2026). Bosch announced it is buying Uptake for predictive maintenance (Mar 2026). Fleetio connects to 1,200+ systems through Workato | Seen | https://www.thetechoutlook.com/press-release/decisiv-paccar-isuzu-hino-and-kpit-launch-the-srm-alliance/ · https://www.fleetmaintenance.com/shop-operations/ai-and-software/article/55365401/robert-bosch-llc-bosch-acquires-uptake-to-strengthen-vehicle-health-predictive-maintenance-tools | Predictions and dealer networks will plug into the shop's record. We can be the place they land, through open connections |\n| Reaching customers through another channel | Telematics vendors bundling maintenance with AI; leasing companies and OEM dealers bundling AI service | Motive Maintenance (18 Aug 2026): fault codes and defects become work orders automatically, invoices are read by AI. Motive Agents (20 Oct 2026) can open a work order and mark a truck out of service. Samsara (Jun 2026, early access): AI warranty claims, shop planning, automatic parts orders. Penske Catalyst AI for leasing customers; Volvo AI service intervals in dealer contracts | Seen | https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/ · https://www.truckinginfo.com/news/motive-adds-ai-agents-for-fleet-operations · https://www.samsara.com/blog/samsaras-new-innovations-increase-efficiency · https://www.truckingdive.com/press-release/20250512-penskes-catalyst-ai-powers-innovative-new-era-of-fleet-intelligence-1/ (search result) | The biggest move. Telematics vendors reach the CFO with one bill. We keep the shop by doing the shop's work better than a bundle can, and by working well with their data |\n| An AI product built on top of the product | General AI assistants reading fleet data through connectors | Geotab's connector (17 Jun 2026) lets ChatGPT, Claude and Copilot read fleet data and schedule maintenance. Truto publishes connectors from Fleetio to Claude and ChatGPT | Early signs | https://truckinginfo.com/news/what-geotabs-new-ai-connector-means-for-fleets · https://truto.one/blog/connect-fleetio-to-claude-track-fuel-faults-inspections/ (search result) | If general assistants become where managers ask questions, our records must be easy and safe for them to use, and our own agent must do more than answer |\n\n## What this opens up for us\n\n- **The shop's own work, end to end.** Telematics bundles turn a fault code into a work order. Nobody yet plans the job, orders the parts, books the bay and checks warranty in the fleet's own shop. That's where FleetDesk is deepest (`../documents/lost-deals-h1-2026.md`).\n- **The landing place for predictions.** Uptake, Bosch and Decisiv produce predictions and service cases; they need a shop record to act on. Open connections make FleetDesk that record.\n- **Working with telematics, not against it.** About 310 customers already stream codes from Samsara, Motive or Geotab into FleetDesk (`../documents/fault-code-assist-beta-feedback.md`). Doing more with that data than its source does is a reason to keep both.\n- **Ready for outside assistants.** A safe connection for ChatGPT, Claude or Copilot to read FleetDesk records would keep us in the conversation when managers ask those tools.\n\n## What we looked for and didn't find\n\n- A funded AI startup that writes work orders or diagnoses heavy trucks for technicians.\n- Maintenance programs from insurers, from parts distributors (FleetPride, TruckPro, Rush) or from Ryder.\n- A maintenance product from a fuel card company: Corpay lists \"fleet maintenance\" among its payment services, but no product (early signs at most).\n- An official Fleetio connector for Claude or ChatGPT.\n- Any 2026 news from Noregon, or confirmation that Bosch has closed the Uptake deal.\n- A standalone AI copilot that sits on top of several maintenance systems.\n", "vision/opportunities.md": "# FleetDesk · Opportunities\n\n> Fictional example. FleetDesk, its documents and numbers are invented; market facts are real and sourced. The product manager's answers are tagged `[PM, illustrative]`. Sources marked \"vendor\" are companies selling software for that step: the rules count them as one voice.\n\nBuilt from `../product.md`, `ai-levels.md`, `market-map.md`, `market-moves.md` and `documents/` on 27 Oct 2026.\n\n## The work around the product\n\n| # | Step | What happens | Who | Software | Still manual | Coverage | Who's moving here | Our AI level |\n|---|---|---|---|---|---|---|---|---|\n| 1 | Driver inspection and defects | Drivers do pre- and post-trip inspections; defects go to the shop | Driver, maintenance manager | FleetDesk Driver app, Whip Around, Fleetpal, telematics apps | Paper inspections at some fleets; drivers \"pencil-whip\" forms (search result: https://www.ccjdigital.com/business/article/14937883/how-electronic-dvirs-help-to-ensure-proper-truck-inspections); defects retyped into work orders where systems aren't joined (vendor: https://www.samsara.com/products/telematics/fleet-maintenance) | software | Fleetpal (free), Whip Around (AI photo checks), Motive | 1 |\n| 2 | Fault codes and triage | Telematics sends fault codes; someone decides which matter and opens a work order | Maintenance manager, lead technician | Samsara, Motive, Geotab, OEM portals, FleetDesk | Each code read and looked up by hand: \"My lead tech spends the first hour of his day as a fault-code clerk\" [documents/interview-maintenance-manager-regional-carrier.md]; 12% of our tickets [documents/support-tickets-q3-2026.csv]. Diagnostics ranked third in TMC fleet members' concerns, Fall 2025 (https://tmc.trucking.org/blog/tmc-fleet-members-top-maintenance-concerns-shift-considerably-fall-2025-spring-2026) | partial | Motive, Samsara, Fleetio, Uptake | 2 in beta (Fault Code Assist) |\n| 3 | PM and DOT inspection planning | Schedule PMs and annual inspections; plan the shop's day | Maintenance manager | FleetDesk, spreadsheets, whiteboards | Day planned on a whiteboard, then typed in; PMs missed when dispatch keeps a truck out, with nothing rescheduling it [documents/interview-maintenance-manager-regional-carrier.md]; meter sync is 18% of tickets [documents/support-tickets-q3-2026.csv]. Job postings ask fleet managers for Excel to coordinate 3/6/12-month DOT inspections (https://jobs.khoslaventures.com/companies/cloudtrucks/jobs/39004423-fleet-manager) | partial | Samsara (Shop Planner) | 1 |\n| 4 | Repair and work-order notes | Technician repairs, records complaint, cause and correction, labor, parts and VMRS code; manager reviews | Technician, maintenance manager | FleetDesk tablet and desktop | Techs spend an estimated 20–30 minutes per job typing and close with \"replaced\" [documents/interview-maintenance-manager-regional-carrier.md]; \"too many clicks to close a work order\" [documents/churn-note-2026.md]; postings require \"documentation that backs up the complaint, cause, and correction\" (search result: https://www.interviewpal.com/jobs/2119855443) | partial | Fullbay (AI note clean-up), Fleetio | 1 |\n| 5 | Parts and purchasing | Look up, stock, order and receive parts; return cores and warranty parts | Parts manager | FleetDesk Pro, vendor websites, spreadsheets | Trucks wait for parts the PM schedule predicted [documents/interview-fleet-ops-director-distribution.md]; counts off after receiving, 15% of tickets [documents/support-tickets-q3-2026.csv]; postings list cycle counts, POs and invoice checks by hand (search result: https://www.arjoblink.arkansas.gov/jobs/4462165) | partial | Samsara (automatic POs, early access) | 1 |\n| 6 | Warranty recovery | Check if a failed part is under warranty, tag it, file the claim | Parts manager, technician, maintenance manager | FleetDesk Pro (little used), OEM portals | \"Maybe a third\" recovered [documents/interview-maintenance-manager-regional-carrier.md]; \"coverage isn't visible at the moment of repair\" (vendor-sponsored: https://www.fleetowner.com/resources/white-papers/whitepaper/55409832/the-money-youre-already-owed-a-warranty-recovery-playbook) | manual | Samsara (warranty claim agent, early access), Fleetio | 1 |\n| 7 | Outside repairs and invoices | Send trucks to dealers and vendors; enter and check their invoices | Director of fleet operations, office staff | FleetDesk, email, accounting | Invoices arrive as PDFs and faxes and are typed in line by line [documents/interview-fleet-ops-director-distribution.md] [documents/interview-maintenance-manager-regional-carrier.md]; a five-page invoice \"could take an administrator 30 to 45 minutes to key in\" (Sobeys, quoted by vendor: https://www.samsara.com/ca/blog/sobeys-fleet-maintenance-ai) | partial | Motive, Samsara, Collective Data, RTA, Trimble TMT, ServiceUp, Fleetio | 1 |\n| 8 | DOT records and audits | Keep inspection, repair and annual inspection records; answer audits and roadside inspections | Maintenance manager | FleetDesk | Mostly covered: an audit file \"in ten minutes\" [documents/interview-maintenance-manager-regional-carrier.md]. Rules: maintenance records 1 year plus 6 months after a vehicle leaves (https://www.law.cornell.edu/cfr/text/49/396.3); periodic inspection every 12 months (https://www.law.cornell.edu/cfr/text/49/396.17) | software | Fleetio, Whip Around | 1 |\n| 9 | Cost per mile and downtime reporting | Report maintenance cost, downtime and availability to the CFO | Director of fleet operations | FleetDesk exports, Excel, fuel card portal | \"Two days a month, every month\" in Excel [documents/interview-fleet-ops-director-distribution.md]; 9% of tickets [documents/support-tickets-q3-2026.csv]. Repair and maintenance cost per mile rose 8.6% in 2025 (https://truckingresearch.org/2026/07/new-atri-report-details-accelerating-costs-and-low-profitability-despite-cuts/) | partial | Motive (cost per mile, heading), RTA, Geotab | 1 |\n\n## Opportunities, ranked\n\n| # | Opportunity | Kind | Level | Impact | Effort | Urgency | Evidence | Priority | Band |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | From fault code to a ready work order | Grow the base | 4 | 5 | 3 | 5 | Strong | 4.60 | Do first |\n| 2 | Outside invoices read and checked for you | Grow the base | 4 | 4 | 2 | 4 | Strong | 4.20 | Do first |\n| 3 | Technician notes from the technician's voice | Grow the base | 3 | 3 | 2 | 4 | Strong | 3.85 | Do first |\n| 4 | Parts ready before the truck arrives | Grow the base | 4 | 4 | 3 | 3 | Good | 3.55 | Strong option |\n| 5 | Warranty money found and claimed | New revenue | 4 | 4 | 3 | 3 | Good | 3.55 | Strong option |\n| 6 | \"Fleets like us\": cost-per-mile benchmarks | New revenue | 5 | 4 | 4 | 2 | Strong | 3.30 | Strong option |\n\n## 1. From fault code to a ready work order\n\n- **The job today:** every morning the maintenance manager or lead technician reads a list of fault codes, \"a few hundred\" at a 240-tractor carrier, looks each one up, decides if it matters and types a work order [documents/interview-maintenance-manager-regional-carrier.md]. Fault codes are 12% of support tickets [documents/support-tickets-q3-2026.csv]. Fault Code Assist explains codes, but beta users ask \"why can't it start the work order and pull the parts?\" [documents/fault-code-assist-beta-feedback.md]\n- **What the product would do:** an agent reads every code with the truck's repair history, groups repeats, drops noise, and for the ones that matter drafts the work order: likely cause, VMRS code, parts in stock or to order, and a proposed shop slot around the truck's route. The manager approves, edits or rejects; small, known jobs can be approved by rule.\n- **For whom:** maintenance manager (user, influences the buy); director of fleet operations (buyer), who gets fewer road calls.\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** Motive turns defects and fault codes into work orders automatically, and Motive Agents can open one on their own (https://www.truckinginfo.com/news/motive-adds-ai-agents-for-fleet-operations); Samsara's maintenance agents; Fleetio's AI Service Advisor drafts work orders (`market-map.md`).\n- **Ratings:** impact 5 because it defends the core against telematics bundles, which took 31 of the 88 customers we lost [documents/churn-note-2026.md]; effort 3 because the beta, the codes and the repair history exist, but parts and scheduling must join in and outcomes must be captured to check accuracy; urgency 5 because Motive already does this job for fleets that used to be our customers; evidence Strong because there are five findings across interviews, tickets, beta data and competitors, with customer quotes.\n- **Priority:** 0.35 × 5 + 0.25 × 5 + 0.20 × 5 + 0.20 × (6 − 3) = 1.75 + 1.25 + 1.00 + 0.60 = 4.60 → Do first\n- **Size (retention):** 37 customers with a bundled offer at renewal (measured [documents/churn-note-2026.md]) × about $12,900 revenue per customer a year ($10.5M across 812 customers, measured `[PM, illustrative]`) × 30–60% of that churn avoided (assumption) = about $143,000–$286,000 a year kept. An add-on price would come on top; not sized, because no customer has been asked a price yet.\n- **First question:** \"If FleetDesk drafted the work order from the fault code, with parts and a slot, what would you need to see before you approved it without checking?\"\n\n## 2. Outside invoices read and checked for you\n\n- **The job today:** dealer, roadside and vendor invoices arrive as PDFs, email and fax; office staff type them in line by line [documents/interview-fleet-ops-director-distribution.md] [documents/interview-maintenance-manager-regional-carrier.md]. 7% of tickets ask how to enter them faster [documents/support-tickets-q3-2026.csv]. At Sobeys, a long invoice took \"30 to 45 minutes to key in\" and parts were miscoded (quoted by Samsara: https://www.samsara.com/ca/blog/sobeys-fleet-maintenance-ai). \"I have no idea if the dealer in Joliet charges me twice what the one in Gary does.\" [documents/interview-fleet-ops-director-distribution.md]\n- **What the product would do:** read every invoice, code it to the vehicle and VMRS, post it, and compare each line with the fleet's own history and the same job at other vendors. Only invoices that don't match, or look high, go to a person.\n- **For whom:** director of fleet operations (buyer); office and parts staff.\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** Motive, Samsara, Collective Data, RTA and Trimble TMT all read invoices with AI; ServiceUp and Fleetio check repair costs (`market-map.md`).\n- **Ratings:** impact 4 because the buyer says checking vendors \"would pay for itself in a quarter\", a feature customers will pay extra for; effort 2 because reading invoices is now common technology and we already hold vendor price history; urgency 4 because several competitors shipped invoice reading in 2026; evidence Strong because there are five findings across interviews, tickets and a third-party fleet's quote.\n- **Priority:** 0.35 × 4 + 0.25 × 4 + 0.20 × 5 + 0.20 × (6 − 2) = 1.40 + 1.00 + 1.00 + 0.80 = 4.20 → Do first\n- **Size:** not sized: we don't know how many customers send half their repairs outside, as this distributor does.\n- **First question:** \"If we flagged every outside invoice that's higher than your history, how much would that be worth to you a year?\"\n\n## 3. Technician notes from the technician's voice\n\n- **The job today:** technicians type notes, time and part numbers on a tablet, an estimated 20–30 minutes per job, and often close with \"replaced\" or \"fixed\", so warranty claims fail and repeat repairs hide [documents/interview-maintenance-manager-regional-carrier.md]. 13% of tickets are about closing work orders [documents/support-tickets-q3-2026.csv]; 14 churned customers named the mobile app and too many clicks [documents/churn-note-2026.md].\n- **What the product would do:** the technician says what they found and did; FleetDesk writes complaint, cause and correction, picks the VMRS code and parts used, and fills the time. The technician checks and signs.\n- **For whom:** technician (user); maintenance manager, who reviews every work order.\n- **Kind and level:** grow the base; level 3.\n- **Who else is going after it:** Fullbay turns shorthand and dictated notes into clean repair records (https://www.worktruckonline.com/news/fullbay-debuts-ai-tool-and-key-platform-upgrades).\n- **Ratings:** impact 3 because it's a clear sales and retention story but not a paid product on its own; effort 2 because speech-to-text and general models do most of it, on our own work-order data; urgency 4 because Fullbay shipped it; evidence Strong because there are four findings across interviews, tickets, churn notes and job postings, with a customer quote.\n- **Priority:** 0.35 × 3 + 0.25 × 4 + 0.20 × 5 + 0.20 × (6 − 2) = 1.05 + 1.00 + 1.00 + 0.80 = 3.85 → Do first\n- **Size:** not sized: the value is time and better records, not new revenue.\n- **First question:** \"Would your technicians talk to the tablet in the bay, and would you trust what it wrote?\"\n\n## 4. Parts ready before the truck arrives\n\n- **The job today:** \"We know the PM is due. We know which filters it takes. Why am I waiting on filters?\" [documents/interview-fleet-ops-director-distribution.md] Parts counts and receiving are 15% of tickets [documents/support-tickets-q3-2026.csv].\n- **What the product would do:** from the PM schedule and drafted work orders, reserve parts in the right shop and draft purchase orders for what's missing, for the parts manager to approve.\n- **For whom:** parts manager (user); maintenance manager.\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** Samsara generates purchase orders automatically (early access) (https://www.samsara.com/blog/samsaras-new-innovations-increase-efficiency); Fullbay plans parts forecasting (announced).\n- **Ratings:** impact 4 because parts across shops is our stickiest feature (churn 3%) and sits in the Pro plan [documents/churn-note-2026.md]; effort 3 because it needs reliable meter sync, which causes 18% of tickets today; urgency 3 because a competitor has it in early access; evidence Good because there are two kinds of finding, with a customer quote.\n- **Priority:** 0.35 × 4 + 0.25 × 3 + 0.20 × 4 + 0.20 × (6 − 3) = 1.40 + 0.75 + 0.80 + 0.60 = 3.55 → Strong option\n- **Size:** not sized: no measure yet of how much downtime is spent waiting for parts.\n- **First question:** \"How many hours did trucks wait for parts last month, and which parts?\"\n\n## 5. Warranty money found and claimed\n\n- **The job today:** nobody checks if a failed part is still under warranty; one customer thinks they recover \"maybe a third\" [documents/interview-maintenance-manager-regional-carrier.md]. Our warranty tracking is little used: 4% of tickets [documents/support-tickets-q3-2026.csv]. Unclaimed warranty \"shows up as repair spend that looks normal\" (vendor-sponsored: https://www.fleetowner.com/resources/white-papers/whitepaper/55409832/the-money-youre-already-owed-a-warranty-recovery-playbook).\n- **What the product would do:** check every closed work order against warranty terms, tag the part for return, and draft the claim with the technician's notes; the parts manager sends it.\n- **For whom:** parts manager, maintenance manager; the director sees money recovered.\n- **Kind and level:** new revenue, priced as a share of money recovered; level 4.\n- **Who else is going after it:** Samsara's warranty claim agent (early access); Fleetio checks warranty during repairs (`market-map.md`).\n- **Ratings:** impact 4 because a share of recovered money is a new revenue line customers can see; effort 3 because warranty terms by part and OEM aren't in FleetDesk today, and it depends on good technician notes (#3); urgency 3 because Samsara has it in early access; evidence Good because there are two findings and a customer's estimate, but no independent study of money missed.\n- **Priority:** 0.35 × 4 + 0.25 × 3 + 0.20 × 4 + 0.20 × (6 − 3) = 1.40 + 0.75 + 0.80 + 0.60 = 3.55 → Strong option\n- **Size:** not sized: no measured figure for warranty money missed, and public figures are vendor claims without a study.\n- **First question:** \"How much did you claim in warranty last year, and how much do you think you missed?\"\n\n## 6. \"Fleets like us\": cost-per-mile benchmarks\n\n- **The job today:** the buyer rebuilds cost per mile in Excel \"two days a month\" [documents/interview-fleet-ops-director-distribution.md]; buyers above 150 vehicles ask \"How do we compare to fleets like us?\" [documents/lost-deals-h1-2026.md]; a customer asked the same [documents/interview-maintenance-manager-regional-carrier.md]. Repair and maintenance cost per mile rose 8.6% in 2025, the second-largest increase of any cost (https://truckingresearch.org/2026/07/new-atri-report-details-accelerating-costs-and-low-profitability-despite-cuts/).\n- **What the product would do:** cost per mile, downtime and failure rates by vehicle type, age and duty, compared with similar fleets that opt in, with the reasons behind the gaps.\n- **For whom:** director of fleet operations (buyer).\n- **Kind and level:** new revenue, a yearly subscription; level 5.\n- **Who else is going after it:** Motive is heading to cost per mile and total cost of ownership (announced); Fleetio talks of 14 years of maintenance data; Uptake learns across fleets (`market-map.md`).\n- **Ratings:** impact 4 because benchmarks are a product buyers ask for and would pay extra for; effort 4 because the data exists but 30% of customers aren't on contracts that allow aggregated use, and the coding must be cleaned [documents/fault-code-assist-beta-feedback.md]; urgency 2 because nobody in our segment ships it yet; evidence Strong because there are four findings across sales notes, two interviews and ATRI research, with customer quotes.\n- **Priority:** 0.35 × 4 + 0.25 × 2 + 0.20 × 5 + 0.20 × (6 − 4) = 1.40 + 0.50 + 1.00 + 0.40 = 3.30 → Strong option\n- **Size:** not sized: there is no price test yet, and the share of customers who would opt in is unknown.\n- **First question:** \"Would you share your de-identified repair costs to see how you compare with fleets like yours?\"\n\n## From Imagine\n\n- **A shop that plans itself around the routes** (level 6, evidence: Assumption): the product books every PM, repair and part around dispatch's plan, so no truck misses a PM because it was on the road. Came up in `vision.md`. Beyond the product manager's belief, there's one interview [documents/interview-maintenance-manager-regional-carrier.md], and it needs dispatch data we don't hold, so it isn't rated yet. `[PM, illustrative]`\n\n## Open questions\n\n- How accurate are Fault Code Assist's suggestions against what technicians found? Nobody has checked [documents/fault-code-assist-beta-feedback.md].\n- Do our 2021 contracts cover training models on repair outcomes across customers?\n- Would customers pay for AI as an add-on per vehicle, or only for outcomes such as money recovered?\n- Do we partner with telematics vendors or compete with their maintenance bundles?\n- Rescheduling missed PMs around dispatch (step 3) has good evidence, but needs dispatch data we don't hold; worth asking about.\n", "vision/vision.md": "# FleetDesk · AI vision\n\n> Fictional example. FleetDesk and the product manager's answers are invented, tagged `[PM, illustrative]`. Market facts cite the other files in this folder; the real products named under Imagine cite their own pages.\n\n**Today:** level 1, System of Record. Nothing AI is shipped and used; Fault Code Assist is a level 2 beta. Ten of the fifteen placed companies are already at level 3 or above, including Samsara, Motive and Fleetio (`market-map.md`, `ai-levels.md`).\n**Where we're going:** level 4, AI Delegated, by the end of 2028. `[PM, illustrative]`\n\n## The vision\n\nBy the end of 2028, FleetDesk does the paperwork of the shop. Every fault code, driver defect and outside invoice becomes ready work: a drafted work order with the likely cause, the parts reserved and a slot booked around the truck's route. The maintenance manager approves instead of types, and spends the morning on the three trucks that need a person's judgement. `[PM, illustrative]`\n\n## Imagine\n\n*Illustrative sketches, not plans. They show what each level could mean for FleetDesk.*\n\n### Our product at each level\n\n| Level | Already there | Our product at this level |\n|---|---|---|\n| 2 AI Assisted | **Grammarly**: suggests clearer, correct writing as you type [https://www.grammarly.com/]. **Gmail Smart Compose**: suggests the rest of the sentence [https://workspaceupdates.googleblog.com/2018/09/gmail-smart-compose-gsuite.html] | Fault Code Assist, shipped: every code explained, rated and given a suggested repair code. Work orders suggest the VMRS code and parts from the truck's history as the technician types. The manager still decides and clicks everything. Included in Pro, to win the \"What does your AI do?\" question in demos. |\n| 3 AI Directed | **Microsoft 365 Copilot**: drafts documents from your files when asked [https://learn.microsoft.com/en-us/office365/servicedescriptions/office-365-platform-service-description/microsoft-365-copilot]. **Shopify Sidekick**: does a merchant's task and shows the change for approval [https://help.shopify.com/en/manual/shopify-admin/productivity-tools/sidekick] | The technician says \"Replaced the left steer tire, cut sidewall, 4/32 tread on the right\" and FleetDesk writes the complaint, cause and correction, codes it and fills the time. The manager asks \"Which trucks are due a PM and an annual inspection next week?\" and gets the plan, ready to send to dispatch. Paid as a per-vehicle add-on. |\n| 4 AI Delegated | **Intercom Fin**: answers support conversations end to end, paid per outcome [https://fin.ai/pricing]. **Abridge**: writes the clinical note from the doctor's visit; the doctor signs it [https://www.abridge.com/] | FleetDesk triages every fault code overnight, drafts the work orders that matter with parts reserved and a bay booked, reads and checks every outside invoice, and files warranty claims. The maintenance manager approves a short list each morning; small known jobs go through by rule. Paid per vehicle for the shop agent, plus a share of warranty money recovered. |\n| 5 AI Domain Intelligence | **Harvey**: legal research and drafting that law firms trust [https://www.harvey.ai/]. **OpenEvidence**: answers clinicians' questions from the medical literature [https://siliconangle.com/2025/10/20/medical-search-engine-startup-openevidence-closes-200m-investment-led-gv/] | FleetDesk knows how trucks fail across 800 fleets and 15 years of repairs. \"Tractors like yours, on routes like yours, lose this turbo actuator at 410,000 miles. Four of yours are past 390,000.\" The director sees cost per mile against fleets like theirs, and which vendors charge more for the same job. Sold as a yearly benchmark and prediction subscription. |\n| 6 System of Understanding | **Waymo**: drives riders with no one at the wheel [https://waymo.com/]. **Tempus**: combines clinical and molecular data to guide cancer care [https://www.tempus.com/oncology/] | FleetDesk understands how each truck, route and shop behaves. It plans the shop around dispatch's week, orders parts before they're needed, pulls a truck in before it breaks down, and tells the director when to replace a truck rather than repair it. Fleets pay for uptime: trucks ready when dispatch needs them. |\n\n### A day with our System of Understanding\n\nRosa runs maintenance for a 240-tractor regional carrier with two shops, in 2029.\n\nAt 5:30 she opens FleetDesk on her phone. Overnight it read 1,900 fault codes from the trucks. It dropped the noise, and found two that matter. Truck 418's coolant temperature pattern matches 37 trucks across other fleets that lost a water pump within a week. Nobody told it to look; it knows what that pattern led to before. It has already moved 418's PM forward to this morning, reserved the pump in the north shop, and asked dispatch to swap the load to truck 422. Dispatch said yes at 4 am.\n\nShe never reads a fault-code list again. She never types an outside invoice, and never rebuilds the cost-per-mile report: the CFO gets it on the first of the month, with the reasons it moved.\n\nAt 9 she gets one question she has to answer herself. A dealer quoted $4,800 for an aftertreatment job that costs $3,100 at the shop down the road, but the dealer can do it today and the road shop can't until Thursday. FleetDesk shows the cost of two days off the road. She chooses the dealer.\n\nThe technicians talk to the tablets as they work. Their notes are complete, so warranty claims go out the same day, and FleetDesk files them.\n\nRosa spends the afternoon with her two newest technicians, on the jobs the system flagged as ones new techs most often get wrong. Road calls are down by half since 2027. Her job is the people, the vendors and the judgement calls.\n\n**What excites us:** the morning fault-code list disappears, and the shop works on the right trucks before they break down. `[PM, illustrative]`\n**What it would need to know, and the data that takes:** what each fault code actually led to, which needs technicians' findings captured on every job (opportunity #3), and repair outcomes across fleets, which needs customers' permission. It would also need dispatch's plan, which sits in the fleet's dispatch system, not in FleetDesk. `[PM, illustrative]`\n\n## Built on\n\n- **From fault code to a ready work order:** Do first, 4.60 (`opportunities.md` #1). The heart of the vision.\n- **Outside invoices read and checked for you:** Do first, 4.20 (`opportunities.md` #2).\n- **Technician notes from the technician's voice:** Do first, 3.85 (`opportunities.md` #3). The foundation: good notes make the work orders, warranty claims and, later, the level 5 predictions possible.\n- **\"Fleets like us\": cost-per-mile benchmarks:** Strong option, 3.30 (`opportunities.md` #6). The step after the vision, once contracts and data allow it.\n\n## For whom\n\n| Persona | The problem it removes | What changes in their day |\n|---|---|---|\n| Fleet maintenance manager | Reading hundreds of fault codes and typing work orders (`opportunities.md` step 2) | Approves a short list of drafted work orders each morning; spends time on the trucks that need judgement `[PM, illustrative]` |\n| Shop technician | 20–30 minutes of typing per job [documents/interview-maintenance-manager-regional-carrier.md] | Talks while working; checks and signs the note |\n| Director of fleet operations | Typing and checking outside invoices; cost per mile in Excel [documents/interview-fleet-ops-director-distribution.md] | Sees which vendors charge more, and fewer trucks down at 5 am |\n\n## What AI takes over\n\n| Workflow | Today | Tomorrow |\n|---|---|---|\n| Fault code to work order | A person reads every code, looks it up and types a work order (`opportunities.md` step 2) | FleetDesk triages every code and drafts the work order with parts and a slot. The manager approves; small known jobs go through by rule `[PM, illustrative]` |\n| Outside repairs | Office staff type invoices line by line; nobody compares vendors (`opportunities.md` step 7) | FleetDesk reads, codes and checks every invoice; a person sees only the ones that don't match `[PM, illustrative]` |\n| Repair notes | Technicians type, or don't (`opportunities.md` step 4) | Technicians speak; FleetDesk writes, technicians sign `[PM, illustrative]` |\n\n## Why us\n\n- 15 years of work orders, repairs, parts and outside invoices for about 800
