 fleets, roughly 2 million work orders a year (`../product.md`).\n- The shop's own work: multi-shop parts, purchasing and DOT records, where we win half our deals with fleets of 150 to 500 vehicles [documents/lost-deals-h1-2026.md].\n- Telematics data from all three big providers in one place for about 310 customers [documents/fault-code-assist-beta-feedback.md]. A telematics vendor's bundle sees only its own trucks' data.\n- Implementation specialists who ran fleet shops themselves [documents/lost-deals-h1-2026.md].\n\n## The opening\n\nLevel 4 has two players and neither runs the fleet's own shop end to end: Fleetio approves repairs and ServiceUp coordinates outside repairs. Level 5 has one low-confidence player selling mostly to large fleets and OEMs, and level 6 is empty (`market-map.md`). The in-house shop of the mid-size fleet, from fault code to parts to bay to warranty, is open.\n\n## Others moving this way\n\n| Who | At which level | What makes our vision different |\n|---|---|---|\n| Motive | 3; its agents can already open work orders (`market-map.md`, `market-moves.md`) | Motive starts from its own trucks' data and the CFO's bill; we start from the shop, its parts and its technicians, and work with every telematics provider |\n| Samsara | 3, heading to 4 with purchase orders and warranty claims (`market-map.md`) | Same as Motive; strong agents platform, lighter shop and parts depth |\n| Fleetio | 4 (`market-map.md`) | Approves repairs within limits, strongest with smaller fleets and outside repairs; we plan the in-house shop's work around parts and bays |\n| Uptake (Bosch) | 5, low confidence (`market-map.md`) | Predicts failures for large fleets and OEMs; we could take its kind of prediction straight into the work order and the parts room |\n\n## What customers would pay for\n\nIf an agent sat on top of our data tomorrow, customers would stop paying us just to store work orders and print the DOT file; a telematics bundle or a general assistant could do that. They would pay instead for trucks back on the road sooner and money they get back: a per-vehicle shop agent that turns codes and defects into ready work, and a share of warranty money recovered. Later, a yearly subscription for benchmarks. `[PM, illustrative]`\n\n## First step\n\nPilot \"from fault code to a ready work order\" with 10 of the 46 Fault Code Assist beta customers. For each drafted work order, record whether the manager approved it unchanged, edited or rejected it, and what the technician actually found. In the same calls, test two prices: included in Pro, or $3 per vehicle per month as an add-on. `[PM, illustrative]`\n\n## Open questions\n\n- How accurate must drafted work orders be before managers approve without checking?\n- Do we partner with Samsara and Motive, or compete with their maintenance bundles?\n- Will customers allow their repair outcomes to train models across fleets, and on what terms?\n- Can we get dispatch's plan, or do we schedule around it without it?\n"}, "assets": ["flows/mockups/morning-shortlist.html", "flows/mockups/say-it-sign-it.html", "vision/market-map.html"]}</script>

  function titleOf(path){ var c=FILES[path]||""; var m=c.match(/^#\s+(.+)$/m); if(!m) return path; var t=m[1].trim(), nm=((d.product||{}).name||"").trim(); if(nm && t.indexOf(nm+" · ")===0) t=t.slice(nm.length+3); return t.charAt(0).toUpperCase()+t.slice(1); }

  var reader=document.getElementById("reader"), rbody=document.getElementById("rbody"), scrim=null;

    if(f.never){ var cn=el("div","card"); add(cn, el("div","eyebrow","The agent never"), el("p",null,f.never)); add(gw,cn); }
    if(gw.children.length) add(sm2,gw);
  });

  var hasMk = !!(fl && (fl.mockups||[]).length);
  var smk = slide("mockups","Flows","Mockups","Flow mockups",["flows/mockups/"], hasMk);
  if(hasMk){
    var gm=el("div","grid");
    fl.mockups.forEach(function(m){ var c=el("div","card"); var a=el("a",null,m.name); a.href=m.file; add(c, el("div","eyebrow","Mockup"), add(el("h3"),a), m.what ? el("p","muted",m.what) : null); add(gm,c); });
    add(smk, gm, el("p","muted","Mockups for testing flows, not the product."));
  } else add(smk, todo("/ai-product-flows"));

  var hasFb = !!(fl && (fl.panel || fl.customers));
  var sfb = slide("feedback","Flows","Feedback","What customers and the panel said",["flows/panel-tests.md"], hasFb);
  if(hasFb){
    var gfb=el("div","grid");
    if(fl.customers){ var c1=el("div","card chosen"); add(c1, el("div","eyebrow","Real customers"), el("p",null,fl.customers)); add(gfb,c1); }
    if(fl.panel){ var c2=el("div","card"); add(c2, el("div","eyebrow","Synthetic panel"), el("p",null,fl.panel), el("p","muted","Hypotheses, not evidence.")); add(gfb,c2); }
    add(sfb, gfb);
    if(fl.never) add(sfb, el("p","lead","The agent never: "+fl.never));
  } else add(sfb, todo("/ai-product-flows"));


  // Roadmap
  var rm = d.roadmap;
  var hasUp = !!(rm && (rm.update||[]).length);
  var sup = slide("update","Roadmap","This update","This product update",["roadmap/features.md"], hasUp);
  if(hasUp){
    if(rm.summary) add(sup, el("p","statement",rm.summary));
    add(sup, table(["Feature","Flow","Priority"], rm.update.map(function(f){ return [f.name, f.flow||"", typeof f.priority==="number"?f.priority:""]; })));
    if(rm.slice){ var sl2=el("div","card chosen"); add(sl2, el("div","eyebrow","The build-day slice"), el("p",null,rm.slice)); add(sup,sl2); }
  } else add(sup, todo("/ai-product-roadmap"));

  var hasRo = !!(rm && (rm.customer_saves || rm.price));
  var sro = slide("roi","Roadmap","ROI and pricing","What it's worth, and how we charge",["roadmap/roi.md"], hasRo);
  if(hasRo){
    var gr=el("div","pillars");
    [["Customer saves a year",rm.customer_saves],["Their return",rm.customer_return],["New revenue per customer",rm.revenue_per_customer],["Across customers",rm.revenue_total]].forEach(function(k){ if(!k[1]) return; var c=el("div","card"); add(c, el("div","eyebrow",k[0]), el("span","score",k[1])); add(gr,c); });
    add(sro, gr);
    if(rm.price){ var pc=el("div","card"); add(pc, el("div","eyebrow","How we charge"), el("p",null,rm.price), rm.price_why ? el("p","muted",rm.price_why) : null); add(sro,pc); }
  } else add(sro, todo("/ai-product-roadmap"));

  var hasHz = !!(rm && rm.horizons);
  var shz = slide("roadmap","Roadmap","Roadmap","Roadmap",["roadmap/roadmap.md"], hasHz);
  if(hasHz){
    if(d.problem && d.problem.bhag) add(shz, el("p","lead","Toward: "+d.problem.bhag));
    var gh=el("div","grid hz");
    [["Now","now"],["Next","next"],["Later","later"]].forEach(function(k){ var h=rm.horizons[k[1]]; if(!h) return; var c=el("div","card"+(k[1]==="now"?" chosen":"")); add(c, el("div","eyebrow",k[0]+(h.level?" · L"+h.level:"")), h.outcome ? el("h3",null,h.outcome) : null, (h.items||[]).length ? list(h.items) : null, h.revenue ? el("p","muted","New revenue: "+h.revenue) : null); add(gh,c); });
    add(shz, gh);
  } else add(shz, todo("/ai-product-roadmap"));

  add(slides[slides.length-1], el("footer",null,"Built from the files in the product's folder"+(d.updated?" on "+d.updated:"")+". The files are the source; this deck shows them."));

  slides.forEach(function(s){ s.querySelectorAll(".card,.stair").forEach(function(c,k){ if(!c.style.getPropertyValue("--i")) c.style.setProperty("--i",k); }); s.querySelectorAll(".ebar").forEach(function(b){ b.querySelectorAll(".seg").forEach(function(sg,k){ sg.style.setProperty("--i",k); }); }); });

  // sidebar
  var nav=document.getElementById("nav"), groups={}, items=[];
  slides.forEach(function(s,i){
    var g=s.dataset.group;
    if(!groups[g]){ var gr=el("div","group"), h=el("h4"); h.append(g); add(gr,h); groups[g]={el:gr,h:h,n:0,done:0}; add(nav,gr); }
    var it=el("button","item"); it.type="button"; add(it, el("span","dot"+(s.dataset.done?" done":"")), el("span",null,s.dataset.label));
    it.onclick=function(){ go(i); closeMenu(); }; add(groups[g].el,it); items.push(it);
    groups[g].n++; if(s.dataset.done) groups[g].done++;
  });
  Object.keys(groups).forEach(function(k){ if(k!=="Overview") add(groups[k].h, el("span",null,groups[k].done+"/"+groups[k].n)); });

  // navigation
  var shell=document.getElementById("shell"), menu=document.getElementById("menu"), scroll=document.getElementById("scroll"), cur=0;
  var prev=document.getElementById("prev"), next=document.getElementById("next");
  function go(i){
    cur=Math.max(0,Math.min(slides.length-1,i));
    slides.forEach(function(s,k){ s.classList.toggle("on",k===cur); if(k===cur) items[k].setAttribute("aria-current","page"); else items[k].removeAttribute("aria-current"); });
    var s=slides[cur];
    document.getElementById("cgroup").textContent=s.dataset.group;
    document.getElementById("ctitle").textContent=s.dataset.label;
    document.getElementById("count").textContent=(cur+1)+" / "+slides.length;
    prev.disabled=cur===0; next.disabled=cur===slides.length-1;
    document.getElementById("prevname").textContent=cur>0?slides[cur-1].dataset.label:"";
    document.getElementById("nextname").textContent=cur<slides.length-1?slides[cur+1].dataset.label:"";
    try{ history.replaceState(null,"","#"+s.id); }catch(e){}
    scroll.scrollTop=0;
  }
  function closeMenu(){ shell.classList.remove("open"); menu.setAttribute("aria-expanded","false"); }
  menu.onclick=function(){ var o=shell.classList.toggle("open"); menu.setAttribute("aria-expanded",o?"true":"false"); };
  shell.addEventListener("click",function(e){ if(shell.classList.contains("open") && e.target===shell) closeMenu(); });
  prev.onclick=function(){ go(cur-1); }; next.onclick=function(){ go(cur+1); };
  document.addEventListener("keydown",function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(reader.classList.contains("open")){ if(e.key==="Escape") closeReader(); return; }
    if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); go(cur+1); }
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(cur-1); }
    if(e.key==="Escape"){ closeMenu(); closeReader(); }
  });
  var start=slides.findIndex(function(s){ return "#"+s.id===location.hash; }); go(start<0?0:start);
})();
</script>
</body>
</html>
