<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: a document viewer. A quiet left sidebar groups every section (Start, Vision, Discovery) with a status dot;
   one content column shows the current section; a Previous / Next up bar sits at the bottom.
   Depth comes from a ladder of surfaces and hairline borders, never shadows. One accent. */
:root{
  --canvas:#f7f7f8; --surface-1:#ffffff; --surface-2:#f0f1f3; --surface-3:#e8e9ec;
  --hairline:#e3e4e8; --hairline-strong:#d2d4da;
  --ink:#16171a; --ink-muted:#3d4048; --ink-subtle:#6b6f78; --ink-tertiary:#9a9ea6;
  --accent:#5e6ad2; --accent-soft:#eceefb; --on-accent:#ffffff;
  --good:#1f9d45; --risk:#d1453b; --risk-soft:#fbeceb;
  --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --side:264px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#08090a; --surface-1:#0f1011; --surface-2:#141516; --surface-3:#1b1c1e;
  --hairline:#23252a; --hairline-strong:#34343a;
  --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d;
  --accent:#828fff; --accent-soft:#1c1e33; --on-accent:#0b0c1a;
  --good:#27a644; --risk:#f07a6e; --risk-soft:#2a1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#08090a; --surface-1:#0f1011; --surface-2:#141516; --surface-3:#1b1c1e;
  --hairline:#23252a; --hairline-strong:#34343a;
  --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d;
  --accent:#828fff; --accent-soft:#1c1e33; --on-accent:#0b0c1a;
  --good:#27a644; --risk:#f07a6e; --risk-soft:#2a1715; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
.side{background:var(--surface-1);border-right:1px solid var(--hairline);display:flex;flex-direction:column;min-height:0;padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:grid;gap:2px;padding:6px 10px 14px;border-bottom:1px solid var(--hairline);margin-bottom:10px}
.brand .kicker{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.brand .name{font-weight:600;font-size:16px;letter-spacing:-.2px;line-height:1.25;overflow-wrap:anywhere}
.brand .sub{font-size:12px;color:var(--ink-subtle)}
nav{overflow:auto;display:grid;gap:14px;align-content:start;padding-bottom:8px}
.group{display:grid;gap:1px}
.group h4{margin:0 0 4px;padding:0 10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);display:flex;justify-content:space-between}
.group h4 span{color:var(--ink-tertiary)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;font-size:14px;color:var(--ink-muted);cursor:pointer}
.item:hover{background:var(--surface-2);color:var(--ink)}
.item[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--ink-tertiary)}
.dot.done{background:var(--good);border-color:var(--good)}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--hairline);font-size:12px;color:var(--ink-subtle);display:grid;gap:4px}
.side .foot kbd{font:500 11px var(--mono);border:1px solid var(--hairline-strong);border-radius:4px;padding:0 4px}

/* main */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid var(--hairline);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-size:13px;color:var(--ink-subtle);min-width:0}
.top .crumb{display:flex;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink);font-weight:500}
.top .count{margin-left:auto;font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.menu{display:none;border:1px solid var(--hairline);background:var(--surface-1);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.scroll{overflow:auto;min-width:0}
.slide{max-width:960px;margin:0 auto;padding-block:40px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:24px;align-content:start;min-width:0}
.slide>*{min-width:0}
.slide:not(.on){display:none}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--hairline);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface-1)}
.step{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-width:0}
.step:hover:not(:disabled){background:var(--surface-2)}
.step:disabled{visibility:hidden}
.step.next{justify-content:flex-end;text-align:right}
.step small{display:block;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-subtle)}
.step span{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .arrow{font-size:16px;color:var(--ink-subtle)}

/* content */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,56px);font-weight:600;letter-spacing:-1.6px;line-height:1.08}
h2{font-size:28px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
h3{font-size:15px;font-weight:600;letter-spacing:-.1px}
p{margin:0;max-width:68ch}
.eyebrow{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.head{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--hairline)}
.src{font:400 12px var(--mono);color:var(--ink-subtle);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--ink-muted)}
.lead{font-size:18px;line-height:1.55;color:var(--ink-muted);max-width:66ch}
.muted{color:var(--ink-subtle)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-subtle)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--hairline);font-size:12px;color:var(--ink-muted)}
.todo{border:1px dashed var(--hairline-strong);border-radius:12px;padding:22px;color:var(--ink-subtle);display:grid;gap:6px}
.todo code{font-family:var(--mono);color:var(--ink);background:var(--surface-2);padding:1px 6px;border-radius:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.dir{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hz{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:12px;padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
ul,ol{margin:0;padding-left:18px} li{margin:3px 0}
.statement{font-size:clamp(22px,3vw,28px);line-height:1.3;font-weight:500;letter-spacing:-.4px;max-width:44ch;border-left:2px solid var(--accent);padding-left:18px}

/* levels */
.stairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
.stair{background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.stair .n{font:500 11px var(--mono);color:var(--ink-subtle)}
.stair .nm{font-weight:600;font-size:13px;line-height:1.25}
.tag{display:inline-block;justify-self:start;font:500 11px/1.5 var(--mono);padding:0 8px;border-radius:10px;max-width:100%;overflow-wrap:anywhere}
.tag.today{background:var(--surface-3);color:var(--ink)}
.tag.target{background:var(--accent);color:var(--on-accent)}
.chip{font-size:12px;border-radius:4px;padding:2px 6px;background:var(--surface-2);overflow-wrap:anywhere;color:var(--ink-muted)}
.chip.us{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:820px){.stairs{grid-template-columns:1fr}.stair{min-height:0!important}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--hairline);border-radius:12px;background:var(--surface-1)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--hairline);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.band{font:500 11px var(--mono);padding:2px 8px;border-radius:999px;white-space:nowrap}
.band.do{background:var(--accent);color:var(--on-accent)} .band.strong{background:var(--accent-soft);color:var(--accent)} .band.watch{background:var(--surface-2);color:var(--ink-subtle)}

/* pillars and move */
.pillars{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.score{font:500 30px var(--mono);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.score small{font-size:14px;color:var(--ink-subtle)}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent)}
.meter.risk b{background:var(--risk)}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;max-width:560px;font-size:14px}
.quad div{padding:16px;border-radius:10px;background:var(--surface-1);border:1px solid var(--hairline);min-width:0;color:var(--ink-subtle)}
.quad .ax{background:none;border:0;padding:6px;font:500 11px var(--mono);color:var(--ink-subtle);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center}
.card.chosen{border-color:var(--accent);background:var(--accent-soft)}
.econ{display:grid;gap:10px}
.erow{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:12px;align-items:center}
.elab{font-size:13px;color:var(--ink-subtle)}
.etot{font:500 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.ebar{display:flex;height:28px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.seg{display:block;height:100%}
.seg-l,.sw.seg-l{background:var(--ink-tertiary)}
.seg-a,.sw.seg-a{background:var(--accent)}
.seg-p,.sw.seg-p{background:var(--risk)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
/* motion: everything rests visible; slides animate in when opened */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes travel{from{left:0}to{left:calc(100% - 8px)}}
.slide.on .card,.slide.on .stair,.slide.on .step-box,.slide.on .lane-cell .node{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.slide.on .seg{transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 160ms)}
/* experiences: today vs with agents */
.xp{display:grid;gap:14px}
.xp-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.xp-lab{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step-box{font-size:12.5px;line-height:1.3;padding:7px 10px;border-radius:8px;border:1px solid var(--hairline);background:var(--surface-1);max-width:220px}
.step-box.person{border-color:color-mix(in srgb,var(--risk) 45%,var(--hairline));background:var(--risk-soft)}
.step-box.agent{border-color:color-mix(in srgb,var(--accent) 55%,var(--hairline));background:var(--accent-soft)}
.step-box.check{border-style:dashed}
.arrow-sm{color:var(--ink-tertiary);font-size:12px}
.xp-card{display:grid;gap:12px}
/* flow map: swimlanes */
.lanes{overflow-x:auto;border:1px solid var(--hairline);border-radius:12px;background:var(--surface-1)}
.lane-grid{display:grid;grid-template-columns:96px repeat(var(--n),minmax(150px,1fr));min-width:calc(96px + var(--n) * 150px)}
.lane-head{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);padding:10px 12px;border-bottom:1px solid var(--hairline);background:var(--surface-2)}
.lane-name{font:500 12px var(--mono);color:var(--ink-muted);padding:14px 12px;border-right:1px solid var(--hairline);display:flex;align-items:center}
.lane-cell{position:relative;padding:12px 10px;border-bottom:1px solid var(--hairline);min-height:84px;display:flex;align-items:center}
.lane-row-last .lane-cell,.lane-row-last.lane-name{border-bottom:0}
.node{width:100%;font-size:12.5px;line-height:1.35;padding:8px 10px;border-radius:8px;border:1px solid var(--hairline)}
.node.agent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--hairline))}
.node.person{background:var(--risk-soft);border-color:color-mix(in srgb,var(--risk) 45%,var(--hairline))}
.node.exc{border-style:dashed;background:var(--surface-2)}
.lane-cell.has:not(.last)::after{content:"→";position:absolute;right:-7px;top:50%;transform:translateY(-50%);color:var(--ink-tertiary);font-size:13px;z-index:1}
.track{position:relative;height:3px;margin:0 12px 12px 108px;background:var(--surface-3);border-radius:3px}
.track i{position:absolute;top:-2.5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.slide.on .track i{animation:travel 3.2s linear infinite}
@media (prefers-reduced-motion:reduce){.slide.on *{animation:none!important}}
/* reader: the full markdown files, inside the deck */
.reader{position:fixed;inset:0 0 0 auto;width:min(760px,94vw);z-index:40;background:var(--surface-1);border-left:1px solid var(--hairline);display:grid;grid-template-rows:auto minmax(0,1fr);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.7,.2,1);padding-right:env(safe-area-inset-right,0px)}
.reader.open{transform:none}
.reader-scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35)}
.reader-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--hairline);min-width:0}
.reader-top .path{font:500 12px var(--mono);color:var(--ink-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.reader-top .sp{margin-left:auto}
.reader-top a,.reader-top button{font:500 13px var(--sans);border:1px solid var(--hairline);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.md{overflow:auto;padding:24px 28px 48px;font-size:14.5px;line-height:1.6;min-width:0}
.md h1{font-size:26px;letter-spacing:-.5px;margin:0 0 14px}.md h2{font-size:19px;margin:28px 0 10px}.md h3{font-size:15.5px;margin:22px 0 8px}
.md p,.md ul,.md ol{margin:0 0 12px}.md li{margin:3px 0}
.md table{display:block;overflow-x:auto;border-collapse:collapse;margin:0 0 16px;font-size:13px;max-width:100%}
.md th,.md td{border:1px solid var(--hairline);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2);font-weight:600}
.md code{font:12.5px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{background:var(--surface-2);padding:12px;border-radius:8px;overflow-x:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 12px;padding:2px 14px;border-left:2px solid var(--accent);color:var(--ink-muted)}
.md hr{border:0;border-top:1px solid var(--hairline);margin:20px 0}
.src a.embedded{cursor:pointer}
/* library */
.lib{display:grid;gap:18px}
.lib-group h3{margin-bottom:8px}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 12px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface-1);margin-bottom:6px}
.lib-row .t{font-weight:500}.lib-row .p{font:400 12px var(--mono);color:var(--ink-subtle);overflow-wrap:anywhere}
.lib-row .acts{display:flex;gap:8px;font-size:13px;white-space:nowrap}
.lib-row button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font:inherit}
.quad .on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
footer{color:var(--ink-subtle);font-size:12px;border-top:1px solid var(--hairline);padding-top:14px}

/* phone: sidebar becomes a drawer */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:max(16px,env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none}
  .shell.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
  .menu{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Sections">
    <div class="brand"><span class="kicker">ai-product</span><span class="name" id="bname">[Product]</span><span class="sub" id="bsub"></span></div>
    <nav id="nav"></nav>
    <div class="foot"><span><kbd>←</kbd> <kbd>→</kbd> to move between sections</span><span id="updated"></span></div>
  </aside>
  <div class="main">
    <div class="top">
      <button type="button" class="menu" id="menu" aria-controls="side" aria-expanded="false">Sections</button>
      <div class="crumb"><span id="cgroup"></span><span>/</span><b id="ctitle"></b></div>
      <span class="count" id="count"></span>
    </div>
    <div class="scroll" id="scroll"><div id="app"></div></div>
    <div class="bottom">
      <button type="button" class="step" id="prev"><span class="arrow">←</span><span><small>Previous</small><span id="prevname"></span></span></button>
      <button type="button" class="step next" id="next"><span><small>Next up</small><span id="nextname"></span></span><span class="arrow">→</span></button>
    </div>
  </div>
</div>

<div class="reader" id="reader" aria-hidden="true"><div class="reader-top"><span class="path" id="rpath"></span><span class="sp"></span><a id="ropen" href="#" target="_blank" rel="noopener">Open file</a><button type="button" id="rclose">Close</button></div><div class="md" id="rbody"></div></div>

<script type="application/json" id="files">{"files": {"README.md": "# Worked example: FleetDesk, fleet maintenance software\n\n> **Fictional example. FleetDesk and everything about it, its customers, documents and numbers are invented to show how the skills work. The competitors and market facts are real and sourced as of 27 Oct 2026.**\n\nThis folder shows what a product manager has after running all seven skills, `/ai-product-start`, `/ai-product-vision`, `/ai-product-discovery`, `/ai-product-problem`, `/ai-product-research`, `/ai-product-flows` and `/ai-product-roadmap`, for a typical vertical software product.\n\nFleetDesk is a mid-size, 15-year-old company in a software group. It sells fleet maintenance software to about 800 US trucking and delivery fleets, priced per vehicle per month. Its AI is at level 1 today, with one level 2 feature in beta. The product manager brought seven files, in `documents/`, which are the evidence for many facts, and added two real-customer interview transcripts during the flows step.\n\n- **Start:** builds a profile of the product and four personas from those files.\n- **Vision:** maps the real market on six AI levels, finds and ranks the opportunities, imagines FleetDesk at each higher level, and agrees a vision.\n- **Discovery:** scores protection, strength, AI opportunity and exposure; one score is overturned. It checks readiness, maps where value flows, chooses the move and sets where to take the product.\n- **Problem:** sharpens the problem to start with, grades its evidence, thinks bigger and picks the right problem.\n- **Research:** looks at how each type of customer lives the problem and what options they have, defines the ideal customer, builds four synthetic personas, drafts five agentic customer experiences with their economics, and lets the personas pressure-test the problem.\n- **Flows:** maps each experience as a flow, makes the two leading ones clickable, tests them in two panel rounds and two real interviews, and takes forward the morning shortlist, then the notes.\n- **Roadmap:** turns the flows into prioritised features, works out the ROI and the price ($3 per powered vehicle a month for the shortlist), lays out Now, Next and Later, and defines the build-day slice.\n\nFacts about FleetDesk cite `[documents/<file>]` or are tagged `[PM, illustrative]`. Facts about the market cite the public page they came from. The personas are synthetic: what they say is a hypothesis, not evidence.\n\n## Files\n\n- [`index.html`](index.html): **open this first.** The deck covers every step, from the product and the vision to the flows, this product update, ROI and the roadmap, with links to every file.\n- [`product.md`](product.md): the product profile: company, four personas and their problems, workflows, pricing, competitors, data and tech, AI today.\n- [`documents/`](documents/): the invented files the product manager brought:\n  - two customer interviews: a maintenance manager and a director of fleet operations;\n  - a support tickets export;\n  - won and lost deal notes;\n  - a churn note;\n  - the sales one-pager;\n  - notes from the AI beta;\n  - two transcripts from the flows step, with roles only: a waste hauler's maintenance manager and a beverage distributor's shop supervisor.\n\nFrom `/ai-product-vision`, in [`vision/`](vision/):\n\n- [`vision/ai-levels.md`](vision/ai-levels.md): the value FleetDesk gives at each level. Level today is 1, System of Record, with Fault Code Assist in beta at level 2.\n- [`vision/market-map.md`](vision/market-map.md): 15 real companies placed on the six levels, each with source, status and confidence. Fleetio and ServiceUp are at level 4.\n- [`vision/market-map.html`](vision/market-map.html): the same map as a page; open it in a browser.\n- [`vision/market-moves.md`](vision/market-moves.md): who is moving into the market across five ways in. Telematics vendors bundling maintenance is the strongest.\n- [`vision/opportunities.md`](vision/opportunities.md): the fleet's maintenance work as nine steps, then six opportunities, rated and ranked. First is \"From fault code to a ready work order\", at 4.60.\n- [`vision/vision.md`](vision/vision.md): FleetDesk imagined at levels 2 to 6, a day with its System of Understanding, and the vision: level 4 by the end of 2028.\n\nFrom `/ai-product-discovery`, in [`discovery/`](discovery/):\n\n- [`discovery/protection.md`](discovery/protection.md): what protects the product, 24 levers in four groups. 2.7 out of 5, Transitional; switching costs are eroding.\n- [`discovery/strength.md`](discovery/strength.md): business quality and customer strength. Strength is 3.58, AI opportunity 3.67, and AI urgency is immediate.\n- [`discovery/exposure.md`](discovery/exposure.md): 11 risks, 1 safest to 5 most exposed. 3.0 overall, borderline; highest on AI disruption, its timing, and dependence on rivals' data.\n- [`discovery/value.md`](discovery/value.md): where value flows today, where it leaks, where it would flow at level 4, who else could capture it, and how to charge.\n- [`discovery/discovery.md`](discovery/discovery.md): the one page: where to take the product, the four pillars, the move (Move first), readiness, value flows and the overturned score.\n\nFrom `/ai-product-problem`, in [`problem/`](problem/):\n\n- [`problem/evidence.md`](problem/evidence.md): the evidence for the problem, graded with the Mom Test.\n- [`problem/framings.md`](problem/framings.md): the job, the pressure test with the four forces, the BHAG, the job map, adjacent segments and three sized framings.\n- [`problem/problem.md`](problem/problem.md): the right problem: getting every truck that needs work from the first signal back on the road. It also covers the opportunity and what to learn from customers before building anything.\n\nFrom `/ai-product-research`, in [`research/`](research/):\n\n- [`research/evidence.md`](research/evidence.md): what the seven documents say, grouped by customer type, each row with its file and line.\n- [`research/market.md`](research/market.md): the problem in each persona's words, through their eyes, the options fleets have today (from doing nothing to Fleetio, Samsara, Motive, Whip Around, Fullbay and outsourcing) and the segments, with sources.\n- [`research/icp.md`](research/icp.md): the ideal customer: a regional carrier or distributor with 150–500 vehicles, its own shop and a telematics feed.\n- [`research/personas/`](research/personas/): four synthetic personas, every field sourced: Glen, director of fleet operations (buyer); Rosa, maintenance manager (user); Dwayne, lead technician (sceptic); Tess, owner of an independent repair shop (adjacent segment).\n- [`research/experiences.md`](research/experiences.md): how people use the product today, what that time costs a typical customer, five agentic customer experiences, the new economics, and the one to explore first: the morning shortlist.\n- [`research/panel.md`](research/panel.md): the personas at work: an interview with Rosa, the three framings scored, and reactions to the experiences. Hypotheses, not evidence.\n\nFrom `/ai-product-flows`, in [`flows/`](flows/):\n\n- [`flows/flows.md`](flows/flows.md): the five experiences mapped as flows, moment by moment, ranked on value, trust, pay and hours back. The morning shortlist goes forward first, say it, sign it next; parts and the dispatch slot later; overflow not for now.\n- [`flows/DESIGN.md`](flows/DESIGN.md): the design direction the mockups follow: a style like IBM Carbon, from getdesign.md, chosen for contrast in a bright shop. The developers build the slice to match it.\n- [`flows/mockups/morning-shortlist.html`](flows/mockups/morning-shortlist.html) and [`flows/mockups/say-it-sign-it.html`](flows/mockups/say-it-sign-it.html): clickable mockups of the two flows taken forward. Open them in a browser.\n- [`flows/panel-tests.md`](flows/panel-tests.md): two panel rounds, the sceptic first, and the two real interviews, with where they agree and disagree.\n- [`flows/script.md`](flows/script.md): the interview kit for real customers.\n\nFrom `/ai-product-roadmap`, in [`roadmap/`](roadmap/):\n\n- [`roadmap/features.md`](roadmap/features.md): ideas, the features prioritised with the working, this product update (the morning shortlist) and the build-day slice.\n- [`roadmap/roi.md`](roadmap/roi.md): what the update is worth to a typical customer and to FleetDesk, the ways to charge, the panel's price vote, the choice of $3 per powered vehicle a month, and one pricing story across the earlier files.\n- [`roadmap/roadmap.md`](roadmap/roadmap.md): Now, Next and Later, without dates, toward the vision and the BHAG.\n\nPlacements are a snapshot from public sources on 27 Oct 2026. Check the ones you act on.\n", "product.md": "# FleetDesk\n\n> Fictional example. FleetDesk, its company, customers, documents and numbers are invented. Facts about FleetDesk cite the invented files in `documents/` or are tagged `[PM, illustrative]`. Facts about the market, competitors and regulation are real and cite public sources retrieved on 27 Oct 2026.\n\n- company: FleetDesk Software, Columbus, Ohio. Founded 2011; part of Halvard Software Group, a group of vertical software companies, since 2019. About 120 employees. `[PM, illustrative]`\n- industry: transportation software. Niche: fleet maintenance software for US trucking and delivery fleets that run their own shops, mostly 50 to 500 vehicles. [documents/product-one-pager.md]\n- links: website, pricing and help centre (fictional, not linked). Sales one-pager: [documents/product-one-pager.md]\n- team: a product manager for the core product, working with an engineering lead, a designer and the head of customer success `[PM, illustrative]`\n\n## What it does\n\nFleetDesk runs the maintenance side of a fleet. It plans preventive maintenance (PM) by miles, engine hours or days, with meter readings synced from telematics. It takes a defect from a driver's inspection or a fault code to a closed work order, with labor, parts, VMRS repair codes and the technician's sign-off. It manages parts across shops, purchase orders and outside vendor repairs, and keeps the inspection and repair records US fleets must hold for DOT audits. [documents/product-one-pager.md]\n\nAbout 800 fleets manage more than 115,000 trucks, tractors, vans and trailers with it. [documents/product-one-pager.md] [documents/churn-note-2026.md]\n\n## Customers\n\n- customer types: regional and LTL carriers, foodservice and beverage distributors, waste haulers, utilities' private fleets and last-mile delivery fleets, mostly with 50 to 500 vehicles and at least one in-house shop. [documents/product-one-pager.md]\n- 812 customers at the end of September 2026; the average new customer runs about 120 vehicles. [documents/churn-note-2026.md] [documents/lost-deals-h1-2026.md]\n- ideal customer and personas: a regional carrier or distributor with 150–500 vehicles, its own shop and a telematics feed; personas Glen (buyer), Rosa (user), Dwayne (sceptic) and Tess (independent repair shop). See `research/` (`icp.md`, `personas/`, `experiences.md`, `panel.md`).\n\n### Fleet maintenance manager\n\n- who they are: runs one or more shops at a fleet of 100 to 500 vehicles, with 5 to 20 technicians and a parts manager. The main daily user; strongly influences the purchase and the renewal. [documents/interview-maintenance-manager-regional-carrier.md]\n- what they're trying to get done: keep trucks safe and on the road. Measured on road calls (breakdowns on the road) per million miles, PM compliance, out-of-service rate at roadside inspections, and cost per mile. [documents/interview-maintenance-manager-regional-carrier.md]\n- the problems this product solves for them: PM schedules that follow real miles and engine hours; every work order and inspection in one place; DOT audit records printed in minutes, not a week. [documents/interview-maintenance-manager-regional-carrier.md]\n- how they handled it before: a wall calendar, paper work orders and binders. \"Before FleetDesk we did PMs off a wall calendar and missed a third of them.\" [documents/interview-maintenance-manager-regional-carrier.md]\n- what still frustrates them: hundreds of fault codes a day, most of them noise, read one by one; technicians' notes too thin for warranty claims; PM slots missed when dispatch keeps a truck on the road, with nothing rescheduling it. [documents/interview-maintenance-manager-regional-carrier.md] [documents/support-tickets-q3-2026.csv]\n\n### Shop technician\n\n- who they are: a diesel technician in the fleet's shop, on a tablet or shared desktop. A user, not a buyer. `[PM, illustrative]`\n- what they're trying to get done: fix the truck right the first time and move to the next job. Measured on hours billed to work orders and comebacks (repeat repairs). `[PM, illustrative]`\n- the problems this product solves for them: the job, the vehicle's history and the parts in one work order. [documents/product-one-pager.md]\n- how they handled it before: paper work orders and asking the parts counter. `[PM, illustrative]`\n- what still frustrates them: typing. Techs spend an estimated 20 to 30 minutes per job on notes, time entry and finding part numbers, and often close with \"replaced\" or \"fixed\". \"Too many clicks to close a work order\" came up in churn interviews. [documents/interview-maintenance-manager-regional-carrier.md] [documents/churn-note-2026.md] [documents/support-tickets-q3-2026.csv]\n\n### Parts manager\n\n- who they are: runs the parts room for one or more shops: stock, receiving, purchase orders, vendors and warranty returns. A user. [documents/interview-maintenance-manager-regional-carrier.md]\n- what they're trying to get done: the right part on the shelf before the truck comes in, without tying up cash in stock. `[PM, illustrative]`\n- the problems this product solves for them: inventory across shops, reorder points, purchase orders and vendor price history. Customers using parts in two or more shops churn least (3%). [documents/product-one-pager.md] [documents/churn-note-2026.md]\n- how they handled it before: spreadsheets and the parts vendor's website. `[PM, illustrative]`\n- what still frustrates them: counts that don't match the shelf after receiving; trucks waiting for parts the PM schedule could have predicted; no time to check warranty on a failed part. [documents/support-tickets-q3-2026.csv] [documents/interview-fleet-ops-director-distribution.md] [documents/fault-code-assist-beta-feedback.md]\n\n### Director of fleet operations\n\n- who they are: owns the fleet and the maintenance budget at a fleet of 100 to 500 vehicles; reports to the CFO or COO. The buyer, who signs the contract. [documents/interview-fleet-ops-director-distribution.md]\n- what they're trying to get done: trucks ready at 5 am, on-time delivery, maintenance cost per mile under control, and clean DOT audits. [documents/interview-fleet-ops-director-distribution.md]\n- the problems this product solves for them: one record of every repair, including outside vendors; driver inspections that reach the shop. [documents/interview-fleet-ops-director-distribution.md]\n- how they handled it before: the shop's paper files and the accounting system. `[PM, illustrative]`\n- what still frustrates them: rebuilding the cost-per-mile report in Excel every month (\"two days a month, every month\"); no idea which outside vendor overcharges; too many logins. Telematics vendors offer maintenance in the same bill. [documents/interview-fleet-ops-director-distribution.md] [documents/lost-deals-h1-2026.md]\n\nDrivers also use the FleetDesk Driver app for pre- and post-trip inspections, but don't choose the product. [documents/product-one-pager.md]\n\n## Main workflows\n\n- Driver inspection to defect: pre- and post-trip inspections in the Driver app; defects go to the shop queue. [documents/product-one-pager.md]\n- Fault code to work order: telematics codes arrive in FleetDesk; a person reads each one and decides whether to open a work order. The lead tech at one customer spends \"the first hour of his day as a fault-code clerk\". [documents/interview-maintenance-manager-regional-carrier.md]\n- PM planning: schedules by miles, hours or days; the shop plans the day on a whiteboard, then types it in. [documents/interview-maintenance-manager-regional-carrier.md]\n- Work order to close: labor, parts, VMRS codes, notes and sign-off. Where technicians spend the most time typing. [documents/support-tickets-q3-2026.csv]\n- Parts and purchasing, outside vendor invoices, and DOT records and reports. [documents/product-one-pager.md]\n\n## What customers love / complain about\n\n- love: PM schedules that follow real miles; DOT audit-ready records; multi-shop parts inventory deeper than simpler tools; implementation specialists who ran fleet shops. [documents/interview-maintenance-manager-regional-carrier.md] [documents/lost-deals-h1-2026.md]\n- complain: PM schedules wrong when meter readings stop syncing (18% of support tickets in Q3 2026); parts counts (15%); closing work orders on the tablet (13%); fault-code overload (12%); a slow mobile app; reports the CFO wants that don't exist. [documents/support-tickets-q3-2026.csv] [documents/churn-note-2026.md] [documents/interview-fleet-ops-director-distribution.md]\n\n## Pricing and market\n\n- Core $8 per vehicle per month; Pro $13; trailers and equipment $3 per unit. Annual contracts; implementation from $2,500. [documents/product-one-pager.md]\n- Core went from $7.50 to $8 in 2026; 12 customers left over price. [documents/churn-note-2026.md]\n- About $10.5M in annual recurring revenue. Gross revenue retention 90%, net 101%, logo churn 10.8%; churn is 4% above 150 vehicles. `[PM, illustrative]` [documents/churn-note-2026.md]\n- Win rate 43% in the first half of 2026; 51% for fleets of 150–500 vehicles, 34% under 75. [documents/lost-deals-h1-2026.md]\n- The market: see `vision/market-map.md` and `discovery/exposure.md` for size, growth and rules.\n\n## Competitors and alternatives\n\n- Lost deals in the first half of 2026: Fleetio (29), Samsara with maintenance bundled into telematics (21), Whip Around (9), Motive (8), spreadsheets or no decision (11). [documents/lost-deals-h1-2026.md]\n- Churn to telematics bundles: 31 of 88 customers who left. [documents/churn-note-2026.md]\n- The full market, with AI-native challengers and horizontal players: `vision/market-map.md` and `vision/market-moves.md`.\n\n## Data and tech\n\n- Holds 15 years of work orders, repairs, parts, PM history, inspections and outside vendor invoices for each fleet: about 2 million work orders a year across customers. `[PM, illustrative]`\n- About 310 customers stream telematics fault codes and meter readings from Samsara, Motive or Geotab. [documents/fault-code-assist-beta-feedback.md]\n- Built on a C# and .NET Framework monolith with SQL Server, moved to Azure in 2020; newer services on .NET 8; a React Native app for technicians and drivers; a public REST API since 2023. `[PM, illustrative]`\n- Integrates with QuickBooks and Sage Intacct, and imports fuel card files. [documents/product-one-pager.md]\n- Contracts since 2021 allow de-identified, aggregated data for product improvement and benchmarks; about 70% of customers are on them. Whether that covers training AI models isn't confirmed. [documents/fault-code-assist-beta-feedback.md]\n\n## AI today\n\n- No AI in the shipped product. Fault Code Assist, in beta since May 2026 with 46 customers, explains fault codes in plain English, rates urgency and suggests a repair code. 61% of rated answers got a thumbs-up. No charge in the beta. [documents/fault-code-assist-beta-feedback.md]\n- Prospects ask \"What does your AI do?\" in every second demo. [documents/lost-deals-h1-2026.md]\n- **Level today: 1, System of Record (level 2 in beta). Target: 4, AI Delegated, by the end of 2028.** See `vision/ai-levels.md` and `vision/vision.md`.\n- **Our move: Move first** (AI opportunity 3.67, risk 3.0, borderline). Direction: protect the shop's work for fleets of 150–500 vehicles; turn fault codes, invoices and notes into ready work; start with how managers triage fault codes today. See `discovery/discovery.md`.\n\n## The idea we have in mind\n\nOur customers drown in fault codes and paperwork. We want FleetDesk to turn a fault code into a ready work order, with the parts pulled and the slot booked, so the maintenance manager approves instead of types. `[PM, illustrative]`\n\n- **The right problem:** getting every truck that needs work from the first signal back on the road, starting where managers read fault codes by hand. BHAG: by 2029, every truck ready when dispatch needs it, road calls halved, and no one reads a fault code by hand. See `problem/problem.md`. `[PM, illustrative]`\n- **This product update:** the morning shortlist, at $3 per powered vehicle a month as an add-on after a free pilot; the build-day slice is one pilot fleet's overnight signals ranked onto one page, where \"Approve\" opens a real work order. See `roadmap/roadmap.md`. `[PM, illustrative]`\n\n## Still unknown\n\n- How accurate Fault Code Assist's suggestions are against what technicians actually found. [documents/fault-code-assist-beta-feedback.md]\n- Whether our contracts let us train models on repair outcomes across customers.\n- How much warranty money customers miss: one customer guesses they recover a third. [documents/interview-maintenance-manager-regional-carrier.md]\n- Whether a buyer pays $3 per vehicle for the shortlist on its own: so far only the panel and one maintenance manager have answered (`roadmap/roi.md`).\n", "discovery/discovery.md": "# FleetDesk · Discovery\n\n> Fictional example. FleetDesk, its documents and numbers, the product manager's answers and the score they overturned are invented, tagged `[PM, illustrative]`. Market facts cite the reports in this folder or a public source retrieved on 27 Oct 2026.\n\nIs the product ready to go where the vision says? Built from `protection.md`, `strength.md`, `exposure.md`, `value.md`, `../vision/vision.md` and the product manager's answers on 27 Oct 2026.\n\n## In short\n\nFleetDesk is strong inside the fleet's own shop: deeply vertical, embedded in daily work orders, parts and DOT records, and loyal larger customers. It is exposed because the telematics vendors and Fleetio shipped maintenance AI this year, are winning smaller customers, and supply the data our own AI depends on. The move is **Move first**: protect the shop's work for fleets of 150 to 500 vehicles, and go fast on turning fault codes, invoices and notes into ready work, starting by learning exactly how managers triage fault codes today.\n\n## Where to take the product\n\n- **Protect:** the shop's own work for fleets of 150 to 500 vehicles with their own shops: multi-shop parts, DOT records and edge cases, where churn is 4% and we win half our deals (`protection.md`, [documents/churn-note-2026.md], [documents/lost-deals-h1-2026.md]). Give the 37 customers facing a bundled offer a business review before renewal.\n- **Grow:**\n  1. *From fault code to a ready work order.* Value comes from keeping customers the bundles target, then a per-vehicle shop agent (`../vision/opportunities.md` #1, `value.md`).\n  2. *Outside invoices read and checked.* Value comes from the buyer's savings on outside repairs, which the buyer says \"would pay for itself in a quarter\" (`../vision/opportunities.md` #2).\n  3. *Warranty money found and claimed.* Value comes from a share of money recovered, a new revenue line (`../vision/opportunities.md` #5).\n- **Start with:** the problem that every morning, maintenance managers and lead technicians read hundreds of fault codes one by one to find the few trucks that need work, then type the work orders themselves [documents/interview-maintenance-manager-regional-carrier.md]. Before building anything, learn from the beta customers how many codes they see a day, how many become work, what they check before opening a work order, what the technician later found, and what they'd need to see to approve a draft without checking. `[PM, illustrative]`\n- **Don't:**\n  - Don't build benchmarks or cross-fleet predictions until legal confirms the contract rights and technicians' notes are good enough to learn from (`strength.md`).\n  - Don't chase fleets under 75 vehicles on price: we win a third of those deals and lose most churn there (`../vision/market-moves.md`).\n  - Don't rebuild the monolith first; build the new AI work as services next to it. `[PM, illustrative]`\n- **How we'll know:**\n  - The share of drafted work orders approved without edits, and how often the draft matched what the technician found.\n  - Renewals among the 37 customers with a bundled offer.\n  - How many beta customers say yes to paying for the shop agent, and at what price.\n\n## The four pillars\n\n| Pillar | Score | What it means |\n|---|---|---|\n| Protection | 2.7 / 5 | Real but uneven: edge cases and latent history hold; switching costs and feature parity are wearing down (`protection.md`) |\n| Strength | 3.58 / 5 | Business quality 3.67, customer strength 3.5: deeply vertical and embedded; larger customers stay (`strength.md`) |\n| AI opportunity | 3.67 / 5 | A beta today, and a large, agentic workload to take off customers; revenue not yet proven (`strength.md`) |\n| Exposure | 3.0 / 5 (1 safest, 5 most exposed) | On the line: a healthy, stable market, but AI disruption, its timing and dependence on rivals' data are high (`exposure.md`) |\n\n**AI urgency:** immediate: Motive, Fleetio and Samsara shipped AI in this exact workflow in 2026, and Motive is already winning our customers (`strength.md`).\n\n## Where we're strong\n\n- Built only for fleet maintenance, and the system of record for the DOT inspection and repair records fleets must keep (`strength.md`, https://www.law.cornell.edu/cfr/text/49/396.3).\n- Larger customers stay: churn is 4% above 150 vehicles and 3% where parts run in two or more shops [documents/churn-note-2026.md].\n- Fifteen years of edge cases across carriers, distributors, waste haulers, utilities and last-mile fleets (`protection.md`).\n- About 2 million work orders a year across 800 fleets, a latent asset buyers already ask for `[PM, illustrative]` [documents/lost-deals-h1-2026.md].\n- A healthy market with stable rules: fleet management is forecast to grow about 17% a year to 2035 (https://www.gminsights.com/industry-analysis/fleet-management-market).\n\n## Where we're exposed\n\n- **The protection eroding fastest: switching costs.** Contracts are annual, rivals onboard fast, and AI makes moving records and retraining cheaper (`protection.md`).\n- **The highest risk: AI disruption.** Motive Maintenance turns defects and fault codes into work orders automatically (https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/), and 31 customers left for telematics bundles in a year [documents/churn-note-2026.md].\n- **Dependence on rivals' data.** The fault codes and meter readings our AI needs come from Samsara, Motive and Geotab, who also sell maintenance (`exposure.md`).\n- **Feature parity.** Motive matched most of our feature set in one release (`protection.md`).\n\n## The AI opportunity\n\n- **AI in the product today:** level 1, System of Record, with a level 2 beta (`../vision/ai-levels.md`).\n- **Where AI could earn money:**\n  - A per-vehicle shop agent that drafts work orders from codes and defects (`../vision/opportunities.md` #1).\n  - A share of warranty money recovered (`../vision/opportunities.md` #5).\n  - Later, benchmarks for \"fleets like us\" (`../vision/opportunities.md` #6).\n- **Where AI could take work off customers:**\n  - Fault-code triage, an hour a morning for one lead tech.\n  - Technician notes, an estimated 20–30 minutes per job.\n  - Outside invoices, typed line by line.\n  - Parts ordering.\n  - The cost-per-mile report, two days a month.\n  - Sources: [documents/interview-maintenance-manager-regional-carrier.md] [documents/interview-fleet-ops-director-distribution.md]\n\n## Our move\n\n| | Lower risk | Higher risk |\n|---|---|---|\n| **Higher AI opportunity** | Build on it | **Move first** |\n| **Lower AI opportunity** | Optimise | Defend |\n\nWe are in **Move first**: AI opportunity 3.67, risk 3.0. The risk score is borderline: it sits on the 3.0 line, and one point on any single risk would move it across.\n\nThe opportunity is clearly above the line. The work AI could take off customers is large, and it's the shop's own work, where FleetDesk is deepest. The risk is on the line because the market and rules are safe, but rivals are shipping AI in the same workflow now. For us, Move first means doing the shop's paperwork with AI before the bundles reach the fleets of 150 to 500 vehicles.\n\n`[PM, illustrative]` Confirmed on the higher-risk side. Motive's agents shipped this month and 37 renewals face a bundled offer, so we read the borderline score as exposed, not safe.\n\n## Ready for the vision?\n\nThe vision: level 4 by the end of 2028, starting with \"from fault code to a ready work order\" (`../vision/vision.md`, `../vision/opportunities.md` #1).\n\n| | What we have | The gap | Must be true | How we'll check |\n|---|---|---|---|---|\n| **Data** | 15 years of work orders and parts; fault codes from about 310 customers [documents/fault-code-assist-beta-feedback.md] | Technicians' notes rarely say what they found, so we can't check accuracy; 30% of customers are on older contracts; the telematics feeds belong to rivals | We capture what each code actually led to, and our agreements with telematics vendors allow AI use of their feeds | Sample closed work orders at beta customers for cause and correction; legal reviews the 2021 contract and the telematics data terms `[PM, illustrative]` |\n| **Tech** | Newer .NET 8 services, a public API, the Fault Code Assist beta on a general model `[PM, illustrative]` | The monolith and meter sync, the top support issue at 18% [documents/support-tickets-q3-2026.csv] | Drafting work orders can run as a service beside the monolith, with reliable meter data | Engineering lead checks the work-order and parts interfaces the agent needs `[PM, illustrative]` |\n| **Team** | 34 people in product and engineering; implementation specialists who ran fleet shops `[PM, illustrative]` | No one with experience shipping AI agents or measuring their accuracy `[PM, illustrative]` | One person owns AI quality and evaluation | Agree the role with the general manager and the group's AI guild `[PM, illustrative]` |\n| **Customers** | 46 beta customers, 31 active, 61% thumbs-up; customers asking for more [documents/fault-code-assist-beta-feedback.md] | We don't know how often managers would approve a draft unchanged | Managers approve drafts without rework most of the time | The problem interviews in \"Start with\", then a pilot with beta customers |\n| **Pricing** | Per-vehicle pricing customers understand [documents/product-one-pager.md] | No AI price tested; Fleetio sells at $4–$10 per vehicle (https://www.fleetio.com/pricing) | Buyers pay for the shop agent, or renew because of it | Test included-in-Pro against an add-on with beta customers |\n\n**Builds on:** vertical depth and embeddedness in the shop, 15 years of edge cases and repair history, and loyal larger customers (`strength.md`, `protection.md`).\n\n**Could stop it:** a telematics vendor limiting its data feed; bundles reaching larger fleets before we ship; drafts too inaccurate for managers to trust (`exposure.md`).\n\n## Where value flows\n\nIn short, from `value.md`:\n\n| | Today | At the vision's target level |\n|---|---|---|\n| **Who gets value** | The fleet gets a well-kept record; managers, technicians and office staff still do the work around it | Maintenance managers get ready work orders; buyers get overcharges caught and warranty money back |\n| **Who pays, and for what** | The buyer, per vehicle per month: $8–$13, trailers $3 [documents/product-one-pager.md] | The buyer, per vehicle for the record and the shop agent, plus a share of warranty recovered `[PM, illustrative]` |\n| **Where value leaks** | Manual fault-code triage, notes, invoices, missed warranty, Excel reports; telematics bundles | Telematics vendors and general assistants, if they do the work on our records |\n| **Who else could capture it** | Motive, Samsara, Fleetio | Motive and Samsara agents; Fleetio; ChatGPT, Claude and Copilot through connectors |\n| **What keeps it with us** | Parts depth, DOT records, people who know shops | The shop's workflow, data from all telematics providers, trust in the DOT record |\n\n**The shift:** paying per vehicle for a record people type into → paying for trucks back on the road sooner and money recovered.\n\n## What we corrected\n\n| Score | From | To | Why | Evidence |\n|---|---|---|---|---|\n| Strength: market position | 2 | 3 (strength 3.5 → 3.58) | The public read compared FleetDesk with the whole market, where Fleetio's 8,500+ fleets and the telematics bundles lead. The product manager showed that in fleets of 150–500 vehicles with their own shops, FleetDesk wins 51% of deals and churn is 4%. That meets the \"strong second player with defensible relevance\" anchor when scored in its niche, as the rubric's niche rule requires. `[PM, illustrative]` | [documents/lost-deals-h1-2026.md] [documents/churn-note-2026.md] |\n| Exposure: AI disruption | 4 | 4 (kept) | The product manager argued it should be 3, because bundles mostly win fleets under 100 vehicles. Kept: the rubric looks at forward signals, not today's retention. Motive's release covers parts and warranty too, and its agents now act on their own, which meets \"likely affecting decision-making\". `[PM, illustrative]` | `exposure.md`; https://www.truckinginfo.com/news/motive-adds-ai-agents-for-fleet-operations |\n", "discovery/exposure.md": "# FleetDesk · What could go wrong\n\n> Fictional example. FleetDesk, its documents and numbers are invented; inside-view answers are tagged `[PM, illustrative]`. Market facts are real and cite pages retrieved on 27 Oct 2026. Scores computed by `compute_risk_score.py`. 1 is safest, 5 most exposed.\n\n## 1. Risk summary\n\n```\nCompany:         FleetDesk (fictional)\nRisk Composite:  3.0 / 5.0   (lower = safer, higher = more exposed)\nHighest Risk:    AI disruption (4), partner and ecosystem dependency (4), timing of disruption (4)\nLowest Risk:     Market growth (2), regulatory shift (2), audit embeddedness (2)\n```\n\n**Borderline:** the composite of 3.00 sits right on the 3.0 line. One point on any single risk moves it by about 0.09. If AI disruption fell to 3, for example by a partnership that made the telematics vendors' data work for FleetDesk rather than against it, the composite would be 2.91, just on the safer side. If price pressure rose to 4, it would be 3.09. That matters: it is the difference between \"exposed, move now\" and \"moderately safe, build steadily\", and it is close enough that the product manager should decide.\n\n## 2. Top risks\n\n**AI disruption (4).** The telematics vendors and Fleetio now do maintenance with AI, and they are winning our customers.\n- Motive Maintenance (18 Aug 2026) turns defects and fault codes into work orders automatically, reads invoices, and covers parts and warranty (https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/).\n- Fleetio's AI Service Advisor approves low-risk repairs on its own, generally available since 25 Sep 2026 (https://itbrief.co.uk/story/fleetio-opens-ai-service-advisor-after-maintenance-beta).\n- 31 of the 88 customers we lost moved to a telematics vendor's bundled maintenance [documents/churn-note-2026.md].\n- Urgency: near-term.\n\n**Dependence on rivals' data (4).** The data our AI vision needs flows from the companies competing with us.\n- About 310 customers stream fault codes and meter readings from Samsara, Motive or Geotab [documents/fault-code-assist-beta-feedback.md].\n- Those same vendors sell maintenance bundles (`../vision/market-moves.md`).\n- Meter sync problems are already the top support category, at 18% [documents/support-tickets-q3-2026.csv].\n- Urgency: structural.\n\n**Timing of disruption (4).** This is happening now, not in some later wave.\n- Motive Agents can open a work order and mark a truck out of service, since 20 Oct 2026 (https://www.truckinginfo.com/news/motive-adds-ai-agents-for-fleet-operations).\n- Samsara's maintenance agents arrived in June 2026 (https://www.samsara.com/blog/samsaras-new-innovations-increase-efficiency).\n- 37 customers face a bundled offer at renewal [documents/churn-note-2026.md].\n- Urgency: near-term.\n\n## 3. Risk landscape\n\n**End market environment.** The market itself is supportive. Fleet management is forecast to grow about 17% a year to 2035, and the US about 15% (https://www.gminsights.com/industry-analysis/fleet-management-market). The rules that create demand are stable: inspection reports, annual inspections and record keeping (https://www.law.cornell.edu/cfr/text/49/396.11). FMCSA's 2026 deregulation changed small items, not these duties (https://jjkellercompliancenetwork.com/news/fmcsa-finalizes-12-deregulatory-changes). The freight downturn is a drag on small carriers: 19 customers closed or merged [documents/churn-note-2026.md]. The risks here are AI disruption and dependence on the telematics vendors, and both are accelerating.\n\n**Product defensibility.** Integrations are real but standard, and alternatives are credible and fast to set up (https://www.fleetio.com/pricing). Leaving is real work for larger fleets with years of records and parts setups, and easy for small ones. Timing is the accelerating risk in this section; integration depth and substitution are stable.\n\n**Business health.** Price pressure is mixed. FleetDesk charges $8–$13 per vehicle [documents/product-one-pager.md] against Fleetio's $4–$10 (https://www.fleetio.com/pricing) and free inspection apps (https://www.worktruckonline.com/news/fleetpal-makes-its-driver-inspection-app-free-for-qualified-fleets). 12 customers left over the 2026 increase, yet net retention is 101% [documents/churn-note-2026.md]. The product is meaningfully embedded in DOT audits, which lowers risk. Brand is adequate and the stack is mixed, with legacy parts and mobile problems visible in churn.\n\n| Dimension | Score | Section |\n|---|---|---|\n| R1 AI disruption | 4 | End market environment |\n| R2 Market growth | 2 | End market environment |\n| R3 Regulatory and market shift | 2 | End market environment |\n| R4 Partner and ecosystem dependency | 4 | End market environment |\n| R5 Integration and lock-in depth | 3 | Product defensibility |\n| R6 Substitution and data portability | 3 | Product defensibility |\n| R8 Timing of disruption | 4 | Product defensibility |\n| R9 Price-value pressure | 3 | Business health |\n| R10 Audit and approvals embeddedness | 2 | Business health |\n| R11 Brand and trust strength | 3 | Business health |\n| R12 Tech stack obsolescence | 3 | Business health |\n\n## 4. Watch-outs\n\n- Strong retention in larger fleets, high AI disruption: churn above 150 vehicles is 4% today, but retention is a lagging signal. Are bundles starting to win larger fleets too?\n- Dependence on rivals' data, and the AI vision built on it: what happens if a telematics vendor limits or prices its data feed?\n- Price pressure next to a thin brand: if Fleetio or a bundle matches the parts depth at half the price, what holds the price?\n- Brand and trust is scored on inference: no public reviews exist for this fictional company.\n\n## 5. Open questions for interview\n\n| Dimension | Question | Likely change if the answer is unfavourable |\n|---|---|---|\n| Brand and trust | How often are we on the shortlist without being asked, in fleets of 150–500 vehicles? | 3 → 4 |\n| Partner and ecosystem dependency | Do our data agreements with Samsara, Motive and Geotab let us use their feeds for AI features that compete with theirs? | 4 → 5 |\n| AI disruption | Have bundles won any fleet above 150 vehicles in the last year? | 4 → 5 |\n| Price-value pressure | How many renewals this year asked for a discount, citing Fleetio's price? | 3 → 4 |\n\n`[PM, illustrative]` On the first question: sales says FleetDesk is shortlisted unprompted in about half of 150–500-vehicle deals, which supports keeping brand and trust at 3.\n\n## 6. Methodology note\n\nMarket, competitor and regulatory evidence comes from pages retrieved on 27 Oct 2026: competitor launch pages and trade press, Cornell's copy of the FMCSA rules, J. J. Keller on deregulation, and a Global Market Insights forecast. Everything about FleetDesk comes from the invented `documents/` and the product manager's answers. A fictional company has no reviews on G2, Capterra or Trustpilot, so brand and trust is capped at Low confidence.\n\n## 7. Evidence quality\n\n| Dimension | Name | Score | Evidence Confidence | Score Basis | Flags |\n|---|---|---|---|---|---|\n| R1 | AI disruption | 4 | High | direct_evidence | |\n| R2 | Market growth | 2 | Medium | mixed | conflict_present |\n| R3 | Regulatory and market shift | 2 | Medium | mixed | |\n| R4 | Partner and ecosystem dependency | 4 | Medium | mixed | |\n| R5 | Integration and lock-in depth | 3 | Medium | mixed | |\n| R6 | Substitution and data portability | 3 | Medium | mixed | |\n| R8 | Timing of disruption | 4 | High | direct_evidence | |\n| R9 | Price-value pressure | 3 | Medium | mixed | conflict_present |\n| R10 | Audit and approvals embeddedness | 2 | Medium | mixed | |\n| R11 | Brand and trust strength | 3 | Low | inference_heavy | single_class_evidence, interview_candidate |\n| R12 | Tech stack obsolescence | 3 | Medium | mixed | |\n", "discovery/protection.md": "# FleetDesk · What protects the product\n\n> Fictional example. FleetDesk, its documents and numbers are invented; inside-view answers are tagged `[PM, illustrative]`. Market facts are real and cite pages retrieved on 27 Oct 2026. Scores computed by `compute_moat_score.py`.\n\n## 1. Summary\n\n```\nCompany:          FleetDesk (fictional)\nMOAT Composite:   2.7 / 5.0\nMode:             Mode T — Transitional\nExposure Ratio:   0.35 (Moderate)\nStrongest Pillar: Domain knowledge (3.0)\nMost Exposed:     Switching costs (0.58)\n```\n\n## 2. Verdict\n\nFleetDesk's protection is real but uneven: fifteen years of edge cases across many kinds of fleet, deep parts and DOT records, and a latent store of repair history no newcomer has. What protects it least is the cost of leaving and the size of its feature set, because Motive and Fleetio have shown they can build a full maintenance product with AI in one release, and AI makes moving records and retraining cheaper. The most important investment is to turn the repair history into something customers use every day, so staying gives them answers they can't get from a bundle.\n\n## 3. Pillar summary\n\n| Pillar | Score | Exposure Ratio | Mode Signal |\n|---|---|---|---|\n| Switching costs (SC) | 2.8 | 0.58 | Eroding — AI targets 3 of 6 levers, all at 3 |\n| Domain knowledge (DK) | 3.0 | 0.33 | Holding — edge cases strong, history latent |\n| Speed and cost of building (DS) | 2.4 | 0.50 | Weak — rivals reach parity fast |\n| Distribution (DC) | 2.6 | 0.00 | Safe from AI, but thin |\n\n## 4. Pillar analysis\n\n### Switching costs (2.8/5.0 | Exposure: 0.58)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Data migration complexity | 3 | AI-exposed | Direct, Medium |\n| User retraining burden | 3 | AI-exposed | Direct, Medium |\n| Process reconfiguration effort | 3 | AI-exposed | Inference, Low |\n| Integration dependency depth | 3 | Structural | Direct, Medium |\n| Customisation volume | 3 | Partial | Inference, Low |\n| Contractual lock-in | 2 | Structural | Direct, Medium |\n\nLeaving FleetDesk takes some work, and more for larger fleets: churn above 150 vehicles is 4%, against 10.8% overall [documents/churn-note-2026.md]. Records are relational and VMRS-coded, and PM programs and parts setups are built per vehicle class. But nothing here is deep. Rivals onboard fast (\"They were live in a week\") [documents/lost-deals-h1-2026.md], contracts are annual with no exit fees, and the telematics links are ones every rival also has. Integration depth is the most solid lever because it doesn't depend on AI; the contract is the weakest. A credible rival would use AI to import the history, map PM schedules and train technicians, then make the offer at renewal, as Motive's reps already do [documents/interview-fleet-ops-director-distribution.md].\n\n**AI acceleration risk:** this pillar's AI-exposed levers are both weak and directly targeted by modern AI tooling. Competitor advantage in AI product development would accelerate decay here.\n\n### Domain knowledge (3.0/5.0 | Exposure: 0.33)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Regulatory and compliance logic | 3 | Partial | Direct, High |\n| Industry-specific process encoding | 3 | Partial | Direct, Medium |\n| Edge case handling | 4 | Partial | Direct, Medium |\n| Data models | 3 | Partial | Inference, Medium |\n| Terminology and taxonomy | 2 | Structural | Direct, Medium |\n| Historical benchmarks | 3 | Structural | Direct, Medium (latent asset) |\n\nFleetDesk knows how fleet shops work. It encodes the FMCSA rules on inspection reports, annual inspections and record retention (https://www.law.cornell.edu/cfr/text/49/396.11, https://www.law.cornell.edu/cfr/text/49/396.17, https://www.law.cornell.edu/cfr/text/49/396.3), but those rules are public and every rival handles them. Edge cases are the strongest lever: fifteen years across carriers, distributors, waste haulers, utilities and last-mile fleets, including reefer units and trailers [documents/product-one-pager.md]. Terminology is the weakest: VMRS codes are the industry's, not ours (https://www.samsara.com/ca/blog/sobeys-fleet-maintenance-ai). Historical benchmarks are a latent asset: about 2 million work orders a year across 800 fleets `[PM, illustrative]`, and buyers already ask \"How do we compare to fleets like us?\" [documents/lost-deals-h1-2026.md]. This is a named investment opportunity, not a weakness.\n\n### Speed and cost of building (2.4/5.0 | Exposure: 0.50)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Codebase maturity | 3 | Partial | Inference, Medium |\n| QA infrastructure | 2 | Partial | Direct, Medium |\n| Developer domain familiarity | 3 | Partial | Inference, Low |\n| Feature parity as barrier | 2 | AI-exposed | Direct, High |\n| Regulatory approval navigated | 2 | Structural | Direct, Medium |\n\nA fifteen-year codebase is hardened across many fleets, but it is not a barrier others can't cross. Motive launched maintenance with AI fault codes, automatic work orders, invoice reading, parts and warranty in one release (https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/), and Fullbay launched an \"AI-native\" platform (https://fullbay.com/blog/fullbay-next-heavy-duty-repair-shop-software/). Feature parity is the most exposed lever. Testing is thin: most regression testing is manual `[PM, illustrative]`, and meter-sync problems are 18% of tickets [documents/support-tickets-q3-2026.csv]. No regulatory approval is needed to sell in this market.\n\n### Distribution (2.6/5.0 | Exposure: 0.00)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Direct buyer relationships | 3 | Structural | Direct, Medium |\n| Niche brand recognition | 2 | Structural | Inference, Low |\n| Conference and community presence | 3 | Structural | Direct, Low |\n| Referral and partner networks | 2 | Structural | Direct, Medium |\n| Sales team domain expertise | 3 | Structural | Direct, Medium |\n| Customer success depth | 3 | Structural | Direct, Medium |\n| Geographic and language coverage | 2 | Structural | Direct, Medium |\n\nDistribution is safe from AI but thin. The strongest levers are people: implementation specialists who ran fleet shops, and business reviews with the top 50 accounts [documents/lost-deals-h1-2026.md] [documents/churn-note-2026.md]. Brand is the weakest: Samsara, Motive and Fleetio dominate the trade press (`../vision/market-map.md`), and the telematics vendors reach the CFO directly. There is no partner channel; the telematics marketplaces FleetDesk is listed in belong to its biggest rivals `[PM, illustrative]`.\n\n## 5. Exposure map\n\n**AI-exposed levers**\n- Data migration complexity (switching costs, 3): AI makes importing 15 years of records cheaper for a rival. Urgency: high, as bundles target renewals now.\n- User retraining burden (switching costs, 3): AI onboarding and simpler apps cut retraining; rivals already win on ease of use. Urgency: high.\n- Process reconfiguration effort (switching costs, 3): PM templates and AI setup reduce re-mapping. Urgency: medium.\n- Feature parity as barrier (speed and cost of building, 2): one release from Motive matched most of the feature set. Urgency: high.\n\n**Structural levers**\n- Integration dependency depth (switching costs, 3): real engineering to redirect accounting and fuel-card links; but the telematics links belong to rivals.\n- Contractual lock-in (switching costs, 2): annual contracts; safe from AI, but weak.\n- Terminology (domain knowledge, 2) and historical benchmarks (domain knowledge, 3): history can't be copied without time in market.\n- Regulatory approval (speed and cost of building, 2): no approval needed.\n- All seven distribution levers (2–3): human and safe from AI.\n\n## 6. Strategic implications\n\n**Defend now**\n- *Historical benchmarks.* Package the repair history as answers customers use: which codes led to breakdowns, cost per mile against similar fleets. Start by confirming contract rights [documents/fault-code-assist-beta-feedback.md].\n- *Edge case handling.* Keep the multi-shop parts and mixed-fleet depth that wins fleets of 150 to 500 vehicles [documents/lost-deals-h1-2026.md].\n- *Customer success.* Extend business reviews beyond the top 50 to the 37 customers facing a bundled offer [documents/churn-note-2026.md].\n\n**Act on**\n- *Data migration and retraining.* Make FleetDesk the easiest to use for technicians: voice notes and fewer clicks (`../vision/opportunities.md` #3), so the reason to leave disappears.\n- *Feature parity.* Stop competing feature for feature; compete on doing the shop's work, from fault code to ready work order (`../vision/opportunities.md` #1).\n\n**Watch**\n- Regulatory logic, process encoding and data models: safe while rules are stable, but AI makes them easier to copy each year.\n\n## 7. Evidence provenance\n\n- **Switching costs:** churn and lost-deal notes, the one-pager, Fleetio's PM templates; process reconfiguration and customisation volume scored mainly by inference.\n- **Domain knowledge:** the FMCSA rules on Cornell's legal information site, the one-pager and sales notes, a Samsara customer story on VMRS coding.\n- **Speed and cost of building:** Motive's and Fullbay's launch pages, the support tickets and the product manager's answers; developer domain familiarity scored by inference.\n- **Distribution:** churn and sales notes, TMC's fleet survey page, the product manager's answers; brand recognition scored by inference, as a fictional company has no public reviews.\n\n## 8. Evidence quality\n\n| Lever ID | Pillar | Score | Evidence Source | Evidence Confidence | Flags |\n|---|---|---|---|---|---|\n| SC1 | SC | 3 | documents/product-one-pager.md, documents/lost-deals-h1-2026.md | Medium | |\n| SC2 | SC | 3 | documents/churn-note-2026.md | Medium | |\n| SC3 | SC | 3 | `[PM, illustrative]`, fleetio.com PM template | Low | inference_heavy |\n| SC4 | SC | 3 | documents/product-one-pager.md, documents/fault-code-assist-beta-feedback.md | Medium | |\n| SC5 | SC | 3 | `[PM, illustrative]`, documents/churn-note-2026.md | Low | |\n| SC6 | SC | 2 | documents/product-one-pager.md, `[PM, illustrative]` | Medium | |\n| DK1 | DK | 3 | law.cornell.edu (49 CFR 396.3, 396.11, 396.17) | High | |\n| DK2 | DK | 3 | documents/product-one-pager.md, documents/lost-deals-h1-2026.md | Medium | |\n| DK3 | DK | 4 | documents/product-one-pager.md, documents/interview-fleet-ops-director-distribution.md | Medium | |\n| DK4 | DK | 3 | documents/product-one-pager.md | Medium | |\n| DK5 | DK | 2 | samsara.com Sobeys story | Medium | |\n| DK6 | DK | 3 | `[PM, illustrative]`, documents/lost-deals-h1-2026.md | Medium | latent_asset |\n| DS1 | DS | 3 | `[PM, illustrative]` | Medium | |\n| DS2 | DS | 2 | `[PM, illustrative]`, documents/support-tickets-q3-2026.csv | Medium | |\n| DS3 | DS | 3 | inference | Low | inference_heavy |\n| DS4 | DS | 2 | gomotive.com, fullbay.com | High | |\n| DS5 | DS | 2 | `[PM, illustrative]` | Medium | |\n| DC1 | DC | 3 | documents/churn-note-2026.md, `[PM, illustrative]` | Medium | |\n| DC2 | DC | 2 | vision/market-map.md | Low | inference_heavy |\n| DC3 | DC | 3 | `[PM, illustrative]`, tmc.trucking.org | Low | |\n| DC4 | DC | 2 | `[PM, illustrative]` | Medium | |\n| DC5 | DC | 3 | documents/lost-deals-h1-2026.md | Medium | |\n| DC6 | DC | 3 | documents/churn-note-2026.md | Medium | |\n| DC7 | DC | 2 | `[PM, illustrative]` | Medium | |\n", "discovery/strength.md": "# FleetDesk · How strong the product is, and the AI opportunity\n\n> Fictional example. FleetDesk, its documents and numbers are invented; inside-view answers are tagged `[PM, illustrative]`. Market facts are real and cite pages retrieved on 27 Oct 2026. Scores computed by `compute_maturity_score.py`; the AI opportunity pillar by `compute_pillars.py`.\n\n## 1. Maturity summary\n\n```\nCompany:            FleetDesk (fictional)\nMaturity Composite:  3.44 / 5.0\n  Section A (Business Quality):   3.67\n  Section B (Customer Strength):  3.5\n  Section C (AI Opportunity):     3.0\n```\n\nThe AI opportunity pillar used in discovery is **3.67**: the mean of AI today, AI revenue and the work AI could take off customers. Urgency is left out of it and reported on its own: **immediate** (1 out of 5, where 1 means the most urgent).\n\nMarket position was overturned from 2 to 3 by the product manager, with evidence; before that, business quality was 3.5 and the composite 3.38. See `discovery.md`.\n\n## 2. Verdict\n\nFleetDesk is a solid, deeply vertical system of record that larger fleets with their own shops depend on every day. Its strongest asset is how deeply it sits in the shop's daily work: work orders, parts across shops and DOT records, where customers using parts in two or more shops almost never leave. Its biggest gap is AI: nothing is shipped, while the category leaders shipped AI in exactly this workflow in the last few months.\n\n## 3. Dimension scores\n\n| Dimension | Score | Evidence Confidence | Score Basis |\n|---|---|---|---|\n| A1 Type of system | 4 | Medium | mixed |\n| A2 Vertical market software | 5 | High | direct_evidence |\n| A3 Mission criticalness | 4 | Medium | mixed |\n| A4 Market position | 3 (overturned from 2) | Medium | mixed |\n| A5 Leadership mindset | 3 | Low | inference_heavy |\n| A6 Technology modernity | 3 | Medium | mixed |\n| B1 Customer switching propensity | 3 | High | direct_evidence |\n| B3 Customer dependency and embeddedness | 4 | Medium | direct_evidence |\n| C1 Current AI features | 4 | High | direct_evidence |\n| C2 AI initiative urgency | 1 | High | direct_evidence |\n| C3 AI revenue opportunity | 3 | Medium | mixed |\n| C4 AI labour automation upside | 4 | Medium | mixed |\n\n## 4. Section analysis\n\n### Section A (Business Quality) — 3.67/5.0\n\nFleetDesk is the system of record for maintenance, repairs, parts and the DOT inspection records fleets must keep (https://www.law.cornell.edu/cfr/text/49/396.3). It is built only for fleet maintenance, with VMRS codes, driver inspections, annual inspections and multi-shop parts [documents/product-one-pager.md], which makes vertical depth the strongest dimension. It is mission-critical: a truck down for a day \"costs me more than FleetDesk costs me for a year for that truck\" [documents/interview-fleet-ops-director-distribution.md]. Market position is a strong second in its own segment, fleets of 150 to 500 vehicles with their own shops, where it wins 51% of deals [documents/lost-deals-h1-2026.md]; overall, Fleetio's 8,500+ fleets and the telematics bundles lead (https://itbrief.co.uk/story/fleetio-opens-ai-service-advisor-after-maintenance-beta). The weakest dimensions are leadership mindset and technology: an AI beta without a budget line, and a .NET Framework monolith with newer services around it `[PM, illustrative]`.\n\n### Section B (Customer Strength) — 3.5/5.0\n\nCustomers behave in two groups. Fleets under 75 vehicles switch readily: 61 of the 88 who left in the last year were small, and 31 went to a telematics bundle [documents/churn-note-2026.md]. Larger fleets stay: churn above 150 vehicles is 4%, and 3% where parts run in two or more shops. Embeddedness is the stronger dimension, backed by that demonstrated behaviour and by work orders, parts and DOT records running through the product daily. Switching propensity stays at 3 because the overall pattern is \"selective, but switching is realistic\".\n\n### Section C (AI Opportunity) — 3.0/5.0\n\nThe opportunity is large and the clock is short. Fault Code Assist is in beta with 46 customers, 31 active, and 61% of rated answers got a thumbs-up [documents/fault-code-assist-beta-feedback.md]. The work AI could take off customers is the strongest dimension: fault-code triage, work orders, outside invoices, technician notes, parts and warranty (`../vision/opportunities.md`). The section average is pulled down by urgency, scored 1 because Motive, Fleetio and Samsara shipped AI in this exact workflow in 2026 (https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/). Revenue opportunity is clear but unproven: no price has been tested.\n\n## 5. AI picture\n\nRead together, FleetDesk is behind the market. It sits with the \"Emerging\" companies in the Houlihan Lokey calibration the rubric uses: an AI beta, no shipped feature, no AI line in revenue. Its competitors are \"Scaling\": Fleetio's AI Service Advisor approves repairs on its own, Motive's agents open work orders (https://www.truckinginfo.com/news/motive-adds-ai-agents-for-fleet-operations).\n\nThe automation upside sits in the **agentic layer**: closed-loop triage, drafting work orders, reserving parts, booking bays and filing warranty claims. That has a higher ceiling and is harder to copy once it runs inside a shop than prediction alone.\n\nThe same work is already being automated by others. Motive turns defects and fault codes into work orders automatically, and Samsara has warranty claim and purchase-order agents in early access (https://www.samsara.com/blog/samsaras-new-innovations-increase-efficiency). The upside is real, but it is not waiting.\n\nThe data flywheel is possible but not running: technicians' notes are too thin to learn from today [documents/interview-maintenance-manager-regional-carrier.md], and rights to learn across customers aren't confirmed [documents/fault-code-assist-beta-feedback.md].\n\n## 6. Strategic priorities\n\n1. **Ship one AI job that does work, not just explains it.**\n   - Why now: prospects ask \"What does your AI do?\" in every second demo, and rivals show automatic work orders [documents/lost-deals-h1-2026.md].\n   - A good outcome: drafted work orders from fault codes, approved unchanged m
