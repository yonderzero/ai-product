aiting each morning; most codes are noise | documents/interview-maintenance-manager-regional-carrier.md, line 11 |\n| Carrier, lead technician | workaround | The lead tech reads, looks up and decides on each code, then opens work orders: \"a fault-code clerk\" | documents/interview-maintenance-manager-regional-carrier.md, line 23 |\n| Carrier, maintenance manager | workaround | Plans the shop day on a whiteboard, then types it into FleetDesk; dispatch changes it twice before noon | documents/interview-maintenance-manager-regional-carrier.md, line 12 |\n| Carrier, maintenance manager | pain | When dispatch keeps a truck on a route past its PM slot, nothing reschedules it; the planner finds out when it's overdue | documents/interview-maintenance-manager-regional-carrier.md, line 26 |\n| Carrier, technicians | pain | Techs close with \"replaced\" or \"fixed\"; cause and correction missing, so warranty claims get rejected | documents/interview-maintenance-manager-regional-carrier.md, line 24 |\n| Carrier, technicians | quote | \"Half my techs would rather turn a wrench for two hours than type for ten minutes.\" | documents/interview-maintenance-manager-regional-carrier.md, line 24 |\n| Carrier, maintenance manager | budget signal | \"If it wrote the work order from the fault code and the tech just checked it, I'd pay for that.\" | documents/interview-maintenance-manager-regional-carrier.md, line 32 |\n| Carrier, maintenance manager | quote | \"Don't give me another dashboard. Give me the three trucks I need to pull in today, and why.\" | documents/interview-maintenance-manager-regional-carrier.md, line 31 |\n| Carrier, maintenance manager | objection | Samsara's maintenance is \"a checklist\", but the CFO sees one bill instead of two | documents/interview-maintenance-manager-regional-carrier.md, line 33 |\n| Carrier, maintenance manager | pain | Warranty: recovers \"maybe a third\" of what they could | documents/interview-maintenance-manager-regional-carrier.md, line 25 |\n| Carrier, maintenance manager | trigger | Measured on road calls per million miles, PM compliance, out-of-service rate, cost per mile | documents/interview-maintenance-manager-regional-carrier.md, line 13 |\n| Distributor, director | quote | \"I don't need AI that talks to me. I need trucks ready at 5 am.\" | documents/interview-fleet-ops-director-distribution.md, line 30 |\n| Distributor, director | pain | Trucks wait for parts nobody ordered ahead of the PM: \"Why am I waiting on filters?\" | documents/interview-fleet-ops-director-distribution.md, line 23 |\n| Distributor, director | budget signal | \"A truck down for a day costs me more than FleetDesk costs me for a year for that truck.\" | documents/interview-fleet-ops-director-distribution.md, line 11 |\n| Distributor, director | budget signal | Would pay more per truck if it cut downtime and he could prove it to the CFO | documents/interview-fleet-ops-director-distribution.md, line 32 |\n| Distributor, director | workaround | Rebuilds the cost-per-mile report in Excel from three sources, \"two days a month, every month\" | documents/interview-fleet-ops-director-distribution.md, line 12 |\n| Distributor, director | objection | Too many logins; Motive offers maintenance in one login: \"I haven't said no.\" | documents/interview-fleet-ops-director-distribution.md, line 25 |\n| Distributor, director | trigger | Renewal in March 2027 with a Motive bundling offer on the table | documents/interview-fleet-ops-director-distribution.md, line 37 |\n| Distributor, director | workaround | Two smaller depots use outside vendors and a mobile repair service; half the repair spend goes outside | documents/interview-fleet-ops-director-distribution.md, lines 5, 22 |\n| Distributor, parts manager | quote | \"If it already knows what the code is, why can't it start the work order and pull the parts?\" | documents/fault-code-assist-beta-feedback.md, line 21 |\n| Waste hauler, maintenance manager | objection | \"Too many 'watch' codes. Hide them unless they repeat.\" | documents/fault-code-assist-beta-feedback.md, line 20 |\n| Mid-size fleet, shop supervisor | pain | \"Tells me what the code means. I still have to do everything else.\" | documents/fault-code-assist-beta-feedback.md, line 19 |\n| Beta fleets | workaround | 18% of \"act now\" codes became a work order within 24 hours; no one knows if the rest were false alarms or ignored | documents/fault-code-assist-beta-feedback.md, line 14 |\n| Beta fleets | budget signal | 31 of 46 beta customers used it in the last 30 days; 61% thumbs-up | documents/fault-code-assist-beta-feedback.md, lines 12–13 |\n| All customers | pain | Telematics and fault codes: 233 tickets (12%), \"how do we filter the ones that matter?\" | documents/support-tickets-q3-2026.csv, line 5 |\n| All customers | pain | PM wrong or overdue when meter readings stop syncing: 349 tickets (18%) | documents/support-tickets-q3-2026.csv, line 2 |\n| All customers | pain | Parts counts and receiving: 291 tickets (15%) | documents/support-tickets-q3-2026.csv, line 3 |\n| All customers | workaround | Techs pick \"Other\" as the cause code to close a work order on the tablet: 252 tickets (13%) | documents/support-tickets-q3-2026.csv, line 4 |\n| Smaller fleets, buyer | churn reason | 31 of 88 left for a telematics bundle, decided by finance or operations; most under 100 vehicles | documents/churn-note-2026.md, line 15 |\n| All customers | churn reason | 14 left over the app: \"too many clicks to close a work order\" | documents/churn-note-2026.md, line 17 |\n| Larger fleets | budget signal | Churn above 150 vehicles was 4%; 3% where parts run in two or more shops | documents/churn-note-2026.md, lines 24–25 |\n| Top customers | trigger | 37 customers face a bundled offer at renewal; 9 of the top 50 asked about AI, none has an AI budget line | documents/churn-note-2026.md, lines 30–31 |\n| Prospects | trigger | \"What does your AI do?\" in every second demo; prospects ask why it doesn't open the work order itself | documents/lost-deals-h1-2026.md, line 29 |\n| Prospects | objection | Lost 29 deals to Fleetio (\"live in a week\") and 29 to telematics bundles | documents/lost-deals-h1-2026.md, lines 13–16 |\n| Prospects | churn reason | 11 stayed on spreadsheets or made no decision: \"our Excel works\" | documents/lost-deals-h1-2026.md, line 17 |\n\n## What the product manager knows that the files don't\n\n| Customer type | What | Tag |\n|---|---|---|\n| Carriers and distributors, 150–500 vehicles | About 140 of the 310 customers with a telematics feed have 150 to 500 vehicles and at least one shop | [PM, illustrative] |\n| Lead technicians | They trust their own read of a code more than any list, and resent being pulled off the floor to do it | [PM, illustrative] |\n| Directors | The maintenance budget is set once a year with the CFO; new spend outside renewal needs a payback story | [PM, illustrative] |\n| Dispatch | Dispatch plans in a separate system; at most customers the shop hears about changes by phone or radio | [PM, illustrative] |\n| Independent repair shops | Several customers send overflow work to the same local independent shops, which re-enter the job by hand | [PM, illustrative] |\n\n## Gaps\n\nWhat we couldn't find in our data, so any persona that needs it marks it `[assumed]`:\n\n- A third interview at a fleet of 150–500 vehicles; we have two.\n- Anything from a technician in their own words: every technician fact comes through the manager.\n- How dispatch and the shop agree a slot, and what it costs when they don't.\n- What an independent repair shop experiences when it takes work from our fleets.\n- Who signs above which amount, and what the approval path for a new AI add-on looks like.\n", "research/experiences.md": "# FleetDesk · Agentic customer experiences\n\n> Fictional example. FleetDesk, its documents, prices and the product manager's answers are invented, tagged `[PM, illustrative]`. Market sources are real, retrieved on 27 Oct 2026; \"search result\" means seen in search results but not opened.\n\nThe main customer experiences for solving `../problem/problem.md`, reimagined with agents in and around the product: agents that do the customer's work end to end, with the person setting goals, approving and handling exceptions. Exploration, not a build plan yet: these are the experiences to test with the personas and then with real customers. Built on 27 Oct 2026.\n\n**The problem:** when a truck signals it needs work, through a fault code, a driver's defect or a PM coming due, the maintenance manager wants to know which trucks need work today and have each job ready to start, with the parts and a slot that fits dispatch, so they can keep every truck safe and on the road when dispatch needs it.\n**Where the AI sits:** both. Four experiences are agents inside today's FleetDesk workflows; one is a companion that reaches the independent shops our fleets already use.\n\n## How people use the product today\n\nThe work a typical customer's employees do in and around FleetDesk for this job, at the ideal customer in `icp.md`: about 200 vehicles, one or two shops.\n\n| Persona | What they do, step by step | How often | How long each time | People per customer | Outside the product | Source |\n|---|---|---|---|---|---|---|\n| Lead technician | Opens the overnight code list, reads each code, looks it up, decides if it matters, opens a work order | Every working day | About an hour | 1 | OEM lookup sites, memory | `documents/interview-maintenance-manager-regional-carrier.md` (line 23) |\n| Maintenance manager | Reads driver write-ups and the codes the lead tech flags; decides which trucks come in | Every working day | About half an hour `[PM, illustrative]` | 1 | — | `documents/interview-maintenance-manager-regional-carrier.md` (line 11) |\n| Maintenance manager | Plans the shop day on a whiteboard, types it into FleetDesk, replans when dispatch moves trucks, finds missed PMs when they're overdue | Every working day, replanned twice before noon | About an hour across the day `[PM, illustrative]` | 1 | Whiteboard, phone and radio with dispatch | `documents/interview-maintenance-manager-regional-carrier.md` (lines 12, 26) |\n| Parts manager | Checks parts for the day's jobs and the PMs coming due, orders, chases vendors, receives and fixes counts | Every working day | About two hours `[PM, illustrative]` | 1 | Vendor websites, phone, spreadsheets | `documents/interview-fleet-ops-director-distribution.md` (line 23); `documents/support-tickets-q3-2026.csv` (line 3) |\n| Technicians | Type notes, time and part numbers; pick a cause code; close the work order on the tablet | Every job: about 3,400 a year | 20–30 minutes | About 12 | Paper notes, the parts counter | `documents/interview-maintenance-manager-regional-carrier.md` (line 24); `documents/support-tickets-q3-2026.csv` (line 4) |\n\nNot counted here, because they sit outside this problem: the office manager typing outside invoices line by line, and the director's cost-per-mile report in Excel, two days a month (`documents/interview-maintenance-manager-regional-carrier.md`, line 27; `documents/interview-fleet-ops-director-distribution.md`, line 12).\n\n## The double cost today\n\nA typical customer pays for the product twice: the licence, and the time their people spend using it.\n\n| | Per year | How we got it |\n|---|---|---|\n| Licence | $31,200 | 200 vehicles × $13 (Pro) × 12 months. Price measured [documents/product-one-pager.md]; 200 vehicles is the ideal customer's typical size `[PM, illustrative]` |\n| Labour using the product | $132,800 | 2,525 hours a year × the loaded hourly cost of whoever does the work (below) |\n| **Total** | **$164,000** | |\n\n**Working.** 250 working days a year `[assumed]`. Loaded cost = wage ÷ 0.70, because wages are 70% of total pay in US private industry (https://www.bls.gov/news.release/ecec.nr0.htm).\n\n| Workflow | Hours a year | Loaded cost an hour | Per year |\n|---|---|---|---|\n| Lead tech reading codes | 1 h × 250 = 250 | $52: a median $36.50 wage (https://www.freightwaves.com/?p=571607); postings pay up to $42 (https://recruiting.paylocity.com/Recruiting/Jobs/Details/3695081) | $13,000 |\n| Manager deciding which trucks come in | 0.5 h × 250 = 125 | $72: $105,000 a year `[PM, illustrative]`; no manager wage source could be opened | $9,000 |\n| Manager planning and replanning the day | 1 h × 250 = 250 | $72 | $18,000 |\n| Parts manager getting parts in | 2 h × 250 = 500 | $40: a $28 wage `[assumed]` | $20,000 |\n| Technicians' notes, time and part numbers | 3,400 jobs × 25 min = 1,400 | $52 | $72,800 |\n| **Total** | **2,525** | | **$132,800** |\n\n3,400 jobs a year = about 17 work orders per vehicle a year, from 2 million work orders across 115,000 vehicles [documents/product-one-pager.md] `[PM, illustrative]`, × 200 vehicles. 25 minutes is the middle of the customer's own estimate [documents/interview-maintenance-manager-regional-carrier.md].\n\nThe surprise: the labour cost is four times the licence, and most of it sits with the technicians' typing, not the morning code list.\n\n## The experiences at a glance\n\n| # | Experience | Persona | Trigger | Level today → with agents | In or around the product | Why it matters |\n|---|---|---|---|---|---|---|\n| 1 | The morning shortlist | Rosa, maintenance manager | Overnight codes, write-ups and PMs due | 2 → 4 | In | The sharpest struggle; the riskiest assumption (will she let something else choose?) |\n| 2 | Parts on the bench before the truck | Parts manager; Glen as buyer | A job is approved or a PM comes due | 1 → 4 | In | Trucks wait for parts everyone knew were needed |\n| 3 | A slot that survives dispatch | Rosa | Dispatch keeps a truck out, or a part or bay falls through | 1 → 3 | In | Missed PMs and a plan out of date by noon |\n| 4 | Say it, sign it | Dwayne and the technicians | A technician finishes a job | 1 → 3 | In | The biggest labour cost, and the record that makes every other agent learn |\n| 5 | Overflow to a trusted shop | Tess, independent shop owner; Rosa | The fleet's shop has no bay or technician for an approved job | 1 → 4 | Around: a companion for outside shops | Reaches the adjacent segment and gets trucks out when the bays are full |\n\n## 1. The morning shortlist\n\n**Persona:** Rosa, maintenance manager · **Trigger:** overnight fault codes, driver write-ups and PMs coming due · **Outcome:** before the shop opens, Rosa has the few trucks that need work today, each with a drafted work order and the reason, and nothing important was dropped.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Codes and write-ups pile up overnight in FleetDesk | The agent reads every code, defect and PM due, groups them by truck, and drops repeats and known noise | Nothing |\n| 2 | The lead tech reads each code and looks it up | The agent ranks trucks by risk, using the code, how often it repeats, linked defects, the truck's history and what similar codes led to | Nothing |\n| 3 | Rosa and the lead tech decide which trucks come in | The agent shows a shortlist: \"pull in today\", \"plan this week\", \"watching\", each with one line of why | Rosa reviews |\n| 4 | The lead tech types each work order | The agent drafts each work order: complaint, likely cause, VMRS code, parts it expects | Rosa approves, edits or rejects with one tap |\n| 5 | Nobody records what wasn't acted on | Everything not chosen stays visible in \"watching\", and comes back if it repeats or worsens | Rosa handles the exception |\n\n- **Data it needs:** fault codes and meters (we hold them for about 310 customers, from Samsara, Motive and Geotab); defects from the Driver app; PM schedules and repair history (ours); Fault Code Assist's code library (ours) [documents/fault-code-assist-beta-feedback.md].\n- **What the agent decides alone, and what it hands to a person:** alone: grouping, dropping duplicates and ranking. To a person: every work order is opened only on Rosa's approval; nothing is closed or ignored without being visible.\n- **What could go wrong, and how the person stays in control:** it ranks a dangerous code low. Rosa sees \"watching\" with the reason for each, can sort it her own way, and every rejection asks for a one-line reason that tunes the ranking. Repeats and rising severity always come back to the top.\n- **Hours it gives back:** about 300 a year at a typical customer: the lead tech's 250 drop to about 25 for exceptions; Rosa's 125 drop to about 50 for review. Worth about $17,100.\n- **How we'd know it works:** the share of drafted work orders Rosa approves unchanged; how often a truck in \"watching\" later broke down.\n- **What the panel said:** Rosa's first choice; she stops the first time a truck in \"watching\" breaks down. Dwayne would accept it only with a quick veto, and gives up after two bad calls in a week. Glen: it helps the shop, but the code list isn't why trucks miss 5 am. Tess: not her world (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 2. Parts on the bench before the truck\n\n**Persona:** the parts manager, with Glen as buyer · **Trigger:** a work order is approved, or a PM is coming due · **Outcome:** the parts are on the bench when the truck arrives, or the job moves to a day when they will be.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | The parts manager checks the day's jobs and PMs coming due by hand | The agent lists the parts each approved job and each PM coming due needs, from the PM kit and the drafted work order | Nothing |\n| 2 | He checks the shelf, often wrong after receiving | The agent checks stock across shops and flags counts that look wrong | Parts manager handles the exception |\n| 3 | He orders on the vendor's website or by phone | The agent reserves stock, moves it between shops, and drafts purchase orders to the usual vendor at the usual price | Parts manager approves orders above a limit he sets |\n| 4 | The truck arrives; the part doesn't | The agent tracks delivery and warns Rosa if a part won't arrive in time, so the job can move | Rosa decides |\n\n- **Data it needs:** PM kits, parts inventory across shops, vendor price history and purchase orders (ours); vendors' delivery dates (by email today; not held).\n- **What the agent decides alone, and what it hands to a person:** alone: reserving stock and transfers between shops. To a person: any purchase order above the limit; any vendor or price change.\n- **What could go wrong, and how the person stays in control:** it orders against a wrong count, or doubles an order. Limits per order and per day; every order is listed for the parts manager; nothing goes to a new vendor.\n- **Hours it gives back:** about 350 a year: the parts manager's 500 drop to about 150 for counts, exceptions and vendors. Worth about $14,000.\n- **How we'd know it works:** jobs started on time with all parts; trucks waiting for parts each month.\n- **What the panel said:** Glen's first choice: \"this is my pain\", with a cap per order and per day. Rosa and Dwayne both fear ordering against wrong counts; one phantom part or double order and they stop (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 3. A slot that survives dispatch\n\n**Persona:** Rosa · **Trigger:** dispatch keeps a truck on a route past its slot, a part is late, or a job grows · **Outcome:** the shop's plan stays true all day, and a missed PM is rebooked the moment it's missed.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Rosa builds the day on the whiteboard and types it in | The agent proposes the day's plan: trucks, bays, technicians, parts ready | Rosa approves |\n| 2 | Dispatch moves a truck; the shop hears by phone | The agent sees the truck isn't where the plan expected (from telematics) and asks dispatch, by message, when it will be back | Dispatch answers |\n| 3 | Nobody reschedules the missed PM; it shows up overdue | The agent rebooks the PM at the next slot that fits the truck's route and fills the gap with the next job | Rosa reviews the change |\n| 4 | Rosa replans twice before noon | The agent replans and shows only what changed | Rosa handles conflicts |\n\n- **Data it needs:** the shop plan and PM due dates (ours); truck location from telematics (we hold meters, not live location, today); dispatch's plan (in the dispatch system; not held).\n- **What the agent decides alone, and what it hands to a person:** alone: filling an empty slot with the next ready job. To a person: any change that takes a truck off a route; any overdue safety item.\n- **What could go wrong, and how the person stays in control:** it plans around a route it can't see. Without dispatch data it asks rather than assumes; Rosa sees every move and can lock a slot.\n- **Hours it gives back:** about 175 a year: Rosa's 250 drop to about 75. Worth about $12,600.\n- **How we'd know it works:** PM compliance; PMs found overdue rather than rebooked.\n- **What the panel said:** everyone wants the missed PM rebooked, and nobody believes it without dispatch's plan and live location; Dwayne says dispatch won't answer a machine. The evidence is thin here too (`../problem/evidence.md`, `panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 4. Say it, sign it\n\n**Persona:** Dwayne and the technicians · **Trigger:** a technician finishes a job · **Outcome:** every work order closes with complaint, cause and correction, time and parts, in the technician's words, and warranty-ready.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | The technician types notes on the tablet, or writes \"replaced\" | The technician says what he found and did, while working | Speaks |\n| 2 | He looks up part numbers and enters time | The agent writes complaint, cause and correction, matches parts to what was charged out, and fills time from clock-in | Nothing |\n| 3 | He picks \"Other\" as the cause code to close | The agent suggests the VMRS code from what was said | Technician reviews |\n| 4 | Warranty isn't checked | The agent flags parts still under warranty and what the claim needs | Parts manager or Rosa handles it |\n| 5 | The manager closes thin work orders | The technician signs; the manager sees only the ones the agent couldn't complete | Technician approves |\n\n- **Data it needs:** the work order, parts charged out, clock times, warranty terms (ours, warranty little used); the technician's voice (new).\n- **What the agent decides alone, and what it hands to a person:** alone: writing the note and filling codes. To a person: the technician signs every note; nothing is filed as a claim without a person.\n- **What could go wrong, and how the person stays in control:** it writes something he didn't say, or the note is used to judge him. He reads and signs; the original recording is kept with the note; notes are for the truck's record, not timesheets `[PM, illustrative]`.\n- **Hours it gives back:** about 1,120 a year: from 25 minutes a job to about 5 for review and signing `[assumed]`, across 3,400 jobs. Worth about $58,200.\n- **How we'd know it works:** work orders closed with cause and correction; warranty claims rejected for missing information.\n- **What the panel said:** Dwayne's first choice, because it fixes \"replaced\" and \"Other\"; he stops the day one note is used against a technician. Rosa and Glen worry about shop noise and techs feeling watched. Tess already has AI notes in her shop software (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 5. Overflow to a trusted shop\n\n**Persona:** Tess, owner of an independent shop; Rosa on the fleet side · **Trigger:** an approved job has no bay or technician in the fleet's shop, or the truck is near another depot · **Outcome:** the job reaches a trusted outside shop complete and pre-approved, and comes back as a proper record.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Rosa phones local shops for a bay | The agent offers the job to the fleet's preferred shops with codes, history and an approval limit | Rosa picks or approves the shop |\n| 2 | Tess re-enters the job and calls for approval | Tess gets the job in her own software or by link, ready to start | Tess accepts and sets the time |\n| 3 | Approval by phone, while the truck sits | Estimates within the limit are approved; above it, Rosa gets one question | Rosa approves above the limit |\n| 4 | The invoice comes by email and is typed in | The agent reads the invoice into the work order and checks it against the estimate | Office handles mismatches |\n\n- **Data it needs:** the work order and history (ours); preferred shops and limits (new, set by the fleet); the shop's estimate and invoice (from the shop).\n- **What the agent decides alone, and what it hands to a person:** alone: packaging the job and approving within the limit. To a person: choosing a new shop; anything above the limit.\n- **What could go wrong, and how the person stays in control:** it sends a job to a shop that can't take it, or approves padding. Limits per job, preferred shops only, and every outside invoice checked against the estimate.\n- **Hours it gives back:** not counted in the economics below: we have no measure of time spent arranging outside repairs.\n- **How we'd know it works:** how soon outside jobs come back after approval; how many shops accept the jobs.\n- **What the panel said:** Tess's first choice, if jobs drop into her own software and never show her margins; she'd pay little, after a trial. Glen likes it for his two smaller depots but doubts his outside shops will take a new tool (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## The new economics\n\nFor a typical customer, today against with agents (experiences 1 to 4). Agents are priced as a share of the labour they save, so the customer clearly wins.\n\n| | Today | With agents |\n|---|---|---|\n| Licence | $31,200 | $31,200 |\n| Agents (new) | – | $19,200 |\n| Labour using the product | $132,800 | $30,900 |\n| **Total for the customer** | **$164,000** | **$81,300** |\n\n- **Labour:** about 4.3 times lower; people get about 1,945 hours a year back, mostly technicians' typing and the lead tech's morning, for fixing trucks and training new technicians.\n- **The customer saves:** $82,700 a year, 50%.\n- **Our revenue per customer:** from $31,200 to $50,400, about 1.6 times.\n- **Working:** remaining labour = lead tech 25 h ($1,300) + Rosa's review 50 h ($3,600) + planning 75 h ($5,400) + parts 150 h ($6,000) + technicians 280 h ($14,600) = 580 h, $30,900. Labour saved = $101,900. Agents at $8 per vehicle a month × 200 vehicles × 12 = $19,200, about 19% of the labour saved `[PM, illustrative]`. Hourly costs and job counts as in \"The double cost today\"; the remaining hours are assumptions `[assumed]`.\n\nThe $8 is the price of the full shop agent, once all four in-shop experiences are live. It was never the price for one experience on its own. The pricing story is settled in `../roadmap/roi.md`: the morning shortlist starts alone at $3 per powered vehicle a month (the add-on the vision proposed to test, and close to the 25% uplift in `../problem/problem.md`), rising to $6 when the notes join and $8 for the full shop agent.\n\n## The experience to explore first\n\n**The morning shortlist**, mapped and tested as a flow in `../flows/flows.md`, because it's where the struggle is sharpest, it tests the riskiest assumption in `../problem/problem.md` (will managers let something else decide which trucks need work?), and every other experience starts from a job it picks. It gives back fewer hours than \"Say it, sign it\", which carries most of the money; that one should follow, because it also produces the record that tells us whether the shortlist was right.\n\nIt's small enough to prototype end to end: one pilot fleet's last day of fault codes, write-ups and PMs due, pulled through the public API. The agent groups them by truck and ranks them with Fault Code Assist's library and the truck's last repairs. It sends Rosa a single page before the shop opens: three to five trucks to pull in, each with one line of why, a drafted work order, and whether its parts are on the shelf (read only, the panel's suggestion for the buyer). \"Approve\" opens the work order through the API, and \"Reject\" asks for one line of reason. Everything else sits in \"watching\". Every decision is logged. No parts, bays or dispatch yet.\n\n**What the panel changed:** a quick veto for the lead tech on every pick, and the parts line on each draft (`panel.md`). No persona said yes to $8 a vehicle before a pilot on their own trucks; for the shortlist alone they put the bargain at $2–$3 (`../roadmap/roi.md`).\n\n**Open questions for real customers:**\n- Would you approve a drafted work order without re-reading the codes? What would you need to see?\n- When did a code you didn't act on last turn into a breakdown?\n- Who would you let veto a job the agent picked: you, the lead tech, both?\n- Would you pay for this per vehicle, or only if it comes with the parts and notes?\n", "research/icp.md": "# Our ideal customer · FleetDesk\n\n> Fictional example. FleetDesk, its customers and the product manager's answers are invented, tagged `[PM, illustrative]`. Market sources are real, retrieved on 27 Oct 2026.\n\nThe account we most want to win: the most pain, the money to fix it, and a reason to choose us. Every line ends with its source: `[documents/<file>]`, `[source: <url>]`, `[PM]` or `[assumed]`. Built on 27 Oct 2026.\n\n**In one line:** a regional carrier or distributor with 150 to 500 vehicles, its own shop, a telematics feed into FleetDesk, and a telematics vendor offering maintenance at the next renewal.\n\n## The account\n\n| | |\n|---|---|\n| Segment | Regional and LTL carriers, foodservice and beverage distributors that run their own shop [documents/product-one-pager.md] |\n| Size (sites, people, revenue) | 150–500 vehicles, typically about 200; one or two shops; one maintenance manager, one lead technician, about a dozen technicians, one parts manager [documents/interview-maintenance-manager-regional-carrier.md] [PM, illustrative] |\n| Region | US, Midwest and beyond [documents/interview-maintenance-manager-regional-carrier.md] |\n| Independent, or part of a group (and where budget goes) | Independent; the maintenance budget sits with the director of fleet operations, who reports to the CFO or COO [documents/interview-fleet-ops-director-distribution.md] |\n| What they run on (our product, modules, other systems, spreadsheets) | FleetDesk Pro with multi-shop parts, or Core with a shop that needs Pro; Samsara or Motive telematics streaming codes and meters into FleetDesk; a whiteboard for the shop day; Excel for cost per mile; a separate dispatch system [documents/interview-maintenance-manager-regional-carrier.md] [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative] |\n| How long they've been a customer, or why they aren't one | Customers since 2017–2021 [documents/interview-maintenance-manager-regional-carrier.md] [documents/interview-fleet-ops-director-distribution.md] |\n\n## Why they are ideal\n\n| | |\n|---|---|\n| The pain they feel most | Trucks not ready when dispatch needs them: hundreds of codes read by hand, parts not ordered ahead of the PM, slots lost when dispatch changes the plan [documents/interview-maintenance-manager-regional-carrier.md] [documents/interview-fleet-ops-director-distribution.md] |\n| What it costs them today | About $164,000 a year: $31,200 of licence plus about $132,800 of their people's time on this job (`experiences.md`, \"The double cost today\"). Plus downtime: a truck down a day costs more than a year of FleetDesk for it [documents/interview-fleet-ops-director-distribution.md] |\n| Why they would pay to fix it, and how (tier, add-on, price rise, renewal) | The buyer says he'd pay more if it cut downtime and he could prove it to the CFO; as a per-vehicle agents add-on, agreed at renewal [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative] |\n| Why us, not someone else | We hold the shop's work orders, parts and PM history, and see codes from Samsara, Motive and Geotab in one place; we win 51% of deals at this size and churn is 4% [documents/lost-deals-h1-2026.md] [documents/churn-note-2026.md] |\n| How many customers look like this | About 140 of our 812 customers; 37 of all customers face a bundled offer at renewal [PM, illustrative] [documents/churn-note-2026.md] |\n\n## The people inside\n\n| Role in the decision | Persona file | Title |\n|---|---|---|\n| Buyer (signs) | `personas/p1-glen.md` | Director of fleet operations, foodservice distributor |\n| Day-to-day user | `personas/p2-rosa.md` | Maintenance manager, regional LTL carrier |\n| Sceptic | `personas/p3-dwayne.md` | Lead technician, regional LTL carrier |\n| Edge of the market | `personas/p4-tess.md` | Owner, independent heavy-duty repair shop |\n\n## Who is not our ideal customer, and why\n\n- **Fleets under 75 vehicles.** We win a third of those deals and they make up 61 of 88 churned customers; they buy bundles on price [documents/lost-deals-h1-2026.md] [documents/churn-note-2026.md].\n- **Fleets without their own shop.** The job runs through bays and parts rooms they don't have; outsourced-repair tools such as ServiceUp fit them better [source: https://www.serviceup.com/blog/serviceup-launches-the-agentic-repair-platform-for-modern-fleets].\n- **Customers without a telematics feed.** About 500 of our customers have no codes flowing in, so the first signal is only defects and PMs [documents/fault-code-assist-beta-feedback.md].\n- **Government fleets.** A different sale, through public procurement [PM, illustrative].\n", "research/market.md": "# FleetDesk · The problem in the market\n\n> Fictional example. FleetDesk, its documents and the product manager's answers are invented, tagged `[PM, illustrative]`. Market sources are real, retrieved on 27 Oct 2026; \"search result\" means seen in search results but not opened. Vendors' pages are their own claims.\n\nHow each type of customer experiences the problem in `../problem/problem.md`, and the options they have today. Built from public sources, `../documents/` and the product manager's answers on 27 Oct 2026. Every claim has its source.\n\n**The problem:** when a truck signals it needs work, through a fault code, a driver's defect or a PM coming due, the maintenance manager wants to know which trucks need work today and have each job ready to start, with the parts and a slot that fits dispatch, so they can keep every truck safe and on the road when dispatch needs it.\n\n## In their words\n\nHow each persona talks about the problem, from trade press, job postings, vendor research and our own documents.\n\n| Persona type | How they describe it | What they're measured on | Source |\n|---|---|---|---|\n| Director of fleet operations (buyer) | Trucks not ready in the morning, and parts that should have been ordered: \"Why am I waiting on filters?\" Downtime piles up from small delays, not one big one; a fleet software vendor puts it as \"a lot of downtime is tied to approvals\" | On-time delivery, trucks available at 5 am, maintenance cost per mile, audits | `documents/interview-fleet-ops-director-distribution.md` (lines 11–13, 23); https://www.automotive-fleet.com/10256421/if-repair-delays-are-the-new-normal-how-should-fleets-respond |\n| Maintenance manager (user) | Too many codes, can't tell which few matter; a plan that's out of date once dispatch changes it. Someone at Samsara told a trade magazine that the volume of codes makes it hard to know which matter | Road calls per million miles, PM compliance, out-of-service rate, cost per mile. Job postings add owning the PM programme, reviewing road calls and breakdowns, and outside vendors and warranty (search result) | `documents/interview-maintenance-manager-regional-carrier.md` (lines 11–13); https://www.fleetmaintenance.com/in-the-bay/diagnostic-and-repair/article/55379345/13-diagnostic-trouble-codes-in-trucking; https://www.careerbuilder.com/job-details/fleet-maintenance-manager-in-southwest-florida-sarasota-fl--bc1f7602-e213-4f72-babb-329d65c3ab73 (search result) |\n| Lead technician (sceptic) | Pulled off the floor to read codes; would rather fix than type. Postings for lead techs ask them to assign the day's work orders, check finished repairs and charge out parts in the maintenance system | Comebacks, jobs closed, the quality of the crew's work | `documents/interview-maintenance-manager-regional-carrier.md` (lines 23–24); https://recruiting.paylocity.com/Recruiting/Jobs/Details/3695081 |\n| Technician | Typing notes is the part of the job they skip. A Red Seal study guide warns that entries like \"fixed brakes\" get warranty claims rejected | Hours on work orders, comebacks | `documents/interview-maintenance-manager-regional-carrier.md` (line 24); https://open-exam-prep.com/study-guides/ca-red-seal-truck-transport-tech/common-occupational-skills/communication-mentoring |\n| Independent repair shop owner (adjacent) | Too few technicians and too much work: 54% of shops reported being understaffed in 2025, with a median of five technicians | Billed hours, labour rate (median $149 an hour), shop margin | https://www.freightwaves.com/?p=571607 |\n\n## The problem through each persona's eyes\n\n| Persona type | How they see the problem | How often, what it costs | What they do now | What they've tried | What would make them switch | What worries them |\n|---|---|---|---|---|---|---|\n| buyer | Trucks that aren't ready, and money he can't see | Every morning a truck doesn't roll; a truck down a day costs more than a year of FleetDesk for that truck [documents/interview-fleet-ops-director-distribution.md] | Calls the shop, rebuilds cost per mile in Excel monthly [documents/interview-fleet-ops-director-distribution.md] | Listening to Motive's one-login bundle offer [documents/interview-fleet-ops-director-distribution.md] | Less downtime he can prove to the CFO [documents/interview-fleet-ops-director-distribution.md] | Paying for \"AI that talks\" and nothing changing; another login |\n| user | A pile of signals with two real problems hidden in it | Daily: a few hundred codes and 40 write-ups; the lead tech's first hour [documents/interview-maintenance-manager-regional-carrier.md] | Lead tech reads codes; whiteboard plan; hides \"watch\" codes [documents/interview-maintenance-manager-regional-carrier.md] [documents/fault-code-assist-beta-feedback.md] | Fault Code Assist beta: explains, but she still does everything else [documents/fault-code-assist-beta-feedback.md] | \"The three trucks I need to pull in today, and why\" [documents/interview-maintenance-manager-regional-carrier.md] | Missing the one code that matters; a list she has to re-check |\n| sceptic | Not his problem to read codes; his problem is being taken off the floor | Daily; scarce technicians: 32.5% of fleets name technician shortages a top concern (https://www.government-fleet.com/news/report-finds-53-3-of-fleets-researching-or-piloting-ai-capabilities) | Reads codes from memory and experience `[PM, illustrative]` | Nothing; he trusts his own read `[PM, illustrative]` | Being left alone to fix trucks, with jobs that arrive ready | A machine opening jobs that waste a bay; being blamed for its calls |\n| adjacent | Fleets send jobs with thin information and slow approvals | Every fleet job; labour is what they sell, at a median $149 an hour (https://www.freightwaves.com/?p=571607) | Re-enters the job, calls the fleet for approval `[PM, illustrative]` | Shop software with AI notes, such as Fullbay (https://fullbay.com/pricing/) | Jobs that arrive complete and approved | Giving a fleet's system a say in their shop |\n\n## The options they have today\n\n| Option | What it is | Who uses it | What it costs | Good at | Bad at | Source |\n|---|---|---|---|---|---|---|\n| Do nothing | Read codes as they come, react to breakdowns | Fleets without a lead tech free to do it | Road calls and downtime; repair and maintenance rose 8.6% to about $0.22 a mile in 2025 | No new tool, no change | Codes that matter get lost in the noise | https://www.fleetowner.com/operations/article/55392569/atri-report-breaks-down-class-8-truck-operating-costs-by-region-and-expense-category; `documents/interview-maintenance-manager-regional-carrier.md` |\n| Spreadsheets, whiteboards and paper | The shop day on a whiteboard; PM and reefer schedules in Excel; paper work orders at some fleets | Most shops, next to their system; 11 lost deals stayed on spreadsheets | Staff time; Fleetio's own benchmark says most fleet data is still entered by hand | Flexible, everyone understands it | Out of date by noon; retyped; nobody connects code, part and slot | `documents/interview-maintenance-manager-regional-carrier.md` (line 12); `documents/lost-deals-h1-2026.md` (line 17); https://www.automotive-fleet.com/10256421/if-repair-delays-are-the-new-normal-how-should-fleets-respond |\n| Build their own | Reports in another system ranking trucks by alert count | Larger carriers with IT help | IT and analyst time | Fits their fleet | Brittle; nobody acts on it automatically | https://www.fleetowner.com/technology/article/21162229/navigating-telematics-complexities-to-boost-fleet-uptime |\n| FleetDesk today | Work orders, PM, parts and DOT records; Fault Code Assist beta explains codes | 812 fleets; 46 in the beta | $8–$13 per vehicle a month | PM by real miles, multi-shop parts, audit file | A person reads every code, plans on a whiteboard and chases parts | `documents/product-one-pager.md`; `documents/fault-code-assist-beta-feedback.md` |\n| Fleetio | Fleet maintenance software; its AI Service Advisor drafts work orders and approves low-risk repairs within limits | Smaller and mid-size fleets | $4, $7 or $10 per vehicle a month; full work orders and parts on the top plan | Easy, fast to set up, approvals by rule | Reviewers ask for parts ordered from the work order (search result); lighter in-house shop depth | https://www.fleetio.com/pricing; https://itbrief.co.uk/story/fleetio-opens-ai-service-advisor-after-maintenance-beta; https://capterra.com/p/120855/Fleetio/reviews/?page=2 (search result) |\n| Samsara | Telematics with maintenance: Agent Studio, a daily briefing, Shop Planner, automatic purchase orders, a warranty claim agent (announced) | Fleets on its telematics | Not public; about $27–$33 per vehicle a month for telematics, three-year terms | Owns the codes; one bill for the CFO | Our customer calls its maintenance \"a checklist\"; shop features newly announced | https://tech.co/fleet-management/samsara-vs-motive; https://www.fleetmaintenance.com/shop-operations/ai-and-software/article/55386202/samsara-samsara-unleashes-agentic-ai-to-free-maintenance-teams-from-monotony |\n| Motive | Telematics with maintenance: plain-language codes by severity, work orders created from codes and defects, AI invoice reading | Fleets on its telematics | Not public; from about $25 per vehicle a month for telematics, one-year terms | Codes to work orders automatically; one login | Parts reordering \"coming soon\"; sees only its own trucks' data | https://gomotive.com/en-ca/products/maintenance/; https://tech.co/fleet-management/samsara-vs-motive |\n| Whip Around | Driver inspections first, with maintenance on its Pro plan | Smaller fleets | $5 per asset a month for inspections, $10 with maintenance | Driver inspections and defects | Shop depth; no triage of codes | https://help.whiparound.com/en/articles/6925626-how-whip-around-s-plans-work |\n| Fullbay | Software for independent heavy-duty repair shops; AI cleans up and transcribes technicians' notes | Independent shops (the adjacent segment) | $188–$318 per shop a month, plus users | Notes, estimates and invoices for a shop that sells labour | Not built for a fleet's own triage or dispatch | https://fullbay.com/pricing/; https://www.worktruckonline.com/news/fullbay-debuts-ai-tool-and-key-platform-upgrades |\n| Outsource to dealers and repair networks | Send trucks to dealers or use an agentic network such as ServiceUp to route, estimate and approve outside repairs | Fleets without bays, or with too few technicians | Dealer labour; independent shops charge a median $149 an hour; ServiceUp pricing not public | No shop to run; ServiceUp claims faster cycle times | Waiting for bays; invoices to check; one distributor sends half its repair spend outside | https://www.serviceup.com/blog/serviceup-launches-the-agentic-repair-platform-for-modern-fleets; https://www.freightwaves.com/?p=571607; `documents/interview-fleet-ops-director-distribution.md` (line 22) |\n\n**What no option does well today:** taking a signal all the way to a ready job in the fleet's own shop. Telematics bundles turn a code into a work order, and Fleetio approves repairs within limits, but nobody picks the few trucks that matter across codes, defects and PMs, gets the parts in, finds a slot that survives dispatch, and captures what the technician found. Trust is the other gap: half of fleets in Fleetio's survey name accuracy and reliability as their main barrier to AI (https://www.government-fleet.com/news/report-finds-53-3-of-fleets-researching-or-piloting-ai-capabilities).\n\n## The segments\n\n| Segment | How many organisations | Who buys | Why it hurts now | Source |\n|---|---|---|---|---|\n| Our core: fleets of 150–500 vehicles with their own shop and a telematics feed | About 140 of our 812 customers `[PM, illustrative]`; no public count of US fleets this size found | Director of fleet operations, with the maintenance manager's say | Technicians are scarce, costs per mile are rising, and telematics vendors offer maintenance at renewal | `documents/churn-note-2026.md` (line 30); https://www.fleetowner.com/operations/article/55392569/atri-report-breaks-down-class-8-truck-operating-costs-by-region-and-expense-category |\n| Independent heavy-duty repair shops serving fleets | Fullbay alone serves 5,000+ shops; about 70% of its survey's shops are independent, median five technicians | The owner | Understaffed (54%), labour at a median $149 an hour, a 46-hour median week | https://www.motor.com/2026/03/fullbay-acquires-pitstop-to-advance-ai-predictive-maintenance/; https://www.freightwaves.com/?p=571607 |\n| Government and municipal fleets | Not sized | Fleet manager through public procurement | The same technician shortage; their vendors shipped AI assistants this year | https://worktruckonline.com/news/rta-introduces-ron360-ai-assistant-for-fleet360-users-at-government-fleet-expo-2026 |\n| Smaller fleets, under 50 vehicles | 99.3% of US carriers run fewer than 100 power units (search result) | Owner or finance | Same codes, no lead tech; buying bundles on price | https://www.truckersnews.com/news/article/15754113/briefly-atas-american-trucking-trends-report-now-available (search result); `documents/churn-note-2026.md` (line 9) |\n| Canadian private fleets | Not sized | Fleet director | Same work-order pain; Motive sells maintenance in the US and Canada | https://gomotive.com/en-ca/products/maintenance/ |\n\n## What we looked for and didn't find\n\n- Reddit threads (r/Truckers, r/fleetmanagement, r/Diesel): the pages couldn't be opened from here and search returned no threads, so there is no forum voice in this file. Read them by hand before the real interviews.\n- Review pages on G2 and Capterra wouldn't open; Fleetio review themes above come from search results only.\n- Public prices for Samsara's and Motive's maintenance modules: only telematics estimates from a review site.\n- A public count of US fleets with 150–500 vehicles that run their own shop.\n- Any first-hand account from a lead technician about reading codes; all we have comes through managers.\n- An independent number for days a truck waits for a dealer bay in 2025–2026.\n", "research/panel.md": "# FleetDesk · The panel\n\n> Fictional example. FleetDesk, its documents and the product manager's answers are invented, tagged `[PM, illustrative]`. The personas are synthetic and not real people. What they say is a hypothesis to test with real customers, never evidence.\n\nEvery conversation with the personas, newest at the bottom. Built on 27 Oct 2026. Each persona answered in its own agent, with only its own file and the material being judged; the sceptic went first.\n\n## The roster\n\n| Name | Role | Segment | How they see the problem | Would pay for | Won't tolerate | Share `[assumed]` |\n|---|---|---|---|---|---|---|\n| [Glen](personas/p1-glen.md) | Director of fleet operations · buyer | Foodservice distributor, 180 vehicles | Trucks not ready at 5 am; waiting on parts everyone knew were needed | Fewer trucks down, with a number for the CFO | Another login or dashboard | 6% |\n| [Rosa](personas/p2-rosa.md) | Maintenance manager · user | Regional LTL carrier, 240 tractors | A pile of signals with two real problems hidden in it | A work order written from the code that the tech only checks | Another dashboard | 4% |\n| [Dwayne](personas/p3-dwayne.md) | Lead technician · sceptic | Same carrier, north shop | Reading codes isn't the job; fixing trucks is | (not his money) staying on the floor | A machine's call with his name on it | 4% |\n| [Tess](personas/p4-tess.md) | Owner, independent heavy-duty shop · adjacent | Independent shop, 5 technicians | Fleet jobs arrive thin and wait on approval | Complete, pre-approved jobs, paid faster | A fleet's system setting her prices | 14% |\n\nAcross the panel: 117 fields, 8 `[assumed]` (7%), under the one-third limit. The thinnest is Dwayne: no technician speaks in our documents, so he leans on `[PM, illustrative]`.\n\n### Reality check\n\nThe product manager read each persona and said what they'd never say or do. Fixes applied, tagged `[PM, illustrative]`:\n\n- Glen would never buy without a reference call from another distributor: \"how they buy\" updated.\n- Dwayne would never type in the bay with gloves on; he types at the shared desktop at the end of the shift: \"workarounds\" updated.\n- Rosa and Tess: no changes.\n\nNo calibration yet: `documents/` has two interview summaries but no verbatim question-and-answer to hold back. The next real interview transcript should be used to calibrate Rosa.\n\n## 1. Interview: Rosa, maintenance manager\n\nThe product manager asked the Mom Test questions from `../problem/problem.md`. Rosa answered in character from her record.\n\n**PM:** Walk me through yesterday morning. Which codes did you open, and how did you decide?\n**Rosa:** I got in before six. The overnight list had a few hundred codes and about forty write-ups. My lead tech took the codes, like every day. I took the write-ups. He flagged maybe a dozen trucks. We looked at three properly: a coolant temperature code that had come back three nights running, an aftertreatment code on a truck due a PM anyway, and an air pressure write-up from a driver. Everything else we left.\n\n**PM:** Tell me about the last time a code you didn't act on turned into a breakdown. What happened?\n**Rosa:** Back in the summer. A tractor threw a low-severity code a few times over a week. Nobody pulled it in, because it looked like the usual noise. It derated on the interstate on a Thursday night. Tow, a rental tractor, a late load. I had to explain the road call on Monday. When we looked back, the code had been telling us.\n\n**PM:** What did you check before you opened the last work order from a code?\n**Rosa:** Whether it repeated. The truck's last few work orders. Whether it had a PM coming up, so we could do both at once. And my lead tech's gut. Honestly, his gut is most of it.\n\n**PM:** Think of the last truck that sat in the yard waiting. What was it waiting for, and for how long?\n**Rosa:** A turbo actuator, last month. We knew it needed one. The part wasn't in either shop, and the vendor took until the next afternoon. Before that it was a set of filters for a PM. That one shouldn't happen.\n\n**PM:** When did dispatch last keep a truck out past its PM? What happened next?\n**Rosa:** Two weeks ago. It was on the whiteboard for Tuesday. Dispatch kept it on a run. Nobody moved the PM. We found it overdue on Friday, in the overdue list.\n\n**PM:** How many codes did you see yesterday, and how many became work?\n**Rosa:** A few hundred codes. Three or four work orders came out of them. I couldn't tell you the exact number. Nobody counts.\n\n**PM:** Would you use something that picked the trucks for you?\n**Rosa:** Maybe. It depends what it picks. If it shows me why, I'd look at it. The beta's fine on the bad days.\n\n**PM:** How did you work out what the last truck that didn't roll cost you? Who saw that number?\n**Rosa:** I didn't, really. The tow bill and the rental went to accounts. Operations knew the load was late. Nobody put it together in one number. The CFO sees cost per mile once a month.\n\n*End interview.*\n\n**Stepping out: feedback on the interview**\n\n- **The three questions that got the most useful answers:**\n  1. \"Tell me about the last time a code you didn't act on turned into a breakdown\": a real incident, a repeat code nobody acted on, and its cost (tow, rental, a late load).\n  2. \"Think of the last truck that sat in the yard waiting\": parts, twice, and one the PM predicted. This supports the bigger job.\n  3. \"What did you check before you opened the last work order?\": the real decision rule: repeats, history, PM due, the lead tech's gut. That's the shortlist's ranking.\n- **The polite non-answer:** \"Would you use something that picked the trucks for you?\" got \"maybe, it depends\". It's a future question, so it got a future answer. Drop it.\n- **The one you should have asked:** \"On a morning the beta saved your lead tech time, what did he do with it?\" If the time goes back to the floor, the hours in `experiences.md` are real. If it disappears, they're not. Also worth asking: \"Who has to agree before a work order is opened from a code?\" Dwayne's veto came up in every other answer.\n- **Also learned:** nobody adds up the cost of a truck that didn't roll. That weakens \"the buyer can see downtime\", the third riskiest assumption in `../problem/problem.md`.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## 2. Score the three framings\n\nEach persona rated the three framings in `../problem/framings.md`: pain (1 to 5: how much it hurts them today) and pay (1 to 5: how likely their organisation pays to fix it, and through which budget). Sceptic first.\n\n| Persona | As stated: pain | pay | The bigger job: pain | pay | The moonshot: pain | pay |\n|---|---|---|---|---|---|---|\n| Dwayne (sceptic) | 4 | 2 | 3 | 2 | 1 | 1 |\n| Glen (buyer) | 2 | 2 | 5 | 4 | 4 | 2 |\n| Rosa (user) | 4 | 3 | 4 | 2 | 3 | 1 |\n| Tess (adjacent) | 1 | 1 | 3 | 2 | 1 | 1 |\n| **Average** | **2.75** | **2.0** | **3.75** | **2.5** | **2.25** | **1.25** |\n| **Spread** | 1–4 | 1–3 | 3–5 | 2–4 | 1–4 | 1–2 |\n| Average, the three fleet personas | 3.3 | 2.3 | 4.0 | 2.7 | 2.7 | 1.3 |\n\nIn their own words:\n\n- **Dwayne, as stated:** \"That's my first hour every morning. Fine. But don't make me approve a list I already know by heart.\" Budget: the shop line, \"if Rosa fights for it\".\n- **Dwayne, the bigger job:** \"Parts and bays aren't my fight. Get me parts on the bench and leave me the call on the truck.\"\n- **Dwayne, the moonshot:** \"Nobody reads a code by hand? I've heard that one.\"\n- **Glen, as stated:** \"That's my shop's chore. Not why trucks miss 5 am.\" No budget of his.\n- **Glen, the bigger job:** \"Waiting on filters for a PM we knew was due. That's the whole problem.\" Budget: an add-on to the maintenance budget at the March 2027 renewal; he signs up to $50,000.\n- **Glen, the moonshot:** \"Show me fewer trucks down at 5 am first. Then talk about charging for uptime.\"\n- **Rosa, as stated:** \"That's my lead tech's first hour every day. But I already have Fault Code Assist for the bad days.\" Budget: an add-on at renewal, through the director and the CFO.\n- **Rosa, the bigger job:** \"That's my whole week. But it's five tools at once. Show me one that works first.\"\n- **Rosa, the moonshot:** \"Paid for uptime\" isn't a line at her carrier.\n- **Tess:** only her slice of the bigger job matters to her: \"I won't pay for their uptime. I bill hours.\"\n\n**Where they agree and disagree:**\n\n- **The bigger job hurts most** for everyone (3.75 average, 4.0 for the fleets), and it's the only framing the buyer would pay for (4). That supports the product manager's choice.\n- **The user and the buyer split on where the pain is.** Rosa and Dwayne feel the code list (4); Glen gives it a 2: \"not why trucks miss 5 am\". The fault code is the users' pain, the parts wait is the buyer's.\n- **Pay is low across the board except the buyer.** Only Glen goes above 3, and only for the bigger job. Rosa feels it but doesn't hold the budget.\n- **The moonshot is a slogan to all four.** Nobody has a budget line for uptime.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## 3. React to the experiences\n\nEach persona walked through the five experiences in `experiences.md`, sceptic first: where it helps, where they'd get stuck, what they'd never let an agent do, and the moment they'd stop.\n\n| Experience | Dwayne (sceptic) | Glen (buyer) | Rosa (user) | Tess (adjacent) |\n|---|---|---|---|---|\n| 1. The morning shortlist | Takes his first hour; stops after \"two bad calls in a week\". Never: a job that ties up a bay with his name on it | Helps the shop, not his 5 am; stops if a \"watching\" truck breaks down or it's another screen | Her first choice; stops the first time a \"watching\" truck breaks down on I-70 | Not her world |\n| 2. Parts on the bench | Wants it; stops the second time a part is a phantom | His first choice: \"this is my pain\". Never: spend without a cap per order and per day | Stuck on wrong counts after receiving; stops at the first double order | Not her world; never order from her vendors |\n| 3. A slot that survives dispatch | Only a little; dispatch \"won't answer a machine\" | Needs dispatch data FleetDesk doesn't hold; won't add a login | Wants the rebooked PM; doubts it without dispatch and live location | Never let a fleet's system bump a job in her bay |\n| 4. Say it, sign it | His first choice: fixes \"replaced\" and \"Other\". Stops the day one note is used against a tech | Helps the audits; techs may feel watched | 14 techs stop typing \"replaced\"; stops if techs just tap through | Partly hers; doesn't want a second tool beside her shop software |\n| 5. Overflow to a trusted shop | Helps when both bays are full; a comeback from outside lands on his shop | Fits his two smaller depots; his outside shops won't install a new tool | Saves phoning around; stops at one bad invoice that slips through | Her first choice, if it drops into her software and never shows her margins |\n\n**What each would want first:** Rosa the shortlist, Glen the parts, Dwayne the notes, Tess the overflow. Every persona picked the one that removes their own chore.\n\n**What none of them would let an agent do:** spend money, move a truck off a route, or file a claim without a named person seeing it.\n\n**Price, agents at $8 per vehicle a month:** no yes. Glen: not now, he'd pilot the parts experience first and sign it himself at renewal, under his $50,000 limit. Rosa: not now, she'd back a pilot of the shortlist; the director and the CFO sign. Dwayne: not now, \"show me it on a truck I know\". Tess: not her bill; she might pay a small monthly add-on to her own software for experience 5, after a trial. (The price for the shortlist alone was later voted on and set at $3 per powered vehicle a month: `../roadmap/roi.md`.)\n\n**The three changes that would win over the most personas:**\n\n1. **A person's name on every action, and a quick veto.** Nothing is opened, ordered, moved or filed without a named person seeing it, and the lead tech can strike a job in one tap. It answers Dwayne, Rosa and Glen.\n2. **Prove it on their own trucks before the price.** A pilot that counts hours given back and trucks down at their fleet, then the price. It answers Glen, Rosa and Dwayne.\n3. **Show the parts on every drafted job.** Put a \"parts on the shelf: yes / no\" line on each draft in the shortlist, so the buyer's pain shows up in the users' first experience. It answers Glen and Dwayne.\n\nAdded to `experiences.md` under \"What the panel said\" for each experience.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## The best objection\n\n\"You're asking me to trust a machine that picks my jobs and writes my notes, and when it's wrong, I'm the one who gets blamed.\" (Dwayne; Rosa said the same in her own words.)\n\nGlen's is the commercial one: he'll pay only if it proves fewer trucks down with one fewer login, next to Motive's one-bill offer, with last year's price rise still fresh.\n\n**Worth adding to `../problem/problem.md`, under what to learn before building:** \"Who gets blamed when the agent's pick is wrong, and who must be able to veto it?\" Not added yet; the product manager decides.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n", "research/personas/p1-glen.md": "# p1 · Glen, director of fleet operations\n\n> Fictional example. A synthetic persona built from invented FleetDesk documents and real public sources. Not a real person.\n\nmodelled_on: the regional foodservice distributor in the September 2026 interview, 180 vehicles, three depots [PM, illustrative]\npanel_role: buyer\n\n## Background\n- organisation: regional foodservice distributor; 110 refrigerated box trucks and 70 tractors with reefer trailers; three depots, one central shop with 6 technicians [documents/interview-fleet-ops-director-distribution.md]\n- group position: independent; maintenance budget is his, agreed with the CFO [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative]\n- role and tenure: director of fleet operations, 8 years in role, reports to the CFO [assumed]\n- runs on: FleetDesk Core since 2021; Motive telematics; a fuel card portal; the parts vendor's website; Excel; reefer units tracked in a spreadsheet [documents/interview-fleet-ops-director-distribution.md]\n\n## Business\n- who signs: Glen up to $50,000 a year; the CFO above that [PM, illustrative]\n- budget route: renewal, as an add-on [PM, illustrative]\n- what they are measured on: on-time delivery; trucks available at 5 am; maintenance cost per mile; DOT and food-safety audits [documents/interview-fleet-ops-director-distribution.md]\n- renewal or contract moment: March 2027, with a Motive bundling offer on the table [documents/interview-fleet-ops-director-distribution.md]\n\n## Psychology\n- attitude to change: pragmatist [PM, illustrative]\n- trust in AI: low for talk, high for results: \"I don't need AI that talks to me.\" [documents/interview-fleet-ops-director-distribution.md]\n- burned by: rebuilding the CFO report by hand every month after being told the product had reports [documents/interview-fleet-ops-director-distribution.md]\n- will not tolerate: another login or another dashboard he has to check [documents/interview-fleet-ops-director-distribution.md]\n- would pay for: fewer trucks down at 5 am, with a number he can show the CFO [documents/interview-fleet-ops-director-distribution.md]\n\n## Capability\n- tech comfort: medium [assumed]\n- data they hold: FleetDesk work orders and outside invoices; Motive GPS and codes; fuel card files; reefer hours in a spreadsheet that's often behind [documents/interview-fleet-ops-director-distribution.md]\n- time they can give a new tool: a short weekly review, no more [PM, illustrative]\n\n## The problem, through their eyes\n- the problem in their words: \"We know the PM is due. We know which filters it takes. Why am I waiting on filters?\" [documents/interview-fleet-ops-director-distribution.md]\n- how often it hits them, and what it costs them: several trucks a month miss the morning; each day down costs more than a year of FleetDesk for that truck [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative]\n- what they do about it today: calls the shop; rents or swaps a truck; rebuilds downtime and cost per mile in Excel monthly [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative]\n- options they've tried or considered: Motive's maintenance in one login, not yet refused [documents/interview-fleet-ops-director-distribution.md]\n- what would make them switch: a vendor who proves less downtime and one fewer system [documents/interview-fleet-ops-director-distribution.md]\n- what worries them about a new way: paying for AI that explains things but leaves the work with his people; agents spending money without a limit [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative]\n\n## Behaviour\n- a normal day: checks which trucks didn't roll at 5 am, then calls the shop and dispatch; afternoons on customers, vendors and invoices; opens FleetDesk mostly for reports and outside repairs [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative]\n- workarounds: Excel cost-per-mile report from three exports; outside vendors and a mobile repair service at the two smaller depots [documents/interview-fleet-ops-director-distribution.md]\n- last time it went wrong: a reefer truck sat waiting for filters on a PM that was due, and a restaurant called about a missed delivery [documents/interview-fleet-ops-director-distribution.md] [PM, illustrative]\n- how they buy: a demo, then a reference call with another distributor, which he won't skip, then the CFO at renewal [PM, illustrative]\n\n## Buying insight\n- priority initiative: get trucks ready at 5 am before the March 2027 renewal, where Motive offers one bill [documents/interview-fleet-ops-director-distribution.md]\n- success factors: fewer trucks down in the morning; a downtime number for the CFO [documents/interview-fleet-ops-director-distribution.md]\n- perceived barriers: FleetDesk's AI so far explains codes and does nothing; a price rise last year [documents/lost-deals-h1-2026.md] [documents/churn-note-2026.md]\n- decision criteria: downtime, cost per truck, number of logins; compared against Motive's bundle [documents/interview-fleet-ops-director-distribution.md]\n- buyer's journey: Glen and the maintenance lead see a demo; customer success runs a business review; the CFO approves at renewal [PM, illustrative]\n\n## Voice\n- sounds like: \"Price per truck is fine. Show me fewer trucks down and I'll pay more.\" [documents/interview-fleet-ops-director-distribution.md]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| quote | \"I don't need AI that talks to me. I need trucks ready at 5 am.\" | documents/interview-fleet-ops-director-distribution.md, line 30 |\n| budget signal | A truck down for a day costs more than a year of FleetDesk for that truck | documents/interview-fleet-ops-director-distribution.md, line 11 |\n| budget signal | Would pay more if it cut downtime and he could prove it to the CFO | documents/interview-fleet-ops-director-distribution.md, line 32 |\n| pain | Waiting on filters for a PM everyone knew was due | documents/interview-fleet-ops-director-distribution.md, line 23 |\n| workaround | Cost-per-mile report in Excel, two days a month | documents/interview-fleet-ops-director-distribution.md, line 12 |\n| objection | Motive offers one login; he hasn't said no | documents/interview-fleet-ops-director-distribution.md, line 25 |\n| trigger | Renewal March 2027 with a bundle offer | documents/interview-fleet-ops-director-distribution.md, line 37 |\n| market | Small delays add up to downtime; approvals are a big part of it | https://www.automotive-fleet.com/10256421/if-repair-delays-are-the-new-normal-how-should-fleets-respond |\n\nFields tagged: 33 · `[assumed]` 2 (6%).\n", "research/personas/p2-rosa.md": "# p2 · Rosa, maintenance manager\n\n> Fictional example. A synthetic persona built from invented FleetDesk documents and real public sources. Not a real person. The same Rosa appears in `../../vision/vision.md`, in 2029.\n\nmodelled_on: the regional LTL carrier in the September 2026 interview, 240 tractors, two shops [PM, illustrative]\npanel_role: user\n\n## Background\n- organisation: regional less-than-truckload carrier in the Midwest; 240 tractors, 610 trailers; two shops, 14 technicians, one parts manager [documents/interview-maintenance-manager-regional-carrier.md]\n- group position: independent; budget through the director of maintenance and the CFO [PM, illustrative]\n- role and tenure: maintenance manager, 11 years at the carrier, came up as a technician [assumed]\n- runs on: FleetDesk Pro since 2017; Samsara telematics feeding codes and meters; a whiteboard for the shop day; a dispatch system she can't see [documents/interview-maintenance-manager-regional-carrier.md] [PM, illustrative]\n\n## Business\n- who signs: not her; she strongly influences the purchase and the renewal [documents/interview-maintenance-manager-regional-carrier.md]\n- budget route: add-on at renewal [PM, illustrative]\n- what they are measured on: road calls per million miles; PM compliance; out-of-service rate at roadside inspections; cost per mile [documents/interview-maintenance-manager-regional-carrier.md]\n- renewal or contract moment: annual contract; next renewal in spring 2027 [PM, illustrative]\n\n## Psychology\n- attitude to change: early pragmatist; she joined the Fault Code Assist beta [documents/fault-code-assist-beta-feedback.md]\n- trust in AI: will use a ranked list if it shows why; won't let it close or skip a truck without her [documents/interview-maintenance-manager-regional-carrier.md] [PM, illustrative]\n- burned by: meter readings that stopped syncing and showed trucks overdue that were done last week [documents/support-tickets-q3-2026.csv]\n- will not tolerate: \"another dashboard\" [documents/interview-maintenance-manager-regional-carrier.md]\n- would pay for: a work order written from the code that the tech only checks [documents/interview-maintenance-manager-regional-carrier.md]\n\n## Capability\n- tech comfort: medium-high [PM, illustrative]\n- data they hold: 9 years of work orders and PM history in FleetDesk; Samsara codes; technicians' notes that rarely say cause and correction [documents/interview-maintenance-manager-regional-carrier.md]\n- time they can give a new tool: a few minutes each morning, if it replaces something [PM, illustrative]\n\n## The problem, through their eyes\n- the problem in their words: \"Two of them will be the truck that breaks down on I-70 tonight, and I can't tell which two.\" [documents/interview-maintenance-manager-regional-carrier.md]\n- how often it hits them, and what it costs them: every morning; the lead tech's first hour; road calls she has to explain [documents/interview-maintenance-manager-regional-carrier.md]\n- what they do about it today: the lead tech reads codes; she plans on a whiteboard and types it in; finds missed PMs when they're overdue [documents/interview-maintenance-manager-regional-carrier.md]\n- options they've tried or considered: Fault Code Assist: helpful on bad days, but she still does everything else; Samsara's maintenance looked like \"a checklist\" [documents/fault-code-assist-beta-feedback.md] [documents/interview-maintenance-manager-regional-carrier.md]\n- what would make them switch: \"the three trucks I need to pull in today, and why\" [documents/interview-maintenance-manager-regional-carrier.md]\n- what worries them about a new way: missing the one code that matters; too many \"watch\" alerts again; being blamed for a machine's call [documents/fault-code-assist-beta-feedback.md] [PM, illustrative]\n\n## Behaviour\n- a normal day: opens FleetDesk before coffee for write-ups and codes; builds the whiteboard plan with the lead tech; replans twice before noon when dispatch moves trucks [documents/interview-maintenance-manager-regional-carrier.md]\n- workarounds: the whiteboard; phone calls with dispatch; the lead tech as \"fault-code clerk\" [documents/interview-maintenance-manager-regional-carrier.md]\n- last time it went wrong: a tractor missed its PM slot because dispatch kept it on a route, and nobody noticed until it was overdue [documents/interview-maintenance-manager-regional-carrier.md]\n- how they buy: tries it in the beta, then argues for it with the director [documents/fault-code-assist-beta-feedback.md] [PM, illustrative]\n\n## Voice\n- sounds like: \"Don't give me another dashboard. Give me the three trucks I need to pull in today, and why.\" [documents/interview-maintenance-manager-regional-carrier.md]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| quote | \"I can't tell which two.\" | documents/interview-maintenance-manager-regional-carrier.md, line 11 |\n| workaround | Whiteboard plan, typed in, changed twice before noon | documents/interview-maintenance-manager-regional-carrier.md, line 12 |\n| trigger | Measured on road calls, PM compliance, out-of-service rate, cost per mile | documents/interview-maintenance-manager-regional-carrier.md, line 13 |\n| pain | Lead tech as fault-code clerk | documents/interview-maintenance-manager-regional-carrier.md, line 23 |\n| pain | Missed PM slots that nothing reschedules | documents/interview-maintenance-manager-regional-carrier.md, line 26 |\n| budget signal | Would pay for a drafted work order the tech checks | documents/interview-maintenance-manager-regional-carrier.md, line 32 |\n| objection | \"Too many 'watch' codes\" | documents/fault-code-assist-beta-feedback.md, line 20 |\n| pain | Meter sync, 18% of tickets | documents/support-tickets-q3-2026.csv, line 2 |\n| market | Job postings put PM, road calls and breakdown review on this role (search result) | https://www.careerbuilder.com/job-details/fleet-maintenance-manager-in-southwest-florida-sarasota-fl--bc1f7602-e213-4f72-babb-329d65c3ab73 |\n\nFields tagged: 28 · `[assumed]` 1 (4%).\n", "research/personas/p3-dwayne.md": "# p3 · Dwayne, lead technician\n\n> Fictional example. A synthetic persona built from invented FleetDesk documents and real public sources. Not a real person.\n\nmodelled_on: the lead technician at the same regional LTL carrier, described by the maintenance manager [PM, illustrative]\npanel_role: sceptic\n\n## Background\n- organisation: regional LTL carrier, 240 tractors, two shops, 14 technicians [documents/interview-maintenance-manager-regional-carrier.md]\n- group position: works for the maintenance manager; no budget [PM, illustrative]\n- role and tenure: lead technician in the north shop, 20+ years on diesel trucks, like 42% of technicians in Fullbay's survey [PM, illustrative] [source: https://www.freightwaves.com/?p=571607]\n- runs on: FleetDesk on a shared desktop and a tablet; Samsara codes inside FleetDesk; OEM diagnostic laptops [documents/interview-maintenance-manager-regional-carrier.md] [source: https://recruiting.paylocity.com/Recruiting/Jobs/Details/3695081]\n\n## Business\n- who signs: nobody asks him, but he can kill a rollout on the shop floor [PM, illustrative]\n- budget route: not budgeted [PM, illustrative]\n- what they are measured on: comebacks; jobs done right; the crew's quality [assumed]\n- renewal or contract moment: none [PM, illustrative]\n\n## Psychology\n- attitude to change: resistant until he sees it work on a truck he knows [PM, illustrative]\n- trust in AI: low; he has seen codes cleared and the problem come back [PM, illustrative]\n- burned by: a tablet rollout that made techs pick a cause code to close a job, so they picked \"Other\" [documents/support-tickets-q3-2026.csv]\n- will not tolerate: a machine opening jobs that tie up a bay for nothing, and him taking the blame [PM, illustrative]\n- would pay for: (not his money) being left on the floor to fix trucks [documents/interview-maintenance-manager-regional-carrier.md]\n\n## Capability\n- tech comfort: medium on diagnostic tools, low on typing [documents/interview-maintenance-manager-regional-carrier.md]\n- data they hold: what the trucks actually had, in his head; little of it written down [documents/interview-maintenance-manager-regional-carrier.md]\n- time they can give a new tool: almost none during the shift [PM, illustrative]\n\n## The problem, through their eyes\n- the problem in their words: \"Reading codes isn't the job. Fixing trucks is the job, and I'm stuck at a screen.\" [PM, illustrative]\n- how often it hits them, and what it costs them: every morning, the first hour [documents/interview-maintenance-manager-regional-carrier.md]\n- what they do about it today: reads every code, decides from experience, opens the work orders himself [documents/interview-maintenance-manager-regional-carrier.md]\n- options they've tried or considered: Fault Code Assist; it explains codes he already knows [documents/fault-code-assist-beta-feedback.md] [PM, illustrative]\n- what would make them switch: jobs arriving with the cause likely and the parts on the bench, and the right to say no [PM, illustrative]\n- what worries them about a new way: losing the judgement call; being replaced by a list; notes he types being used against him [PM, illustrative]\n\n## Behaviour\n- a normal day: first hour at the screen on codes, then assigns jobs and works the hardest trucks; checks finished repairs at the end of the shift [documents/interview-maintenance-manager-regional-carrier.md] [source: https://recruiting.paylocity.com/Recruiting/Jobs/Details/3695081]\n- workarounds: closes with \"replaced\" or \"fixed\"; picks \"Other\" as the cause [documents/interview-maintenance-manager-regional-carrier.md] [documents/support-tickets-q3-2026.csv]; types nothing in the bay with gloves on, only at the shared desktop at the end of the shift [PM, illustrative]\n- last time it went wrong: a warranty claim rejected because the work order said only \"replaced\" [documents/interview-maintenance-manager-regional-carrier.md]\n- how they buy: doesn't; tells the manager whether it works [PM, illustrative]\n\n## Voice\n- sounds like: \"I'd rather turn a wrench for two hours than type for ten minutes.\" [documents/interview-maintenance-manager-regional-carrier.md]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| pain | First hour of the day as a fault-code clerk | documents/interview-maintenance-manager-regional-carrier.md, line 23 |\n| quote | Would rather turn a wrench than type | documents/interview-maintenance-manager-regional-carrier.md, line 24 |\n| workaround | Closes with \"replaced\" or \"fixed\" | documents/interview-maintenance-manager-regional-carrier.md, line 24 |\n| workaround | Picks \"Other\" to close on the tablet | documents/support-tickets-q3-2026.csv, line 4 |\n| market | Lead techs assign daily work orders and check finished repairs | https://recruiting.paylocity.com/Recruiting/Jobs/Details/3695081 |\n| market | 42% of technicians have 20+ years; 54% of shops understaffed | https://www.freightwaves.com/?p=571607 |\n\nFields tagged: 28 · `[assumed]` 1 (4%). Leans heavily on `[PM, illustrative]`: we have no technician in their own words (`../evidence.md`, gaps).\n", "research/personas/p4-tess.md": "# p4 · Tess, owner of an independent heavy-duty repair shop\n\n> Fictional example. A synthetic persona built from invented FleetDesk documents and real public sources. Not a real person.\n\nmodelled_on: an independent heavy-duty shop near the distributor's smaller depots, which takes overflow work from FleetDesk fleets
