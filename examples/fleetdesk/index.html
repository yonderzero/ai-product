ost of the time by the beta customers.\n   - Owner: the product manager for the core product.\n2. **Capture what technicians actually found.**\n   - Why now: without it, there's no accuracy check, no warranty claims and no flywheel.\n   - A good outcome: complaint, cause and correction filled on most closed work orders.\n   - Owner: product and design, with customer success.\n3. **Settle the data rights.**\n   - Why now: level 5 and benchmarks depend on it, and 30% of customers are on older contracts.\n   - A good outcome: legal confirms what the 2021 contract allows, and an opt-in for the rest.\n   - Owner: the general manager, with legal.\n\n## 7. Watch-outs\n\n- High upside, low shipping: a large automation surface with nothing shipped yet. How quickly can the team turn the beta into a product?\n- Loyal large customers, thin structural lock-in: churn above 150 vehicles is 4%, but contracts are annual and exports are standard. Would they stay if a bundle matched the parts depth?\n- Leadership appetite is inferred, not evidenced: will the group fund AI beyond the discretionary budget?\n- The modern services around the legacy core are a stated direction; how much of the AI work can run outside the monolith?\n\n## 8. Evidence quality\n\n| Dimension | Score | Evidence Confidence | Score Basis | Flags |\n|---|---|---|---|---|\n| A1 | 4 | Medium | mixed | |\n| A2 | 5 | High | direct_evidence | |\n| A3 | 4 | Medium | mixed | |\n| A4 | 3 | Medium | mixed | boundary_risk |\n| A5 | 3 | Low | inference_heavy | inference_heavy |\n| A6 | 3 | Medium | mixed | |\n| B1 | 3 | High | direct_evidence | |\n| B3 | 4 | Medium | direct_evidence | |\n| C1 | 4 | High | direct_evidence | |\n| C2 | 1 | High | direct_evidence | |\n| C3 | 3 | Medium | mixed | |\n| C4 | 4 | Medium | mixed | |\n\n## 9. Evidence provenance\n\n- **Business quality:** the invented one-pager, sales and churn notes and interviews, plus the FMCSA rules, Fleetio's customer count in trade press and the product manager's answers on stack and leadership. Leadership mindset is scored mainly by inference.\n- **Customer strength:** the churn note's demonstrated switching by fleet size and plan.\n- **AI opportunity:** the beta feedback note, the opportunities file, and Motive's, Fleetio's and Samsara's 2026 launch pages and trade coverage.\n", "discovery/value.md": "# FleetDesk · Where value flows\n\n> Fictional example. FleetDesk, its documents, prices and numbers are invented; the product manager's answers are tagged `[PM, illustrative]`. Market facts are real and sourced.\n\nBuilt from `../product.md`, `../vision/ai-levels.md`, `../vision/opportunities.md`, `../vision/market-moves.md`, the discovery reports and the product manager's answers on 27 Oct 2026.\n\n**The shift:** most of the value goes to the fleet as a well-kept record, paid per vehicle, while the work around it is done by hand or captured by telematics bundles today → to the maintenance manager and the buyer as ready work and money recovered, paid per vehicle for the shop agent plus a share of warranty recovered, at level 4.\n\n## Today\n\n| Persona | The value they get | Who pays | For what | Roughly how much | Source |\n|---|---|---|---|---|---|\n| Director of fleet operations | One record of every repair, including outside vendors; clean DOT audits | Buyer | Per vehicle per month, Core or Pro | $8–$13 per vehicle per month, $3 per trailer; about $12,900 per customer a year on average | [documents/product-one-pager.md] `[PM, illustrative]` |\n| Fleet maintenance manager | PM schedules that follow real miles; the audit file in ten minutes | Buyer pays; user | Included in the per-vehicle price | Part of the above | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Shop technician | The job, history and parts in one work order | Buyer pays; user | Included | Part of the above | [documents/product-one-pager.md] |\n| Parts manager | Inventory and purchasing across shops | Buyer pays; user | Pro plan, $5 more per vehicle than Core | Pro customers using two or more shops churn 3% | [documents/product-one-pager.md] [documents/churn-note-2026.md] |\n\n## Where value leaks today\n\nValue the product creates or could create, but that goes somewhere else.\n\n| The leak | Where it goes instead | How big | Source |\n|---|---|---|---|\n| Reading fault codes and typing work orders | The customer's own manual work: the lead tech's first hour each morning | An hour a day at a 240-tractor carrier | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Technician notes, time and part numbers | The customer's own manual work, and thin records | An estimated 20–30 minutes per job | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Outside invoices typed in and never compared | The customer's own manual work; vendors' overcharges go unnoticed | Half of one distributor's repair spend goes outside | [documents/interview-fleet-ops-director-distribution.md] |\n| Warranty not claimed | Not recovered at all | \"Maybe a third\" recovered, by one customer's estimate | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Cost per mile for the CFO | A spreadsheet, two days a month | Every month, at every buyer who reports it | [documents/interview-fleet-ops-director-distribution.md] |\n| Fault-code insight and the \"one bill\" | Telematics vendors, who now sell maintenance in their bundle | 31 customers lost to bundles in a year | [documents/churn-note-2026.md] |\n| Fault Code Assist | Not charged for during the beta | 46 customers | [documents/fault-code-assist-beta-feedback.md] |\n| Repair history across 800 fleets | Not used; buyers ask for benchmarks we don't offer | About 2 million work orders a year | [documents/lost-deals-h1-2026.md] `[PM, illustrative]` |\n\n## At the vision's target level\n\nLevel 4, AI Delegated, by the end of 2028 (`../vision/vision.md`).\n\n| Persona | The job AI does | The value they get | What they'd pay for | Source |\n|---|---|---|---|---|\n| Fleet maintenance manager | Triages every fault code and defect; drafts work orders with cause, parts and a slot | Approves a short list instead of typing; fewer road calls | Trucks back on the road sooner: a per-vehicle shop agent | `../vision/opportunities.md` #1 |\n| Shop technician | Writes the note from the technician's voice | Wrenching instead of typing | Included in the shop agent | `../vision/opportunities.md` #3 |\n| Parts manager | Reserves parts and drafts purchase orders from the plan; tags and claims warranty | No truck waiting on parts; money back | A share of warranty money recovered | `../vision/opportunities.md` #4, #5 |\n| Director of fleet operations | Reads and checks every outside invoice; reports cost per mile | Overcharges caught; the CFO report done | Money saved on outside repairs, within the shop agent | `../vision/opportunities.md` #2 |\n\n## Who else could capture it\n\n| Who | How they'd capture the value | What keeps it with us |\n|---|---|---|\n| Telematics vendors: Motive, Samsara, Geotab | Already turn fault codes into work orders and sell one bill to the CFO (https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/) | Workflow: the shop's parts, bays and technicians; data across all three providers' trucks |\n| Fleetio | Approves low-risk repairs on its own at a lower price (https://itbrief.co.uk/story/fleetio-opens-ai-service-advisor-after-maintenance-beta, https://www.fleetio.com/pricing) | Workflow and data: deeper multi-shop parts and fleets with their own shops |\n| A general AI assistant | Reads fleet data through connectors and answers or schedules (https://truckinginfo.com/news/what-geotabs-new-ai-connector-means-for-fleets) | Trust: the DOT record and the approved work order live with us |\n| ServiceUp and repair networks | Coordinate outside repairs end to end (https://www.serviceup.com/blog/serviceup-launches-the-agentic-repair-platform-for-modern-fleets) | Distribution: our customers do most repairs in their own shops |\n\n## How we'd charge\n\n- **Today:** per vehicle per month: Core $8, Pro $13, trailers $3, on annual contracts, plus implementation [documents/product-one-pager.md].\n- **Tomorrow:** the per-vehicle base stays for the record. On top: a per-vehicle shop agent, and a share of warranty money recovered. Later, a yearly subscription for benchmarks. `[PM, illustrative]`\n- **What has to be true:** managers approve drafted work orders without rework most of the time; we can show the buyer road calls and downtime falling, and money recovered, in numbers the CFO accepts. \"I'd pay more if it cut downtime and I could prove it to the CFO.\" [documents/interview-fleet-ops-director-distribution.md]\n\n## Open questions\n\n- Is the shop agent a Pro feature, to defend against bundles, or a paid add-on? (Chosen in `../roadmap/roi.md`: a per-vehicle add-on on Pro, $3 for the morning shortlist, growing to $8 for the full shop agent.)\n- How do we measure downtime saved in a way buyers trust?\n- What share of warranty recovered is fair, and who verifies the amount?\n- Should we partner with a telematics vendor rather than compete for the \"one bill\"?\n", "flows/DESIGN.md": "# FleetDesk · Design direction\n\nSource: a style like IBM (Carbon), from getdesign.md (MIT), not its brand. No screenshots of FleetDesk were shared, so this is route 2 in the flows skill's `references/design.md`. The tokens come from `design-md/ibm/DESIGN.md` in https://github.com/VoltAgent/awesome-design-md, fetched 27 Oct 2026; the light status tints are worked out from those colours. No IBM logo, name or assets appear in the mockups. FleetDesk's own name stays.\n\n- **Offered:** IBM Carbon (structured, square, high contrast), Linear (calm, one accent, dense) and Notion (soft, readable).\n- **Chosen:** IBM Carbon. Rosa reads the shortlist at a shop desktop early in the morning and Dwayne uses a tablet at the bench in a bright, noisy shop, so the product manager wanted the most contrast and the biggest, plainest controls. Linear felt too dark and fine-grained for a shop floor, Notion too soft for safety items. [PM, illustrative]\n\n## Colours\n\n| Token | Value | Use |\n|---|---|---|\n| background | `#ffffff` | the page |\n| surface | `#f4f4f4` | panels, the selected nav item, input fields, quoted speech |\n| surface-2 | `#e0e0e0` | neutral tags, disabled controls |\n| inverse | `#161616` | the top bar and the Back / Next bar |\n| text | `#161616` | everything that matters |\n| text-muted | `#525252` | labels, meta, \"who did it\" lines |\n| text-subtle | `#8c8c8c` | helper text only, never for data |\n| border | `#e0e0e0` | 1px lines on cards, rows and inputs |\n| border-strong | `#161616` | focus underline |\n| accent | `#0f62fe` | primary actions, links, focus, the agent's work |\n| accent-hover / pressed | `#0050e6` / `#002d9c` | button states |\n| accent-tint | `#edf5ff` | the agent's banners and tags |\n| success | `#24a148` (tint `#defbe6`, text `#0e6027`) | opened, approved, parts on the shelf, feed OK |\n| warning | `#f1c21b` (tint `#fcf4d6`, text `#161616`) | not sure, waiting, feed incomplete, plan this week |\n| danger | `#da1e28` (tint `#fff1f1`, text `#a2191f`) | pull in today, safety items, struck |\n\n## Type\n\n- Families: IBM Plex Sans (Google Fonts), then Helvetica Neue, Arial, sans-serif. IBM Plex Mono for truck numbers, fault codes and VMRS codes.\n- Scale: page title 28px weight 400; section 20px weight 600; body 16px weight 400, line height 1.5, letter spacing 0.16px; small 14px; caption 12px.\n- Weights: 300 only for big numbers; 400 for text; 600 for truck numbers, section heads and the moment name.\n- Sentence case everywhere. No all-caps labels.\n\n## Spacing and shape\n\n- Base unit 4px. Steps: 4, 8, 12, 16, 24, 32, 48.\n- Cards: 24px padding, 16px apart.\n- Radius 0 on everything: cards, buttons, inputs, banners, tags. The only round thing is the talk button on the tablet.\n- Borders, not shadows: 1px `border` lines and a change of surface carry the structure.\n- Buttons are 48px tall on the shop desktop and tablet, so they work with gloves on.\n\n## Components\n\n- **Buttons:** primary is accent with white text, square, 48px tall. Secondary is charcoal `#161616` with white text. Tertiary is white with a 1px accent border and accent text. Danger is `#da1e28` with white text.\n- **Cards and tables:** white, 1px border, square, 24px padding. Rows split by 1px lines. Truck numbers in Plex Mono 20px weight 600, the reason in body text, the status tag on the right.\n- **Status tags:** square, 24px tall, 12px text, tint background with dark text. Opened / approved: success. Waiting / not sure / plan this week: warning. Pull in today / safety / struck: danger. Watching: neutral `surface-2`.\n- **Navigation:** charcoal top bar 48px tall with \"FleetDesk\" in white. Side nav white; the selected item on `surface` with a 3px accent bar on the left.\n- **The agent's work:**\n  - a suggestion or draft: an accent-tint banner with a 3px accent bar on the left, and a \"Drafted by the agent\" tag in accent-tint with accent text; nothing it drafts looks like it is already done;\n  - an approval: a primary button that names who signs (\"Approve\", \"Sign and close as Dwayne\"); afterwards a success tag and a \"who, when\" line under the row;\n  - an exception: a warning banner (tint, 3px `#f1c21b` bar on the left, dark text) that says what is missing and what the agent did not do; safety items always carry a red \"Safety\" tag.\n- **The Back / Next bar:** inverse charcoal at the bottom; the moment name in white weight 600, its line in `#c6c6c6`; progress as small squares, the current one in accent.\n- **\"Mockup for testing\":** a small warning-tint tag, fixed at the top right.\n- **Light and dark:** light only for now. The charcoal top and bottom bars are the only dark surfaces.\n\n## Do / don't\n\n- Do keep contrast high: data in `#161616` on white; muted grey only for labels.\n- Do use one accent colour. Blue means \"act here\" or \"the agent did this\", nothing else.\n- Do show raw codes in Plex Mono so a technician can check them.\n- Don't round corners or add shadows.\n- Don't put meaning in colour alone: every status tag has words.\n- Don't use IBM's logo, name, imagery or the 8-bar mark.\n", "flows/flows.md": "# FleetDesk · The right flows\n\n> Fictional example. FleetDesk, its documents, customers and the product manager's answers are invented, tagged `[PM, illustrative]`. The personas are synthetic: what they say is a hypothesis, not evidence.\n\nThe flows of the agentic customer experiences in `../research/experiences.md`, tested with real customers and the synthetic panel. Built on 27 Oct 2026. Flows to take forward, not features or a build plan yet.\n\n## The flows, ranked\n\n| # | Flow | Experience | Persona | Level today → with agents | Hours back per customer | Value | Trust | Pay | Real customers | Take forward? |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | The morning shortlist | 1 | Rosa, with Dwayne | 2 → 4 | 300 h a year | 3.5 | 3.0 | 2.75 | agree: both want it; they disagree on when the lead tech strikes | yes, first |\n| 2 | Say it, sign it | 4 | Dwayne and the technicians | 1 → 3 | 1,120 h a year | 3.75 | 3.75 | 2.5 | agree, with two changes: the technician confirms his own time; the recording stays with the truck | yes, next |\n| 3 | Parts on the bench before the truck | 2 | Parts manager, Glen | 1 → 4 | 350 h a year | 3.0 | 2.75 | 3.0 | agree it's where trucks wait; neither would let it order until counts are right | later |\n| 4 | A slot that survives dispatch | 3 | Rosa | 1 → 3 | 175 h a year | 2.75 | 2.0 | 2.0 | disagree: not a problem at a fixed-route hauler; \"dispatch won't answer a computer\" | later |\n| 5 | Overflow to a trusted shop | 5 | Tess, Rosa | 1 → 4 | not counted | 3.25 | 3.25 | 3.0 | disagree: their outside shops won't use a new tool | no, for now |\n\nValue, trust and pay are the panel's averages (1 to 5) across all four personas from `panel-tests.md`: round 2 for flows 1 and 2, round 1 for the others. Tess pulls every fleet-side average down; the three fleet personas alone give the shortlist 4.3 value and 3.3 trust. Hours back are from `../research/experiences.md`. Real customers outweigh the panel: two interviews on 27 Oct 2026 (`../documents/interview-maintenance-manager-waste-hauler-flows.md`, `../documents/interview-shop-supervisor-beverage-distributor-flows.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 1. The morning shortlist\n\n**Persona:** Rosa, maintenance manager, with Dwayne, lead technician · **Trigger:** the overnight fault codes, driver write-ups and PMs coming due, gathered before the shop opens · **Outcome:** Rosa has the few trucks to pull in today, each with a work order she approved and the reason, Dwayne had his say, and nothing else was dropped out of sight.\n\n### The main path\n\n| # | Moment | The agent | The person | What they see |\n|---|---|---|---|---|\n| 1 | Overnight read | reads every fault code, driver write-up and PM coming due; groups them by truck; drops exact repeats and codes the fleet marked as noise | nothing | a morning message: \"214 fault codes, 31 write-ups, 9 PMs due, from 46 trucks. 4 to pull in today.\" |\n| 2 | Rank | ranks trucks by risk: the code and its severity, how often it repeats, a linked write-up, a PM due, the truck's last repairs, and what similar codes led to before | nothing | nothing yet |\n| 3 | The lead tech's say | shows the picks to the lead tech first, on the shop desktop | Dwayne keeps or strikes a pick in one tap, with a preset reason; no typing | the picks with \"Keep\" and one-tap reasons: \"Known sensor glitch on this model\", \"Already fixed\", \"Not today\" |\n| 4 | The shortlist | sends one page before the shop opens: \"Pull in today\" (three to five trucks), \"Plan this week\" and \"Watching\", each truck with one line of why; the feed's status at the top | Rosa opens it; she doesn't wait for Dwayne if he hasn't looked | \"Truck 2217: coolant temperature code three nights running, and a driver wrote 'temp gauge high on hills'. PM due in 1,200 miles: do both.\" |\n| 5 | Why this truck | drafts each work order: complaint, likely cause, VMRS code, the parts it expects, whether they're on the shelf, and the evidence behind it | Rosa reviews | the draft beside \"Why this truck\": the raw codes with times, the write-up, the last three repairs, and the past cases behind the ranking |\n| 6 | Approve | opens the approved work orders in FleetDesk with Rosa's name on them, and logs every decision; a job waits for the lead tech's look before it gets a bay | Rosa approves, edits or rejects with a one-line reason | \"WO-58114 opened for truck 2217 by Rosa. Parts: 1 thermostat, 1 gasket, on the shelf in the north shop.\" |\n| 7 | Watching | keeps every truck not chosen visible in \"Watching\", with its reason and its days there, and brings it back to the top if a code repeats or gets worse | Rosa handles what comes back | \"Back on your list: truck 1840. Same aftertreatment code, third night.\" |\n\n### When it goes wrong\n\n| What happens | What the agent does | What the person does |\n|---|---|---|\n| The telematics feed or meter sync stopped overnight | flags it at the top of the page (\"No codes from Samsara since 1:12 am: this list is incomplete\") and doesn't guess | Rosa checks the feed or calls the lead tech |\n| The agent isn't sure about a truck | puts it in \"Plan this week\" with \"Not sure: check\", never in \"Watching\" | Rosa or Dwayne decides |\n| A driver reports a safety defect (brakes, steering, tyres, lights) | always puts it in \"Pull in today\"; never drops it or moves it to \"Watching\" | Rosa approves or moves it herself, with her name on it |\n| Dwayne strikes a pick that Rosa already approved | holds the job off the bay board and shows both names and reasons | Rosa decides |\n| A strike suggests a rule for the whole fleet (\"this code is noise on this model\") | applies it to that truck only, and sends the rule to Rosa | Rosa approves or declines the rule |\n| A truck in \"Watching\" breaks down | flags it, shows the history it had, and asks for a review of why it was ranked low | Rosa and Dwayne review; the reason tunes the ranking |\n\n- **What the agent does alone:** reads, groups, drops exact repeats, ranks, drafts, keeps \"Watching\" and brings trucks back.\n- **What the person always approves:** opening a work order; striking a pick; moving a safety defect; any new noise rule for the fleet.\n- **What the agent never does:** opens a work order without a named person; hides or closes a code or write-up; puts a safety defect in \"Watching\"; turns one strike into a fleet-wide rule on its own; orders parts; takes a truck off a route.\n- **Data it needs:** fault codes and meter readings (about 310 customers stream them from Samsara, Motive or Geotab); driver write-ups from the Driver app; PM schedules and repair history; Fault Code Assist's code library; parts stock, read only [documents/fault-code-assist-beta-feedback.md].\n-\n\n## 2. Parts on the bench before the truck\n\n**Persona:** the parts manager, with Glen as buyer and Rosa when a job has to move · **Trigger:** a work order is approved, or a PM comes due within the planning window · **Outcome:** the parts are on the bench when the truck arrives, or the job moves to a day when they will be.\n\n### The main path\n\n| # | Moment | The agent | The person | What they see |\n|---|---|---|---|---|\n| 1 | What the jobs need | lists the parts each approved job and each PM coming due needs, from the PM kit and the drafted work order | nothing | nothing yet |\n| 2 | Check the shelf | checks stock across shops and flags counts that look wrong, such as a receipt with no change in the count | the parts manager handles a flagged count | \"North shop shows 4 oil filters; 12 were received yesterday. Count?\" |\n| 3 | Reserve and move | reserves stock for each job and moves it between shops | nothing | the job shows \"Parts reserved\" |\n| 4 | Order | drafts purchase orders to the usual vendor at the usual price | the parts manager approves orders above the limit he set | \"PO-7731 to the usual vendor: 2 brake chambers, $214. Under your $500 limit: sent.\" |\n| 5 | Delivery | tracks the delivery date and warns Rosa if a part won't arrive in time | Rosa moves the job or keeps it | \"Turbo actuator for truck 3302 arrives Thursday, after its Tuesday slot. Move the job?\" |\n\n### When it goes wrong\n\n| What happens | What the agent does | What the person does |\n|---|---|---|\n| The count looks wrong | stops ordering that part and asks for a count | the parts manager counts |\n| The vendor gives no delivery date | flags the order as unconfirmed | the parts manager calls the vendor |\n| The price is up on the vendor's last price | stops and asks | the parts manager approves or picks another usual vendor |\n| The same part is ordered twice | blocks the second order against the daily cap | the parts manager checks |\n\n- **What the agent does alone:** reserves stock, moves it between the fleet's own shops, drafts orders under the limit.\n- **What the person always approves:** any order above the limit, any price change, any vendor change.\n- **What the agent never does:** orders from a new vendor; goes over the daily cap; orders against a count it flagged.\n- **Data it needs:** PM kits, inventory across shops, vendor price history and purchase orders (ours); vendors' delivery dates (by email today; not held).\n- **What real customers said:** the supervisor wants it most (\"It's always parts\") and the manager stages PM kits already; both said counts are wrong after every delivery and wouldn't let it order until they're right. [documents/interview-shop-supervisor-beverage-distributor-flows.md] [documents/interview-maintenance-manager-waste-hauler-flows.md]\n- **What the panel said:** Glen's top flow on value and pay (5 and 5): \"Why am I waiting on filters?\" Rosa and Dwayne both stuck on wrong counts: \"Shelf says four. Shelf lies.\" Everyone would let it reserve and move stock; nobody would let it order from a guessed cause. *Hypotheses, not evidence.*\n\n## 3. A slot that survives dispatch\n\n**Persona:** Rosa · **Trigger:** dispatch keeps a truck on a route past its slot, a part is late, or a job grows · **Outcome:** the shop's plan stays true all day, and a missed PM is rebooked the moment it's missed.\n\n### The main path\n\n| # | Moment | The agent | The person | What they see |\n|---|---|---|---|---|\n| 1 | The day's plan | proposes the plan: trucks, bays, technicians, parts ready | Rosa approves | the shop day as a board, in place of the whiteboard |\n| 2 | The truck isn't back | sees the truck isn't where the plan expected and asks dispatch, by message, when it will be | dispatch answers | \"Truck 2390 is still 140 miles out. Back by 2 pm?\" |\n| 3 | Rebook | rebooks the PM at the next slot that fits and fills the gap with the next ready job | Rosa reviews the change | \"PM for 2390 moved to Wednesday 7 am. Bay 3 now: truck 2217.\" |\n| 4 | Replan | replans and shows only what changed | Rosa handles conflicts | three changes since 9 am, each with its reason |\n\n### When it goes wrong\n\n| What happens | What the agent does | What the person does |\n|---|---|---|\n| No dispatch data and no answer | asks again, then leaves the slot open and tells Rosa; never assumes | Rosa calls dispatch |\n| An overdue safety item | never pushes it past due; puts it in front of Rosa | Rosa decides |\n| Two jobs want the same bay | shows the conflict and both options | Rosa picks |\n\n- **What the agent does alone:** fills an empty slot with the next ready job.\n- **What the person always approves:** any change to a truck's route; any overdue safety item; locking a slot.\n- **What the agent never does:** takes a truck off a route; moves a safety item past its due date.\n- **Data it needs:** the shop plan and PM due dates (ours); live location (we hold meter readings, not live location, today); dispatch's plan (in the dispatch system; not held).\n- **What real customers said:** the hauler's routes run on fixed days, so missed PMs aren't her problem; the supervisor says dispatch \"will never answer a message from a computer\". [documents/interview-maintenance-manager-waste-hauler-flows.md] [documents/interview-shop-supervisor-beverage-distributor-flows.md]\n- **What the panel said:** Rosa would value it most (5) if it worked, but nobody trusts it without dispatch's plan and live location, which FleetDesk doesn't hold (trust 2 from all four). *Hypotheses, not evidence.*\n\n## 4. Say it, sign it\n\n**Persona:** Dwayne and the technicians · **Trigger:** a technician finishes a job · **Outcome:** every work order closes with complaint, cause and correction, parts and time, in the technician's words, signed by him.\n\n### The main path\n\n| # | Moment | The agent | The person | What they see |\n|---|---|---|---|---|\n| 1 | Open the job | shows the job with the complaint already filled from the work order | nothing | the work order on the tablet, complaint filled |\n| 2 | Say it | listens while the technician holds the button and says what he found and did | the technician speaks | a big \"Hold to talk\" button, and his words appearing |\n| 3 | The draft | writes cause and correction in his words, matches the parts charged out, shows the time clocked for him to confirm, suggests the VMRS code | nothing yet | complaint, cause, correction, parts and code, each editable; \"Clocked on this job: 1.6 h. Confirm?\" |\n| 4 | Sign it | marks any word it wasn't sure of | the technician reads, fixes, confirms his time and signs | \"Sign and close as Dwayne\", with the promise: notes and recordings stay with the truck's record, never timesheets or grading |\n| 5 | What's left | shows Rosa only the work orders it couldn't complete | Rosa handles them | \"2 work orders need you: no cause given.\" |\n\n### When it goes wrong\n\n| What happens | What the agent does | What the person does |\n|---|---|---|\n| Shop noise or a word it isn't sure of | highlights the word and asks; never fills it in | the technician fixes it in one tap |\n| A part was charged out but not mentioned, or the other way round | asks which is right | the technician answers |\n| The technician says nothing about the cause | leaves cause empty and marks the job incomplete; never invents a cause | Rosa follows up |\n| The technician's finding differs from the drafted cause | records his finding, not the draft | nothing: this is how the shortlist learns |\n\n- **What the agent does alone:** writes the draft note, matches parts, suggests the code.\n- **What the person always approves:** the technician signs every note and confirms his own time.\n- **What the agent never does:** closes a work order without his signature; invents a finding; fills time on its own; uses notes or recordings for timesheets or to judge a technician; deletes the recording.\n- **Data it needs:** the work order, parts charged out, clock times (ours); the technician's voice (new); warranty terms (ours, little used).\n- **What real customers said:** \"Notes. The part nobody does.\" Both want it. The manager: never fill time from the clock (\"The union steward would be in my office the same day\"); techs would talk at the bench or in the cab, not in the bay. The supervisor: \"If my manager can play it back to grade me, the guys won't touch it.\" Commitment: two technicians will try it once there is a pilot. [documents/interview-maintenance-manager-waste-hauler-flows.md] [documents/interview-shop-supervisor-beverage-distributor-flows.md]\n- **What the panel said:** Dwayne's first choice (value 5): \"I'll talk for two minutes. Just don't make me type.\" Trust rose to 3.75 once the promise was on the sign screen and the technician confirms his own time, but Rosa, Glen and Dwayne all said a promise on a screen isn't a policy: it belongs in the customer agreement. Glen wouldn't pay for it alone. *Hypotheses, not evidence.*\n\n## 5. Overflow to a trusted shop\n\n**Persona:** Tess, owner of an independent shop, and Rosa on the fleet's side · **Trigger:** an approved job has no bay or technician in the fleet's shop, or the truck is near another depot · **Outcome:** the job reaches a trusted outside shop complete and pre-approved, and comes back as a proper record.\n\n### The main path\n\n| # | Moment | The agent | The person | What they see |\n|---|---|---|---|---|\n| 1 | Offer the job | offers it to the fleet's preferred shops with codes, history and an approval limit | Rosa picks or approves the shop | three preferred shops near the truck, with their last jobs for the fleet |\n| 2 | The shop gets it | sends the job to Tess by link or into her own shop software | Tess accepts and sets the time | the job, ready to start: codes, history, limit |\n| 3 | Estimate | approves an estimate within the limit; asks Rosa above it | Rosa approves above the limit | \"Estimate $1,180, limit $1,500: approved.\" |\n| 4 | Invoice | reads the invoice into the work order and checks it against the estimate | the office handles mismatches | \"Invoice $1,420 against estimate $1,180: check.\" |\n\n### When it goes wrong\n\n| What happens | What the agent does | What the person does |\n|---|---|---|\n| No preferred shop can take it | tells Rosa; never tries a new shop | Rosa phones |\n| The estimate is over the limit | stops and asks | Rosa approves or declines |\n| The invoice doesn't match the estimate | holds it for the office | the office checks |\n\n- **What the agent does alone:** packages the job and approves within the limit.\n- **What the person always approves:** a new shop; anything above the limit.\n- **What the agent never does:** sends a job to a shop the fleet hasn't chosen; shows the fleet the shop's margins.\n- **Data it needs:** the work order and history (ours); preferred shops and limits (new, set by the fleet); the shop's estimate and invoice (from the shop).\n- **What real customers said:** neither would use it as drawn: \"The dealer won't log into anything of ours\"; \"Our mobile mechanic texts photos. He won't use an app.\" [documents/interview-maintenance-manager-waste-hauler-flows.md] [documents/interview-shop-supervisor-beverage-distributor-flows.md]\n- **What the panel said:** Tess's first choice (value 5) if jobs land in her own shop software and the fleet never sees her margins; she'd pay per job she wins, never per seat. Glen likes it for his two smaller depots. Rosa: \"Handy on a bad week. Not why I'd renew.\" *Hypotheses, not evidence.*\n\n## The flows to take forward\n\n**1. The morning shortlist, first.** It tests the riskiest assumption in `../problem/problem.md` (will managers let something else decide which trucks need work?), every other flow starts from a job it picks, both real customers recognised it at once, and one offered a pilot. It gives back fewer hours than the notes, so it has to prove trust, not carry the money.\n\n*The thinnest version that still shows the whole experience:* one pilot fleet's overnight codes, write-ups and PMs due, read through the public API. The agent groups them by truck and ranks them with Fault Code Assist's code library, repeats and the truck's last repairs. The lead tech can strike a pick in one tap. Rosa gets one page before the shop opens: three to five trucks to pull in, each with one line of why, the evidence, a drafted work order and whether its parts are on the shelf (read only). \"Approve\" opens the work order with her name on it; \"Reject\" asks for one line of reason. Everything else sits in \"Watching\" with its days there, and comes back if it repeats. A feed warning sits at the top when codes stop. Every decision is logged. No parts ordering, bays or dispatch.\n\n**2. Say it, sign it, next.** It gives back the most hours (1,120 a year), it's Dwayne's and the supervisor's first choice, and it records what the technician actually found, which is how we'll know whether the shortlist was right.\n\n*The thinnest version:* on work orders opened from the shortlist, the technician holds a button at the bench and says what he found and did. The agent drafts cause and correction in his words, matches the parts charged out and suggests the VMRS code; it asks about any word it isn't sure of; he confirms his own time and signs. The recording stays with the truck's record only. Rosa sees the ones it couldn't complete at the end of the shift. No warranty claims yet.\n\n**Later:** parts on the bench, once counts after receiving can be trusted (the shortlist's read-only parts line comes first); a slot that survives dispatch, once there's a way to see dispatch's plan. **Not for now:** overflow to a trusted shop, because real customers say their outside shops won't use a new tool; if it comes back, it has to land in the shop's own software.\n\n## What changed after the interviews\n\n| Round | Change | Why | Who said so |\n|---|---|---|---|\n| 1 | The lead tech sees the picks before Rosa and strikes in one tap, with preset reasons, no typing | \"Make no a one-tap, no-typing, no-penalty action\"; Rosa wanted his say before she reads the list | Dwayne, Rosa (personas) |\n| 1 | \"Watching\" shows each truck's days there and brings it back when a code repeats; \"Plan this week\" and \"Watching\" start collapsed; a feed warning at the top | Rosa stops reading a long watch list; Dwayne and Glen stop the first time a \"Watching\" truck breaks down | Rosa, Dwayne, Glen (personas) |\n| 1 | A written promise on the sign screen: notes and recordings stay with the truck's record, never timesheets or grading; the technician confirms his own time | Every fleet persona said \"never judge a tech\" | Dwayne, Rosa, Glen (personas) |\n| 1 | Mockups built for the two flows that led round 1; the others stay as flow maps | Overflow, parts and the dispatch slot scored lower on trust | panel |\n| 2 | A strike applies to that truck only; a fleet-wide noise rule needs Rosa's approval | \"One tech's tap quietly rewrites the rules for 240 tractors\" | Rosa, Glen, Dwayne (personas) |\n| 2 | \"Why this truck\" shows the past cases behind the ranking (\"See the 9 trucks\") | \"7 out of 9 is a small sample. Show the nine.\" | Dwayne (persona) |\n| Real | Rosa doesn't wait for the lead tech; a job she approved waits for his look before it gets a bay | The manager won't wait to open the day; the supervisor won't have a bay tied up | real customers (maintenance manager; shop supervisor) |\n| Real | Time is never filled from the clock: the technician confirms it | \"The union steward would be in my office the same day\" | real customer (maintenance manager) |\n| Real | Notes promise to go in the customer agreement, not just on the screen | \"If my manager can play it back to grade me, the guys won't touch it\"; the panel said the same | real customer (shop supervisor); Rosa, Glen, Dwayne (personas) |\n| Real | Overflow to a trusted shop dropped for now | Neither fleet's outside shops would use a new tool | real customers (both) |\n\nNot changed, and why: Glen's weekly \"trucks down at 5 am, before and after\" for his CFO. It matters for the sale, but it's a report on top of the flows, not part of them; it goes to the roadmap.\n", "flows/panel-tests.md": "# FleetDesk · Interviews about the flows\n\n> Fictional example. FleetDesk, its customers and documents are invented. The personas are synthetic and not real people: what they say is a hypothesis to test with real customers, never evidence.\n\nEach round: the personas walk through each flow as themselves, each in its own agent with only its own persona file and the material being judged, the sceptic first. Real interviews are at the bottom, and outweigh the panel. Built on 27 Oct 2026.\n\n## Round 1 · 27 Oct 2026 · the five flow maps in `flows.md`\n\nAll five flows, read moment by moment from the \"What they see\" column and \"When it goes wrong\". No mockups yet.\n\n### Dwayne, lead technician (sceptic)\n\n- **First thing he'd do:** test the shortlist on trucks he already knows, then check what it left out.\n- **Where he'd get stuck:** \"a code three nights running can mean a bad sensor, not a thermostat\"; a strike that needs typing; shop noise for the notes; shelf counts for parts.\n- **What he'd let the agent do alone:** read, group, drop exact repeats; draft notes and match parts; reserve and move parts between the two shops.\n- **What he'd never let it do:** open jobs that tie up a bay for nothing with his name on them; order from a guessed cause; close a note without his signature; use his words to judge or time him.\n- **What's missing for his job:** \"a way to say no without typing\"; a record of when it was wrong; a written promise that recordings never go to timesheets.\n- **The moment he'd stop:** \"the first time a 'Watching' truck breaks down and nobody asks me why\"; a recording used against a tech.\n- **In his words:** \"Show me it was right on 2217 last week, then talk to me.\" · \"I'll talk for two minutes. Just don't make me type.\"\n\n### Glen, director of fleet operations (buyer)\n\n- **First thing he'd do:** check the shortlist against which trucks didn't roll at 5 am; look at the filter case in the parts flow.\n- **Where he'd get stuck:** the shortlist goes to Rosa, and he gets no number; vendor delivery dates and reefer parts sit outside FleetDesk; dispatch is another system.\n- **What he'd let the agent do alone:** read, group, rank, draft; reserve stock and order under a limit he sets; package outside jobs.\n- **What he'd never let it do:** open a work order without a named person; buy from a new vendor or go over the cap; touch a route.\n- **What's missing for his job:** \"a count of trucks down at 5 am, before and after\", as a weekly page for the CFO with no new login.\n- **The moment he'd stop:** a truck in \"Watching\" misses the morning \"and the only fix is 'tune the ranking'\"; the first double order.\n- **In his words:** \"Don't send me a list. Send me fewer trucks down.\" · \"Nice for Dwayne. I won't pay extra for it.\"\n\n### Rosa, maintenance manager (user)\n\n- **First thing she'd do:** open the shortlist before coffee, check the feed line, read the \"Pull in today\" reasons.\n- **Where she'd get stuck:** the \"Watching\" pile: \"too many watch codes\" is what made her hide them in the beta; wrong counts for parts; a dispatch system she can't see.\n- **What she'd let the agent do alone:** read, group, rank, draft, bring trucks back; reserve and move parts between her shops; draft notes.\n- **What she'd never let it do:** open a work order without her name; hide or drop a code; put a safety defect in \"Watching\"; order parts; invent a cause.\n- **What's missing for her job:** \"Dwayne's say before I see the list, not after\"; the \"needs you\" notes list at the end of the shift.\n- **The moment she'd stop:** the meter sync breaks again and the list doesn't say so. \"Once.\"\n- **In her words:** \"Three trucks, and why. If the why is vague, it's just another dashboard.\"\n\n### Tess, owner of an independent repair shop (adjacent)\n\n- **First thing she'd do:** for overflow, read the job: codes, history, limit, then accept and set the time. The other four: \"not my world\".\n- **Where she'd get stuck:** jobs arriving by link instead of in her own shop software; how a shop gets on a \"preferred\" list; a supplement over the limit while the truck sits in her bay.\n- **What she'd let the agent do alone:** package the job and approve her estimate under the limit.\n- **What she'd never let it do:** set her price or time; show the fleet her margins; touch her vendors; move her schedule.\n- **What's missing for her job:** being paid fast, not just approved fast.\n- **The moment she'd stop:** a half-empty job, or an approval slower than a phone call.\n- **In her words:** \"Send me the codes, the history and how much I can spend. I'll have it out today.\"\n\n### Scores\n\nValue / trust / pay, 1 to 5.\n\n| Flow | Dwayne | Glen | Rosa | Tess | Average | Spread |\n|---|---|---|---|---|---|---|\n| 1. The morning shortlist | 4 / 2 / 2 | 4 / 4 / 4 | 5 / 3 / 4 | 1 / 2 / 1 | 3.5 / 2.75 / 2.75 | 1–5 / 2–4 / 1–4 |\n| 2. Parts on the bench | 3 / 3 / 3 | 5 / 3 / 5 | 3 / 3 / 3 | 1 / 2 / 1 | 3.0 / 2.75 / 3.0 | 1–5 / 2–3 / 1–5 |\n| 3. A slot that survives dispatch | 2 / 2 / 3 | 2 / 2 / 2 | 5 / 2 / 2 | 2 / 2 / 1 | 2.75 / 2.0 / 2.0 | 2–5 / 2 / 1–3 |\n| 4. Say it, sign it | 5 / 3 / 3 | 3 / 4 / 2 | 4 / 4 / 4 | 1 / 3 / 1 | 3.25 / 3.5 / 2.5 | 1–5 / 3–4 / 1–4 |\n| 5. Overflow to a trusted shop | 2 / 3 / 2 | 4 / 3 / 4 | 2 / 3 / 2 | 5 / 4 / 4 | 3.25 / 3.25 / 3.0 | 2–5 / 3–4 / 2–4 |\n\n**Where they disagree:**\n\n- **Each persona's top flow removes their own chore:** Rosa the shortlist, Glen the parts, Dwayne the notes, Tess the overflow, as in `../research/panel.md`.\n- **Trust in the shortlist splits user and sceptic:** Rosa 3, Dwayne 2. He trusts it only if he can say no in one tap, before anything opens.\n- **The buyer won't pay for the notes** (pay 2) that the sceptic values most (value 5). Its money case has to be warranty and clean records, not Glen's downtime.\n- **Nobody trusts the dispatch slot** (trust 2 from all four): FleetDesk doesn't hold dispatch's plan or live location.\n\n**The three changes that would win over the most personas:**\n\n1. **The lead tech goes first, with a one-tap \"no\".** Preset reasons, no typing, before Rosa reads the list, and nothing opens until she approves. Wins Dwayne and Rosa.\n2. **Make \"Watching\" short and honest.** Days in \"Watching\", trucks come back when a code repeats, the feed's status at the top, the long piles collapsed. Wins Rosa, Dwayne and Glen.\n3. **Put the promise on the notes.** Notes and recordings stay with the truck's record, never timesheets or grading; the technician confirms his own time. Wins Dwayne, Rosa and Glen.\n\nAll three made. Mockups built for the two flows that led round 1, the shortlist and the notes: `mockups/morning-shortlist.html` and `mockups/say-it-sign-it.html`.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## Round 2 · 27 Oct 2026 · mockups: `morning-shortlist.html`, `say-it-sign-it.html`\n\nThe same four agents, on what changed.\n\n### Dwayne, lead technician (sceptic)\n\n- **Better:** sees the picks before Rosa; one tap with a preset reason; a job waits for him before it gets a bay; \"the feed warning is honest\".\n- **Still bothers him:** one strike turning a code into noise for every truck of that model (\"If I'm wrong on a bad day, a real DEF fault gets buried and it's my name on it\"); \"7 out of 9 is a small sample. Show the nine\"; parts \"on the shelf\" is the system's count, not the shelf; a big button for gloved hands.\n- **The moment he'd stop:** the noise rule hides a real fault, or a strike is used to judge him; the recording or his clocked time shows up in a pay or review conversation.\n- **In his words:** \"A promise on a screen is not a policy. I want it in writing.\"\n\n### Glen, director of fleet operations (buyer)\n\n- **Better:** Dwayne strikes first; days in \"Watching\"; the feed warning; \"parts on the shelf\" and \"sensor on order, due Wed\" is \"exactly the filter problem I told you about\".\n- **Still bothers him:** still no count of trucks that rolled at 5 am: \"I can't prove a thing to my CFO from a shortlist.\" A fleet-wide noise rule from one tap; he wants a rule list he can review.\n- **The moment he'd stop:** a truck in \"Watching\" dies on the road and the answer is \"the ranking will be tuned\".\n- **In his words:** \"Add it as a weekly card, not a new screen.\" Pay rises from 3 to 4 with the CFO card.\n\n### Rosa, maintenance manager (user)\n\n- **Better:** \"Dwayne checks first, so I'm not reading a list he'd gut\"; the feed warning names the trucks; safety items stay in \"Pull in today\" even with the feed down; the end-of-shift \"needs you\" list catches \"the two things I chase today\".\n- **Still bothers her:** \"One tech's tap quietly rewrites the rules for 240 tractors. That is how I miss the one code that matters.\" She wants the rule to need her OK. 37 trucks in \"Watching\" is still a lot. The notes promise belongs in the contract.\n- **The moment she'd stop:** a struck truck breaks down on I-70 and the answer is \"known glitch\".\n- **In her words:** \"Charge per tractor, not per trailer.\"\n\n### Tess, owner of an independent repair shop (adjacent)\n\n- **Better:** a signed complaint, cause and correction helps her, if it travels with the truck as a page her shop software can take: \"I skip the diagnosis and the phone call.\"\n- **Still bothers her:** the shortlist never sends a truck to her; she'd re-check the fleet's cause before quoting.\n- **In her words:** \"It is jobs landing in software we already have.\"\n\n### Scores\n\n| Flow | Dwayne | Glen | Rosa | Tess | Average | Spread |\n|---|---|---|---|---|---|---|\n| 1. The morning shortlist | 4 / 3 / 3 | 4 / 4 / 3 | 5 / 3 / 4 | 1 / 2 / 1 | 3.5 / 3.0 / 2.75 | 1–5 / 2–4 / 1–4 |\n| 4. Say it, sign it | 5 / 4 / 3 | 3 / 4 / 2 | 4 / 4 / 3 | 3 / 3 / 2 | 3.75 / 3.75 / 2.5 | 3–5 / 3–4 / 2–3 |\n\nThe three fleet personas alone: the shortlist 4.3 / 3.3 / 3.3; the notes 4.0 / 4.0 / 2.7.\n\n**Where they disagree:** Glen's pay for the shortlist depends on a number for his CFO, which the flow doesn't give; Rosa's and Dwayne's depend on trust. The notes win trust from everyone, but only Rosa would put real budget behind them.\n\n**The three changes that would win over the most personas:**\n\n1. **A strike applies to that truck only; a fleet-wide noise rule needs Rosa's approval.** Rosa, Glen and Dwayne. Made in the mockup.\n2. **Show the past cases behind the ranking.** Dwayne. Made: \"See the 9 trucks\".\n3. **Put the notes promise in the customer agreement, not just on the screen.** Rosa, Glen and Dwayne. Taken to the roadmap.\n\nGlen's weekly card of trucks down at 5 am is not in the flows; it goes to the roadmap.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## Real customers\n\n| Date | Who (role, no names) | What they said about each flow | Same as the panel? | Source |\n|---|---|---|---|---|\n| 27 Oct 2026 | Maintenance manager, waste hauler, 160 refuse trucks, Geotab, beta user | **Shortlist:** \"My morning. Done before I get in.\" Would tap \"Why this truck\" every time until she trusts it; it must never hide a driver's write-up; she won't wait for her shop lead to approve. Wants days in \"Watching\", noise marked per model, and PTO hours for the packers. **Notes:** wants them; never fill time from the clock (union); techs would talk at the bench or in the cab. **Parts:** not until counts are right; PM kits already staged. **Dispatch slot:** not her problem, fixed routes. **Overflow:** \"The dealer won't log into anything of ours.\" **Commitment:** mark a shortlist replayed from her own recent codes; pilot at the north yard if it matches. \"A few dollars a truck\" is her budget. | **Yes** on the shortlist, \"Watching\" and noise per model. **No** on the strike: she won't wait for the lead tech, where the panel's Rosa wanted his say first. **No** on overflow, where Tess was keen. **New:** the union and the time field. | `../documents/interview-maintenance-manager-waste-hauler-flows.md` |\n| 27 Oct 2026 | Shop supervisor (lead technician), beverage distributor, 290 vehicles, Samsara | **Shortlist:** \"The list I make in my head every morning.\" Strike before it's opened, \"or a bay's tied up\". Wants freeze-frame data and the fleet's known noise; stops the first time it pulls in a known sensor glitch. **Notes:** \"The part nobody does.\" Hold-to-talk at the bench, not in the bay; recording kept with the truck only. **Parts:** \"It's always parts\", but counts are wrong after every delivery. **Dispatch slot:** \"They'll never answer a message from a computer.\" **Overflow:** the mobile mechanic \"won't use an app\". **Commitment:** two technicians will try the notes. | **Yes**, closely matching Dwayne: strike before opening, no grading, parts as the real wait. **No** with the panel's Glen on the notes: the supervisor values them most, the buyer persona least. | `../documents/interview-shop-supervisor-beverage-distributor-flows.md` |\n\n**Where real customers agree with the panel:** the shortlist and the notes are the two flows to take forward; the agent never opens a work order without a named person; notes must never be used to judge a technician; counts must be right before parts ordering; the dispatch slot can't work without dispatch's data.\n\n**Where they disagree, and what we did:** the panel's Tess and Glen liked overflow; both real customers say their outside shops won't use a new tool, so overflow drops. The panel's Rosa wanted the lead tech's say first; the real manager won't wait, and the real supervisor won't have a bay tied up. Both are met: the lead tech sees the picks first, Rosa doesn't wait, and a job she approved waits for his look before it gets a bay. Neither the panel nor the earlier evidence raised the union and the time field; now the technician always confirms his own time.\n\n**Still not tested with a real customer:** whether a buyer pays for the shortlist on its own. Next real interview: a director of fleet operations (`script.md`).\n", "flows/script.md": "# FleetDesk · Customer interview kit\n\n> Fictional example. FleetDesk and its customers are invented. The questions are the kind to use with real customers.\n\nFor interviewing real customers about getting every truck that needs work from the first signal back on the road, and about the flows, using the mockups. About their life and the past first, the mockups second. Built on 27 Oct 2026.\n\n**Who to talk to:** maintenance managers at fleets of 150 to 500 vehicles with their own shop and a telematics feed (three or more, like Rosa); lead technicians or shop supervisors at the same fleets (two or more, like Dwayne); one director of fleet operations (like Glen). Start with the 46 Fault Code Assist beta customers. · **Bring:** the mockups in `mockups/`: `morning-shortlist.html` and `say-it-sign-it.html`.\n\n## Before you start\n\n- Ask permission to take notes or record. Don't keep names or contact details in the notes you share.\n- You're there to learn, not to sell. Talk less than they do.\n- Don't show a mockup until Part 2.\n\n## Part 1 · Their world (no mockups yet)\n\nThe riskiest assumptions from `../problem/problem.md`, as questions about the past:\n\n1. \"Walk me through yesterday morning. What was waiting for you, and who read it?\"\n2. \"How many codes did you see yesterday, and how many became work?\"\n3. \"Tell me about the last time a code you didn't act on turned into a breakdown. What happened? What did it cost?\"\n4. \"What did you check before you opened the last work order from a code?\"\n5. \"Who has to agree before a work order is opened from a code? Who gets blamed when the call is wrong?\"\n6. \"Walk me through the last work order you closed. What did you write, and why that?\" (technicians)\n7. \"When did a warranty claim last get rejected? What was missing?\"\n8. \"Think of the last truck that sat in the yard waiting. What was it waiting for?\"\n9. \"How did you work out what the last truck that didn't roll cost you? Who saw that number?\" (directors)\n10. \"On a morning the beta saved your lead tech time, what did he do with it?\" (beta customers)\n\n## Part 2 · The flows\n\nShow each flow's mockup one moment at a time, with \"Next\". Don't explain it first.\n\n**The morning shortlist** (`mockups/morning-shortlist.html`), seven moments: overnight, the lead tech's say, the shortlist, why this truck, approve, when the feed stops, Watching.\n\n**Say it, sign it** (`mockups/say-it-sign-it.html`), six moments: open the job, say it, the draft, when it isn't sure, sign it, what's left.\n\nAt each moment:\n\n1. \"What do you think this is?\"\n2. \"What would you do first here?\"\n3. \"What would you let this do on its own? What would you always want to check?\"\n4. \"What's missing for you to rely on it?\"\n5. \"What would this replace in your week?\"\n\nThen, once per flow:\n\n- \"When would you stop using it?\"\n- (Shortlist) \"Who should be able to strike a pick: you, the lead tech, both? Before or after it's opened?\"\n- (Notes) \"Where in the shop would you actually talk to it? Who should be able to hear the recording?\"\n\nDescribe the other three flows from `flows.md` in one or two lines each (parts, the dispatch slot, overflow) and ask: \"Is this a problem at your fleet? When did it last happen?\"\n\n## Part 3 · Commitment\n\nNot \"would you buy it?\", but a real next step:\n\n- \"Could we run the shortlist on your own recent codes, write-ups and PMs, and you mark which trucks you'd have pulled?\"\n- \"Could two of your technicians try the notes on real jobs?\"\n- \"Who else should see this?\"\n- \"Who would need to agree to pay for something like this, and from which budget?\"\n\n## After the interview\n\nWrite notes the same day, in their words, and put them in `../documents/`. Then run `/ai-product-flows` again to compare them with the panel.\n\nSo far: two interviews on 27 Oct 2026, a maintenance manager at a waste hauler and a shop supervisor at a beverage distributor (`../documents/interview-maintenance-manager-waste-hauler-flows.md`, `../documents/interview-shop-supervisor-beverage-distributor-flows.md`). **Next real interview:** a director of fleet operations, to test whether the buyer will pay for the shortlist alone.\n", "problem/evidence.md": "# FleetDesk · Problem evidence\n\n> Fictional example. FleetDesk, its documents and the product manager's answers are invented, tagged `[PM, illustrative]`. Market sources are real, retrieved on 27 Oct 2026; \"search result\" means seen in search results but not opened.\n\nWhat backs the problem, graded with the Mom Test. Built on 27 Oct 2026.\n\n**The problem as we started:** every morning, maintenance managers and lead technicians read hundreds of fault codes one by one to find the few trucks that need work, then type the work orders themselves (`../discovery/discovery.md`, \"Start with\").\n**Overall grade:** Strong, because there are more than three findings from customers, our own usage data, churn and an outside fleet, including past behaviour and time already spent on workarounds. What's missing: how many codes become work, and what that triage costs at fleets outside our two interviews.\n\n## Past behaviour and spend (strong)\n\n| What happened | Who | How often / how much | Source |\n|---|---|---|---|\n| The lead tech spends the first hour of each day reading fault codes, looking them up and opening work orders | Lead technician at a 240-tractor carrier | Every morning; \"a few hundred\" codes and 40 driver write-ups waiting | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Customers raised 233 support tickets about fault codes and the telematics feed in one quarter, typically \"how do we filter the ones that matter?\" | Maintenance managers | 12% of all tickets, Q3 2026 | [documents/support-tickets-q3-2026.csv] |\n| Beta users had 5,800 fault codes explained; 18% of \"act now\" codes became a work order within 24 hours | Maintenance managers and lead techs at 46 fleets | Since May 2026 | [documents/fault-code-assist-beta-feedback.md] |\n| Customers left for telematics vendors whose maintenance turns codes into work orders | Buyers at 31 fleets | 31 of 88 customers lost in a year | [documents/churn-note-2026.md] |\n| A carrier's VP of maintenance built reports in ServiceNow to rank trucks by alert count and send the worst to the shop, plus a monthly alert review | A real carrier, Genox Transportation, at a TMC panel | Ongoing (2021) | https://www.fleetowner.com/technology/article/21162229/navigating-telematics-complexities-to-boost-fleet-uptime |\n| Diagnostics ranked third among fleet maintenance concerns | 400+ TMC fleet members | Fall 2025 survey | https://tmc.trucking.org/blog/tmc-fleet-members-top-maintenance-concerns-shift-considerably-fall-2025-spring-2026 |\n\n## Workarounds today\n\n| Workaround | Who | What it costs them | Source |\n|---|---|---|---|\n| A person reads every code and looks it up | Lead technician | An hour a day of a technician's time, at a time when technicians are scarce: 46,695 diesel jobs went unfilled in 2022–23 | [documents/interview-maintenance-manager-regional-carrier.md], https://fleetmaintenance.com/shop-operations/employees-and-training/article/55261439/techforce-foundation-increases-projected-technician-demand-by-20 |\n| The shop day planned on a whiteboard, then typed in | Maintenance manager | Retyping; plans out of date by noon when dispatch changes them | [documents/interview-maintenance-manager-regional-carrier.md] |\n| Custom reports ranking trucks by alert count | VP of maintenance at a real carrier | Building and reviewing reports outside the maintenance system | https://www.fleetowner.com/technology/article/21162229/navigating-telematics-complexities-to-boost-fleet-uptime |\n| Hiding or ignoring \"watch\" codes | Maintenance managers in the beta | Codes ignored that might matter; nobody knows which | [documents/fault-code-assist-beta-feedback.md] |\n| Switching to a telematics bundle | Buyers at smaller fleets | Leaving their maintenance system and its history | [documents/churn-note-2026.md] |\n\n## What people say (weak on its own)\n\n| Said | Who | Source |\n|---|---|---|\n| \"If it wrote the work order from the fault code and the tech just checked it, I'd pay for that.\" | Maintenance manager, 240-tractor carrier | [documents/interview-maintenance-manager-regional-carrier.md] |\n| \"Don't give me another dashboard. Give me the three trucks I need to pull in today, and why.\" | Same | [documents/interview-maintenance-manager-regional-carrier.md] |\n| \"If it already knows what the code is, why can't it start the work order and pull the parts?\" | Parts manager, beverage distributor | [documents/fault-code-assist-beta-feedback.md] |\n| \"I don't need AI that talks to me. I need trucks ready at 5 am.\" | Director of fleet operations, foodservice distributor | [documents/interview-fleet-ops-director-distribution.md] |\n| Prospects ask \"What does your AI do?\" in every second demo | Prospects, via sales | [documents/lost-deals-h1-2026.md] |\n| 57% of repaired trucks went back out with undiagnosed fault codes | A diagnostics vendor's own study, about 2012 | https://www.fleetowner.com/perspectives/trucks-at-work/article/21697920/all-in-one-diagnostics (search result) |\n\n## What we looked for and didn't find\n\n- An independent study of how much time fleets spend triaging fault codes. All figures found were from vendors.\n- How many of the codes a person reads lead to a repair, at any fleet. Our own beta can't tell false alarms from codes that were ignored [documents/fault-code-assist-beta-feedback.md].\n- Evidence from fleets of 150 to 500 vehicles beyond our two interviews: no third interview yet. `[PM, illustrative]`\n- A published cost of a missed fault code that became a breakdown, from a source that doesn't sell software.\n", "problem/framings.md": "# FleetDesk · Framing the problem\n\n> Fictional example. FleetDesk, its documents and the product manager's answers are invented, tagged `[PM, illustrative]`. Market sources are real, retrieved on 27 Oct 2026; \"search result\" means seen in search results but not opened.\n\nBuilt from `../product.md`, `../vision/`, `../discovery/`, `evidence.md` and the product manager's answers on 27 Oct 2026.\n\n## The job\n\n**When** the trucks have reported overnight and the shop opens, **I want to** know which trucks need work today and have that work ready to start, **so I can** keep every truck safe and on the road when dispatch needs it.\n\n- **The struggling moment:** 5:30 am, before coffee: 40 driver write-ups and a few hundred fault codes, \"Two of them will be the truck that breaks down on I-70 tonight, and I can't tell which two.\" [documents/interview-maintenance-manager-regional-carrier.md]\n- **Functional:** find the trucks that need work, open the work, get it into the shop before it fails.\n- **Emotional:** not to be the one who missed the code before a breakdown; to start the day in control rather than behind.\n- **Social:** to be seen by operations and the CFO as the person who keeps the fleet running, not the cost centre that explains road calls.\n\nAsking \"why?\" behind the task: \"read the fault codes\" → \"find the trucks that will fail\" → \"keep trucks ready when dispatch needs them\". `[PM, illustrative]`\n\n## Pressure test\n\n| Question | Answer | Evidence |\n|---|---|---|\n| Is it real? | Yes, at every customer with a telematics feed: about 310 of 812. Daily, in the customers' own words, and visible in tickets and churn | `evidence.md`; [documents/fault-code-assist-beta-feedback.md] |\n| Does it hurt enough? | An hour a day of a scarce technician at one carrier; a truck down costs more in a day than a year of FleetDesk for that truck. The buyer pays for downtime, and says he'd pay more for less of it | [documents/interview-maintenance-manager-regional-carrier.md] [documents/interview-fleet-ops-director-distribution.md] |\n| What do they do today? | Read codes by hand, ignore the \"watch\" ones, rank trucks with homemade reports, or switch to a telematics bundle | `evidence.md` |\n| Why us? | The shop's work order, parts, PM history and 15 years of repairs sit with us; we see codes from Samsara, Motive and Geotab in one place | `../vision/vision.md`, \"Why us\" |\n| Why now? | Motive turns codes into work orders and its agents act on their own; 37 customers face a bundled offer at renewal | https://www.truckinginfo.com/news/motive-adds-ai-agents-for-fleet-operations; [documents/churn-note-2026.md] |\n\n### The four forces\n\n| Force | What we found | Source |\n|---|---|---|\n| Push | Hundreds of codes a day, most noise; technicians are scarce; road calls are what managers are measured on | [documents/interview-maintenance-manager-regional-carrier.md]; https://fleetmaintenance.com/shop-operations/employees-and-training/article/55261439/techforce-foundation-increases-projected-technician-demand-by-20 |\n| Pull | Rivals show work orders created from codes in demos; beta users ask for it | [documents/lost-deals-h1-2026.md] [documents/fault-code-assist-beta-feedback.md] |\n| Anxiety | Missing the one code that matters; a machine opening jobs the shop doesn't trust; too many alerts again (\"Too many 'watch' codes\") | [documents/fault-code-assist-beta-feedback.md] |\n| Habit | The morning routine and the whiteboard; the lead tech's experience is trusted more than any list | [documents/interview-maintenance-manager-regional-carrier.md] |\n\n**Switching verdict:** push and pull beat anxiety and habit for fleets with a telematics feed and a busy shop, as the churn to bundles shows. Anxiety is the force to lower: managers need to see why a truck was chosen, and that nothing important was dropped.\n\n### The case against it\n\nFault-code triage is the part of the job the telematics vendors do best, because the codes are theirs. Solving it puts us in a race on their ground, using their data, and they've already shipped it. The pain we own is what happens after the code: the shop, the parts, the technicians, the outside repairs.\n\n**Our answer:** fair, and it's why we widen the problem. The fault code is only the moment the job starts; what managers want is the truck ready, which runs through our parts room and bays. We start learning at the fault code because that's where the struggle is sharpest, but we frame the problem around the whole job, from first signal to truck back on the road. `[PM, illustrative]`\n\n## Thinking bigger\n\n### The BHAG\n\n**By 2029, every truck in a FleetDesk fleet is ready when dispatch needs it: road calls halved against 2026, and no one at a FleetDesk fleet reads a fault code by hand.** `[PM, illustrative]`\n\nOptions we considered:\n- \"By 2029, no FleetDesk fleet has a breakdown on the road from a failure its own data warned about.\"\n- \"By 2030, a maintenance manager's morning takes ten minutes of approvals.\" Dropped: about the manager's time, not the truck.\n\nThe chosen one goes beyond `../vision/vision.md`, which targets level 4 by 2028. Road calls halved needs prediction across fleets, level 5 and above; the vision can be updated later.\n\n### The job map\n\n| Step | What the customer does | Covered by us today? | Our AI level there |\n|---|---|---|---|\n| Define | Decide which trucks need work today | no | 2 in beta (Fault Code Assist) |\n| Locate | Gather codes, defects, PM due dates, the truck's history, its route | partly: defects and PM, not the route | 1 |\n| Prepare | Get parts, a bay and a technician ready; agree the slot with dispatch | partly: parts, no bay or dispatch planning | 1 |\n| Confirm | Check the truck is in, parts are here, the job is right | no | none |\n| Execute | Do the repair | partly: the work order | 1 |\n| Monitor | Track jobs in progress and outside repairs | partly | 1 |\n| Modify | Reschedule when a truck doesn't come in, a part is missing, or a job grows | no | none |\n| Conclude | Record cause and correction, close, claim warranty, learn | partly: records, thin notes, warranty little used | 1 |\n\nFleetDesk covers execute and conclude, as a level 1 product does. Define, prepare, confirm and modify are where the bigger version of the problem sits.\n\n### What customers most want fixed\n\nThe biggest pains of current customers, beyond the problem we started with.\n\n| Pain | Who | How big | Evidence |\n|---|---|---|---|\n| Trucks not ready at 5 am | Director of fleet operations | \"A truck down for a day costs me more than FleetDesk costs me for a year for that truck\" | [documents/interview-fleet-ops-director-distribution.md] |\n| Trucks waiting for parts the PM predicted | Director, parts manager | Recurring at a 180-vehicle distributor | [documents/interview-fleet-ops-director-distribution.md] |\n| PMs missed when dispatch keeps a truck out, with nothing rescheduling | Maintenance manager | Meter and PM issues are 18% of tickets | [documents/interview-maintenance-manager-regional-carrier.md] [documents/support-tickets-q3-2026.csv] |\n| Outside vendor invoices and overcharges | Director | Half one distributor's repair spend | [documents/interview-fleet-ops-director-distribution.md] |\n\nThe biggest is bigger than the problem we picked: customers want trucks ready, not just codes read. `[PM, illustrative]` \"I don't need AI that talks to me. I need trucks ready at 5 am.\" [documents/interview-fleet-ops-director-distribution.md]\n\n### Adjacent segments\n\nWhere else this problem is very painful now.\n\n| Segment | Why it hurts there now | How big | Evidence |\n|---|---|---|---|\n| Independent heavy-duty repair shops serving fleets | Technician time is what they sell; labor runs about $149 an hour and over half are understaffed, so triage and paperwork cost them directly | Fullbay alone serves 5,000+ shops handling $6.5B of service a year | https://www.freightwaves.com/?p=571607 (search result); https://www.motor.com/2026/03/fullbay-acquires-pitstop-to-advance-ai-predictive-maintenance/ |\n| Government and municipal fleets | Mixed fleets, small shops, the same technician shortage; vendors serving them shipped AI assistants this year | Not sized; RTA and Collective Data lean to this market | https://worktruckonline.com/news/rta-introduces-ron360-ai-assistant-for-fleet360-users-at-government-fleet-expo-2026 |\n| Smaller fleets, under 50 vehicles | Same codes, no lead tech to read them; but they're buying bundles | 99.3% of US carriers run fewer than 100 power units | https://www.truckersnews.com/news/article/15754113/briefly-atas-american-trucking-trends-report-now-available (search result); [documents/churn-note-2026.md] |\n| Canadian private fleets | The same work-order and invoice pain; Motive launched maintenance for the US and Canada | Not sized | https://www.samsara.com/ca/blog/sobeys-fleet-maintenance-ai; https://gomotive.com/motive-launches-ai-powered-maintenance-to-help-operations-teams-prevent-breakdowns-increase-uptime-and-lower-repair-costs/ |\n\n`[PM, illustrative]` We could reach independent repair shops that already work on our customers' trucks; the others aren't for now.\n\n## Three framings\n\n| | As stated | The bigger job | The moonshot |\n|---|---|---|---|\n| **The problem** | Managers read hundreds of fault codes by hand each morning to find the trucks that need work, then type the work orders | Getting every truck that needs work from the first signal (code, defect, PM due) back on the road: chosen, parted, slotted around dispatch, repaired, recorded | The BHAG: every truck ready when dispatch needs it, road calls halved, nobody reads a fault code by hand |\n| **For whom** | Maintenance manager, lead technician | Maintenance manager, parts manager, technician; the director as buyer | The director of fleet operations and every shop |\n| **Level** | 2 → 4 | 1 → 4 | 1 → 6 |\n| **Value from existing customers** | Keeps the customers telematics bundles target | Keeps them, and a paid shop agent across fleets with their own shops | Paid for uptime, not vehicles |\n| **New customers or revenue** | Little | Independent repair shops that serve our fleets | Every fleet with a shop, in any segment |\n| **Size a year** | $143,000–$286,000 kept = 37 customers with a bundled offer (measured, [documents/churn-note-2026.md]) × about $12,900 a year each (measured, `[PM, illustrative]`) × 30–60% of that churn avoided (assumption) | $524,000–$1,047,000 new = 812 customers (measured) × about $12,900 a year each (measured) × 20–40% who'd buy (assumption) × 25% price uplift (assumption) | Not sized: no measured number links road calls to price |\n| **Evidence** | Strong | Good: strong on codes, the parts wait and missed PMs; thin on bays and dispatch | Assumption |\n| **Moves us toward the BHAG** | Removes the hand-reading of codes | Covers define to conclude for the in-house shop, the base for prediction | Is the BHAG |\n", "problem/problem.md": "# FleetDesk · The right problem\n\n> Fictional example. FleetDesk, its documents and the product manager's choices are invented, tagged `[PM, illustrative]`. Market sources are real, retrieved on 27 Oct 2026.\n\nBuilt from `evidence.md`, `framings.md` and the product manager's choices on 27 Oct 2026.\n\n## The BHAG\n\n**By 2029, every truck in a FleetDesk fleet is ready when dispatch needs it: road calls halved against 2026, and no one at a FleetDesk fleet reads a fault code by hand.** `[PM, illustrative]`\n\n## The problem we'll solve\n\n**When** a truck signals it needs work, through a fault code, a driver's defect or a PM coming due, **the maintenance manager wants to** know which trucks need work today and have each job ready to start, with the parts and a slot that fits dispatch, **so they can** keep every truck safe and on the road when dispatch needs it. Today they read hundreds of codes by hand, plan on a whiteboard, chase parts and retype the plan when dispatch changes it. At one carrier, that's the lead technician's first hour every day, and trucks still wait for parts the PM predicted [documents/interview-maintenance-manager-regional-carrier.md] [documents/interview-fleet-ops-director-distribution.md].\n\n- **Framing chosen:** the bigger job, because what customers most want is trucks ready, not codes read, and that job runs through the parts room and bays we already hold. The fault-code moment is where we start learning, because that's where the struggle is sharpest. `[PM, illustrative]`\n- **Level:** from 1 today to 4.\n- **How it moves us toward the BHAG:** it covers define to conclude for the in-house shop, and capturing what technicians actually found builds the record that prediction, and halving road calls, would need.\n- **Evidence:** Good. It's strong on the fault-code struggle, trucks waiting for parts and missed PMs, with past events and workarounds from customers, churn and an outside carrier. It's thin on bay planning and dispatch (`evidence.md`).\n\n## The opportunity\n\n| | |\n|---|---|\n| **More value for existing customers** | Fleets with their own shops and a telematics feed: fewer road calls, no hand triage, no waiting for parts. They'd pay for trucks ready, as a per-vehicle shop agent, and stay rather than move to a bundle |\n| **New customers** | Independent heavy-duty repair shops that serve our fleets, where technician time is what they sell and over half are understaffed (https://www.freightwaves.com/?p=571607, search result). Not sized |\n| **Size a year** | $524,000–$1,047,000 new revenue = 812 customers (measured) × about $12,900 a year each (measured, `[PM, illustrative]`) × 20–40% who'd buy (assumption) × 25% price uplift (assumption). Plus $143,000–$286,000 kept from the 37 customers with a bundled offer (`framings.md`) |\n\n## What success looks like\n\n- No one at a pilot fleet reads fault codes by hand each morning, and managers say they trust what was chosen.\n- Fewer trucks waiting for parts, and fewer missed PMs, at the same fleets.\n- Road calls per million miles going down at those fleets.\n- The 37 customers with a bundled offer renew.\n\n## What we need to learn before building\n\nThe riskiest assumptions, most dangerous first, each with the questions to ask customers (Mom Test: their life, the past, specifics).\n\n| Assumption | Why it's risky | Questions to ask |\n|---|---|---|\n| Managers will let something else decide which trucks need work | If they re-check everything, nothing is saved; the beta's users already hide \"watch\" codes | \"Tell me about the last time a code you didn't act on turned into a breakdown. What happened?\" · \"Walk me through yesterday morning: which codes did you open, and how did you decide?\" · \"What did you check before you opened the last work order from a code?\" |\n| What technicians find can be captured on every job | Without it we can't tell good choices from bad, claim warranty or learn | \"Walk me through the last work order you closed. What did you write, and why that?\" · \"When did a warranty claim last get rejected? What was missing?\" |\n| The real cost is downtime, and the buyer can see it | If downtime isn't counted, a better morning isn't worth paying for | \"How did you work out what the last truck that didn't roll cost you? Who saw that number?\" · \"What did you last spend money on to cut downtime? How did you justify it?\" |\n| Parts and bays, not just codes, are where trucks wait | If the wait is elsewhere, the bigger framing is wrong | \"Think of the last truck that sat in the yard waiting. What was it waiting for, and for how long?\" · \"When did dispatch last keep a truck out past its PM? What happened next?\" |\n| The problem is as sharp at fleets of 150–500 vehicles beyond our two interviews | We have two interviews and one segment's tickets | \"How many codes did you see yesterday, and how many became work?\" · \"Who reads them, and what else would they be doing?\" |\n\n## Not now\n\n- **The moonshot.** Halving road calls needs prediction across fleets: data rights aren't confirmed and technicians' notes are too thin to learn from (`../discovery/strength.md`). We park it until the notes and rights are in place.\n- **Smaller fleets and government fleets.** Smaller fleets buy bundles on price; government fleets are a different sale. Neither now.\n- **Outside invoices and warranty** as problems on their own: they stay in the discovery \"Grow\" bets (`../discovery/discovery.md`) and connect to this job at \"conclude\".\n", "research/evidence.md": "# Evidence map · FleetDesk\n\n> Fictional example. FleetDesk, its documents and the product manager's answers are invented, tagged `[PM, illustrative]`. Line numbers point to the files in `../documents/`.\n\nWhat our own data says about our customers, before any persona is written. One row per piece of evidence. No real names: the documents already had names removed, so no anonymised copies were needed. Built on 27 Oct 2026.\n\n**The problem we're researching:** getting every truck that needs work from the first signal (fault code, driver defect, PM coming due) back on the road (`../problem/problem.md`).\n\n## Customer types we see\n\n| Type | How many in our data | Example source |\n|---|---|---|\n| Regional and LTL carriers with their own shops (maintenance manager, lead tech, technicians) | 1 interview, 1 beta quote, ticket themes | documents/interview-maintenance-manager-regional-carrier.md |\n| Foodservice and beverage distributors (director of fleet operations, parts manager) | 1 interview, 1 beta quote | documents/interview-fleet-ops-director-distribution.md |\n| Waste haulers and other mid-size private fleets (maintenance manager, shop supervisor) | 2 beta quotes | documents/fault-code-assist-beta-feedback.md |\n| Smaller fleets, under 75 vehicles (buyer in finance or operations) | 61 of 88 churned; lost-deal themes | documents/churn-note-2026.md, documents/lost-deals-h1-2026.md |\n| All customers (support) | 1,940 tickets in Q3 2026 | documents/support-tickets-q3-2026.csv |\n\n## Evidence\n\n| Customer type | Kind | What they said or did | Source (file, line) |\n|---|---|---|---|\n| Carrier, maintenance manager | quote | \"Two of them will be the truck that breaks down on I-70 tonight, and I can't tell which two.\" | documents/interview-maintenance-manager-regional-carrier.md, line 11 |\n| Carrier, maintenance manager | pain | 40 driver write-ups and a few hundred fault codes w
