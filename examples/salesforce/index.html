 households [PM, illustrative]\n- runs on: a Salesforce-based advisor CRM, a portfolio system, and an AI notetaker the firm approved [source: https://www.familywealthreport.com/printarticle.php?id=207153] (notetakers now widespread; his setup is [PM, illustrative])\n\n## Business\n- who signs: managing partner, on the operations lead's recommendation [assumed]\n- budget route: per-advisor software budget; notetakers priced per advisor per month [source: https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616]\n- what they are measured on: assets kept and grown, client retention, clean compliance records [assumed]\n- renewal or contract moment: notetaker contracts yearly [PM, illustrative]\n\n## Psychology\n- attitude to change: pragmatist; adopted a notetaker once peers did [source: https://www.familywealthreport.com/printarticle.php?id=207153]\n- trust in AI: trusts the summary, checks every action item, because he stays liable for errors [source: https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/]\n- burned by: a notetaker that assigned a follow-up to the wrong household member [PM, illustrative]\n- will not tolerate: anything that creates a compliance record he hasn't reviewed [source: https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/]\n- would pay for: leaving the meeting with notes, tasks and the CRM done, correctly [source: https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616]\n\n## Capability\n- tech comfort: medium [PM, illustrative]\n- data they hold: client households, accounts, meeting notes, tasks in the CRM; notes before the notetaker are patchy [PM, illustrative]\n- time they can give a new tool: little; he switched tools once because of price [source: https://advisor.ca/practice/technology/what-advisors-need-to-know-about-ai-notetaking-apps/]\n\n## The problem, through their eyes\n- the problem in their words: \"Every meeting creates an hour of follow-up, and I'm liable if it's wrong.\" [source: https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/] (paraphrased)\n- how often it hits them, and what it costs them: every client meeting; advisors report saving 2–10 hours a week with notetakers, which shows what it took before [source: https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616]\n- what they do about it today: an AI notetaker, then checks and edits before anything goes into the CRM [source: https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/]\n- options they've tried or considered: two notetakers; dropped one on price [source: https://advisor.ca/practice/technology/what-advisors-need-to-know-about-ai-notetaking-apps/]\n- what would make them switch: CRM updates that are right without editing, inside the CRM the firm already pays for [PM, illustrative]\n- what worries them about a new way: compliance and books-and-records rules; client consent [source: https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616]\n\n## Behaviour\n- a normal day: three or four client meetings, prep before each, follow-up and CRM updates in between and at the end of the day [PM, illustrative]\n- workarounds: reviews the notetaker's output, retypes tasks into the CRM when the sync misses [PM, illustrative]\n- last time it went wrong: a follow-up promised in a meeting never became a task; the client chased him [PM, illustrative]\n- how they buy: peers and the firm's operations lead; a trial with a few advisors [source: https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616]\n\n## Voice\n- sounds like: \"I already pay for a notetaker. Why would I want a sales forecast?\" [PM, illustrative]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| pain | Notes in the meeting distract; notes afterwards miss follow-ups; action items 62–87% accurate in one test | https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/ |\n| objection | The advisor stays liable for the software's errors | https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/ |\n| budget signal | Advisors save about 2–10 hours a week; CRM integration a key buying question | https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616 |\n| churn reason | An advisor switched notetakers on price | https://advisor.ca/practice/technology/what-advisors-need-to-know-about-ai-notetaking-apps/ |\n| trigger | Notetakers went from one product to fourteen in a year | https://www.familywealthreport.com/printarticle.php?id=207153 |\n\n**Grounding:** 28 tagged fields: 13 sourced, 12 `[PM, illustrative]`, 3 `[assumed]` (11%).\n", "roadmap/features.md": "# Salesforce Sales Cloud and Service Cloud · Features, prioritised\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. The product manager's answers are invented, tagged `[PM, illustrative]`.\n\nFeatures for the flows taken forward in `../flows/flows.md` (flow 1, the rep confirms the deal, and flow 2, the forecast brief without the chase), plus the best ideas from ideation, prioritised. Built on 27 Oct 2026.\n\n## Ideas\n\nWhere the features came from: the flows moment by moment, the opportunities and the Imagine section in `../vision/`, what the panel asked for in `../flows/panel-tests.md`, and ideation with the product manager. There are no real customer interviews in this example.\n\n| Idea | From | Flow it serves | Keep? |\n|---|---|---|---|\n| Propose stage, close date, next step and forecast category from calls and email, each with its evidence | flow 1, moments 1–2; `../vision/opportunities.md` #1 | 1 | yes |\n| One review list: accept, edit or reject each change; no \"accept all\" | flow 1, moment 3; panel round 1 | 1 | yes |\n| A private preview of the rep's deal as the manager will see it | panel round 1 (Marcus, Sam) | 1, 2 | yes |\n| A report row per change: old and new value, evidence, who confirmed, when, edited or not; pause per field | panel round 1 (Elena) | 1, 2 | yes |\n| Undo any confirmed change | ideation `[PM, illustrative]` | 1 | yes |\n| A loud notice the moment capture stops, to the rep and to the admin | panel rounds 1 and 2 (Marcus, Elena) | 1 | yes |\n| \"Look again\" when a rep accepts forecast-moving changes fast | panel round 1 (Elena) | 1 | yes |\n| One-tap \"accept all\" for small changes | panel round 1 (Marcus) | 1 | drop, because the sceptic and the buyer said a rubber-stamped log is worse than none |\n| Questions about gaps, in the rep's own review list | flow 2, moment 2; panel round 1 | 2 | yes |\n| The brief: what changed since last week with a reason per move, and the three deals that need the manager | flow 2, moments 3–4 | 2 | yes |\n| Commit, best case and a range with its method stated, reconciled to the Forecasts tab; stop on a mismatch | flow 2, moment 5; panel round 1 (Elena, Priya) | 2 | yes |\n| Override any deal with a reason, visible to the rep | flow 2, moment 6 | 2 | yes |\n| Accept, edit and reject counts per rep, for the manager | panel round 1 (Priya) | 2 | yes, with a rule on who sees them (panel round 2, Marcus) |\n| A fallback brief marked stale when the totals disagree | panel round 2 (Priya) | 2 | yes |\n| Unconfirmed drafts visible to the manager, labelled | panel round 2 (Priya) | 2 | drop, because it breaks the rep-first promise every rep persona asked for |\n| Test the range against the team's past quarters | panel round 1 (Priya) | 2 | merge into the range feature |\n| Read calls from recorders customers already pay for | `../research/panel.md`, change 3 | 1 | yes, later |\n| The brief and the questions in Slack | `../research/experiences.md` #2 | 2 | yes, later |\n| Hygiene rules with a dry run and owner questions | flow 3 (`../research/experiences.md` #4) | 3 | yes, next |\n| Slipping-deal flags to the rep first, with their hit rate | flow 4 | 4 | yes, later |\n| Service notes on the deal | flow 5 | 5 | drop for now, because the flow isn't taken forward |\n| \"Deals like yours\": opt-in benchmarks | `../vision/vision.md`, Imagine; `../vision/opportunities.md` #6 | 2 | yes, later |\n| A household version for financial advisors | `../problem/framings.md`, adjacent segments; Sam | 1 | yes, later |\n\n## The features, prioritised\n\n| # | Feature | Kind | Flow | Value | Pay | Confidence | Effort | Priority | Horizon |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | Review list: accept, edit or reject each change, no \"accept all\" | control | 1 | 4 | 3 | Good | 1 | 14.0 | Now |\n| 2 | Override any deal with a reason, visible to the rep | control | 2 | 4 | 3 | Good | 1 | 14.0 | Now |\n| 3 | Change log in a standard report, with a pause per field | visibility | 1, 2 | 4 | 4 | Good | 2 | 10.67 | Now |\n| 4 | Proposed deal updates with evidence | agent capability | 1 | 5 | 3 | Strong | 3 | 10.0 | Now |\n| 5 | Undo any confirmed change | control | 1 | 3 | 2 | Good | 1 | 10.0 | Now |\n| 6 | Hygiene rules with a dry run and owner questions | agent capability | 3 | 3 | 3 | Strong | 2 | 10.0 | Next |\n| 7 | Questions about gaps, in the rep's review list | agent capability | 2 | 4 | 3 | Good | 2 | 9.33 | Now |\n| 8 | The brief: what changed and why, and the three deals that need you | visibility | 2 | 5 | 4 | Good | 3 | 9.0 | Now |\n| 9 | Commit, best case and range, reconciled to the Forecasts tab | agent capability | 2 | 4 | 4 | Good | 3 | 8.0 | Now |\n| 10 | Private preview for the rep | control | 1, 2 | 4 | 3 | Thin | 1 | 7.0 | Now |\n| 11 | Accept, edit and reject counts per rep | visibility | 2 | 3 | 3 | Thin | 1 | 6.0 | Now |\n| 12 | Fallback brief marked stale | control | 2 | 3 | 3 | Thin | 1 | 6.0 | Now |\n| 13 | Capture notice, to the rep and the admin | visibility | 1 | 3 | 2 | Thin | 1 | 5.0 | Now |\n| 14 | \"Look again\" on fast accepts | control | 1 | 3 | 2 | Thin | 1 | 5.0 | Now |\n| 15 | The brief and the questions in Slack | visibility | 2 | 3 | 2 | Thin | 2 | 3.33 | Next |\n| 16 | Read calls from other recorders | data | 1 | 4 | 4 | Thin | 4 | 3.2 | Next |\n| 17 | A household version for financial advisors | agent capability | 1 | 4 | 3 | Thin | 4 | 2.8 | Later |\n| 18 | Slipping-deal flags to the rep first, with their hit rate | agent capability | 4 | 3 | 2 | Thin | 4 | 2.0 | Next |\n| 19 | \"Deals like yours\": opt-in benchmarks | data | 2 | 4 | 4 | Assumption | 5 | 1.33 | Later |\n\n- **Value:** the hours it gives back and how much customers want it (no real customers yet, so the panel and `../research/experiences.md`): 5 for the features that carry the 1,725 hours of flow 1 or the 1,552 of flow 2.\n- **Pay:** how likely customers pay for it, from the panel's pay scores.\n- **Confidence:** the evidence grade (Strong 5, Good 4, Thin 2, Assumption 1). Strong where `../problem/evidence.md` and `../research/evidence.md` show past behaviour or spend; Thin where only the panel asked for it.\n- **Effort:** 1 small, on data we already hold … 5 needs data or rights we don't have. Agreed with the product manager `[PM, illustrative]`; developers haven't scored it yet.\n- **Priority** = (value + pay) × confidence points ÷ (effort + 1).\n\n**Working:** 1: (4 + 3) × 4 ÷ 2 = 14.0 · 2: (4 + 3) × 4 ÷ 2 = 14.0 · 3: (4 + 4) × 4 ÷ 3 = 10.67 · 4: (5 + 3) × 5 ÷ 4 = 10.0 · 5: (3 + 2) × 4 ÷ 2 = 10.0 · 6: (3 + 3) × 5 ÷ 3 = 10.0 · 7: (4 + 3) × 4 ÷ 3 = 9.33 · 8: (5 + 4) × 4 ÷ 4 = 9.0 · 9: (4 + 4) × 4 ÷ 4 = 8.0 · 10: (4 + 3) × 2 ÷ 2 = 7.0 · 11: (3 + 3) × 2 ÷ 2 = 6.0 · 12: (3 + 3) × 2 ÷ 2 = 6.0 · 13: (3 + 2) × 2 ÷ 2 = 5.0 · 14: (3 + 2) × 2 ÷ 2 = 5.0 · 15: (3 + 2) × 2 ÷ 3 = 3.33 · 16: (4 + 4) × 2 ÷ 5 = 3.2 · 17: (4 + 3) × 2 ÷ 5 = 2.8 · 18: (3 + 2) × 2 ÷ 5 = 2.0 · 19: (4 + 4) × 1 ÷ 6 = 1.33.\n\n**Why hygiene (6) is Next despite its score:** it serves flow 3, which isn't taken forward in this update, and it builds on the change log (3). It's the first thing in Next. `[PM, illustrative]`\n\n## This product update\n\nThe features in Now, in priority order: the rep confirms the deal, and the manager's forecast brief is built only from what reps confirmed.\n\n1. Review list: accept, edit or reject each change, no \"accept all\"\n2. Override any deal with a reason, visible to the rep\n3. Change log in a standard report, with a pause per field\n4. Proposed deal updates with evidence\n5. Undo any confirmed change\n6. Questions about gaps, in the rep's review list\n7. The brief: what changed and why, and the three deals that need you\n8. Commit, best case and range, reconciled to the Forecasts tab\n9. Private preview for the rep\n10. Accept, edit and reject counts per rep, with a rule on who sees them\n11. Fallback brief marked stale\n12. Capture notice, to the rep and the admin\n13. \"Look again\" on fast accepts\n\n### The build-day slice\n\nThe smallest end-to-end slice of this update that developers start with, small enough to build in about a day, to make the flow real and testable:\n\n- **The flow:** a call ends → the agent proposes changes with evidence → the rep accepts, edits or rejects each one → the manager's brief shows only what the rep confirmed, what changed, the three deals that need them and the commit → the manager overrides one deal with a reason.\n- **In:** sample data for one team (five reps, fifteen open deals, a few call summaries and email threads as text, in a developer org or plain files); proposed updates with evidence (4); the review list (1); a simple change log (3); the brief with what changed, three deals and a commit that adds up to the deals behind it (7, 8); override with a reason (2).\n- **Out (for now):** live email, calendar and call capture; other recorders; Slack; the private preview screen (the brief simply leaves out anything unconfirmed); the range and its test against past quarters; reconciliation to the real Forecasts tab; undo; per-rep counts; the capture notice; \"look again\"; the fallback brief; anything across customers.\n- **Done when:** someone playing a rep accepts two proposed changes and rejects one on a deal; the manager's brief shows only the two, with who confirmed them and the evidence; the commit equals the sum of the commit deals; and an override changes the commit and appears in the log with its reason.\n", "roadmap/roadmap.md": "# Salesforce Sales Cloud and Service Cloud · Roadmap\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. The product manager's answers are invented, tagged `[PM, illustrative]`.\n\nFrom the thinnest version to the BHAG, in three horizons. Outcomes first, features second. Built from `features.md`, `roi.md`, `../flows/flows.md`, `../research/experiences.md`, `../vision/vision.md` and `../problem/problem.md` on 27 Oct 2026.\n\n**The BHAG:** by 2031, sellers spend 70% of their week selling, up from 40%, and no sales manager has to ask a rep where a deal stands (`../problem/problem.md`).\n**The vision:** level 5, AI Domain Intelligence, by the end of 2028: Sales Cloud keeps every deal up to date on its own and tells each sales team what is working in deals like theirs (`../vision/vision.md`).\n\n| | Now | Next | Later |\n|---|---|---|---|\n| **The outcome for customers** | Managers walk into the forecast call knowing what changed and which deals need them, without chasing reps; reps confirm instead of typing | Records stay clean at the source; managers and reps get the brief where they already work | Each team sees what works in deals like theirs; the forecast comes with a range from many companies |\n| **Agentic experiences** | The forecast call without the chase, with the rep's confirm step (flows 1 and 2), thinnest version first | Pipeline hygiene without the bulk reset (flow 3); step in before a deal slips (flow 4) | \"Deals like yours\" benchmarks; a household version for financial advisors |\n| **Key features** | Review list, override with a reason, change log, proposed updates with evidence, the brief, commit reconciled to Forecasts, private preview (`features.md`) | Hygiene rules with a dry run; the brief and questions in Slack; calls from other recorders; slipping-deal flags to the rep first | Opt-in benchmarks across customers; household records and compliance-ready notes |\n| **AI level** | 4, AI Delegated, in the forecast workflow | 4, across more of the sales workflow | 5, AI Domain Intelligence |\n| **Hours given back per customer** | 3,277 a year | 3,829 a year (adds 552 for revenue operations) | more of the non-selling week, toward the BHAG; not sized yet |\n| **What customers pay for** | Agents for the sales team, $45 a user a month, a fixed line at renewal | The same line; hygiene included, to protect the renewal | A benchmark subscription per sales team, priced on pipeline managed `[PM, illustrative]` |\n| **New agent revenue per customer** | $17,280 a year | $17,280 a year; the renewal is what grows | not priced yet |\n| **What we must learn first** | Do reps hold back bad news, or lack time? Will managers believe a record reps confirmed but didn't type? | Do reps answer hygiene questions, or mute them? Do flags show a real hit rate on the customer's own deals? | Will sales leaders opt in to sharing anonymised deal data, and on what terms? |\n| **How we'll know it worked** | Managers stop messaging reps before the call; share of proposed changes accepted without edits; more teams within 5% of their forecast | Past-due close dates on open deals; tickets about numbers that don't match | Share of leaders who opt in; benchmark subscriptions sold |\n\n## Now\n\nThis product update: the rep confirms the deal, and the manager's brief is built only from what reps confirmed (`features.md`, This product update). It comes first because it is the chosen problem in the buyer's own terms, it gives back the most hours (3,277 a year for a typical customer, a $239,400 saving, `roi.md`), and it tests the riskiest assumption head on: whether managers believe a record their reps confirmed but didn't type, and whether a rep-first flow makes reps share bad news sooner.\n\nDevelopers start with the build-day slice in `features.md`: one team's sample data, end to end, from a call to an override. Then the full update runs as a pilot with one sales team at each of 10 customers, as the first step in `../vision/vision.md` says, with the interview kit in `../flows/script.md`.\n\n## Next\n\nOnce Now works, the same change log carries hygiene: revenue operations sets the rules, the agent asks the person who knows the deal, and the bulk reset goes away (flow 3). The brief and the questions move into Slack, and the agent reads calls from recorders customers already pay for, which answers the buyer's \"why pay twice?\" objection in `../research/panel.md`. Slipping-deal flags go to the rep first, and only once they can show their hit rate on the customer's own past deals. All of this stays at level 4 and widens it; the hours reach the full 3,829 in `../research/experiences.md`.\n\n## Later\n\nThe step to level 5 and toward the BHAG. With clean, rep-confirmed records across many customers, and only with their opt-in, Sales Cloud can show \"deals like yours\" and give the forecast a range drawn from thousands of companies (`../vision/vision.md`, Imagine). That needs the readiness gaps in `../discovery/discovery.md` closed first: explicit consent, and data scientists and privacy engineers on the team. The adjacent segment comes here too: a household version for financial advisors, who already pay for the same job after every meeting (`../problem/framings.md`). Beyond that, the rest of the non-selling week, the bigger half of the BHAG.\n\n## Not on the roadmap\n\n- **Service signals reach the deal (flow 5):** it only works where support runs on Service Cloud, and no persona would pay for it from a sales budget (`../flows/panel-tests.md`).\n- **\"Accept all\":** the sceptic and the buyer both said a rubber-stamped log is worse than none.\n- **Showing managers unconfirmed drafts:** it would break the rep-first promise every rep persona asked for.\n- **Repricing seats across the board:** not until outcome pricing is proven (`../discovery/discovery.md`, Don't).\n- **Quoting and sales-to-success handoff agents:** the evidence is still thin (`../vision/opportunities.md`).\n", "roadmap/roi.md": "# Salesforce Sales Cloud and Service Cloud · ROI and pricing\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. The product manager's answers are invented, tagged `[PM, illustrative]`.\n\nWhat this product update is worth, to customers and to us, and how we charge for it. Built from `../research/experiences.md` (the double cost and the new economics), `../discovery/value.md`, `features.md`, `../flows/panel-tests.md` and the product manager's answers on 27 Oct 2026. Every number shows its working; assumptions are labelled.\n\n## For a typical customer\n\nThe ideal customer in `../research/icp.md`: 25 account executives, 5 sales managers and 2 revenue operations people on Sales Cloud Core `[PM, illustrative]`. This update covers flows 1 and 2 (experiences 1 and 2), not hygiene, so revenue operations' time doesn't change yet.\n\n| | Today | With this update |\n|---|---|---|\n| Licence | $74,880 | $74,880 |\n| Agents | – | $17,280 |\n| People's time using the product | $395,968 | $139,288 |\n| **Total a year** | **$470,848** | **$231,448** |\n\n- **They save:** $239,400 a year (51%); their people get 3,277 hours back: 1,725 for reps keeping deals current, 862 for reps answering the chase, 690 for managers.\n- **Their return:** every $1 they pay for agents gives back $14.85 of people's time.\n- **Working:** licence: 32 seats × $195 a user a month (Core list, https://www.salesforce.com/sales/pricing/) × 12 = $74,880. Agents: 32 × $45 × 12 = $17,280. People's time with the update: reps 25 × 0.75 hours a week × 46 weeks × $72 = $62,100; managers 5 × 1 hour × 46 × $102 = $23,460; revenue operations unchanged at $53,728; total $139,288. Labour saved $395,968 − $139,288 = $256,680; $256,680 ÷ $17,280 = 14.85. Hours, rates and people counts as in `../research/experiences.md`: wages measured (BLS), hours a week `[PM, illustrative]`.\n- **Against the research economics:** `../research/experiences.md` counted experiences 1, 2 and 4 with agents at the $125 list price of the Agentforce for Sales add-on as a placeholder: $221,872 a year, a $248,976 saving. This update leaves out hygiene (experience 4, Next) and uses the price chosen below. When hygiene follows in Next, at no extra price, revenue operations' time falls to $13,432, the hours reach 3,829 as in research, and the customer's total falls to $191,152, a $279,696 saving (59%).\n\n## For us\n\n| | Per customer a year | Across about 12,060 customers who'd buy |\n|---|---|---|\n| New agent revenue | $17,280 | $208M |\n| Cost to run the agents | $3,456 | $42M |\n| Cost to build the update (one-off) | – | $4M |\n| **Net** | **$13,824** | **about $163M** |\n\n- **Customers who'd buy:** about 12,060 typical-customer equivalents = $903M ÷ $74,880, where $903M is 10% (assumption: the low end of the share used in `../problem/framings.md`) of $9.03B Sales revenue in fiscal 2026 (measured, https://www.sec.gov/Archives/edgar/data/1108524/000110852426000056/crm-q4fy26xexhibit991.htm). Salesforce doesn't report customer counts, so this counts revenue, not companies.\n- **New revenue across them:** $903M × ($45 ÷ $195) = $208M. That's a 23% uplift on a Core seat, inside the 15–30% uplift `../problem/problem.md` assumed, and $208M sits inside its $135M–$542M opportunity.\n- **Cost to run:** 20% of the price (assumption: model and compute for reading each deal's activity and drafting the brief). **Cost to build:** $4M `[PM, illustrative]`, from the product manager.\n- **Per customer:** revenue rises from $74,880 to $92,160, 1.23 times.\n\n## How we charge\n\nSalesforce's public Agentforce prices today, for context (https://www.salesforce.com/agentforce/pricing/, checked 27 Oct 2026): the Agentforce add-on for Sales or Service at $125 a user a month, with unmetered use by employees; Flex Credits at $500 per 100,000; $2 per conversation for customer-facing agents; the Max edition from $550 a user a month with the add-on and 2.75M Flex Credits included. Trade press reports the Help Agent at $2 per resolution (https://www.cxnetwork.com/cx-experience/news/salesforce-launches-pay-per-resolution-agent/amp).\n\n| Option | How it works | Fits when | Risk |\n|---|---|---|---|\n| Per outcome | per confirmed deal update, or per forecast brief | value is easy to count | revenue swings with how many calls reps have; reps may feel counted |\n| Per agent | a fixed price per user a month, like a seat, billed at renewal | buyers want predictable bills; the panel asked for a flat line | harder to tie to value; reps who only review a list feel overpriced (Priya) |\n| Usage | Flex Credits per action | usage varies a lot | Elena: \"unclear credits already burn me\"; bills feel unpredictable |\n| Tier | included in the $125 Agentforce for Sales add-on or in Max | simple to sell to customers already on it | gives the value away to those customers and doesn't reach the rest |\n\n**Our choice:** per agent, at **$45 a user a month** for every Sales Cloud user on the team, a fixed line billed annually at renewal. Customers already on the Agentforce for Sales add-on or Max get it included. `[PM, illustrative]` Because the buyer and the sceptic both asked for one flat line with no credit surprises, and $45 sits at the buyer's \"getting expensive\" mark: high enough to be taken seriously, low enough to sit well under a tool on top.\n\n- **Value-based check:** the price is 6.7% of the labour it saves ($17,280 ÷ $256,680), so the customer clearly wins; for the 32-seat customer it's $17,280 a year, against Gong's median deal of about $55,000 (https://vendr.com/marketplace/gong).\n- **Panel price vote:** medians: too cheap $6.50, a bargain $17.50, getting expensive $42.50, too expensive $77.50; the buyer's own line is $45 (`../flows/panel-tests.md`). The panel priced well below the value; we sit at the top of its acceptable range rather than the bottom. *Synthetic vote: hypotheses, not evidence.*\n- **Real customers said:** nothing yet; no real interviews in this public example. Ask the budget question in `../flows/script.md`, Part 3.\n- **What would change our mind:** real buyers accepting a higher price once a one-team pilot shows managers stop chasing; reps resenting a seat price for a review list (then a lower rep rate and a higher manager rate, as Priya suggested); or too many customers already on the add-on, so little new revenue comes in.\n", "vision/ai-levels.md": "# Salesforce Sales Cloud and Service Cloud · value at each AI level\n\n> Illustrative example built from public sources on 27 Oct 2026. In a real run the product manager confirms each row; here, rows tagged `[PM, illustrative]` are invented.\n\n**Level today:** 4, AI Delegated: the highest level with value that is shipped and used. Agentforce service agents resolve customer conversations end to end, with people handling the rest, and named customers report the results.\n**Planned or in beta:** none verified at level 5 or 6. Headless 360 (agents outside Salesforce calling its actions) is shipped but is plumbing, not a higher level.\n\n## Summary\n\n| Level | Value today? | Main features | For whom | How they pay |\n|---|---|---|---|---|\n| 1 System of Record | Yes | Accounts, contacts, leads, deals, forecasts, cases, knowledge, workflows, reports | All four personas | Per seat, by edition ($25–$550 per user per month) |\n| 2 AI Assisted | Yes | Einstein lead and opportunity scoring, forecasting, call and record summaries, reply suggestions | Account executives, sales managers, service reps | Some included; most in Einstein for Sales or higher editions |\n| 3 AI Directed | Yes | Close plans and emails on request, Agentforce Coworker, Agentforce Sales in ChatGPT | Account executives, service reps | Agentforce add-on ($125 per user per month), Max edition, or $50 Coworker licence |\n| 4 AI Delegated | Yes | Agentforce service agents resolving conversations; Agentforce Engagement working leads; Fin | Service managers and their customers; sales managers | Per conversation ($2), per resolution, or Flex Credits (about $0.10 per action) |\n| 5 AI Domain Intelligence | No | none | | |\n| 6 System of Understanding | No | none | | |\n\n## Level 1 · System of Record\n\nPeople do the work; the product stores and runs it.\n\n| Feature | For whom | The value they get | How they pay | Status | Source |\n|---|---|---|---|---|---|\n| Accounts, contacts, deals and pipeline in one place, with automatic capture of calls, emails and meetings | Account executive, user | One view of each customer and deal | Per seat, by edition | Shipped and used | https://www.salesforce.com/sales/ |\n| Forecasting, quotas and commissions | Sales manager, buyer and user | A forecast built from deal data; quota tracking | Per seat, by edition | Shipped and used | https://www.salesforce.com/sales/ |\n| Cases, knowledge, assets, contact center and field service | Service rep and manager | Every customer issue tracked from first contact to close | Per seat: Starter $25 to Max $550 | Shipped and used | https://www.salesforce.com/service/ · https://www.salesforce.com/service/pricing/ |\n| Configuration, permissions, flows and reports | Admin or revenue operations | The system fits how the company sells and serves | Included; complexity drives partner and admin costs | Shipped and used | https://g2.com/products/salesforce-crm/reviews |\n\n## Level 2 · AI Assisted\n\nPeople do the work; AI suggests.\n\n| Feature | For whom | The value they get | How they pay | Status | Source |\n|---|---|---|---|---|---|\n| Einstein Lead Scoring and Opportunity Scoring | Account executive | Knows which leads and deals to work first | Sales Cloud Einstein licence; opportunity scoring also with a standard licence | Shipped | https://help.salesforce.com/s/articleView?id=sales.sales_core_artificial_intelligence.htm&language=en_US&type=5 |\n| Einstein Forecasting | Sales manager | A predicted forecast next to the team's call | Sales Cloud Einstein licence | Shipped | same as above |\n| Call summaries and conversation insights | Account executive, sales manager | No notes to write after a call; managers see what was said | Einstein Conversation Insights plus Einstein for Sales add-on | Shipped | same as above |\n| AI-generated reply suggestions for service | Service rep | Faster, personalised replies; Wonolo reports 20% shorter handle times | Included in higher editions or add-on (exact packaging not verified) | Shipped and used | https://www.salesforce.com/sales/ |\n\n## Level 3 · AI Directed\n\nA person asks; AI does one task; the person checks each result.\n\n| Feature | For whom | The value they get | How they pay | Status | Source |\n|---|---|---|---|---|---|\n| Einstein for Sales: summarise a record, draft sales emails, create a close plan | Account executive | Drafts on request, reviewed before sending | Einstein for Sales add-on | Shipped | https://help.salesforce.com/s/articleView?id=sales.sales_core_artificial_intelligence.htm&language=en_US&type=5 |\n| Account research by an agent on request | Account executive | Carnegie Learning cut rep research from up to an hour to 5–10 minutes | Agentforce for Sales add-on, from $125 per user per month | Shipped and used | https://www.salesforce.com/news/stories/agentforce-customer-success-stories/ · https://www.salesforce.com/sales/pricing/ |\n| Agentforce Sales app in ChatGPT: ask for leads, update deals, build an account plan saved back to Salesforce | Account executive | Works the CRM from where they already are | Not stated | Shipped (December 2025) | https://www.salesforceben.com/salesforce-brings-agentforce-sales-to-chatgpt/ |\n| Agentforce Coworker: one place to ask questions across CRM, documents and Slack, and hand tasks to agents | All employees | Answers and actions without hunting across tools | $50 per user per month, unmetered in Max | Shipped; general availability timing not verified | https://www.salesforce.com/agentforce/pricing/ |\n\n## Level 4 · AI Delegated\n\nAI does the job end to end; people handle exceptions.\n\n| Feature | For whom | The value they get | How they pay | Status | Source |\n|---|---|---|---|---|---|\n| Agentforce service agents resolving customer conversations and acting in systems | Service manager (buyer); their customers | Engine: 50% of chat cases resolved automatically, 15% less handle time, 16% higher chat satisfaction. 1-800Accountant: 70% of chats resolved in tax week 2025 | $2 per conversation, or Flex Credits | Shipped and used | https://www.salesforce.com/customer-stories/engine/agentic-service/ · https://www.salesforce.com/news/stories/agentforce-customer-success-stories/ · https://www.salesforce.com/agentforce/pricing/ |\n| Agentforce on Salesforce's own help site | Salesforce's customers | More than five million conversations; over 63% resolved instantly | Internal use | Shipped and used | https://www.salesforce.com/agentforce/case-study/customer-zero |\n| Agentforce Help Agent, ready-made service agent | Service manager | Pays only when the agent resolves an issue; no charge if the customer asks for a human | Per resolution ($2 per trade press) | Shipped (June 2026); usage not yet reported | https://www.cxnetwork.com/cx-experience/news/salesforce-launches-pay-per-resolution-agent/amp |\n| Agentforce Engagement (formerly the SDR agent): emails new leads, answers replies, books meetings, hands qualified leads to reps | Sales manager; account executives get meetings | Salesforce's own use (Jul–Oct 2025): 68,000 leads re-engaged, 800 meetings booked autonomously | Einstein for Sales or Agentforce add-on | Shipped and used | https://help.salesforce.com/s/articleView?id=sales.sales_agent_sdr_parent.htm&language=en_US&type=5 · https://www.salesforce.com/ap/blog/ai-for-lead-qualification/?bc=OTH |\n| Fin, the customer agent from the former Intercom | Service teams, especially smaller ones | 76% average resolution rate claimed; more than 30,000 customer companies | Fin's own pricing (outcome-based) | Shipped and used; part of Salesforce since 10 Sep 2026 | https://www.salesforce.com/news/press-releases/2026/09/10/salesforce-completes-acquisition-of-fin/ |\n\n## Level 5 · AI Domain Intelligence\n\nAI brings expertise learned from data across many customers.\n\nnone. Einstein scoring and forecasting learn from each customer's own history, which is level 2. No public evidence of Sales Cloud or Service Cloud giving benchmarks or recommendations drawn from many customers' data. [https://help.salesforce.com/s/articleView?id=sales.sales_core_artificial_intelligence.htm&language=en_US&type=5]\n\nPlanned: the product manager's target, see `vision.md` `[PM, illustrative]`.\n\n## Level 6 · System of Understanding\n\nThe product understands how the domain works, anticipates and acts.\n\nnone.\n", "vision/market-map.md": "# AI level map · CRM for sales and customer service\n\nSalesforce Sales Cloud and Service Cloud own the sales pipeline and the service case for mid-market and enterprise companies. Snapshot from public sources on 27 Oct 2026.\n\n## The market on the curve\n\n| Level | Incumbents | AI-native challengers | Horizontal players |\n|---|---|---|---|\n| 6 System of Understanding | | | |\n| 5 AI Domain Intelligence | | | |\n| 4 AI Delegated | **Salesforce**, HubSpot, Microsoft Dynamics 365, ServiceNow | Sierra, Decagon, Clay | |\n| 3 AI Directed | Oracle Fusion CX, Zoho CRM | Attio, Day.ai | Microsoft 365 Copilot, ChatGPT |\n| 2 AI Assisted | SAP Sales and Service Cloud | | |\n| 1 System of Record | | | |\n\n**Us:** level 4, because Agentforce service agents resolve customer conversations end to end and named customers report results: Engine 50% of chat cases, 1-800Accountant 70% of chats in tax week. Salesforce's own help site resolves over 63% of more than five million conversations. The public evidence matches `ai-levels.md`. [https://www.salesforce.com/customer-stories/engine/agentic-service/] [https://www.salesforce.com/agentforce/case-study/customer-zero]\n\n## Company by company\n\n| Company | Group | Level | Its highest AI feature | Shipped / beta / announced | Confidence | Source | Heading towards |\n|---|---|---|---|---|---|---|---|\n| Salesforce (us) | Incumbent | 4 | Agentforce service agents resolving conversations; Agentforce Engagement working leads; Fin | Shipped | High | https://www.salesforce.com/customer-stories/engine/agentic-service/ | Pay per resolution (Help Agent, June 2026); agents callable from Claude, ChatGPT and Cursor through Headless 360 |\n| HubSpot | Incumbent | 4 | Breeze Customer Agent: says it resolves 70% of support conversations on its own; 9,000+ customers; paid per resolution | Shipped | High | https://www.cxtoday.com/contact-center/hubspot-customer-agent-resolution-rate/ | Sales-side agents, such as its Prospecting Agent |\n| Microsoft Dynamics 365 | Incumbent | 4 | Case Management Agent creates, updates and closes cases; Sales Qualification Agent researches and emails leads | Shipped (October 2025) | Medium: no named customer metric found | https://learn.microsoft.com/en-us/dynamics365/contact-center/administer/autonomous-agents-overview | Fully autonomous email resolution (planned) |\n| ServiceNow Customer Service Management | Incumbent | 4 | AI agents for case triage and resolution; ServiceNow reports deflecting about 75% of its own cases | Shipped | Medium: mostly its own use | https://www.cxtoday.com/contact-center/servicenow-hasnt-cut-its-customer-service-headcount-despite-deflecting-75-of-cases/ | CRM agents for selling, orders and service (announced 2025) |\n| Oracle Fusion CX | Incumbent | 3 | Quote Generation Agent configures and prices a quote for the seller to review; prebuilt agents at no extra cost | Shipped (February 2026) | Low: no usage evidence | https://itbrief.co.uk/story/oracle-adds-ai-agents-across-crm-supply-chain-apps | Self-service and attachment-processing agents |\n| Zoho CRM | Incumbent | 3 | Zia Agents pick up chats, create leads and hand off to people | Shipped in the summer 2026 release; no usage evidence | Low | https://www.zoho.com/blog/salesiq/meet-zia-agents-autonomous-ai-workforce.html | Agents across all Zoho apps on its own model, with an agent marketplace |\n| SAP Sales and Service Cloud | Incumbent | 2 | Case Classification Agent detects intent and sentiment and routes cases | Shipped | Low: press found no named CX customers | https://www.cxtoday.com/ai-automation-in-cx/sap-ai-agents-customer-service-wins/ | \"Autonomous CX\" with voice agents (announced) |\n| Sierra | AI-native challenger | 4 | Customer agents that resolve cases end to end; Airtable 80%, Chime 70%+ resolution | Shipped | High | https://sierra.ai/customers | Agents that run ongoing relationships, sales and retention (stated intent) |\n| Decagon | AI-native challenger | 4 | Support agents across chat, email and voice; Chime 70% resolution, Duolingo 80% deflection | Shipped | High | https://decagon.ai/ | Voice and multichannel agents; a channel for customers' own AI agents |\n| Clay | AI-native challenger | 4 | Research agents that research, score and prepare outreach for thousands of accounts; named results such as Canva saving 4 hours per rep a week | Shipped | Medium: a person designs each run | https://www.clay.com/ | Agents that share what they learn across sales plays |\n| Attio | AI-native challenger | 3 | Ask Attio queries and updates the CRM in plain language; agents in Workflows research and score leads | Shipped | High at level 3 | https://attio.com/ | Agent-run workflows; context for outside AI tools through MCP |\n| Day.ai | AI-native challenger | 3 | Agents read email, calendar, meetings and Slack, send briefings and draft replies; nothing goes out without approval | Shipped (generally available February 2026) | Medium | https://day.ai/ | Long-running agents that act on their own (positioning) |\n| Microsoft 365 Copilot | Horizontal player | 3 | Sales Agent and Service Agent in Outlook and Teams: summaries, CRM logging, draft replies on request | Shipped (July 2026) | High | https://www.cxtoday.com/marketing-sales-technology/microsoft-sales-agent-service-agent-general-availability/ | Sales Close Agent and Sales Research Agent (preview) |\n| ChatGPT | Horizontal player | 3 | CRM connectors that read and act on request; workspace agents that run on a schedule | Connectors shipped; workspace agents in research preview | Low | https://www.uctoday.com/productivity-automation/openai-workspace-agents-chatgpt-enterprise-workflows/ | Level 4 once workspace agents leave preview |\n\n## Not placed\n\n| Company | Why |\n|---|---|\n| Google Gemini Enterprise for CX | Unveiled January 2026; no general availability, named customers or metrics found. [https://www.destinationcrm.com/Articles/CRM-News/CRM-Across-the-Wire/Google-Cloud-Launches-Gemini-Enterprise-for-Customer-Experience-173071.aspx] |\n| Fin (formerly Intercom) | Now part of Salesforce (closed 10 Sep 2026); counted in Salesforce's row. [https://www.salesforce.com/news/press-releases/2026/09/10/salesforce-completes-acquisition-of-fin/] |\n| Lightfield | Named in `market-moves.md`; raised a $47M Series A, but its AI features weren't researched feature by feature. [https://dealroom.co/news/149823-ai-crm-startup-lightfield-raises-47m-series-a-led-by-a16z/] |\n| Gong, Clari, Zapier | Named in `market-moves.md` as tools on top of or between CRMs; not researched feature by feature for this map. |\n\n## Openings\n\n- **Empty or thin levels:** nobody credible is at level 5 or 6. No one gives sales or service teams benchmarks or recommendations drawn from many companies' deals and cases. Level 4 is crowded in service but thin in sales: only Salesforce's own lead agent, Microsoft's lead qualification agent (no named customers) and Clay for research.\n- **Moving up fastest:** Sierra and Decagon, AI-native, with published resolution rates and outcome pricing; Sierra raised $950M in May 2026. [https://www.vktr.com/customer-experience/sierra-raises-950m-at-15b-valuation-eyes-transformation-beyond-customer-support/] HubSpot reports its customer agent went from 20% to 70% resolution in a year. [https://www.cxtoday.com/contact-center/hubspot-customer-agent-resolution-rate/]\n- **Where we could lead:** level 5 in sales. Salesforce holds years of pipeline and case history across its customers (`../product.md`), and the sales side of level 4 is still open.\n\n*Placements are a snapshot from public sources. Check the ones you act on.*\n", "vision/market-moves.md": "# Salesforce Sales Cloud and Service Cloud · Who's moving in your market\n\nSnapshot from public sources on 27 Oct 2026.\n\n**In short:** The busiest move is in customer service. Well-funded AI agent companies handle whole customer conversations and sell them per resolution, not per seat. Simpler self-serve CRMs with free plans and easy Salesforce import go after smaller teams. Microsoft and ServiceNow reach CRM buyers through products those buyers already run. This opens up three things for us: lead on outcomes in service, use Fin for the fast-setup end of the market, and make the CRM record keep itself so tools on top have less to add.\n\n## Five ways others move into a market\n\n| Way in | What we found | Who | Seen / early signs / not seen | Source | What it means for us |\n|---|---|---|---|---|---|\n| A focused tool for one part of the product | AI customer service agents that resolve chat and voice conversations end to end and take actions in back-office systems, charged per outcome. Sierra raised $950M in May 2026 and publishes named resolution rates; analysts list Salesforce among the seat-priced platforms it competes with. Decagon raised $250M in January 2026. Fin was in this group until Salesforce bought it. | Sierra, Decagon | Seen (high confidence) | https://www.vktr.com/customer-experience/sierra-raises-950m-at-15b-valuation-eyes-transformation-beyond-customer-support/ · https://sacra.com/c/sierra/ · https://www.vktr.com/contact-center/decagon-triples-valuation-to-45b-with-250m-series-d/ | Service buyers now judge value by the resolved conversation. Lead with per-resolution pricing and publish resolution results. |\n| A simpler product for smaller customers | Attio has a free plan for up to 3 seats, paid plans at $35–$79 per user per month and a Salesforce import guide; it raised a $52M Series B in August 2025. Lightfield raised a $47M Series A in September 2026 and reports about 5,000 companies using it. | Attio, Lightfield | Seen (medium confidence) | https://attio.com/pricing · https://tech.eu/2025/08/26/attio-raises-52m-series-b-to-scale-crm-platform/ · https://dealroom.co/news/149823-ai-crm-startup-lightfield-raises-47m-series-a-led-by-a16z/ | Reviewers say setup needs consultants. A fast, self-serve start protects the small-team end. |\n| A layer that connects to the product and adds to it | Zapier offers ready-made connectors to Salesforce and to Microsoft Dynamics 365, HubSpot, Pipedrive and Zoho, and links service tools like Zendesk to those CRMs. | Zapier | Seen (medium confidence: third-party help article) | https://help.unibuddy.co/en/articles/5043523-which-crm-integrations-are-available-on-zapier · https://zapier.com/apps/pipedrive/integrations/zendesk | Customers can move data between CRMs without either vendor. We stay the hub by owning the workflows, not just the records. |\n| Reaching customers through another channel | ServiceNow added CRM AI agents in 2025 for selling, orders and service, on a platform its customers already run. Microsoft puts its Sales Agent and Service Agent inside Outlook and Teams and sells Dynamics 365 with the rest of the Microsoft stack. | ServiceNow, Microsoft | Seen (high confidence) | https://www.destinationcrm.com/Articles/CRM-News/CRM-Across-the-Wire/ServiceNow-Introduces-CRM-AI-Agents-169362.aspx · https://www.cxtoday.com/marketing-sales-technology/microsoft-sales-agent-service-agent-general-availability/ · https://www.alphabold.com/microsoft-dynamics-365-vs-salesforce/ | Sellers increasingly work outside the CRM screen. Our Agentforce Sales app in ChatGPT and Headless 360 are the same play; run them in more places. |\n| An AI product built on top of the product | Tools that sit on Salesforce data: Gong fills CRM fields from calls; Clari adds forecasting while the CRM stays the record; Coffee says it replaces manual data entry (its own marketing). None is positioned as a full replacement. | Gong, Clari, Coffee | Early signs (low confidence: vendor and partner blogs) | https://vantagepoint.io/blog/sf/gong-for-salesforce-revenue-ai-review · https://coffee.ai/articles/best-clari-alternatives-sales-ops | These tools need clean records. If our agents capture activity and keep records current, there's less reason to buy a separate layer. |\n\n## What this opens up for us\n\n- **Lead on outcomes in service.** Sierra and Decagon sell on resolutions. We already offer $2 per conversation and, since June 2026, the Help Agent that charges only when it resolves an issue. [https://www.salesforce.com/agentforce/pricing/] [https://www.cxnetwork.com/cx-experience/news/salesforce-launches-pay-per-resolution-agent/amp]\n- **Use Fin for the fast-setup customer.** Salesforce says Fin adds faster-to-deploy agents for small and some commercial businesses: the same segment Attio and Lightfield target. [https://www.salesforce.com/news/press-releases/2026/06/15/salesforce-signs-definitive-agreement-to-acquire-fin]\n- **Make the record keep itself.** Gong, Clari and Coffee all live off data reps type in. If Sales Cloud captures activity and updates deals on its own, the gap they fill shrinks.\n- **Show up where people already work.** Microsoft's pitch is Copilot in Outlook and Teams. We have Slack, the Agentforce Sales app in ChatGPT and Headless 360 for outside agents. [https://www.salesforceben.com/salesforce-brings-agentforce-sales-to-chatgpt/] [https://www.destinationcrm.com/Articles/CRM-News/CRM-Across-the-Wire/Salesforce-Expands-Headless-360-Across-Its-Portfolio-176206.aspx]\n- **Stay open to builders.** In 2025 Salesforce limited how outside AI tools such as Glean could store and index Slack data, and critics called it lock-in. Clear, open terms keep builders working on Salesforce rather than around it. [https://www.cxtoday.com/crm/salesforce-blocks-competitors-from-using-slack-data-so-what/]\n\n## What we looked for and didn't find\n\n- **No one selling CRM through payments, commerce or cloud platforms.** Searches for Stripe, Shopify, Google Workspace or AWS launching CRM or service agents for small businesses in 2026 found no such launch.\n- **No OpenAI CRM.** Searches found only partnerships the other way: Salesforce apps inside ChatGPT and OpenAI models inside Agentforce.\n- **No app that fully replaces Sales Cloud or Service Cloud.** Tools on top present themselves as additions; replacement claims come only from vendors' own marketing.\n- **No proof that Sierra replaces Service Cloud.** Sources describe Sierra connecting to existing CRMs, not displacing them.\n", "vision/opportunities.md": "# Salesforce Sales Cloud and Service Cloud · Opportunities\n\nBuilt from `../product.md`, `ai-levels.md`, `market-map.md` and `market-moves.md` on 27 Oct 2026. No `documents/` in this example, so the evidence is public: Salesforce's own surveys, job postings, reviews and trade press. Some surveys are from 2024; their dates are given.\n\n## The work around the product\n\n| # | Step | What happens | Who | Software | Still manual | Coverage | Who's moving here | Our AI level |\n|---|---|---|---|---|---|---|---|---|\n| 1 | Lead capture and qualification | Leads come in or are found; someone contacts and qualifies them | SDR, account executive | Salesforce, HubSpot, Zoho | Reps log notes, stages and outcomes by hand in the CRM [https://www.myjobmag.co.ke/job/sales-development-representative-sdr-pavago] | partial | Microsoft Dynamics 365, HubSpot, Clay | 4 (Agentforce Engagement) |\n| 2 | Prospect research and outreach | Research target accounts, build lists, send sequences, call | SDR, account executive | LinkedIn Sales Navigator, Apollo, Salesforce | Reps research and build lists by hand, then track every activity in Salesforce [https://www.workingnomads.com/jobs/sales-development-representative-hackerrank] | partial | Clay, Attio | 3 (research on request) |\n| 3 | Meetings and activity logging | Calls, emails and meetings get recorded on the deal | Account executive | Salesforce, Gong, many other apps | Non-selling work took 70% of reps' time in 2024 [https://www.salesforce.com/news/?p=79781]; manual data entry is about 11% of the week [https://www.apollo.io/magazine/the-toggle-tax-what-1200-daily-app-switches-are-costing-sales-teams] | partial | Day.ai, Microsoft 365 Copilot, Gong, Coffee | 2 (activity capture, call summaries) |\n| 4 | Opportunity management and forecasting | Reps update stage, amount and close date; managers review pipeline and roll up a commit | Account executive, sales manager, revenue operations | Salesforce Forecasts, Clari, spreadsheets | Weekly forecast roll-ups in spreadsheets take about an hour and go stale fast [https://zapier.com/templates/details/weekly-forecast-rollup]; only 45% of sales leaders had high confidence in their forecast (Gartner, 2020) [https://www.gartner.com/en/newsroom/press-releases/2020-02-12-gartner-says-less-than-50--of-sales-leaders-and-selle] | partial | Clari | 2 (Einstein Forecasting) |\n| 5 | Quoting and close | Configure, price, approve, sign | Account executive, deal desk | Salesforce CPQ and Revenue Cloud | A reviewer reports many workarounds in CPQ [https://trustradius.com/reviews/salesforce-cpq-formerly-steelbrick-2018-10-24-18-03-16] | unknown | Oracle Fusion CX | not covered in `ai-levels.md` |\n| 6 | Handoff to customer success | Deal context passes to onboarding | Account executive, customer success manager | Salesforce, Slack | Handoffs run on scattered notes and Slack messages (vendor blog) [https://www.rocketlane.com/blogs/sales-to-customer-success-handoff] | partial | none on the map | not covered |\n| 7 | Case intake and routing | Cases arrive by phone, email, chat or web and get classified and assigned | Service rep, service manager | Service Cloud | No specific evidence found | unknown | SAP, Microsoft Dynamics 365 | 4 (Agentforce service agents) |\n| 8 | Case resolution and knowledge | Resolve the case, write notes, update knowledge | Service rep | Service Cloud | Service agents spent only 39% of their time serving customers in 2024; the rest went to admin, meetings and logging case notes by hand [https://www.cxtoday.com/workforce-engagement-management/salesforce-contact-center-agents-spend-just-39-of-their-time-servicing-customers/] | partial | Sierra, Decagon, HubSpot, ServiceNow | 4 |\n| 9 | Reporting, admin and data hygiene | Build reports, import and dedupe data, fix records, answer user requests | Salesforce admin, revenue operations | Salesforce, spreadsheets, Cloudingo, Validity | Admin postings list cleanup, deduplication, reconciliation and a ticket queue of data fixes [https://jobs.workable.com/jobs/83139990-02aa-447b-9f68-5d26b90d22f1.md] [https://www.vaneck.com/globalassets/home/us/our-firm/careers/salesforce-administrator_2025-002.pdf] | partial | none on the map | 1 |\n\n## Opportunities, ranked\n\n| # | Opportunity | Kind | Level | Impact | Effort | Urgency | Evidence | Priority | Band |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | The deal record that keeps itself | Grow the base | 4 | 5 | 3 | 4 | Strong | 4.35 | Do first |\n| 2 | Outcome-priced service for the fast-setup customer | New revenue | 4 | 4 | 3 | 5 | Strong | 4.25 | Do first |\n| 3 | An admin agent for data hygiene and the request queue | Grow the base | 4 | 3 | 2 | 3 | Strong | 3.60 | Strong option |\n| 4 | The forecast without the spreadsheet | Grow the base | 4 | 4 | 3 | 3 | Good | 3.55 | Strong option |\n| 5 | Case wrap-up done for the rep | Grow the base | 4 | 3 | 2 | 3 | Good | 3.40 | Strong option |\n| 6 | \"Deals like yours\": opt-in benchmarks across customers | New revenue | 5 | 5 | 5 | 2 | Thin | 2.85 | Worth watching |\n\n## 1. The deal record that keeps itself\n\n- **The job today:** after every call, email and meeting, account executives and SDRs type notes, next steps, stage and close date into Salesforce. Postings ask reps to \"meticulously track all activities\". [https://www.workingnomads.com/jobs/sales-development-representative-hackerrank] Non-selling work took 70% of reps' time in 2024 [https://www.salesforce.com/news/?p=79781], with manual data entry about 11% of the week [https://www.apollo.io/magazine/the-toggle-tax-what-1200-daily-app-switches-are-costing-sales-teams].\n- **What the product would do:** an agent listens to calls, reads email and calendar, and updates the deal: contacts, next step, stage, close date, risks. The rep sees a short list of changes and approves or edits them. Fields with high confidence update on their own.\n- **For whom:** account executive (user); sales manager (buyer, who gets a pipeline that reflects reality).\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** Day.ai (agents read email, calendar and meetings), Gong (fills CRM fields from calls), Coffee (says it replaces data entry), Microsoft 365 Copilot (logs to the CRM from Outlook). See `market-map.md`, `market-moves.md`.\n- **Ratings:** impact 5 because it defends the core seat and removes the main reason to buy tools on top; effort 3 because Einstein Activity Capture and call summaries exist but reliable field updates across email, calendar and calls are new; urgency 4 because Day.ai and Gong have shipped versions of this; evidence Strong because there are four findings across surveys, job postings and third-party analysis, with a quote from a non-Salesforce source.\n- **Priority:** 0.35 × 5 + 0.25 × 4 + 0.20 × 5 + 0.20 × (6 − 3) = 1.75 + 1.00 + 1.00 + 0.60 = 4.35 → Do first\n- **Size:** not sized, because there's no public count of Sales Cloud customers or seats to multiply from.\n- **First question:** \"If the CRM updated your deals for you, what would you need to see before you trusted it?\"\n\n## 2. Outcome-priced service for the fast-setup customer\n\n- **The job today:** smaller service teams want an agent that answers customers within days, not a consulting project. Reviewers say Service Cloud setup depends on consultants. [https://capterra.com/p/136189/Salesforce/reviews/] Sierra, Decagon and HubSpot sell agents that resolve conversations and charge per outcome. [https://sierra.ai/customers] [https://decagon.ai/] [https://www.cxtoday.com/contact-center/hubspot-customer-agent-resolution-rate/]\n- **What the product would do:** one package of Fin and the Agentforce Help Agent for small and commercial Service Cloud customers: live in a day, connected to their Service Cloud cases and knowledge, paid only per resolved conversation.\n- **For whom:** service manager at a small or mid-size company (buyer).\n- **Kind and level:** new revenue; level 4.\n- **Who else is going after it:** Sierra, Decagon, HubSpot; Attio and Lightfield on the small-CRM side.\n- **Ratings:** impact 4 because outcome pricing is a product customers will pay extra for, and Salesforce paid about $3.6B for Fin to win this segment [https://www.salesforce.com/news/press-releases/2026/06/15/salesforce-signs-definitive-agreement-to-acquire-fin]; effort 3 because Fin and Service Cloud must share cases, knowledge and billing; urgency 5 because others already take this job from Salesforce's customers; evidence Strong because there are five findings across reviews, vendor sites and trade press, with third-party quotes.\n- **Priority:** 0.35 × 4 + 0.25 × 5 + 0.20 × 5 + 0.20 × (6 − 3) = 1.40 + 1.25 + 1.00 + 0.60 = 4.25 → Do first\n- **Size:** 30,000 Fin customers (measured [https://www.salesforce.com/news/press-releases/2026/09/10/salesforce-completes-acquisition-of-fin/]) × 5–15% who also adopt Service Cloud (assumption) × $10,000–$30,000 extra a year each (assumption) = $15M–$135M a year in new Service Cloud revenue. Wide, because both of the last two factors are assumptions.\n- **First question:** \"Would you move your support desk to Service Cloud if the agent were live in a day and you paid only for resolved conversations?\"\n\n## 3. An admin agent for data hygiene and the request queue\n\n- **The job today:** admins run cleanup, deduplication and reconciliation by hand, work a queue of data-fix and field-change requests, and lean on spreadsheets and tools like Cloudingo and Validity. [https://jobs.workable.com/jobs/83139990-02aa-447b-9f68-5d26b90d22f1.md] [https://www.wearedevelopers.com/jobs/ext/6751643/salesforce-administrator-remote] [https://www.vaneck.com/globalassets/home/us/our-firm/careers/salesforce-administrator_2025-002.pdf] Reviewers call advanced automation, reporting and permissions hard. [https://g2.com/products/salesforce-crm/reviews]\n- **What the product would do:** an agent that finds duplicates and broken records, proposes merges and fixes, and works simple requests from users (a new field, a report, a permission), with the admin approving each batch.\n- **For whom:** Salesforce admin or revenue operations lead (influences the renewal).\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** no one on the map; Cloudingo and Validity cover deduplication.\n- **Ratings:** impact 3 because admins shape renewals and complexity is the top complaint; effort 2 because the data and metadata are already in the platform; urgency 3 because the complexity complaint is visible in every review site; evidence Strong because there are three postings plus review summaries, two kinds of source, with quotes from employers.\n- **Priority:** 0.35 × 3 + 0.25 × 3 + 0.20 × 5 + 0.20 × (6 − 2) = 1.05 + 0.75 + 1.00 + 0.80 = 3.60 → Strong option\n- **Size:** not sized: no public count of Salesforce admins or of time spent on data fixes.\n- **First question:** \"What share of your week goes to fixing data and small requests, and which would you hand off first?\"\n\n## 4. The forecast without the spreadsheet\n\n- **The job today:** managers export pipeline, roll it up in spreadsheets each week and chase reps for updates. [https://zapier.com/templates/details/weekly-forecast-rollup] Users call forecast exports cumbersome. [https://community.salesloft.com/product-q-a-11/need-enhanced-forecasting-reporting-1921] Confidence in forecasts was low in Gartner's 2020 survey. [https://www.gartner.com/en/newsroom/press-releases/2020-02-12-gartner-says-less-than-50--of-sales-leaders-and-selle]\n- **What the product would do:** an agent inspects every deal each week, flags slipped dates and missing steps, asks reps only about what changed, and drafts the commit with reasons. The manager edits and submits.\n- **For whom:** sales manager or VP of sales.\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** Clari.\n- **Ratings:** impact 4 because forecasting is something leaders pay extra for, as Clari shows; effort 3 because it needs opportunity 1's clean records to work well; urgency 3 because the gap is noticed and Clari sells into it; evidence Good because there are three findings, mostly from search snippets and one dated survey.\n- **Priority:** 0.35 × 4 + 0.25 × 3 + 0.20 × 4 + 0.20 × (6 − 3) = 1.40 + 0.75 + 0.80 + 0.60 = 3.55 → Strong option\n- **Size:** not sized: no public figure for how many Sales Cloud customers forecast in Salesforce.\n- **First question:** \"Walk me through last week's forecast call: what did you do in a spreadsheet, and why?\"\n\n## 5. Case wrap-up done for the rep\n\n- **The job today:** when a rep handles a case, they write notes and a summary by hand; service agents spent only 39% of their time with customers in 2024. [https://www.cxtoday.com/workforce-engagement-management/salesforce-contact-center-agents-spend-just-39-of-their-time-servicing-customers/] Salesforce's own training says forms and case data pull agents away from customers. [https://trailhead.salesforce.com/content/learn/modules/einstein-work-summaries-service/get-to-know-future-of-service-and-generative-ai]\n- **What the product would do:** at the end of every human-handled case, the agent writes the notes, sets the fields, drafts a knowledge article if the answer was new, and closes the case once the rep approves.\n- **For whom:** service rep (user), service manager (buyer).\n- **Kind and level:** grow the base; level 4.\n- **Who else is going after it:** ServiceNow, Microsoft Dynamics 365 (case agents).\n- **Ratings:** impact 3 because it's a clear time saving for every rep; effort 2 because work summaries already exist; urgency 3 because Microsoft's case agent already updates and closes cases; evidence Good because there are two findings, both from Salesforce's own research.\n- **Priority:** 0.35 × 3 + 0.25 × 3 + 0.20 × 4 + 0.20 × (6 − 2) = 1.05 + 0.75 + 0.80 + 0.80 = 3.40 → Strong option\n- **Size:** not sized: no public count of Service Cloud reps.\n- **First question:** \"How long does wrap-up take after a typical case, and what do you skip when you're busy?\"\n\n## 6. \"Deals like yours\": opt-in benchmarks across customers\n\n- **The job today:** sales managers judge whether a deal is healthy from their own team's history. Einstein scoring learns from each customer's own data only. [https://help.salesforce.com/s/articleView?id=sales.sales_core_artificial_intelligence.htm&language=en_US&type=5] Nobody on the map offers benchmarks from many companies' deals (`market-map.md`).\n- **What the product would do:** customers who opt in share anonymised deal patterns. In return each team sees how deals like theirs, in their industry and size, tend to move: typical cycle length, the steps that predict a win, where similar deals stall.\n- **For whom:** sales manager or VP of sales; revenue operations.\n- **Kind and level:** new revenue; level 5.\n- **Who else is going after it:** Clay says its agents share what they learn across sales plays (stated direction). [https://www.clay.com/]\n- **Ratings:** impact 5 because it would open a new paid data product; effort 5 because Salesforce would need customers' permission to learn across their data, which it doesn't have today; urgency 2 because no one has shipped it; evidence Thin because the only finding is the gap on the map, plus the product manager's belief.\n- **Priority:** 0.35 × 5 + 0.25 × 2 + 0.20 × 2 + 0.20 × (6 − 5) = 1.75 + 0.50 + 0.40 + 0.20 = 2.85 → Worth watching\n- **Size:** not sized: no measured factor.\n- **First question:** \"Would you share anonymised deal data with other companies if you got their benchmarks back? What would you need to be sure of first?\"\n\n## Open questions\n\n- Sales-to-customer-success handoff: evidence so far is vendor blogs only. Worth asking customers whether it hurts.\n- Quoting: one reviewer reports workarounds; not enough to call it an opportunity yet.\n- Case routing: no evidence of manual work found.\n- First-hand review quotes from G2, Capterra and TrustRadius couldn't be read in full for this example. A real run should add them, or the product manager's own customer notes in `documents/`.\n", "vision/vision.md": "# Salesforce Sales Cloud and Service Cloud · AI vision\n\n> Illustrative. The product manager's answers in this file are invented to show how `/ai-product-vision` works, tagged `[PM, illustrative]`. Market and product facts cite the other files in this folder.\n\n**Today:** level 4, AI Delegated. Agentforce agents resolve service conversations and work leads end to end, with named customers reporting results (`market-map.md`, `ai-levels.md`).\n**Where we're going:** level 5, AI Domain Intelligence, by the end of 2028. `[PM, illustrative]`\n\n## The vision\n\nBy the end of 2028, Sales Cloud keeps every deal up to date on its own and tells each sales team what is working in deals like theirs. Sales managers stop chasing updates and building forecasts in spreadsheets. They spend that time coaching on the deals that matter. `[PM, illustrative]`\n\n## Imagine\n\n*Illustrative sketches, not plans. They show what each level could mean for this product.*\n\n### Our product at each level\n\n| Level | Already there | Our product at this level |\n|---|---|---|\n| 5 AI Domain Intelligence | **Harvey**: legal research and drafting for law firms [https://www.harvey.ai/]. **OpenEvidence**: answers doctors' questions from the medical literature, with citations [https://www.kleinerperkins.com/perspectives/openevidence-expanding-the-worlds-collective-medical-knowledge/] | Sales Cloud knows how deals move across thousands of companies that opt in. A sales manager opens a deal and sees: \"Deals like this, at companies your size, close in 74 days when security review starts before the pricing call. Yours hasn't started.\" Forecasts come with a range and the reasons behind it. Customers pay a yearly subscription for benchmarks, on top of their seats. |\n| 6 System of Understanding | **Waymo**: an autonomous ride-hailing service, no one at the wheel [https://waymo.com/]. **Tempus**: combines clinical and molecular data to guide cancer care [https://d3.harvard.edu/platform-digit/submission/tempus-ai-data-driven-precision-medicine/] | Sales Cloud understands how a company's revenue is made: which accounts are ready to buy, which customers are drifting, what each team can deliver this quarter. It plans the quarter, routes the work to agents and people, and adjusts as deals move. The VP of sales sets the goals and makes the calls only people can make. Customers pay for revenue outcomes, such as pipeline created and deals closed, not seats. |\n\n### A day with our System of Understanding\n\nPriya runs a 25-person sales team at a mid-size software company, in 2031.\n\nAt 7:40 she opens Slack. Overnight, Sales Cloud has read every email, call and contract change. It moved three deals forward, and pulled one back because the buyer's champion changed jobs last week. Nobody told it; it noticed the email bounce and the new LinkedIn title. It has already found the new contact and drafted an introduction for the rep to send.\n\nHer forecast is done. It doesn't ask her for a number. It shows the range it expects, based on her team's deals and thousands like them, and the two deals that decide the quarter. Priya disagrees on one; she knows the CFO personally. She overrides it and says why. It remembers.\n\nShe never chases a rep for an update again, and never exports pipeline to a spreadsheet. The Monday pipeline call is gone. In its place: one hour with the two reps whose deals look like ones that usually slip in week 10, working out what to do differently.\n\nAt 4 pm it flags that a large customer's support cases tripled this month and their renewal is in 90 days. It has already booked time with the account team. Priya spends her day on the people and the judgement calls. The record keeps itself.\n\n**What excites us:** the forecast call disappears, and managers coach instead of chase. `[PM, illustrative]`\n**What it would need to know, and the data that takes:** how deals actually move across many companies, which takes customers' permission to learn from their anonymised data. It would also need signals from outside the CRM, such as job changes and support volume, joined to the deal. `[PM, illustrative]`\n\n## Built on\n\n- **The deal record that keeps itself:** Do first, 4.35 (`opportunities.md` #1). The foundation: benchmarks are only as good as the records.\n- **The forecast without the spreadsheet:** Strong option, 3.55 (`opportunities.md` #4).\n- **\"Deals like yours\": opt-in benchmarks:** Worth watching, 2.85 (`opportunities.md` #6). This is the level 5 step; it's rated low today because Salesforce doesn't yet have permission to learn across customers. The first step tests exactly that.\n\n## For whom\n\n| Persona | The problem it removes | What changes in their day |\n|---|---|---|\n| Sales manager or VP of sales | Forecasts built from what reps remember to type in, rolled up in spreadsheets (`opportunities.md` steps 3–4) | No weekly roll-up; time goes to coaching on the deals most likely to slip `[PM, illustrative]` |\n| Account executive | Most of the week spent on non-selling work, including data entry (`opportunities.md` #1) | Approves a short list of record changes instead of typing them `[PM, illustrative]` |\n\n## What AI takes over\n\n| Workflow | Today | Tomorrow |\n|---|---|---|\n| Opportunity to close: keeping deals current and forecasting | Reps log activities and update stages by hand; managers chase updates and roll up the forecast in spreadsheets (`opportunities.md` steps 3–4) | Agents capture every activity and update deals; the forecast drafts itself with reasons and benchmarks. People decide the commit, the strategy and anything the agent flags as unsure `[PM, illustrative]` |\n\n## Why us\n\n- Years of pipeline, activity and case history across Salesforce's customers (`../product.md`).\n- Agents already working at level 4 in both sales and service, with customer results (`ai-levels.md`).\n- Data 360 to join outside signals to the deal, and Headless 360, Slack and the ChatGPT app to show up where sellers work (`../product.md`, `market-moves.md`).\n- Distribution: sellers and managers already live in Sales Cloud. `[PM, illustrative]`\n\n## The opening\n\nLevel 5 is empty for everyone on the map, and level 4 is thin on the sales side: Salesforce's own lead agent, Microsoft's lead qualification agent and Clay's research agents (`market-map.md`).\n\n## Others moving this way\n\n| Who | At which level | What makes our vision different |\n|---|---|---|\n| Clari | Not placed; a forecasting tool on top of the CRM (`market-moves.md`) | We own the record it forecasts from; when the record keeps itself, the forecast lives where the deal does |\n| Day.ai | 3 (`market-map.md`) | Captures activity well for new teams; we bring years of history and benchmarks across many companies |\n| Microsoft Dynamics 365 and 365 Copilot | 4 and 3 (`market-map.md`) | Strong in Outlook and Teams; we aim at the forecast and benchmarks, not just the inbox |\n| Clay | 4 (`market-map.md`) | Strong at research before the deal; we cover the deal from first meeting to close |\n\n## What customers would pay for\n\nIf an agent sat on top of our data tomorrow, customers would stop paying for seats that exist mainly to type into the CRM, and for separate tools that capture activity or roll up the forecast (`market-moves.md`). They would pay instead for a forecast they trust and for benchmarks they can't get anywhere else: a yearly subscription per sales team, priced on pipeline managed, not seats. `[PM, illustrative]`\n\n## First step\n\nRun a pilot of \"the deal record that keeps itself\" with 10 Sales Cloud customers, with the rep-confirmed changes feeding the manager's forecast brief (the experience to explore first in `../research/experiences.md`, built as the flows in `../flows/flows.md`). Measure the share of agent-proposed updates reps accept without editing, and the hours saved per rep. In the same interviews, ask 20 sales leaders the opt-in question: would they share anonymised deal data to get benchmarks back, and on what terms? `[PM, illustrative]`\n\n## Open questions\n\n- Will customers give permission to learn across their data, and under what guarantees?\n- How accurate do automatic updates need to be before reps stop checking them?\n- How does this sit next to Clari and Gong, which many customers already pay for?\n- Does pricing on pipeline managed undercut seat revenue faster than it grows new revenue?\n"}, "assets": ["flows/mockups/forecast-brief.html", "flows/mockups/rep-confirm.html", "vision/market-map.html"]}</script>

    if(fl.thinnest) add(sfl, el("p","lead","Thinnest version: "+fl.thinnest));

  (fl && fl.flows || []).filter(function(f){ return (f.steps||[]).length; }).forEach(function(f,fi){
    var sm2 = slide("flow-"+(fi+1),"Flows","Flow: "+f.name,f.name,["flows/flows.md"], true);

      f.steps.forEach(function(s2,k){

    add(smk, gm, el("p","muted","Mockups for testing flows, not the product."));
  } else add(smk, todo("/ai-product-flows"));

  var hasFb = !!(fl && (fl.panel || fl.customers));

    [["Customer saves a year",rm.customer_saves],["Their return",rm.customer_return],["New revenue per customer",rm.revenue_per_customer],["Across customers",rm.revenue_total]].forEach(function(k){ if(!k[1]) return; var c=el("div","card"); add(c, el("div","eyebrow",k[0]), el("span","score",k[1])); add(gr,c); });

    if(rm.price){ var pc=el("div","card"); add(pc, el("div","eyebrow","How we charge"), el("p",null,rm.price), rm.price_why ? el("p","muted",rm.price_why) : null); add(sro,pc); }

  var hasHz = !!(rm && rm.horizons);

    add(shz, gh);

  add(slides[slides.length-1], el("footer",null,"Built from the files in the product's folder"+(d.updated?" on "+d.updated:"")+". The files are the source; this deck shows them."));

  slides.forEach(function(s){ s.querySelectorAll(".card,.stair").forEach(function(c,k){ if(!c.style.getPropertyValue("--i")) c.style.setProperty("--i",k); }); s.querySelectorAll(".ebar").forEach(function(b){ b.querySelectorAll(".seg").forEach(function(sg,k){ sg.style.setProperty("--i",k); }); }); });

  Object.keys(groups).forEach(function(k){ if(k!=="Overview") add(groups[k].h, el("span",null,groups[k].done+"/"+groups[k].n)); });

  // navigation
  var shell=document.getElementById("shell"), menu=document.getElementById("menu"), scroll=document.getElementById("scroll"), cur=0;
  var prev=document.getElementById("prev"), next=document.getElementById("next");
  function go(i){
    cur=Math.max(0,Math.min(slides.length-1,i));
    slides.forEach(function(s,k){ s.classList.toggle("on",k===cur); if(k===cur) items[k].setAttribute("aria-current","page"); else items[k].removeAttribute("aria-current"); });
    var s=slides[cur];
    document.getElementById("cgroup").textContent=s.dataset.group;
    document.getElementById("ctitle").textContent=s.dataset.label;
    document.getElementById("count").textContent=(cur+1)+" / "+slides.length;
    prev.disabled=cur===0; next.disabled=cur===slides.length-1;
    document.getElementById("prevname").textContent=cur>0?slides[cur-1].dataset.label:"";

    try{ history.replaceState(null,"","#"+s.id); }catch(e){}

  prev.onclick=function(){ go(cur-1); }; next.onclick=function(){ go(cur+1); };
  document.addEventListener("keydown",function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(reader.classList.contains("open")){ if(e.key==="Escape") closeReader(); return; }
    if(e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); go(cur+1); }
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(cur-1); }
    if(e.key==="Escape"){ closeMenu(); closeReader(); }
  });
  var start=slides.findIndex(function(s){ return "#"+s.id===location.hash; }); go(start<0?0:start);
})();
