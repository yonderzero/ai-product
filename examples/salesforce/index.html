<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: a document viewer. A quiet left sidebar groups every section (Start, Vision, Discovery) with a status dot;
   one content column shows the current section; a Previous / Next up bar sits at the bottom.
   Depth comes from a ladder of surfaces and hairline borders, never shadows. One accent. */
:root{
  --canvas:#f7f7f8; --surface-1:#ffffff; --surface-2:#f0f1f3; --surface-3:#e8e9ec;
  --hairline:#e3e4e8; --hairline-strong:#d2d4da;
  --ink:#16171a; --ink-muted:#3d4048; --ink-subtle:#6b6f78; --ink-tertiary:#9a9ea6;
  --accent:#5e6ad2; --accent-soft:#eceefb; --on-accent:#ffffff;
  --good:#1f9d45; --risk:#d1453b; --risk-soft:#fbeceb;
  --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --side:264px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#08090a; --surface-1:#0f1011; --surface-2:#141516; --surface-3:#1b1c1e;
  --hairline:#23252a; --hairline-strong:#34343a;
  --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d;
  --accent:#828fff; --accent-soft:#1c1e33; --on-accent:#0b0c1a;
  --good:#27a644; --risk:#f07a6e; --risk-soft:#2a1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#08090a; --surface-1:#0f1011; --surface-2:#141516; --surface-3:#1b1c1e;
  --hairline:#23252a; --hairline-strong:#34343a;
  --ink:#f7f8f8; --ink-muted:#d0d6e0; --ink-subtle:#8a8f98; --ink-tertiary:#62666d;
  --accent:#828fff; --accent-soft:#1c1e33; --on-accent:#0b0c1a;
  --good:#27a644; --risk:#f07a6e; --risk-soft:#2a1715; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
.side{background:var(--surface-1);border-right:1px solid var(--hairline);display:flex;flex-direction:column;min-height:0;padding-block:16px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:grid;gap:2px;padding:6px 10px 14px;border-bottom:1px solid var(--hairline);margin-bottom:10px}
.brand .kicker{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.brand .name{font-weight:600;font-size:16px;letter-spacing:-.2px;line-height:1.25;overflow-wrap:anywhere}
.brand .sub{font-size:12px;color:var(--ink-subtle)}
nav{overflow:auto;display:grid;gap:14px;align-content:start;padding-bottom:8px}
.group{display:grid;gap:1px}
.group h4{margin:0 0 4px;padding:0 10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);display:flex;justify-content:space-between}
.group h4 span{color:var(--ink-tertiary)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;font-size:14px;color:var(--ink-muted);cursor:pointer}
.item:hover{background:var(--surface-2);color:var(--ink)}
.item[aria-current="page"]{background:var(--surface-3);color:var(--ink);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--ink-tertiary)}
.dot.done{background:var(--good);border-color:var(--good)}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--hairline);font-size:12px;color:var(--ink-subtle);display:grid;gap:4px}
.side .foot kbd{font:500 11px var(--mono);border:1px solid var(--hairline-strong);border-radius:4px;padding:0 4px}

/* main */
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid var(--hairline);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-size:13px;color:var(--ink-subtle);min-width:0}
.top .crumb{display:flex;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink);font-weight:500}
.top .count{margin-left:auto;font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.menu{display:none;border:1px solid var(--hairline);background:var(--surface-1);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.scroll{overflow:auto;min-width:0}
.slide{max-width:960px;margin:0 auto;padding-block:40px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:24px;align-content:start;min-width:0}
.slide>*{min-width:0}
.slide:not(.on){display:none}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--hairline);padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface-1)}
.step{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-width:0}
.step:hover:not(:disabled){background:var(--surface-2)}
.step:disabled{visibility:hidden}
.step.next{justify-content:flex-end;text-align:right}
.step small{display:block;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-subtle)}
.step span{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .arrow{font-size:16px;color:var(--ink-subtle)}

/* content */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,56px);font-weight:600;letter-spacing:-1.6px;line-height:1.08}
h2{font-size:28px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
h3{font-size:15px;font-weight:600;letter-spacing:-.1px}
p{margin:0;max-width:68ch}
.eyebrow{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.head{display:grid;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--hairline)}
.src{font:400 12px var(--mono);color:var(--ink-subtle);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--ink-muted)}
.lead{font-size:18px;line-height:1.55;color:var(--ink-muted);max-width:66ch}
.muted{color:var(--ink-subtle)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-subtle)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--hairline);font-size:12px;color:var(--ink-muted)}
.todo{border:1px dashed var(--hairline-strong);border-radius:12px;padding:22px;color:var(--ink-subtle);display:grid;gap:6px}
.todo code{font-family:var(--mono);color:var(--ink);background:var(--surface-2);padding:1px 6px;border-radius:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.dir{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hz{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:12px;padding:18px;display:grid;gap:8px;align-content:start;min-width:0}
ul,ol{margin:0;padding-left:18px} li{margin:3px 0}
.statement{font-size:clamp(22px,3vw,28px);line-height:1.3;font-weight:500;letter-spacing:-.4px;max-width:44ch;border-left:2px solid var(--accent);padding-left:18px}

/* levels */
.stairs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
.stair{background:var(--surface-1);border:1px solid var(--hairline);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.stair .n{font:500 11px var(--mono);color:var(--ink-subtle)}
.stair .nm{font-weight:600;font-size:13px;line-height:1.25}
.tag{display:inline-block;justify-self:start;font:500 11px/1.5 var(--mono);padding:0 8px;border-radius:10px;max-width:100%;overflow-wrap:anywhere}
.tag.today{background:var(--surface-3);color:var(--ink)}
.tag.target{background:var(--accent);color:var(--on-accent)}
.chip{font-size:12px;border-radius:4px;padding:2px 6px;background:var(--surface-2);overflow-wrap:anywhere;color:var(--ink-muted)}
.chip.us{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:820px){.stairs{grid-template-columns:1fr}.stair{min-height:0!important}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--hairline);border-radius:12px;background:var(--surface-1)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--hairline);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.band{font:500 11px var(--mono);padding:2px 8px;border-radius:999px;white-space:nowrap}
.band.do{background:var(--accent);color:var(--on-accent)} .band.strong{background:var(--accent-soft);color:var(--accent)} .band.watch{background:var(--surface-2);color:var(--ink-subtle)}

/* pillars and move */
.pillars{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.score{font:500 30px var(--mono);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.score small{font-size:14px;color:var(--ink-subtle)}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent)}
.meter.risk b{background:var(--risk)}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;max-width:560px;font-size:14px}
.quad div{padding:16px;border-radius:10px;background:var(--surface-1);border:1px solid var(--hairline);min-width:0;color:var(--ink-subtle)}
.quad .ax{background:none;border:0;padding:6px;font:500 11px var(--mono);color:var(--ink-subtle);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center}
.card.chosen{border-color:var(--accent);background:var(--accent-soft)}
.econ{display:grid;gap:10px}
.erow{display:grid;grid-template-columns:110px minmax(0,1fr) 70px;gap:12px;align-items:center}
.elab{font-size:13px;color:var(--ink-subtle)}
.etot{font:500 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.ebar{display:flex;height:28px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.seg{display:block;height:100%}
.seg-l,.sw.seg-l{background:var(--ink-tertiary)}
.seg-a,.sw.seg-a{background:var(--accent)}
.seg-p,.sw.seg-p{background:var(--risk)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
/* motion: everything rests visible; slides animate in when opened */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes travel{from{left:0}to{left:calc(100% - 8px)}}
.slide.on .card,.slide.on .stair,.slide.on .step-box,.slide.on .lane-cell .node{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.slide.on .seg{transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 160ms)}
/* experiences: today vs with agents */
.xp{display:grid;gap:14px}
.xp-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center}
.xp-lab{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step-box{font-size:12.5px;line-height:1.3;padding:7px 10px;border-radius:8px;border:1px solid var(--hairline);background:var(--surface-1);max-width:220px}
.step-box.person{border-color:color-mix(in srgb,var(--risk) 45%,var(--hairline));background:var(--risk-soft)}
.step-box.agent{border-color:color-mix(in srgb,var(--accent) 55%,var(--hairline));background:var(--accent-soft)}
.step-box.check{border-style:dashed}
.arrow-sm{color:var(--ink-tertiary);font-size:12px}
.xp-card{display:grid;gap:12px}
/* flow map: swimlanes */
.lanes{overflow-x:auto;border:1px solid var(--hairline);border-radius:12px;background:var(--surface-1)}
.lane-grid{display:grid;grid-template-columns:96px repeat(var(--n),minmax(150px,1fr));min-width:calc(96px + var(--n) * 150px)}
.lane-head{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);padding:10px 12px;border-bottom:1px solid var(--hairline);background:var(--surface-2)}
.lane-name{font:500 12px var(--mono);color:var(--ink-muted);padding:14px 12px;border-right:1px solid var(--hairline);display:flex;align-items:center}
.lane-cell{position:relative;padding:12px 10px;border-bottom:1px solid var(--hairline);min-height:84px;display:flex;align-items:center}
.lane-row-last .lane-cell,.lane-row-last.lane-name{border-bottom:0}
.node{width:100%;font-size:12.5px;line-height:1.35;padding:8px 10px;border-radius:8px;border:1px solid var(--hairline)}
.node.agent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--hairline))}
.node.person{background:var(--risk-soft);border-color:color-mix(in srgb,var(--risk) 45%,var(--hairline))}
.node.exc{border-style:dashed;background:var(--surface-2)}
.lane-cell.has:not(.last)::after{content:"→";position:absolute;right:-7px;top:50%;transform:translateY(-50%);color:var(--ink-tertiary);font-size:13px;z-index:1}
.track{position:relative;height:3px;margin:0 12px 12px 108px;background:var(--surface-3);border-radius:3px}
.track i{position:absolute;top:-2.5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.slide.on .track i{animation:travel 3.2s linear infinite}
@media (prefers-reduced-motion:reduce){.slide.on *{animation:none!important}}
/* reader: the full markdown files, inside the deck */
.reader{position:fixed;inset:0 0 0 auto;width:min(760px,94vw);z-index:40;background:var(--surface-1);border-left:1px solid var(--hairline);display:grid;grid-template-rows:auto minmax(0,1fr);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.7,.2,1);padding-right:env(safe-area-inset-right,0px)}
.reader.open{transform:none}
.reader-scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35)}
.reader-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--hairline);min-width:0}
.reader-top .path{font:500 12px var(--mono);color:var(--ink-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.reader-top .sp{margin-left:auto}
.reader-top a,.reader-top button{font:500 13px var(--sans);border:1px solid var(--hairline);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.md{overflow:auto;padding:24px 28px 48px;font-size:14.5px;line-height:1.6;min-width:0}
.md h1{font-size:26px;letter-spacing:-.5px;margin:0 0 14px}.md h2{font-size:19px;margin:28px 0 10px}.md h3{font-size:15.5px;margin:22px 0 8px}
.md p,.md ul,.md ol{margin:0 0 12px}.md li{margin:3px 0}
.md table{display:block;overflow-x:auto;border-collapse:collapse;margin:0 0 16px;font-size:13px;max-width:100%}
.md th,.md td{border:1px solid var(--hairline);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2);font-weight:600}
.md code{font:12.5px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{background:var(--surface-2);padding:12px;border-radius:8px;overflow-x:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 12px;padding:2px 14px;border-left:2px solid var(--accent);color:var(--ink-muted)}
.md hr{border:0;border-top:1px solid var(--hairline);margin:20px 0}
.src a.embedded{cursor:pointer}
/* library */
.lib{display:grid;gap:18px}
.lib-group h3{margin-bottom:8px}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 12px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface-1);margin-bottom:6px}
.lib-row .t{font-weight:500}.lib-row .p{font:400 12px var(--mono);color:var(--ink-subtle);overflow-wrap:anywhere}
.lib-row .acts{display:flex;gap:8px;font-size:13px;white-space:nowrap}
.lib-row button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font:inherit}
.quad .on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
footer{color:var(--ink-subtle);font-size:12px;border-top:1px solid var(--hairline);padding-top:14px}

/* phone: sidebar becomes a drawer */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s;padding-top:max(16px,env(safe-area-inset-top,0px))}
  .shell.open .side{transform:none}
  .shell.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
  .menu{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Sections">
    <div class="brand"><span class="kicker">ai-product</span><span class="name" id="bname">[Product]</span><span class="sub" id="bsub"></span></div>
    <nav id="nav"></nav>
    <div class="foot"><span><kbd>←</kbd> <kbd>→</kbd> to move between sections</span><span id="updated"></span></div>
  </aside>
  <div class="main">
    <div class="top">
      <button type="button" class="menu" id="menu" aria-controls="side" aria-expanded="false">Sections</button>
      <div class="crumb"><span id="cgroup"></span><span>/</span><b id="ctitle"></b></div>
      <span class="count" id="count"></span>
    </div>
    <div class="scroll" id="scroll"><div id="app"></div></div>
    <div class="bottom">
      <button type="button" class="step" id="prev"><span class="arrow">←</span><span><small>Previous</small><span id="prevname"></span></span></button>
      <button type="button" class="step next" id="next"><span><small>Next up</small><span id="nextname"></span></span><span class="arrow">→</span></button>
    </div>
  </div>
</div>

<div class="reader" id="reader" aria-hidden="true"><div class="reader-top"><span class="path" id="rpath"></span><span class="sp"></span><a id="ropen" href="#" target="_blank" rel="noopener">Open file</a><button type="button" id="rclose">Close</button></div><div class="md" id="rbody"></div></div>

<script type="application/json" id="files">{"files": {"README.md": "# Worked example: Salesforce Sales Cloud and Service Cloud\n\n> **Illustrative example built from public sources on 27 Oct 2026. Not affiliated with or endorsed by Salesforce. The product manager's answers, the vision, the personas and the panel are invented to show how the skills work. Salesforce, Sales Cloud, Service Cloud, Einstein and Agentforce are trademarks of Salesforce, Inc.**\n\nThis folder shows what a product manager has after running all seven skills, in order, with Salesforce Sales Cloud and Service Cloud as the product:\n\n1. `/ai-product-start` builds a sourced profile of the product and its customers.\n2. `/ai-product-vision` places the product's AI features on six levels, from System of Record to System of Understanding, maps the market and who is moving in, ranks opportunities and turns them into a vision.\n3. `/ai-product-discovery` scores what protects the product (3.67), how strong it is (3.83), the AI opportunity (5.0) and the exposure (2.64), with AI urgency immediate; checks readiness, maps where value flows, and chooses the move: Build on it.\n4. `/ai-product-problem` says the problem as a customer job, grades the evidence, thinks bigger with a BHAG and picks the right problem from three framings: sales managers can't see where every deal stands without chasing reps.\n5. `/ai-product-research` goes deep on each customer type, defines the ideal customer, builds four synthetic personas, works out the double cost (licence plus people's time), uncovers five agentic customer experiences and picks one to explore first: the forecast call without the chase.\n6. `/ai-product-flows` maps each experience as a flow, makes the flows to take forward clickable, tests them with the synthetic panel in two rounds, and chooses the right flows: the rep confirms the deal, and the manager's forecast brief is built only from what reps confirmed.\n7. `/ai-product-roadmap` turns those flows into prioritised features, works out the ROI for a typical customer and for Salesforce, chooses the price ($45 a user a month), and lays out Now, Next and Later toward the vision and the BHAG, with the build-day slice for developers.\n\nFacts come from public pages cited by URL. Anything a real product manager would have supplied is tagged `[PM, illustrative]`. There is no `documents/` folder and there are no real customer interviews: the panel is synthetic, and its results are hypotheses, not evidence.\n\n## Files\n\n**Open this first:** [`index.html`](index.html), the deck. Every section, from the product to the roadmap, with links to the files behind it.\n\nAt the top:\n\n- [`product.md`](product.md): the product profile: company, customers and personas, workflows, pricing, competitors, data and AI today, and the idea in mind, including this product update.\n\nFrom `/ai-product-vision`, in [`vision/`](vision/):\n\n- [`vision/ai-levels.md`](vision/ai-levels.md): the value at each AI level; level today is 4, AI Delegated.\n- [`vision/market-map.md`](vision/market-map.md): 14 companies placed on the six levels.\n- [`vision/market-map.html`](vision/market-map.html): the same map as a page.\n- [`vision/market-moves.md`](vision/market-moves.md): who is moving into the market, and what that opens up.\n- [`vision/opportunities.md`](vision/opportunities.md): the sales and service work as nine steps, then six opportunities, ranked.\n- [`vision/vision.md`](vision/vision.md): level 5 by the end of 2028, what each higher level could look like, and a first step.\n\nFrom `/ai-product-discovery`, in [`discovery/`](discovery/):\n\n- [`discovery/protection.md`](discovery/protection.md): what protects the product; 3.67 out of 5.\n- [`discovery/strength.md`](discovery/strength.md): business quality, customer strength and the AI opportunity; strength 3.83, AI opportunity 5.0, urgency immediate.\n- [`discovery/exposure.md`](discovery/exposure.md): 11 risks; 2.64 overall.\n- [`discovery/value.md`](discovery/value.md): where value flows today, where it leaks, where it would flow at level 5, and how to charge.\n- [`discovery/discovery.md`](discovery/discovery.md): the one page: where to take the product, the four pillars, the move, readiness and where value flows.\n\nFrom `/ai-product-problem`, in [`problem/`](problem/):\n\n- [`problem/evidence.md`](problem/evidence.md): what backs the problem, graded with the Mom Test.\n- [`problem/framings.md`](problem/framings.md): the job, the pressure test, the BHAG, the job map and three sized framings.\n- [`problem/problem.md`](problem/problem.md): the right problem, the opportunity, and the riskiest assumptions as questions.\n\nFrom `/ai-product-research`, in [`research/`](research/):\n\n- [`research/evidence.md`](research/evidence.md): the evidence map from public first-hand sources, with what's missing.\n- [`research/market.md`](research/market.md): the problem in each persona's words, and the options customers have today.\n- [`research/icp.md`](research/icp.md): the ideal customer: a mid-market B2B software company with about 25 account executives on Sales Cloud.\n- [`research/personas/`](research/personas/): Priya (VP of sales, buyer), Marcus (account executive, user), Elena (revenue operations, sceptic) and Sam (financial advisor, adjacent).\n- [`research/experiences.md`](research/experiences.md): the double cost, five agentic customer experiences, the new economics, and the one to explore first.\n- [`research/panel.md`](research/panel.md): the synthetic panel on the problem and the experiences.\n\nFrom `/ai-product-flows`, in [`flows/`](flows/):\n\n- [`flows/flows.md`](flows/flows.md): the five flows, moment by moment, ranked on value, trust, pay and hours given back; the two to take forward and their thinnest version.\n- [`flows/mockups/rep-confirm.html`](flows/mockups/rep-confirm.html): clickable mockup of the rep confirming a deal.\n- [`flows/mockups/forecast-brief.html`](flows/mockups/forecast-brief.html): clickable mockup of the manager's forecast brief.\n- [`flows/panel-tests.md`](flows/panel-tests.md): two panel rounds, the price vote, and what public first-hand sources say about similar flows.\n- [`flows/script.md`](flows/script.md): the interview kit for real customers.\n\nFrom `/ai-product-roadmap`, in [`roadmap/`](roadmap/):\n\n- [`roadmap/features.md`](roadmap/features.md): ideas, features prioritised with the working, this product update and the build-day slice.\n- [`roadmap/roi.md`](roadmap/roi.md): the ROI for a typical customer (a $239,400 saving a year, 51%) and for Salesforce, and the pricing choice.\n- [`roadmap/roadmap.md`](roadmap/roadmap.md): Now, Next and Later, toward the vision and the BHAG.\n\nPlacements and prices are a snapshot from public sources on 27 Oct 2026. Check the ones you act on.\n", "product.md": "# Salesforce Sales Cloud and Service Cloud\n\n> Illustrative example built from public sources on 27 Oct 2026. Not affiliated with or endorsed by Salesforce. Anything tagged `[PM, illustrative]` is invented to show what a product manager would add.\n\n- company: Salesforce, Inc. Founded 1999, headquartered at Salesforce Tower, San Francisco. Listed on the NYSE as CRM. About 83,000 employees (2026). [https://en.wikipedia.org/wiki/Salesforce]\n- industry: CRM software. Niche: sales and customer service platforms for mid-market and enterprise companies, with entry plans for small businesses. [https://www.salesforce.com/sales/pricing/]\n- links:\n  - Sales Cloud: https://www.salesforce.com/sales/\n  - Service Cloud: https://www.salesforce.com/service/\n  - Sales pricing: https://www.salesforce.com/sales/pricing/\n  - Service pricing: https://www.salesforce.com/service/pricing/\n  - Agentforce pricing: https://www.salesforce.com/agentforce/pricing/\n  - Latest results (Q2 fiscal 2027): https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx\n- team: a product manager for Sales Cloud and Service Cloud, working with an engineering lead and a designer `[PM, illustrative]`\n\n## What it does\n\nSales Cloud keeps a company's accounts, contacts, leads and deals in one place. Sellers track their pipeline, managers forecast revenue, and leaders manage quotas and commissions. It captures calls, emails and meetings, and connects to quoting, contracts and billing. [https://www.salesforce.com/sales/]\n\nService Cloud runs customer service. It manages cases, knowledge articles and assets, connects voice and digital channels in a contact center, and covers field service. [https://www.salesforce.com/service/]\n\nBoth now ship with AI agents under the Agentforce name. They qualify leads, answer customers and resolve cases. Since September 2026 the range also includes Fin (formerly Intercom), a customer service agent Salesforce acquired. [https://www.salesforce.com/news/press-releases/2026/09/10/salesforce-completes-acquisition-of-fin/]\n\n## Customers\n\n- ideal customer and personas: a mid-market B2B software company with about 25 account executives on Sales Cloud; personas Priya (VP of sales, buyer), Marcus (account executive, user), Elena (revenue operations, sceptic) and Sam (financial advisor, adjacent). See `research/`. `[PM, illustrative]`\n- customer types: B2B and B2C companies that sell through a sales team and support customers through a service team. They range from small businesses on the Starter and Pro plans to large enterprises on Core, Advanced and Max. [https://www.salesforce.com/sales/pricing/]\n- named customers in recent stories include Engine (travel booking), 1-800Accountant, OpenTable, Datasite, Formula 1 and Texas DPS. [https://www.salesforce.com/customer-stories/engine/agentic-service/] [https://www.salesforce.com/news/stories/agentforce-customer-success-stories/] [https://www.salesforce.com/service/]\n\n### Account executive at a mid-market B2B company\n\n- who they are: a quota-carrying seller at a software or services company with a few hundred employees. A user, not the buyer. `[PM, illustrative]`\n- what they're trying to get done: work the right deals, prepare for meetings, move opportunities forward and hit quota.\n- the problems this product solves for them: one view of each account and its history; deal tracking that flags risk before a deal stalls. [https://www.salesforce.com/sales/]\n- how they handled it before, or would without the product: spreadsheets, inbox folders and memory, or a lighter CRM. `[PM, illustrative]`\n- what still frustrates them: reviewers report a steep learning curve and say some setups still need admin help. [https://g2.com/products/salesforce-crm/reviews] Research before calls takes time: Carnegie Learning reported rep research falling from up to an hour to 5–10 minutes once an agent did it, which shows how long it took before. [https://www.salesforce.com/news/stories/agentforce-customer-success-stories/]\n\n### Sales manager or VP of sales\n\n- who they are: leads a team of 8–40 sellers. Often the buyer, together with revenue operations. `[PM, illustrative]`\n- what they're trying to get done: a forecast leadership can trust, healthy pipeline coverage, and coaching that improves win rates.\n- the problems this product solves for them: forecasting from live deal data, quota and commission tracking, performance data for coaching. [https://www.salesforce.com/sales/]\n- how they handled it before: weekly pipeline calls and forecast roll-ups in spreadsheets. `[PM, illustrative]`\n- what still frustrates them: a forecast is only as good as what reps type in. `[PM, illustrative]` Licence and add-on costs rise as needs grow. [https://g2.com/products/salesforce-crm/reviews]\n\n### Salesforce admin or revenue operations lead\n\n- who they are: configures Salesforce, builds reports and flows, manages permissions and data quality. Influences the purchase; often owns the renewal. `[PM, illustrative]`\n- what they're trying to get done: keep the system matching how the business sells and serves, with clean data and working reports.\n- the problems this product solves for them: one configurable platform for sales and service data, workflows and reporting. [https://www.salesforce.com/sales/]\n- how they handled it before: separate tools stitched together, or custom code. `[PM, illustrative]`\n- what still frustrates them: reviewers single out permission setup and advanced automation and reporting as hard. [https://g2.com/products/salesforce-crm/reviews] Capterra reviewers are mostly negative on value for money and point to extra costs for features, support and storage. [https://capterra.com/p/61368/Salesforce/reviews/]\n\n### Customer service rep and service manager\n\n- who they are: reps answering customers by chat, email and phone, and the manager who runs the team. The manager or head of service buys; reps use. `[PM, illustrative]`\n- what they're trying to get done: resolve cases fast and well, keep satisfaction up and cost per case down.\n- the problems this product solves for them: cases, knowledge and channels in one console; AI agents that take routine questions. Engine's agent resolves half of incoming chat cases and hands the rest to a rep with the history attached. [https://www.salesforce.com/customer-stories/engine/agentic-service/]\n- how they handled it before: shared inboxes, phone queues and a helpdesk tool. `[PM, illustrative]`\n- what still frustrates them: getting set up depends on consultants, according to reviewers. [https://capterra.com/p/136189/Salesforce/reviews/] Complex cases still need people: Engine's agent hands off large group rebookings to a rep. [https://www.salesforce.com/customer-stories/engine/agentic-service/]\n\n## Main workflows\n\n- Lead to qualified opportunity: capture, score, contact, qualify, book a meeting. Agentforce Engagement (formerly the SDR agent) now does much of this on its own. [https://help.salesforce.com/s/articleView?id=sales.sales_agent_sdr_parent.htm&language=en_US&type=5]\n- Opportunity to close: account research, meetings, activity logging, deal updates, forecast. [https://www.salesforce.com/sales/]\n- Case intake to resolution: a customer asks on any channel; an agent or rep answers, acts and closes the case. [https://www.salesforce.com/service/]\n- Admin and reporting: configuration, permissions, reports and dashboards. [https://g2.com/products/salesforce-crm/reviews]\n\n## What customers love / complain about\n\n- love: centralised data, automation and flexibility to customise (G2's summary of 25,000+ reviews, rated 4.4). [https://g2.com/products/salesforce-crm/reviews] Sales and activity tracking is the most praised feature on Capterra. [https://capterra.com/p/61368/Salesforce/reviews/]\n- complain: complexity and a steep learning curve; cost and add-ons; storage pricing; some integration gaps that cause double entry. [https://g2.com/products/salesforce-crm/reviews] [https://capterra.com/p/61368/Salesforce/reviews/]\n\n## Pricing and market\n\n- Sales Cloud and Service Cloud list prices, per user per month, billed annually: Starter Suite $25, Pro Suite $100, Core $195, Advanced $395, Max $550 (Max includes the full Agentforce suite and 2.75M Flex Credits per org per year). [https://www.salesforce.com/sales/pricing/] [https://www.salesforce.com/service/pricing/]\n- Agentforce: add-ons for Sales or Service at $125 per user per month; Flex Credits at $500 per 100,000 credits (an action costs 20 credits, about $0.10); or $2 per conversation for customer-facing agents. [https://www.salesforce.com/agentforce/pricing/]\n- Agentforce Help Agent, launched June 2026, charges only when the agent resolves an issue on its own; trade press reports $2 per resolution. [https://www.cxnetwork.com/cx-experience/news/salesforce-launches-pay-per-resolution-agent/amp] [https://communicateonline.me/news/salesforce-launches-agentforce-help-agent-with-pay-per-resolution-pricing/]\n- Company revenue was $41.5B in fiscal 2026 (to Jan 2026). [https://en.wikipedia.org/wiki/Salesforce] Q2 fiscal 2027 revenue was $11.3B, up 11%. Agentforce annual recurring revenue passed $1.5B, now counting Slackbot and Headless 360. Sales and Service are not reported separately. [https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx]\n- Salesforce says it has led Gartner's Magic Quadrant for CRM sales platforms for 20 years in a row. [https://www.salesforce.com/sales/]\n\n## Competitors and alternatives\n\n- Incumbents: Microsoft Dynamics 365, HubSpot, Oracle Fusion CX, SAP Sales and Service Cloud, Zoho CRM, ServiceNow Customer Service Management. See `vision/market-map.md`.\n- AI-native: Sierra and Decagon in service; Attio, Day.ai and Lightfield as AI-first CRMs; Clay for sales research. See `vision/market-map.md` and `vision/market-moves.md`.\n- Tools on top: Gong (call recording), Clari (forecasting), Zapier (moving data between systems). See `vision/market-moves.md`.\n- Doing nothing: spreadsheets and shared inboxes, mostly in smaller teams. `[PM, illustrative]`\n\n## Data and tech\n\n- Holds accounts, contacts, leads, opportunities, activities, cases and knowledge for each customer company, often going back many years. [https://www.salesforce.com/sales/]\n- Data 360 (formerly Data Cloud) unifies customer data from Salesforce and other sources, such as Snowflake and Amazon S3 in Engine's case. [https://www.salesforce.com/customer-stories/engine/agentic-service/]\n- Headless 360 opens the platform to outside agents through APIs, MCP servers and a command line. Agents in Claude, ChatGPT and Cursor can call Salesforce actions (expanded August 2026). [https://www.destinationcrm.com/Articles/CRM-News/CRM-Across-the-Wire/Salesforce-Expands-Headless-360-Across-Its-Portfolio-176206.aspx]\n- Also part of the company: Slack, Tableau, MuleSoft and Informatica (acquired November 2025). [https://en.wikipedia.org/wiki/Salesforce]\n\n## AI today\n\n- Einstein features suggest and score: lead and opportunity scoring, forecasting, call summaries, record summaries. [https://help.salesforce.com/s/articleView?id=sales.sales_core_artificial_intelligence.htm&language=en_US&type=5]\n- Agentforce agents act on their own: they nurture and qualify leads and resolve service conversations. On Salesforce's own help site they have handled more than five million conversations and resolved over 63% of them instantly. [https://www.salesforce.com/agentforce/case-study/customer-zero]\n- 7.0 billion \"agentic work units\" (discrete tasks agents completed) delivered to date across Agentforce and Slack, 3.2 billion of them in Q2 fiscal 2027. [https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx]\n- **Level today: 4, AI Delegated. Target: 5, AI Domain Intelligence, by the end of 2028.** See `vision/ai-levels.md` and `vision/vision.md`.\n- **Our move: Build on it** (AI opportunity 5.0, risk 2.64, AI urgency immediate). Direction: protect the record and the ecosystem, make the deal record keep itself, then sell outcomes and opt-in benchmarks. See `discovery/discovery.md`.\n\n## The idea we have in mind\n\nSellers still spend time keeping the CRM up to date instead of selling. We want Sales Cloud to keep its own records, and to tell each team what is working in deals like theirs. `[PM, illustrative]`\n\n- The right problem: sales managers can't see where every deal really stands without chasing reps. BHAG: by 2031, sellers spend 70% of their week selling, up from 40%, and no manager has to ask where a deal stands. See `problem/problem.md`. `[PM, illustrative]`\n- This product update: the rep confirms each deal change the agent proposes, and the manager's forecast brief is built only from what reps confirmed (flows 1 and 2 in `flows/flows.md`); $45 a user a month, a fixed line at renewal; build-day slice: one team's sample data, from a call to a proposed change, the rep's confirmation, the brief and an override with a reason. See `roadmap/roadmap.md`. `[PM, illustrative]`\n\n## Still unknown\n\n- How many companies use Sales Cloud and Service Cloud, and how revenue splits between them: not reported separately. [https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx]\n- What share of customers pay for Agentforce, and how many agents are live in Sales Cloud versus Service Cloud: not verified.\n- How resolution is measured across customer stories: definitions differ (resolved, deflected, handled), so the rates aren't directly comparable.\n- Whether customers would let their anonymised deal data feed benchmarks for other customers. `[PM, illustrative]`\n", "discovery/discovery.md": "# Salesforce Sales Cloud and Service Cloud · Discovery\n\n> Illustrative. The product manager's answers and the score they overturned are invented to show how `/ai-product-discovery` works, tagged `[PM, illustrative]`. Everything else cites the reports in this folder or a public source.\n\nIs the product ready to go where the vision says? Built from `protection.md`, `strength.md`, `exposure.md`, `value.md`, `../vision/vision.md` and the product manager's answers on 27 Oct 2026.\n\n## In short\n\nSales Cloud and Service Cloud are strong where it is hardest to copy: brand, partners, integrations and years of customer history. The exposure is in service, where well-funded AI-native agents are winning decisions, and in how easily data and habits can move once AI does the migration work. The move is **Build on it**: protect the record and the ecosystem, make the deal record keep itself, win service on outcomes with Fin, and earn customers' permission to learn across their data so benchmarks can follow.\n\n## Where to take the product\n\n- **Protect:** the record and the ecosystem around it: integrations, AppExchange and the partner network. Keep them open, so builders work on Salesforce rather than around it (`protection.md`, `exposure.md`).\n- **Grow:**\n  1. *The deal record that keeps itself.* Value comes from defending the seat and from taking back the work Gong, Clari and Day.ai do on top (`../vision/opportunities.md` #1, `value.md`).\n  2. *Outcome-priced service with Fin for the fast-setup customer.* Value comes from per-resolution revenue in the segment AI-native agents are winning (`../vision/opportunities.md` #2).\n  3. *Opt-in benchmarks, \"deals like yours\".* Value comes from a new subscription per sales team, built on history no newcomer has (`../vision/vision.md`, `../vision/opportunities.md` #6).\n- **Start with:** reps' deal records are never current, so managers don't trust the forecast and reps lose selling time to data entry. Before building anything, learn with 10 Sales Cloud customers whether reps would trust an agent to keep records current without checking, and whether sales leaders would opt in to sharing anonymised deal data (`../vision/vision.md`). `[PM, illustrative]`\n- **Don't:**\n  - Don't build benchmarks before customers have opted in and the records are clean: both are prerequisites.\n  - Don't spend on quoting or sales-to-success handoff agents yet: the evidence is thin (`../vision/opportunities.md`, open questions).\n  - Don't reprice seats across the board until outcome pricing is proven. `[PM, illustrative]`\n- **How we'll know:**\n  - The share of agent-proposed updates reps accept without edits.\n  - The share of sales leaders who say yes to opting in, and on what terms.\n  - The service win rate against AI-native agents, and the number of customers on per-resolution pricing. `[PM, illustrative]`\n\n## The four pillars\n\n| Pillar | Score | What it means |\n|---|---|---|\n| Protection | 3.67 / 5 | Broad and durable, led by distribution; switching costs are the part AI wears down (`protection.md`) |\n| Strength | 3.83 / 5 (business quality 3.67, customer strength 4.0) | Market leader, customers stay; horizontal by design (`strength.md`) |\n| AI opportunity | 5.0 / 5 | Shipped, paid for and large: AI in the product today, AI revenue and work AI could take off customers all score 5 (`strength.md`) |\n| Exposure | 2.64 / 5 (1 safest, 5 most exposed) | Moderate overall; AI disruption and its timing are the two high risks (`exposure.md`) |\n\n**AI urgency:** immediate: Sierra, Decagon, HubSpot and Microsoft ship agents in the same service and sales workflows now (`strength.md`).\n\n## Where we're strong\n\n- First in CRM for the 13th year, with a 20.0% share in 2025 [https://www.digitaltoday.co.kr/en/view/74831/salesforce-tops-idc-global-crm-market-share-for-13th-straight-year]\n- 3,800+ consulting firms and 170,000+ certified experts build on Salesforce [https://www.forrester.com/blogs/the-salesforce-consulting-landscape-shows-no-sign-of-slowdown/]\n- 91% of customers run at least one AppExchange app [https://smartbridge.com/salesforce-appexchange-apps-top-20-for-2026/]\n- Customers stay: revenue attrition is about 8% [https://transcripts.platformaeronaut.com/summaries/CRM-4Q26-AI-Summary]. `[PM, illustrative]` Our own renewal data matches, and most churn is among small teams that find setup heavy.\n- AI already earns money: Agentforce annual recurring revenue is above $1.5B [https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx]\n\n## Where we're exposed\n\n- **The protection eroding fastest: switching costs.** Data exports as CSV every week, and AI tools make migration, retraining and re-mapping processes cheaper (`protection.md`).\n- **The highest risk: AI disruption.** Sierra raised $950M and serves over 40% of the Fortune 50 [https://www.vktr.com/customer-experience/sierra-raises-950m-at-15b-valuation-eyes-transformation-beyond-customer-support/]. `[PM, illustrative]` AI-native agents now appear in most mid-market service deals we lose.\n- **Timing.** Investors are pricing the risk now: the stock was down about 33% in 2026 by late May, on fears for seat-based pricing [https://www.tikr.com/blog/salesforce-beat-q1-earnings-by-0-76-a-share-heres-why-the-stock-is-still-down-33-in-2026]\n- **Trust around data.** A default-on setting that lets customer data train global predictive models drew criticism [https://www.salesforceben.com/salesforces-new-ai-data-setting-sparks-debate-over-what-customers-agreed-to/]\n\n## The AI opportunity\n\n- **AI in the product today:** level 4, AI Delegated (`../vision/ai-levels.md`).\n- **Where AI could earn money:**\n  - Per-resolution service for the fast-setup customer, with Fin and the Help Agent (`../vision/opportunities.md` #2).\n  - Opt-in benchmarks, sold per sales team (`../vision/vision.md`).\n- **Where AI could take work off customers:**\n  - Activity logging and deal updates, forecast roll-ups, case wrap-up, and data hygiene for admins (`../vision/opportunities.md` #1, #3–#5).\n  - Reps spent 70% of their time on non-selling work in 2024 (`../vision/opportunities.md`).\n\n## Our move\n\n| | Lower risk | Higher risk |\n|---|---|---|\n| **Higher AI opportunity** | **Build on it** | Move first |\n| **Lower AI opportunity** | Optimise | Defend |\n\nWe are in **Build on it**: AI opportunity 5.0, risk 2.64. Neither score is within 0.2 of the 3.0 line. AI urgency is immediate: rivals ship agents in the same workflows now, so the move has to start now.\n\nThe opportunity is large and already paid for, and the protection is broad enough to invest from. For us, this means using the installed base, partners and history to do what a newcomer can't: keep the record current and learn across customers.\n\n`[PM, illustrative]` Confirmed, with one caveat. Risk rose after our own correction, and timing scores 4, so we build on it quickly, starting where the AI-native rivals are already winning.\n\n## Ready for the vision?\n\nThe vision: level 5 by the end of 2028, starting with the deal record that keeps itself (`../vision/vision.md`, `../vision/opportunities.md` #1).\n\n| | What we have | The gap | Must be true | How we'll check |\n|---|---|---|---|---|\n| **Data** | Years of pipeline, activity and case history per customer (`../product.md`). A Spring '26 setting covers training global predictive models [https://www.salesforceben.com/salesforces-new-ai-data-setting-sparks-debate-over-what-customers-agreed-to/] | `[PM, illustrative]` Legal reads benchmarks shown to other customers as needing explicit opt-in; the MSA alone isn't enough | Enough customers opt in, in each industry and size band, for benchmarks to mean something | Ask 20 sales leaders the opt-in question in the pilot interviews; count yes, and the terms they set |\n| **Tech** | Data 360, the Atlas reasoning engine, activity capture and Headless 360 (`../product.md`) [https://www.destinationcrm.com/Articles/CRM-News/CRM-Across-the-Wire/Salesforce-Expands-Headless-360-Across-Its-Portfolio-176206.aspx] | Reliable field updates from email, calendar and calls; an anonymised pipeline across customer orgs. `[PM, illustrative]` Activity capture data sits apart from the core record today | Agents update deals accurately enough that reps stop checking each change | Pilot: share of proposed updates accepted without edits, per field |\n| **Team** | `[PM, illustrative]` One product manager, an engineering lead and a designer (`../product.md`) | No data scientists or privacy engineers on this team | Cross-customer modelling and privacy review are staffed before benchmarks are built | `[PM, illustrative]` Agree staffing with the Sales Cloud lead before the pilot ends |\n| **Customers** | Agents already resolve service conversations with named results (`../vision/ai-levels.md`) | Reps' trust in automatic updates is unknown; trust in data use was dented (`exposure.md`) | Reps accept updates, and leaders opt in to sharing | Pilot acceptance rate, hours saved per rep, opt-in answers |\n| **Pricing** | Per-conversation, per-resolution and credit pricing exist (`../product.md`) | Salesforce moved its agents back towards seat-based deals because customers wanted predictable costs [https://www.theregister.com/2025/12/12/ai_agents_salesforce_pricing/]; benchmarks have no price yet | Sales teams pay for benchmarks on top of seats | Test two price points in the 20 interviews |\n\n**Builds on:** brand and distribution, deep integrations, a paying AI line, and years of history that is still a latent asset (`protection.md`, `strength.md`).\n\n**Could stop it:** customers saying no to learning across their data; AI-native rivals capturing the work first; seat revenue shrinking faster than outcome revenue grows (`exposure.md`).\n\n## Where value flows\n\nIn short, from `value.md`:\n\n| | Today | At the vision's target level |\n|---|---|---|\n| **Who gets value** | Reps, managers and service teams get one record and a console; partners and tools on top get the work around it | Sales managers get a forecast they trust and benchmarks; service managers get resolved conversations |\n| **Who pays, and for what** | The company, per seat ($25–$550 per user per month), plus AI add-ons, credits or $2 per conversation [https://www.salesforce.com/agentforce/pricing/] | The company, per resolution in service and a benchmark subscription per sales team `[PM, illustrative]` |\n| **Where value leaks** | Reps' manual entry, spreadsheet forecasts, Gong and Clari, consulting partners, AI-native service agents | Outside assistants doing the work through Headless 360, if the value of the record moves to them |\n| **Who else could capture it** | Sierra, Decagon, HubSpot in service; Gong, Clari, Day.ai in sales | Microsoft 365 Copilot and ChatGPT as the place reps work; customers' own builds |\n| **What keeps it with us** | Integrations, partners, brand | Data across many customers, the workflow, trust, and distribution |\n\n**The shift:** seats for people who type into the CRM → paying for outcomes: resolved conversations and a forecast with benchmarks.\n\n## What we corrected\n\n| Score | From | To | Why | Evidence |\n|---|---|---|---|---|\n| Exposure: AI disruption | 3 | 4 (composite 2.55 → 2.64) | The public score was capped at 3 because rivals sit on top of the CRM rather than replace it. Our win/loss notes show buyers choosing the service agent first and the CRM second, which meets the \"likely affecting decision-making\" anchor. `[PM, illustrative]` | `[PM, illustrative]` win/loss notes; Sierra and Decagon funding (`exposure.md`) |\n| Strength: vertical market software | 1 | 1 (kept) | The product manager argued Salesforce shapes how sales teams work. Kept, because the rubric measures how built-for-one-industry the product is, and Sales Cloud and Service Cloud are horizontal by design. `[PM, illustrative]` | `strength.md` |\n", "discovery/exposure.md": "# Salesforce Sales Cloud and Service Cloud · What could go wrong\n\n> Illustrative example built from public sources on 27 Oct 2026. Not affiliated with or endorsed by Salesforce. Anything tagged `[PM, illustrative]` is invented to show what a product manager would add. Scores computed by `compute_risk_score.py`. 1 is safest, 5 most exposed.\n\n## 1. Risk summary\n\n```\nCompany:         Salesforce (Sales Cloud and Service Cloud)\nRisk Composite:  2.64 / 5.0   (lower = safer, higher = more exposed)\nHighest Risk:    AI disruption (4) and timing of disruption (4)\nLowest Risk:     Market growth (2), with five others at 2\n```\n\nThe composite was 2.55 from public sources. The product manager raised AI disruption from 3 to 4 with their own win/loss evidence (see `discovery.md`, \"What we corrected\"), and the script was rerun. `[PM, illustrative]`\n\n## 2. Top risks\n\n**AI disruption: 4.** AI-native service agents are well funded and winning service decisions.\n- Sierra raised $950M at a valuation above $15B. It says it serves more than 40% of the Fortune 50 and is moving into sales [https://www.vktr.com/customer-experience/sierra-raises-950m-at-15b-valuation-eyes-transformation-beyond-customer-support/].\n- Decagon raised $250M in January 2026 [https://www.vktr.com/contact-center/decagon-triples-valuation-to-45b-with-250m-series-d/]. HubSpot's customer agent resolves about 70% of conversations for 9,000+ customers [https://www.cxtoday.com/contact-center/hubspot-customer-agent-resolution-rate/].\n- `[PM, illustrative]` In win/loss notes, AI-native agents now appear in most mid-market service evaluations Salesforce loses.\n\nSalesforce's complementary assets slow this down: installed base, integrations, partners and years of history. They would normally cap this risk at 3. The product manager's evidence shows buyers choosing the agent first, which meets the higher anchor. Urgency: near-term.\n\n**Timing of disruption: 4.** The market is pricing the risk now, even though customers aren't leaving yet.\n- The stock was down about 33% in 2026 by late May, amid fears that agents shrink seat-based software. Bank of America rated it Underperform for that reason [https://www.tikr.com/blog/salesforce-beat-q1-earnings-by-0-76-a-share-heres-why-the-stock-is-still-down-33-in-2026].\n- Revenue attrition is still about 8% [https://transcripts.platformaeronaut.com/summaries/CRM-4Q26-AI-Summary]. That is a lagging signal, so it doesn't lower this score.\n\nUrgency: near-term.\n\n**Price-value pressure: 3.** Prices still hold, but the pricing model is in motion.\n- A 6% list increase on Enterprise and Unlimited editions of Sales Cloud and Service Cloud took effect in August 2025 [https://tech.co/news/lock-in-deal-salesforce-price-rise-august].\n- Salesforce moved its agents from per-conversation and consumption pricing back towards seat-based agreements because customers wanted predictability. Analysts warn buyers may pay for seats they barely use [https://www.theregister.com/2025/12/12/ai_agents_salesforce_pricing/].\n- Reviewers point to cost and add-ons (`../product.md`).\n\nUrgency: medium-term.\n\n## 3. Risk landscape\n\n**End market environment.** The market is growing: global CRM is forecast to grow about 10.9% a year from 2025 to 2030 [https://www.researchandmarkets.com/r/z4gnmz]. AI disruption is the one risk that is accelerating. Regulation is manageable. In May 2026 the EU agreed to push back its high-risk AI deadlines, while the duty to tell people they are talking to AI stays on 2 August 2026 [https://www.gibsondunn.com/eu-ai-act-omnibus-agreement-postponed-high-risk-deadlines-and-other-key-changes/]. Dependence on partners is spread out. Agentforce runs models from OpenAI, Anthropic and Google [https://www.constellationr.com/insights/news/salesforce-expands-openai-anthropic-partnerships-eyes-agentforce-everywhere], and Hyperforce runs on several public clouds [https://www.infoworld.com/article/3599854/salesforce-targets-public-clouds-with-hyperforce.html].\n\n**Product defensibility.** Integration depth is strong: 91% of customers run AppExchange apps [https://smartbridge.com/salesforce-appexchange-apps-top-20-for-2026/]. Substitution is realistic but takes effort. Data exports as CSV every week [https://trailhead.salesforce.com/content/learn/modules/lex_implementation_data_management/lex_implementation_data_export], and migration firms plan weeks to months [https://insidea.com/blog/hubspot/salesforce-to-hubspot-migration-timeline]. Timing is the risk to watch: it is accelerating.\n\n**Business health.** The brand is strong but has taken knocks. In August 2025 a threat group used stolen tokens from the Salesloft Drift app to export data from many companies' Salesforce orgs; Google found no flaw in the Salesforce platform itself [https://cloud.google.com/blog/topics/threat-intelligence/data-theft-salesforce-instances-via-salesloft-drift]. A default-on data-sharing setting [https://www.salesforceben.com/salesforces-new-ai-data-setting-sparks-debate-over-what-customers-agreed-to/] and the Slack API restrictions [https://www.cxtoday.com/crm/salesforce-blocks-competitors-from-using-slack-data-so-what/] drew criticism. The stack is mostly modern, with Classic remnants in older orgs [https://www.salesforceben.com/salesforce-lightning-transition-apps-retired-amid-98-1-adoption/]. CRM plays some part in approvals but is not the core financial control layer. All three are stable.\n\n| Dimension | Score | Section |\n|---|---|---|\n| R1 AI disruption | 4 | End market environment |\n| R2 Market growth | 2 | End market environment |\n| R3 Regulatory and market shift | 2 | End market environment |\n| R4 Partner and ecosystem dependency | 2 | End market environment |\n| R5 Integration and lock-in depth | 2 | Product defensibility |\n| R6 Substitution and data portability | 3 | Product defensibility |\n| R8 Timing of disruption | 4 | Product defensibility |\n| R9 Price-value pressure | 3 | Business health |\n| R10 Audit, segregation of duties and approvals | 3 | Business health |\n| R11 Brand and trust strength | 2 | Business health |\n| R12 Tech stack obsolescence | 2 | Business health |\n\n## 4. Watch-outs\n\n- Customers stay (about 8% attrition), but exposure to AI-native rivals is high. Is today's retention hiding decisions being made now?\n- Pricing has moved from seats to consumption and back. Will customers keep paying per seat if agents do more of the work?\n- Trust is a strength, but the data-setting debate touches exactly what level 5 needs: permission to learn across customers.\n- Rivals connect to Salesforce rather than replace it. Does that keep the record safe, or slowly move the value elsewhere?\n\n## 5. Open questions for interview\n\n| Dimension | Question | If the answer is unfavourable |\n|---|---|---|\n| Audit and approvals embeddedness | How many customers run approvals, discounts or controls that auditors rely on inside Sales Cloud? | Rises to 4 |\n| Substitution and data portability | In the last year, how many lost customers moved fully off, and how long did it take them? | Rises to 4 |\n| Price-value pressure | What share of renewals ended with fewer seats? | Rises to 4 |\n| Timing of disruption | Are lost service deals rising quarter on quarter? | Rises to 5 |\n\n## 6. Methodology note\n\nAbout 12 searches and fetches went into this report: funding coverage, analyst and trade press, Salesforce's own pages, a Google security advisory and a market forecast. Gartner's CRM forecasts couldn't be opened, so a ResearchAndMarkets forecast is used for market growth, which caps that score at Medium confidence. The retired labour-displacement dimension is not scored.\n\n## 7. Evidence quality\n\n| Dimension | Name | Score | Evidence Confidence | Score Basis | Flags |\n|---|---|---|---|---|---|\n| R1 | AI disruption | 4 | Medium | mixed | conflict_present; changed by `[PM, illustrative]` |\n| R2 | Market growth | 2 | Medium | direct_evidence | single_class_evidence |\n| R3 | Regulatory and market shift | 2 | Medium | mixed | |\n| R4 | Partner and ecosystem dependency | 2 | Medium | direct_evidence | |\n| R5 | Integration and lock-in depth | 2 | High | direct_evidence | |\n| R6 | Substitution and data portability | 3 | Medium | mixed | |\n| R8 | Timing of disruption | 4 | Medium | mixed | conflict_present |\n| R9 | Price-value pressure | 3 | Medium | mixed | |\n| R10 | Audit, segregation of duties and approvals | 3 | Low | inference_heavy | inference_heavy |\n| R11 | Brand and trust strength | 2 | Medium | mixed | conflict_present |\n| R12 | Tech stack obsolescence | 2 | Medium | mixed | |\n", "discovery/protection.md": "# Salesforce Sales Cloud and Service Cloud · What protects the product\n\n> Illustrative example built from public sources on 27 Oct 2026. Not affiliated with or endorsed by Salesforce. Anything tagged `[PM, illustrative]` is invented to show what a product manager would add. Scores computed by `compute_moat_score.py`.\n\n## 1. Summary\n\n```\nCompany:          Salesforce (Sales Cloud and Service Cloud)\nMOAT Composite:   3.67 / 5.0\nMode:             Mode F — Fortress\nExposure Ratio:   0.35 (Moderate)\nStrongest Pillar: Distribution (4.3)\nMost Exposed:     Switching costs (0.58)\n```\n\nBoundary note from the script: exposure 0.35 is within 0.03 of the Fortress/Resilient boundary (0.35). Read this as Fortress, close to Resilient.\n\n## 2. Verdict\n\nSalesforce has a broad moat: the best-known brand in CRM, the largest partner and certified-expert network around any CRM, and years of customisation inside each customer's org. The part AI can wear down is the cost of leaving: data export is standard, and AI tools make moving records, retraining people and re-mapping processes cheaper for a rival. The most valuable thing to invest in is turning years of cross-customer history into something customers use every day, so that staying gives them something they can't get elsewhere.\n\n## 3. Pillar summary\n\n| Pillar | Score | Exposure Ratio | Mode Signal |\n|---|---|---|---|\n| Switching costs (SC) | 3.7 | 0.58 | Holding, but AI targets 3 of 6 levers |\n| Domain knowledge (DK) | 3.3 | 0.33 | Solid; history is a latent asset |\n| Speed and cost of building (DS) | 3.4 | 0.50 | Wide surface; talent is easy to find |\n| Distribution (DC) | 4.3 | 0.00 | Strong, relational and safe from AI |\n\n## 4. Pillar analysis\n\n### Switching costs (3.7/5.0 | Exposure: 0.58)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Data migration complexity | 3 | AI-exposed | Direct, Medium |\n| User retraining burden | 4 | AI-exposed | Direct, Medium |\n| Process reconfiguration effort | 4 | AI-exposed | Direct, Medium |\n| Integration dependency depth | 4 | Structural | Direct, High |\n| Customisation volume | 4 | Partial | Direct, Medium |\n| Contractual lock-in | 3 | Structural | Direct, Medium |\n\nLeaving Salesforce takes real work. Nearly 6,000 apps sit on AppExchange and 91% of customers use at least one [https://smartbridge.com/salesforce-appexchange-apps-top-20-for-2026/]. Salesforce's own engineers found that most customer orgs are highly customised, each with its own objects and business logic [https://engineering.salesforce.com/how-agentforce-delivers-trusted-extensible-ai-agents-for-enterprise-orchestration/]. Integrations are the strongest lever, and they don't depend on AI. Data migration is the weakest. Enterprise editions can export all data as CSV files every week [https://trailhead.salesforce.com/content/learn/modules/lex_implementation_data_management/lex_implementation_data_export], and migration firms plan 6 to 12 weeks to move a customised org to HubSpot, plus a read-only period [https://insidea.com/blog/hubspot/salesforce-to-hubspot-migration-timeline]. Contracts can't be cancelled or reduced mid-term, but most renew yearly [https://www.nutshell.com/blog/salesforce-contracts-explained]. A credible rival would use AI to map objects, rebuild flows and train users, then time the switch to a renewal.\n\n### Domain knowledge (3.3/5.0 | Exposure: 0.33)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Regulatory and compliance logic | 2 | Partial | Direct, Medium |\n| Industry-specific process encoding | 3 | Partial | Inference, Low |\n| Edge case handling | 4 | Partial | Inference, Medium |\n| Data models | 4 | Partial | Direct, Medium |\n| Terminology | 4 | Structural | Direct, Medium |\n| Historical benchmarks | 3 | Structural | Direct, Medium (latent asset) |\n\nSales and service are horizontal work, so there is little regulatory logic to protect. Salesforce has been first in CRM for 13 years in a row, with a 20.0% share in 2025 [https://www.digitaltoday.co.kr/en/view/74831/salesforce-tops-idc-global-crm-market-share-for-13th-straight-year], and that breadth has built a deep library of edge cases. The data model of accounts, contacts, opportunities and cases is widely copied: migration firms recreate custom objects one for one [https://insidea.com/blog/hubspot/salesforce-to-hubspot-migration-timeline]. Its vocabulary has stuck: job postings ask for a \"Salesforce administrator\" (`../vision/opportunities.md`). The most promising lever is historical benchmarks. Salesforce holds years of pipeline and case history across customers but doesn't package it (`../vision/ai-levels.md`). Since Spring '26, a default-on setting lets customer data train global predictive models [https://www.salesforceben.com/salesforces-new-ai-data-setting-sparks-debate-over-what-customers-agreed-to/]. This is a latent asset and a named opportunity.\n\n### Speed and cost of building (3.4/5.0 | Exposure: 0.50)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Codebase maturity | 4 | Partial | Direct, Medium |\n| QA infrastructure | 3 | Partial | Direct, Medium |\n| Developer domain familiarity | 2 | Partial | Direct, Medium |\n| Feature parity as barrier | 4 | AI-exposed | Direct, Medium |\n| Regulatory approval navigated | 4 | Structural | Direct, Medium |\n\nThe platform is mature and moved to public clouds through Hyperforce [https://www.infoworld.com/article/3599854/salesforce-targets-public-clouds-with-hyperforce.html]. 98.1% of orgs are on Lightning, with Classic still around [https://www.salesforceben.com/salesforce-lightning-transition-apps-retired-amid-98-1-adoption/]. The reasoning engine ships every other day with staged rollouts [https://engineering.salesforce.com/how-agentforce-delivers-trusted-extensible-ai-agents-for-enterprise-orchestration/]. Government Cloud Plus has held a FedRAMP High provisional authorisation since May 2020 [https://compliance.salesforce.com/en/categories/fedramp-high]. The feature surface is wide, which is the strongest lever here. The weakest is talent: more than 170,000 certified experts work in the ecosystem [https://www.forrester.com/blogs/the-salesforce-consulting-landscape-shows-no-sign-of-slowdown/], so CRM skills are easy to hire. Rivals don't try to match every feature. They take one slice, such as service agents, and connect to the CRM (`../vision/market-moves.md`).\n\n### Distribution (4.3/5.0 | Exposure: 0.00)\n\n| Lever | Score | AI Exposure | Evidence Basis |\n|---|---|---|---|\n| Direct buyer relationships | 4 | Structural | Inference, Medium |\n| Brand recognition | 5 | Structural | Direct, High |\n| Conference and community presence | 5 | Structural | Direct, Medium |\n| Referral and partner networks | 5 | Structural | Direct, High |\n| Sales team expertise | 3 | Structural | Inference, Low |\n| Customer success depth | 4 | Structural | Direct, Medium |\n| Geographic coverage | 4 | Structural | Direct, Medium |\n\nThis is the strongest pillar. Salesforce is a Leader in Gartner's 2025 sales force automation report [https://www.cxtoday.com/crm/gartner-magic-quadrant-for-sales-force-automation-platforms-sfa-2025-the-rundown/]. It runs Dreamforce, which drew more than 40,000 people in person in 2025 [https://www.salesforceben.com/dreamforce/]. More than 3,800 consulting firms work on Salesforce, and Forrester puts their combined revenue at nearly six times Salesforce's own [https://www.forrester.com/blogs/the-salesforce-consulting-landscape-shows-no-sign-of-slowdown/]. The paid Signature plan adds a named customer success manager and round-the-clock monitoring [https://www.salesforce.com/services/success-plans/overview/signature-success/]. The sales team's expertise is the least evidenced lever. A well-funded rival would have to earn all of this over many years.\n\n## 5. Exposure map\n\n**AI-exposed levers**\n- Data migration complexity (switching costs, 3): standard CSV export plus AI mapping tools make moving records cheaper. Urgency: high.\n- User retraining burden (switching costs, 4): AI onboarding and agents that work in Slack or ChatGPT shrink what users need to learn. Urgency: medium.\n- Process reconfiguration effort (switching costs, 4): AI can rebuild flows and rules from configuration. Urgency: medium.\n- Feature parity as a barrier (speed and cost, 4): AI-native rivals build one slice fast and sit on top of the CRM. Urgency: medium.\n\n**Structural levers**\n- Integration dependency depth (switching costs, 4): re-integrating ERP, data and apps still takes engineering time.\n- Contractual lock-in (switching costs, 3): non-cancellable terms; multi-year agentic licence agreements [https://www.theregister.com/2025/12/12/ai_agents_salesforce_pricing/].\n- Terminology (domain knowledge, 4) and historical benchmarks (domain knowledge, 3): only time builds these.\n- Regulatory approval (speed and cost, 4): FedRAMP High takes years for a newcomer.\n- All seven distribution levers (4.3 average): relationships, brand, Dreamforce and partners.\n\n## 6. Strategic implications\n\n**Defend now**\n- **Partners.** The consulting ecosystem is the biggest barrier to entry. Give partners agent-building work to sell, so they keep bringing customers in.\n- **Integrations.** Keep AppExchange and Headless 360 open and well documented, so builders build on Salesforce rather than around it. The 2025 Slack API change drew lock-in criticism [https://www.cxtoday.com/crm/salesforce-blocks-competitors-from-using-slack-data-so-what/].\n\n**Act on**\n- **Make leaving cost the customer something they value.** Export will stay easy. Instead, give each customer benchmarks and agent learnings built from many customers' history, which a new CRM can't offer on day one.\n- **Make the agent the place people work.** If agents update the record and do the follow-up, retraining matters less, and so does a rival's AI onboarding.\n\n**Watch**\n- Edge-case depth and the data model: AI can learn both from public docs and migrations.\n- QA and release speed: AI-native rivals ship fast; staged rollouts are a strength to keep.\n\n## 7. Evidence provenance\n\nAbout 30 searches and fetches were shared across the three reports, with about 10 for this one.\n- Switching costs: Trailhead, contract analysis, migration vendor timelines, AppExchange statistics, the engineering blog.\n- Domain knowledge: IDC rankings, product files in this folder, trade press on the data setting. Industry process encoding (DK2) and edge-case handling (DK3) were scored mainly by inference.\n- Speed and cost: InfoWorld, SalesforceBen, the engineering blog, the compliance portal and Forrester.\n- Distribution: CX Today, SalesforceBen, Forrester and Salesforce's success-plan page. Direct buyer relationships (DC1) and sales team expertise (DC5) were scored by inference.\n\n## 8. Evidence quality\n\n| Lever ID | Pillar | Score | Evidence Source | Evidence Confidence | Flags |\n|---|---|---|---|---|---|\n| SC1 | Switching costs | 3 | Trailhead; INSIDEA | Medium | borderline |\n| SC2 | Switching costs | 4 | Forrester; review summaries in `../product.md` | Medium | |\n| SC3 | Switching costs | 4 | Salesforce engineering blog; `[PM, illustrative]` | Medium | |\n| SC4 | Switching costs | 4 | Smartbridge; INSIDEA | High | |\n| SC5 | Switching costs | 4 | Engineering blog; Signature page | Medium | |\n| SC6 | Switching costs | 3 | Nutshell (MSA quotes); The Register | Medium | |\n| DK1 | Domain knowledge | 2 | Compliance portal; Gibson Dunn | Medium | |\n| DK2 | Domain knowledge | 3 | Inference | Low | inference_heavy |\n| DK3 | Domain knowledge | 4 | Digital Today (IDC) | Medium | |\n| DK4 | Domain knowledge | 4 | INSIDEA | Medium | |\n| DK5 | Domain knowledge | 4 | Job postings in `../vision/opportunities.md` | Medium | |\n| DK6 | Domain knowledge | 3 | `../vision/ai-levels.md`; SalesforceBen | Medium | latent_asset |\n| DS1 | Speed and cost | 4 | InfoWorld; SalesforceBen | Medium | |\n| DS2 | Speed and cost | 3 | Engineering blog; Signature page | Medium | |\n| DS3 | Speed and cost | 2 | Forrester | Medium | |\n| DS4 | Speed and cost | 4 | `../product.md`; `../vision/market-moves.md` | Medium | |\n| DS5 | Speed and cost | 4 | Compliance portal; InfoWorld | Medium | |\n| DC1 | Distribution | 4 | Signature page; `[PM, illustrative]` | Medium | |\n| DC2 | Distribution | 5 | Digital Today (IDC); CX Today | High | |\n| DC3 | Distribution | 5 | SalesforceBen | Medium | single_source |\n| DC4 | Distribution | 5 | Forrester | High | |\n| DC5 | Distribution | 3 | Inference | Low | inference_heavy |\n| DC6 | Distribution | 4 | Signature page | Medium | |\n| DC7 | Distribution | 4 | InfoWorld | Medium | |\n", "discovery/strength.md": "# Salesforce Sales Cloud and Service Cloud · How strong the product is, and the AI opportunity\n\n> Illustrative example built from public sources on 27 Oct 2026. Not affiliated with or endorsed by Salesforce. Anything tagged `[PM, illustrative]` is invented to show what a product manager would add. Scores computed by `compute_maturity_score.py`.\n\n## 1. Summary\n\n```\nCompany:            Salesforce (Sales Cloud and Service Cloud)\nMaturity Composite:  3.87 / 5.0\n  Section A (Business Quality):   3.67\n  Section B (Customer Strength):  4.0\n  Section C (AI Opportunity):     4.0\n```\n\n**The pillar numbers used in `discovery.md`** come from `compute_pillars.py`, not from the composite above: strength 3.83 (the mean of business quality 3.67 and customer strength 4.0), AI opportunity 5.0 (the mean of AI in the product today, AI revenue and work AI could take off customers, all 5), and AI urgency immediate, reported on its own. The maturity composite (3.87) and the AI section score (4.0) above average urgency in on its inverted scale, which makes a product under heavy AI pressure look like a smaller opportunity, so the pillars leave it out.\n\nScope: two products inside a larger platform. Sales and service revenue is not reported separately [https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx], so company-level figures are used and marked as such.\n\n## 2. Verdict\n\nSales Cloud and Service Cloud are a mature, market-leading business with customers who stay and a large, already-paying AI line. The strongest asset is market position: first in CRM with a 20.0% share in 2025, for the 13th year in a row. The biggest gap is that the products are horizontal, so the deep know-how about how sales and service work across many companies isn't yet turned into something only Salesforce can offer.\n\n## 3. Dimension scores\n\n| Dimension | Score | Evidence Confidence | Score Basis |\n|---|---|---|---|\n| A1 Type of system | 4 | High | direct_evidence |\n| A2 Vertical market software | 1 | High | direct_evidence |\n| A3 Mission criticalness | 4 | Medium | mixed |\n| A4 Market position | 5 | High | direct_evidence |\n| A5 Leadership mindset | 4 | Medium | mixed |\n| A6 Technology modernity | 4 | Medium | direct_evidence |\n| B1 Customer switching propensity | 4 | Medium | mixed |\n| B3 Customer dependency and embeddedness | 4 | Medium | mixed |\n| C1 Current AI features | 5 | High | direct_evidence |\n| C2 AI initiative urgency (5 = least urgent) | 1 | High | direct_evidence |\n| C3 AI revenue opportunity | 5 | High | direct_evidence |\n| C4 AI labour automation upside | 5 | Medium | mixed |\n\n## 4. Section analysis\n\n### Section A (Business Quality) — 3.67/5.0\n\nSales Cloud and Service Cloud are where companies keep their pipeline and their customer cases. That makes them a system of record in a moderately complex area. A failure stops selling and service, which is why the top success plan promises a response within 15 minutes for business-stopping issues [https://www.salesforce.com/services/success-plans/overview/signature-success/]. Market position is the strongest dimension. IDC ranks Salesforce first in CRM with a 20.0% share in 2025 [https://www.digitaltoday.co.kr/en/view/74831/salesforce-tops-idc-global-crm-market-share-for-13th-straight-year], and first in both sales and service [https://www.salesforce.com/news/stories/idc-crm-market-share-ranking-2025/]. Leadership acts like owners. It bought Informatica and Fin [https://www.salesforce.com/news/press-releases/2026/09/10/salesforce-completes-acquisition-of-fin/], and cut its own support team from about 9,000 to 5,000 as agents took half the conversations [https://www.storyboard18.com/brand-marketing/salesforce-cuts-4000-jobs-as-ai-takes-over-half-of-customer-service-tasks-80022.htm]. It has also changed AI pricing course more than once, which is why this isn't a 5. The stack is mostly modern: public cloud through Hyperforce, a reasoning engine that ships every other day, and Headless 360 for outside agents [https://www.destinationcrm.com/Articles/CRM-News/CRM-Across-the-Wire/Salesforce-Expands-Headless-360-Across-Its-Portfolio-176206.aspx]. The weakest dimension is vertical depth, scored 1. That is by design: sales and service CRM is horizontal.\n\n### Section B (Customer Strength) — 4.0/5.0\n\nCustomers stay. Revenue attrition ended fiscal 2026 at about 8%, in line with recent years [https://transcripts.platformaeronaut.com/summaries/CRM-4Q26-AI-Summary]. This is a company-level figure, carried over to these two products. When customers want more, they tend to add tools on top, such as Gong, Clari and AppExchange apps, rather than leave (`../vision/market-moves.md`). 91% of customers run at least one AppExchange app [https://smartbridge.com/salesforce-appexchange-apps-top-20-for-2026/]. `[PM, illustrative]` Most churn is among small teams that find setup too heavy. Both dimensions score 4, based on observed retention and structural signals rather than on review sentiment alone.\n\n### Section C (AI Opportunity) — 4.0/5.0\n\nAI is shipped and earning money. Agentforce annual recurring revenue passed $1.5B, up more than 240% year on year [https://investor.salesforce.com/news/news-details/2026/Salesforce-Delivers-Record-Second-Quarter-Fiscal-2027-Results/default.aspx]. It is priced per conversation, per resolution or by credits (`../product.md`). Current features, revenue opportunity and labour automation all score 5. Urgency scores 1, the most urgent end, because rivals ship in the same workflows now. Sierra raised $950M and serves over 40% of the Fortune 50 [https://www.vktr.com/custo
