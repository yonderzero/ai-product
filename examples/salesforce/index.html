o-2-our-real-workflow?page=10 |\n| pain | Gen Z sellers lose about two hours a week to manual data entry; sellers overall spend 40% of their time selling (survey of 4,050) | https://www.salesforce.com/news/stories/state-of-sales-report-announcement-2026/ |\n| pain | A reviewer says creating opportunities is too time-consuming *(search result only)* | https://www.gartner.com/reviews/market/sales-force-automation-platforms/compare/product/salesforce-sales-cloud-vs-sap-sales-cloud |\n\n### Sales managers and sales leaders\n\n| Kind | What they said or did | Source |\n|---|---|---|\n| quote | A manager of a top-producing team at a large cybersecurity company: \"Our reps have atrocious CRM hygiene\" (2022) | https://news.ycombinator.com/item?id=33135245 |\n| pain | The same manager spends a lot of time chasing reps for the bare minimum; forecast category is the one field they insist on, because other teams plan from it | https://news.ycombinator.com/item?id=33135245 |\n| objection | The same manager: upkeep only gets checked when a rep misses quota, and good records don't predict good selling | https://news.ycombinator.com/item?id=33135245 |\n| workaround | A former CMO turned revenue chief emails the forecast dashboard the night before a weekly call with the CEO and finance; slow deals repeat last week's update (2024) | https://cmo2cro.substack.com/p/efficient-effective-forecast-calls |\n| workaround | Managers forecast from their own spreadsheet, carried from job to job; the forecast call becomes a round of hopes | https://www.revopscoop.com/post/salesforce-forecasting |\n| pain | A sales author: reps set quarter-end close dates to answer the manager's question, not because the buyer will act then (2014) | https://www.thesalesblog.com/blog/lies-mistruths-and-fabrications-in-your-sales-forecast |\n| pain | A consultant: close dates drift outward; suggests a reason for every change and counting how often a date moved (2016) | https://customerthink.com/where-did-that-close-date-come-from-and-where-is-it-going-to/ |\n| budget signal | Only 24% of sales leaders trust their reps' commits (survey of 928, 2022) | https://www.gong.io/press/as-economic-headwinds-grow-stronger-only-24-of-sales-leaders-are-confident-in-their-teams-revenue-forecast |\n\n### Revenue operations and Salesforce admins\n\n| Kind | What they said or did | Source |\n|---|---|---|\n| workaround | A revenue operations writer built a flow that messages the owner about past-due close dates and adds the manager after three reminders (2022) | https://revengine.substack.com/p/automatically-nudging-reps-to-update |\n| workaround | A scheduled job moves every past-due close date to the start of the month | https://www.revopscoop.com/post/salesforce-forecasting |\n| budget signal | A data-storage company hires a full-time specialist whose job is to chase reps by call, Slack and email until required deal fields are filled (posted 4 Sep 2026) | https://careers.greenfield-growth.com/companies/vast-data/jobs/92220906-sales-data-management-specialist |\n| trigger | Revenue operations postings make Salesforce data accuracy and forecast accuracy part of the job | https://builtin.com/job/manager-revenue-operations-analytics/7780783 · https://jobs.workable.com/jobs/732e5b77-61c5-404f-9e4f-538f937b6ef6.md |\n| objection | Trust is admins' top barrier to AI (29.3%, against 16.1% for cost); 15.3% don't use AI at all (Salesforce Ben surveys, Aug 2026) | https://www.salesforceben.com/5-reasons-salesforce-professionals-distrust-ai/ |\n| pain | Admins in an analyst survey of 234 manage more users than in 2020; a solo admin at a 300-person agency says they are drowning | https://www.appsruntheworld.com/survey-finds-agentforce-enriching-salesforce-admins-with-a-catch/ |\n| objection | Admins testing Agentforce in Setup said it was slower than doing the work themselves (vendor blog quoting admins, 2026) | https://www.getclientell.com/salesforce-blogs/what-salesforce-admins-are-saying-about-agentforce-2026 |\n| pain | Email captured by Einstein Activity Capture sat outside reports and flows; a newer sync option writes email as records but backfills only 180 days (competitor's blog, 2026) | https://revenuegrid.com/blog/einstein-activity-capture-limitations/ · https://www.avoma.com/blog/einstein-activity-capture |\n\n### Service leads (Service Cloud)\n\n| Kind | What they said or did | Source |\n|---|---|---|\n| objection | A G2 reviewer of Service Cloud and Agentforce Service: AI misleads when knowledge is out of date, and cleaning data first takes months (Oct 2026) | https://aws.amazon.com/marketplace/reviews/reviews-list/prodview-xdmwnsnyxbqou |\n| budget signal | A capital-markets reviewer lists high cost and unpredictable pricing as a dislike (Oct 2026) | https://aws.amazon.com/marketplace/reviews/reviews-list/prodview-xdmwnsnyxbqou |\n| pain | Escalations reach account owners in a weekly report, sometimes after the renewal call (integration vendor, Sep 2026) | https://tray.ai/blog/support-history-in-crm/ |\n| pain | Support quality rarely shows in customer success tools, so a customer with heavy tickets can look healthy in the CRM (helpdesk vendor, Jul 2026) | https://www.kustomer.com/resources/blog/cx-b2b-renewal-decisions/ |\n| churn reason | A team saw high bot deflection, but customers who hit the bot on billing churned faster: deflection measured silence, not resolution (May 2026) | https://tianpan.co/blog/2026/05/27/the-deflection-metric-that-lied |\n\n### Financial advisors (adjacent segment)\n\n| Kind | What they said or did | Source |\n|---|---|---|\n| pain | Writing notes in a meeting pulls attention from the client; notes written afterwards miss follow-ups. Action-item accuracy in one test ranged 62–87% (Aug 2025) | https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/ |\n| objection | The advisor stays liable for any errors in the software's notes | https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/ |\n| budget signal | An RIA president reports advisors saving about 2–10 hours a week with notetakers; CRM integration was a key buying question; the firm built consent notices and an AI policy first (May 2025) | https://www.investmentnews.com/fintech/as-ai-notetaking-booms-at-rias-what-guardrails-are-being-put-in-place/260616 |\n| churn reason | An independent advisor switched notetakers because of price | https://advisor.ca/practice/technology/what-advisors-need-to-know-about-ai-notetaking-apps/ |\n| trigger | In a survey of about 3,000 advisors, AI notetakers went from one product to fourteen in a year; CRM is still the most valued software (Mar 2026) | https://www.familywealthreport.com/printarticle.php?id=207153 |\n\n## What the product manager knows that the files don't\n\n| Customer type | What | Tag |\n|---|---|---|\n| Sales managers | In our win-loss calls, managers who bought Clari said they did it because they'd stopped believing the Sales Cloud pipeline | `[PM, illustrative]` |\n| Account executives | Reps at our mid-market customers turn on Activity Capture and then stop checking whether it worked | `[PM, illustrative]` |\n| Revenue operations | Most mid-market customers have one or two revenue operations people who also own the Salesforce admin work | `[PM, illustrative]` |\n| Service leads | Customers that run both clouds rarely connect case escalations to open deals | `[PM, illustrative]` |\n\n## Gaps\n\nWhat we couldn't find, so any persona that needs it marks it `[assumed]` or `[PM, illustrative]`:\n\n- Sales Cloud customers in their own words on Reddit, G2, Capterra and TrustRadius: the pages couldn't be opened.\n- A rep saying whether they'd trust a record they didn't type. Nothing either way.\n- A first-hand admission that reps hide bad news on purpose. What exists points to optimism, pressure and lack of time, not deliberate hiding.\n- Hours managers spend chasing reps and rebuilding the forecast: no measured figure; the economics in `experiences.md` use the product manager's estimate.\n- Service manager job postings and what service leads are measured on.\n- Budgets and renewal moments for any of these roles.\n", "research/experiences.md": "# Salesforce Sales Cloud and Service Cloud · Agentic customer experiences\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. The product manager's answers are invented to show how `/ai-product-research` works, tagged `[PM, illustrative]`.\n\nThe main customer experiences for solving `../problem/problem.md`, reimagined with agents in and around the product: agents that do the customer's work end to end, with the person setting goals, approving and handling exceptions. Exploration, not a build plan yet: these are the experiences to test with the personas and then with real customers. Built on 27 Oct 2026.\n\n**The problem:** when the quarter is on the line and the forecast call is coming, a sales manager wants to know where every deal really stands and which ones need them, without chasing reps, so they can call the number with confidence and spend their time coaching.\n**Where the AI sits:** both. Agents inside today's Sales Cloud workflows (the opportunity, Forecasts, the console), and around it in Slack and the inbox, where reps and managers already answer each other.\n\n## How people use the product today\n\nThe work a typical customer's employees do in and around the product, for the ideal customer in `icp.md`: a mid-market B2B software company with 25 account executives, 5 sales managers (4 front-line managers and a VP) and 2 revenue operations people on Sales Cloud. `[PM, illustrative]`\n\n| Persona | What they do, step by step | How often | How long each time | People per customer | Outside the product | Source |\n|---|---|---|---|---|---|---|\n| Account executive | After a call or email, opens the opportunity, logs the activity, updates stage, amount, close date and next step; checks that activity capture picked up the email | After every customer touch | About 2 hours a week of manual data entry (Gen Z sellers, the only figure broken out) | 25 | Notes app or shadow spreadsheet, then batch updates before the forecast call | https://www.salesforce.com/news/stories/state-of-sales-report-announcement-2026/ · https://www.scratchpad.com/blog/salesforce-issues |\n| Account executive | Answers the manager's \"where is this deal?\" messages and gets records right before the forecast call | Weekly, peaking at quarter end | About 1 hour a week `[PM, illustrative]` | 25 | Slack, email, the call itself | `[PM, illustrative]`; the chase is described at https://www.revopscoop.com/post/salesforce-forecasting |\n| Sales manager or VP of sales | Opens the pipeline, spots past-due dates and stale next steps, messages reps one by one, copies the numbers into their own forecast sheet, adjusts by judgement, runs the forecast call | Weekly | About 4 hours a week: about an hour for the roll-up itself, the rest chasing and checking `[PM, illustrative]` | 5 | A personal forecast spreadsheet that moves with them from job to job | https://zapier.com/templates/details/weekly-forecast-rollup · https://www.revopscoop.com/post/salesforce-forecasting |\n| Revenue operations or Salesforce admin | Builds and fixes forecast reports, runs clean-ups of past-due close dates, chases missing fields, answers \"why doesn't this number match?\" | Weekly, plus a clean-up each quarter | About 8 hours a week each `[PM, illustrative]` | 2 | Exports to spreadsheets, data-quality tools, a ticket queue | https://www.revopscoop.com/post/salesforce-forecasting · https://jobs.workable.com/jobs/83139990-02aa-447b-9f68-5d26b90d22f1.md |\n| Service rep and service manager | Resolve cases and write notes; when a big customer has a run of escalations, the service manager tells the account team by message, if they think of it | Every case; escalations ad hoc | Service agents spent 39% of their time serving customers in 2024, the rest on admin, meetings and notes | Not counted in the sales numbers below | Slack, email | https://www.cxtoday.com/workforce-engagement-management/salesforce-contact-center-agents-spend-just-39-of-their-time-servicing-customers/ |\n\n## The double cost today\n\nA typical customer pays for the product twice: the licence, and the time their people spend using it. Only the sales workflows tied to the problem are counted.\n\n| | Per year | How we got it |\n|---|---|---|\n| Licence | $74,880 | 32 Sales Cloud seats (25 reps, 5 managers, 2 revenue operations) `[PM, illustrative]` × $195 a user a month for Core, billed annually (https://www.salesforce.com/sales/pricing/, via `../product.md`) × 12 |\n| Labour: reps keeping records and answering the chase | $248,400 | 25 reps × 3 hours a week (2 measured for data entry, 1 `[PM, illustrative]` for the chase) × 46 working weeks `[assumed]` × $72 an hour loaded |\n| Labour: managers chasing and rebuilding the forecast | $93,840 | 5 managers × 4 hours a week `[PM, illustrative]` × 46 weeks × $102 an hour loaded |\n| Labour: revenue operations on hygiene and reports | $53,728 | 2 people × 8 hours a week `[PM, illustrative]` × 46 weeks × $73 an hour loaded |\n| **Total** | **$470,848** | The labour ($395,968) is a bit over five times the licence |\n\n**Loaded hourly cost.** Median pay, May 2025: sales representatives for technical and scientific products $104,920 a year (https://www.bls.gov/ooh/sales/wholesale-and-manufacturing-sales-representatives.htm), sales managers $71.28 an hour (https://www.bls.gov/ooh/management/sales-managers.htm), and computer systems analysts, used as a stand-in for revenue operations and admins, $50.89 an hour (https://www.bls.gov/ooh/computer-and-information-technology/computer-systems-analysts.htm). Wages are 70% of what private employers pay per employee hour, benefits the other 30% (June 2026, https://www.bls.gov/news.release/ecec.nr0.htm), so each wage is divided by 0.70: $104,920 ÷ 2,080 hours ÷ 0.70 = $72; $71.28 ÷ 0.70 = $102; $50.89 ÷ 0.70 = $73. Reps' pay here leaves out commission, so the true cost of their hours is likely higher.\n\n## The experiences at a glance\n\n| # | Experience | Persona | Trigger | Level today → with agents | In or around the product | Why it matters |\n|---|---|---|---|---|---|---|\n| 1 | The deal record that keeps itself | Account executive | A call, meeting or email with a buyer ends | 2 → 4 | In: the opportunity, with approvals in Slack | Removes the typing and the reason records go stale |\n| 2 | The forecast call without the chase | Sales manager or VP of sales | The forecast call is coming | 2 → 4 | In: Forecasts and the pipeline, with a brief in Slack | The job itself: know where every deal stands without asking |\n| 3 | Step in before a deal slips | Sales manager, with the rep | A deal starts to look like ones that slip | 1 → 4 | In: the opportunity and the manager's calendar | Covers Modify, the step nothing covers today |\n| 4 | Pipeline hygiene without the bulk reset | Revenue operations or admin | Data that breaks the forecast appears | 1 → 4 | In: the platform's rules and reports | Fixes records at the source instead of resetting dates in bulk |\n| 5 | Service signals reach the deal | Service manager and account executive | A customer's cases spike or an escalation opens | 2 → 4 | Around: from Service Cloud into the sales deal | The forecast misses what support already knows |\n\n## 1. The deal record that keeps itself\n\n**Persona:** the account executive (`personas/p2-marcus.md`) · **Trigger:** a call, meeting or email thread with a buyer ends · **Outcome:** the opportunity reflects what was said and agreed, and the rep confirmed it without typing it.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Rep finishes a call and moves on; notes sit in a notebook or a recorder | The agent reads the transcript, emails and calendar for that deal | nothing |\n| 2 | Later, rep opens the opportunity and logs the activity | The agent logs the activity and links it to the right contacts | nothing |\n| 3 | Rep updates stage, amount, close date and next step from memory, often in a batch | The agent proposes changes, each with the sentence or email that justifies it | approves, edits or rejects each change in one tap |\n| 4 | Rep checks whether activity capture picked up the email | The agent shows what it couldn't place, such as an email to an unknown contact | handles the exception |\n| 5 | Manager finds out about changes at the next forecast call | Approved changes appear in the pipeline straight away, marked as agent-proposed and rep-confirmed | nothing |\n\n- **Data it needs:** call transcripts, email and calendar, the opportunity and its history. We hold the record and captured activity (Einstein Activity Capture, call summaries); transcripts may sit in Gong or another recorder the customer pays for.\n- **What the agent decides alone, and what it hands to a person:** alone: logging activity and linking contacts. Handed to the rep: any change to stage, amount, close date or forecast category.\n- **What could go wrong, and how the person stays in control:** a wrong close date lands in the commit; the rep stops reading and accepts everything. The rep sees the evidence for each change, nothing reaches the forecast without the rep, and a change history shows who confirmed what.\n- **Hours it gives back:** about 1.5 of the 2 hours a week of data entry per rep (half an hour stays for reviewing): 69 hours a year per rep, 1,725 for a typical customer.\n- **How we'd know it works:** the share of proposed changes reps accept without editing; past-due close dates on open deals.\n- **What the panel said:** the rep and the advisor back this one first. The sceptic wants field history to show \"agent-proposed, rep-confirmed\" and would stop when reps accept everything in one tap; the rep would stop the first time it silently stops capturing (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 2. The forecast call without the chase\n\n**Persona:** the sales manager or VP of sales (`personas/p1-priya.md`) · **Trigger:** the weekly forecast call is coming · **Outcome:** the manager walks in knowing what changed, which deals need them, and a commit with a range and the reasons, without having messaged a single rep.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Manager opens the pipeline and spots past-due dates and old next steps | The agent checks every open deal against what actually happened since last week | nothing |\n| 2 | Manager messages reps one by one; reps stop selling to reply | The agent asks the rep only about the gaps it can't fill, in Slack, one question per deal | the rep answers the exceptions |\n| 3 | Manager copies numbers into their own forecast sheet | The agent drafts the commit, best case and a range, with the deals that move the number | reviews |\n| 4 | Manager adjusts by judgement, privately | The manager overrides any deal and says why; the agent keeps the reason | approves or overrides |\n| 5 | Forecast call is a round of updates | The brief lists what changed, the three deals that need the manager, and why | runs a shorter call on the deals that matter |\n\n- **Data it needs:** opportunities and their history, captured activity, the rep-confirmed changes from experience 1, last quarters' forecasts against what closed. All in Sales Cloud today; past forecast accuracy is there if the customer uses Forecasts.\n- **What the agent decides alone, and what it hands to a person:** alone: what changed and which deals to flag. Handed to the manager: the commit itself, every override, anything said to the VP or board.\n- **What could go wrong, and how the person stays in control:** the brief misses a deal the manager knows is at risk; reps feel watched. The manager can override and the reason is kept; the brief shows its evidence; reps see the same view of their own deals that the manager sees.\n- **Hours it gives back:** managers from about 4 hours a week to 1: 138 hours a year each, 690 for a typical customer. Reps from about 1 hour a week answering the chase to a quarter of an hour: 862 hours a year for a typical customer.\n- **How we'd know it works:** managers stop messaging reps for updates before the call; the share of teams landing within 5% of their forecast.\n- **What the panel said:** the buyer backs this one first, with the rep's confirm step, but would keep her spreadsheet beside it until the brief proves itself and pay only by cutting a tool on top. The sceptic would stop the first week the brief and the Forecasts tab disagree; the rep never wants his manager to see a draft of his deal before he does (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 3. Step in before a deal slips\n\n**Persona:** the sales manager, with the rep (`personas/p1-priya.md`, `personas/p2-marcus.md`) · **Trigger:** a deal starts to look like the ones that usually slip: the buyer's champion goes quiet or leaves, security review hasn't started, the next step keeps moving · **Outcome:** the manager and rep agree what to do while there's still time, instead of finding out at quarter end.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Manager notices, if at all, from memory or the forecast call | The agent spots the pattern and the reason, from activity and the team's past deals | nothing |\n| 2 | Manager asks the rep in a one-to-one | The agent sends both a short note: what it sees, and two possible plays | the rep reviews |\n| 3 | Rep and manager decide what to do | The agent books time if both want it, and drafts the email to a new contact | approves, sends |\n| 4 | Nobody checks whether it worked | The agent records the play and whether the deal moved | nothing |\n\n- **Data it needs:** activity, opportunity history, the team's won and lost deals; job changes from outside the CRM, which we don't hold for most customers.\n- **What the agent decides alone, and what it hands to a person:** alone: which deals to flag. Handed to people: every play, every email, every meeting.\n- **What could go wrong, and how the person stays in control:** too many flags and the manager ignores them; a rep feels second-guessed. Flags are capped per week and the rep sees them first.\n- **Hours it gives back:** few. It moves the manager's time from chasing to coaching rather than saving it, so it isn't counted in the economics.\n- **How we'd know it works:** deals flagged early that still close in the quarter; managers' time in one-to-ones spent on flagged deals.\n- **What the panel said:** the buyer calls it \"the deal I lost\"; the rep's hard line is that no flag reaches his manager before him; the sceptic notes we don't hold job-change data (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 4. Pipeline hygiene without the bulk reset\n\n**Persona:** revenue operations or the Salesforce admin (`personas/p3-elena.md`) · **Trigger:** data that will break the forecast appears: a past-due close date, a deal with no next step, a duplicate opportunity · **Outcome:** each record is fixed by the person who knows the deal, and revenue operations sets the rules instead of doing the clean-up.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Admin runs a report of bad records each week or quarter | The agent watches for the rules revenue operations set | sets the rules |\n| 2 | A scheduled job moves every past-due date to the start of the month | The agent asks the owner for the real date, with what it knows from activity | the rep answers |\n| 3 | Admin chases owners by email | The agent follows up once and escalates to the manager if needed | handles the exception |\n| 4 | Admin explains why the report doesn't match the forecast | The agent keeps a log of what changed, by whom and why | reviews |\n\n- **Data it needs:** the records, validation rules, field history. All in Sales Cloud.\n- **What the agent decides alone, and what it hands to a person:** alone: finding problems and asking owners. Handed to people: any change to a deal's value or date; the rules themselves.\n- **What could go wrong, and how the person stays in control:** reps get nagged and ignore it; the agent changes records nobody asked it to. It never edits values on its own, and revenue operations can switch any rule off.\n- **Hours it gives back:** revenue operations from about 8 hours a week to 2: 276 hours a year each, 552 for a typical customer.\n- **How we'd know it works:** past-due close dates on open deals; tickets about forecast numbers that don't match.\n- **What the panel said:** the sceptic backs this one first: it replaces her scheduled reset and nudge flow. The buyer sees it as revenue operations' win, not hers to fund; the rep would mute it after the third nag in a week (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## 5. Service signals reach the deal\n\n**Persona:** the service manager and the account executive · **Trigger:** a customer's cases spike, or an escalation opens on an account with an open deal or a renewal · **Outcome:** the account team and the forecast know what support knows.\n\n| Step | Today | With the agent | The person's part |\n|---|---|---|---|\n| 1 | Service manager sees a spike in cases, if they look | The agent watches case volume and escalations per account | nothing |\n| 2 | Service manager messages the account team, if they think of it | The agent attaches a short summary to the open deal or renewal and tells the owner | the rep reviews |\n| 3 | The deal stays in commit until it slips | The agent suggests a change to the deal's risk, with the cases behind it | the rep approves or rejects |\n\n- **Data it needs:** cases in Service Cloud and deals in Sales Cloud for the same account. We hold both when the customer runs both clouds; many run service elsewhere.\n- **What the agent decides alone, and what it hands to a person:** alone: the summary and who to tell. Handed to people: any change to the deal.\n- **What could go wrong, and how the person stays in control:** a noisy week of cases scares a deal that was fine. The rep decides; the summary shows the cases.\n- **Hours it gives back:** few; its value is a forecast that doesn't miss what support knows. Not counted in the economics.\n- **How we'd know it works:** deals at accounts with escalations that slip without warning.\n- **What the panel said:** everyone said it only matters if support runs on Service Cloud, and nobody would let it change a deal's risk from a case count (`panel.md`). *Synthetic panel: hypotheses, not evidence.*\n\n## The new economics\n\nFor a typical customer, today against with agents. Agents are priced as a share of the labour they save, so the customer clearly wins.\n\n| | Today | With agents |\n|---|---|---|\n| Licence | $74,880 | $74,880 |\n| Agents (new) | – | $48,000 |\n| Labour using the product | $395,968 | $98,992 |\n| **Total for the customer** | **$470,848** | **$221,872** |\n\n- **Labour:** 4 times lower; 3,829 hours a year back across the reps, managers and revenue operations, for selling and coaching.\n- **The customer saves:** $248,976 a year, 53%.\n- **Our revenue per customer:** from $74,880 to $122,880, 1.6 times.\n- **Working:** remaining labour: reps 25 × 0.75 hours a week (half an hour reviewing proposed changes, a quarter of an hour on the agent's questions) × 46 × $72 = $62,100; managers 5 × 1 hour × 46 × $102 = $23,460; revenue operations 2 × 2 hours × 46 × $73 = $13,432. Labour saved: $395,968 − $98,992 = $296,976. Agents priced at 32 users × $125 a user a month × 12 = $48,000, the list price of the Agentforce for Sales add-on today (https://www.salesforce.com/agentforce/pricing/, via `../product.md`), which is about 16% of the labour saved. That list price is a placeholder for the full set of experiences 1, 2 and 4; the price for this product update (experiences 1 and 2) is chosen in `../roadmap/roi.md`: $45 a user a month, a fixed line at renewal. The hours a week left after agents are assumptions `[PM, illustrative]`; the people counts are `[PM, illustrative]`; prices and wages are measured. Experiences 3 and 5 aren't counted.\n- **What this leaves out:** what the customer pays Gong, Clari or others today. If the agents replace part of that, the customer saves more; if they don't, the saving stands as above.\n\n`[PM, illustrative]` Would customers pay for agents at that price, for that saving? We think yes for teams that already feel the chase, but only once the acceptance rate in experience 1 is proven. The synthetic buyer said \"not now\": the hours saved aren't cash unless they replace a tool or a hire, so the agents have to replace what's spent on tools on top (`panel.md`).\n\n## The experience to explore first\n\n**The forecast call without the chase (2), with the rep's confirm step from experience 1 built in**, because it is the chosen problem in the manager's own terms, the manager is the buyer, and the switching verdict in `../problem/framings.md` says anxiety decides it: reps must see and correct every change. Testing the two together tests whether managers believe a record their reps confirmed but didn't type.\n\nIt's small enough to prototype end to end: one sales team's sample data (five reps, about fifteen open deals, a few call transcripts and email threads as text, in a Salesforce developer org or plain files). The agent reads each deal and its activity and proposes the current stage, close date and next step, each with its evidence. A rep screen accepts, edits or rejects each change. The manager gets a one-page brief: what changed since last week, the three deals that need them and why, and a commit with a range. The manager overrides one deal with a reason, and the brief updates. No live integrations, no Slack, no learning across customers. Build in what the panel asked for: the rep sees and confirms each change before the manager's brief shows it, every change carries who confirmed it and why, and the brief's commit adds up to the same total as the deals behind it.\n\n**Open questions for real customers:**\n- When a deal slipped without warning, did the rep know earlier? (The riskiest assumption in `../problem/problem.md`; the synthetic rep said yes.) Would seeing a flag before their manager make them share bad news sooner?\n- What share of agent-proposed changes would a rep accept without editing, and what would make a manager trust them?\n- Would the manager drop their own forecast sheet, or keep it beside the brief?\n- Would the agents be paid from the sales budget, or from what's spent on Gong or Clari today?\n", "research/icp.md": "# Our ideal customer · Salesforce Sales Cloud and Service Cloud\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. Anything tagged `[PM, illustrative]` is invented to show what a product manager would add.\n\nThe account we most want to win: the most pain, the money to fix it, and a reason to choose us. Every line ends with its source: `[source: <url>]`, `[PM]` or `[assumed]`. No `documents/` in this example. Built on 27 Oct 2026.\n\n## The account\n\n| | |\n|---|---|\n| Segment | Mid-market B2B software company selling to other businesses through account executives `[PM, illustrative]`; the segment named in `../problem/framings.md` |\n| Size (sites, people, revenue) | About 300 employees; 25 account executives, 4 front-line sales managers and a VP of sales, 2 revenue operations people `[PM, illustrative]` |\n| Region | North America first `[PM, illustrative]` |\n| Independent, or part of a group (and where budget goes) | Independent, venture- or private-equity-backed; sales tools come out of the VP of sales' budget, with finance signing above a threshold `[assumed]` |\n| What they run on (our product, modules, other systems, spreadsheets) | Sales Cloud on Core or Enterprise with Forecasts and Activity Capture; Gong or Clari on top; Slack; managers' own forecast spreadsheets `[PM, illustrative]` [source: https://www.revopscoop.com/post/salesforce-forecasting] |\n| How long they've been a customer, or why they aren't one | Customer for several years; renewing yearly `[PM, illustrative]` |\n\n## Why they are ideal\n\n| | |\n|---|---|\n| The pain they feel most | The VP can't believe the pipeline without chasing; managers rebuild the forecast by hand [source: https://news.ycombinator.com/item?id=33135245] [source: https://www.gong.io/press/as-economic-headwinds-grow-stronger-only-24-of-sales-leaders-are-confident-in-their-teams-revenue-forecast] |\n| What it costs them today | About $396,000 a year of people's time on keeping records, chasing and rebuilding the forecast, on top of a $74,880 licence (working in `experiences.md`) |\n| Why they would pay to fix it, and how (tier, add-on, price rise, renewal) | An add-on at renewal, paid from what they spend on tools on top today; Gong deals have a median of about $55,000 a year [source: https://vendr.com/marketplace/gong] `[PM, illustrative]` |\n| Why us, not someone else | We hold the record every tool on top reads from, and its history; reps and managers already work in it (`../problem/framings.md`, Why us) |\n| How many customers look like this | Not known. Salesforce doesn't report customer counts by size; trackers disagree (`market.md`, segments) |\n\n## The people inside\n\n| Role in the decision | Persona file | Title |\n|---|---|---|\n| Buyer (signs) | `personas/p1-priya.md` | VP of sales |\n| Day-to-day user | `personas/p2-marcus.md` | Account executive |\n| Sceptic | `personas/p3-elena.md` | Revenue operations lead and Salesforce admin |\n| Edge of the market | `personas/p4-sam.md` | Financial advisor at a mid-size RIA (adjacent segment) |\n\n## Who is not our ideal customer, and why\n\n- **Small teams on Starter or Pro** with a handful of sellers: the founder is the forecast, and the chase is a conversation over coffee. The labour saved is too small for an add-on. `[PM, illustrative]`\n- **Large enterprises with a forecasting team and Clari built into their process:** the pain is real but the habit is strong, and the sale is a multi-year replacement. Later. `[PM, illustrative]`\n- **Companies that don't record calls or allow email capture,** for legal or cultural reasons: the agent has little to read. `[assumed]`\n", "research/market.md": "# Salesforce Sales Cloud and Service Cloud · The problem in the market\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. Anything tagged `[PM, illustrative]` is invented to show what a product manager would add.\n\nHow each type of customer experiences the problem in `../problem/problem.md`, and the options they have today. Built from public sources and the product manager's answers on 27 Oct 2026; there is no `documents/` folder in this example (`evidence.md`). Every claim has its source.\n\n**The problem:** when the quarter is on the line and the forecast call is coming, a sales manager wants to know where every deal really stands and which ones need them, without chasing reps, so they can call the number with confidence and spend their time coaching.\n\n## In their words\n\nHow each persona talks about the problem, from forums, newsletters, job postings and reviews. Paraphrased unless in quotation marks.\n\n| Persona type | How they describe it | What they're measured on | Source |\n|---|---|---|---|\n| Account executive | Updating Salesforce is tedious, done mostly so the manager is happy; up to an hour a day. Call recordings get stored and never looked at again | Quota; record upkeep is checked only when they miss it | https://beyondsnakeoil.substack.com/p/just-let-ai-help-you-sell-more · https://news.ycombinator.com/item?id=33132951 · https://news.ycombinator.com/item?id=33135245 |\n| Sales manager or VP of sales | \"Our reps have atrocious CRM hygiene.\" They spend a lot of their time chasing reps for the minimum, and insist on one field: the forecast category | A forecast others can plan from; team quota | https://news.ycombinator.com/item?id=33135245 |\n| Sales leader running the forecast call | Emails the forecast dashboard the night before; when deals move slowly, each week repeats last week's update | The number called to the CEO and finance | https://cmo2cro.substack.com/p/efficient-effective-forecast-calls |\n| Revenue operations or admin | Past-due close dates make the pipeline useless for forecasting, so leaders fall back on one-to-ones and anecdote. Some companies hire a person just to chase reps until fields are filled | Salesforce data accuracy and completeness; forecast accuracy | https://revengine.substack.com/p/automatically-nudging-reps-to-update · https://careers.greenfield-growth.com/companies/vast-data/jobs/92220906-sales-data-management-specialist · https://builtin.com/job/manager-revenue-operations-analytics/7780783 |\n| Revenue operations or admin, on AI | Trust is the biggest barrier to AI, ahead of cost: people will pay for systems they trust | Same | https://www.salesforceben.com/5-reasons-salesforce-professionals-distrust-ai/ |\n| Service lead | AI gives wrong answers when knowledge is out of date; cleaning data first takes months. Escalations reach the account team in a weekly report, sometimes after the renewal call | Resolution and cost per case; for customer success, health scores and renewals | https://aws.amazon.com/marketplace/reviews/reviews-list/prodview-xdmwnsnyxbqou · https://tray.ai/blog/support-history-in-crm/ · https://www.kustomer.com/resources/blog/cx-b2b-renewal-decisions/ |\n| Financial advisor (adjacent) | Notes in the meeting pull attention from the client; notes afterwards miss follow-ups; the advisor stays liable for the tool's mistakes | Client relationships and compliance records `[assumed]` | https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/ |\n\n## The problem through each persona's eyes\n\n| Persona type | How they see the problem | How often, what it costs | What they do now | What they've tried | What would make them switch | What worries them |\n|---|---|---|---|---|---|---|\n| Buyer: sales manager or VP of sales | \"I can't believe the pipeline, so I chase and rebuild it myself\" | Every week, worst at quarter end; about 4 hours a week `[PM, illustrative]`; only 24% of leaders trust reps' commits ([Gong](https://www.gong.io/press/as-economic-headwinds-grow-stronger-only-24-of-sales-leaders-are-confident-in-their-teams-revenue-forecast)) | Messages reps, keeps a personal forecast sheet, runs a weekly call ([RevOps Coop](https://www.revopscoop.com/post/salesforce-forecasting)) | Validation rules, Clari or Gong on top `[PM, illustrative]` | A forecast that is current without asking, and that replaces the spreadsheet | Paying twice for the same view; reps feeling watched |\n| User: account executive | \"Admin that keeps my manager happy and takes me away from selling\" | After every touch; about 2 hours a week of data entry ([State of Sales](https://www.salesforce.com/news/stories/state-of-sales-report-announcement-2026/)) | Batches updates before the call; notes elsewhere ([Scratchpad](https://www.scratchpad.com/blog/salesforce-issues), vendor view) | Activity Capture, note-takers `[PM, illustrative]` | Never typing a stage or date again, and being asked less | Wrong changes in their name; the manager seeing everything first |\n| Sceptic: revenue operations or admin | \"Bad data in, bad forecast out, and I'm the one who gets blamed\" | Weekly clean-ups, quarterly resets ([RevOps Coop](https://www.revopscoop.com/post/salesforce-forecasting)) | Validation rules, nudging flows, bulk resets ([RevEngine](https://revengine.substack.com/p/automatically-nudging-reps-to-update)) | Activity Capture, whose email wasn't reportable ([Revenue Grid](https://revenuegrid.com/blog/einstein-activity-capture-limitations/), competitor) | Fewer tickets and resets, with a log of every change | AI they can't audit; another tool to own; trust over cost ([Salesforce Ben](https://www.salesforceben.com/5-reasons-salesforce-professionals-distrust-ai/)) |\n| Service lead | \"Support knows a customer is unhappy long before sales does\" | On escalations and before renewals ([Tray.ai](https://tray.ai/blog/support-history-in-crm/), vendor) | Messages the account team, if they think of it `[PM, illustrative]` | Weekly escalation reports | Escalations that reach the deal on their own | AI giving wrong answers to customers ([G2 via AWS](https://aws.amazon.com/marketplace/reviews/reviews-list/prodview-xdmwnsnyxbqou)) |\n| Adjacent: financial advisor | \"Every meeting means notes, tasks and a CRM update before the next one\" | Every client meeting; more than two hours behind the scenes for every hour with clients, per Kitces research *(search result only)* | AI notetakers, now used widely ([Family Wealth Report](https://www.familywealthreport.com/printarticle.php?id=207153)) | Switching notetakers on price ([Advisor.ca](https://advisor.ca/practice/technology/what-advisors-need-to-know-about-ai-notetaking-apps/)) | Notes that land in the CRM correctly and pass compliance | Liability for errors ([Kitces](https://www.kitces.com/blog/artificial-intelligence-ai-meeting-notetakers-note-tools-client-communication-accuracy-domentation/)) |\n\n## The options they have today\n\n| Option | What it is | Who uses it | What it costs | Good at | Bad at | Source |\n|---|---|---|---|---|---|---|\n| Do nothing | Accept a stale pipeline and forecast by judgement | Teams where reps hit quota | Selling time and a forecast few trust | No new tool | Surprises at quarter end | https://news.ycombinator.com/item?id=33135245 |\n| Spreadsheets and manual updates | Reps update by hand; managers roll up commits in a sheet and run a weekly call | Almost every team, often beside Salesforce Forecasts | No licence; managers' and reps' time (see `experiences.md`) | Flexible; keeps the manager's judgement | Stale between calls; depends on rep discipline | https://www.revopscoop.com/post/salesforce-forecasting · https://cmo2cro.substack.com/p/efficient-effective-forecast-calls |\n| Rules and nudges in Salesforce | Validation rules, reminder flows, a person who chases reps | Revenue operations | An admin's time, or a full-time hire | Forces the minimum | Reps fill fields to get past the rule | https://revengine.substack.com/p/automatically-nudging-reps-to-update · https://careers.greenfield-growth.com/companies/vast-data/jobs/92220906-sales-data-management-specialist |\n| Build their own | Zapier or similar plus a language model writing to Salesforce | Teams with a technical owner | Zapier from $19.99 a month; a custom build quoted at tens of thousands of dollars by a vendor that sells builds | Fits their process | Someone has to own accuracy and upkeep | https://zapier.com/pricing · https://www.raftlabs.com/blog/gong-pricing |\n| Our product today: Forecasts and Pipeline Inspection | Forecast roll-ups and a view of pipeline changes, with alerts on pushed or quiet deals and one-click field updates | Enterprise edition and up | Included in the seat (Core $195 a user a month) | In the record; no extra tool | Shows the gaps but doesn't fill them | https://www.salesforce.com/ap/blog/sales-cloud-product-release/ · https://www.salesforce.com/sales/pricing/ |\n| Our product today: Einstein Activity Capture | Logs email and calendar to the deal | Reps, set up by admins | Included; free tier capped at 100 users | No typing for activity | Captured email sat outside reports; limited history; deals still need updating by hand | https://revenuegrid.com/blog/einstein-activity-capture-limitations/ (competitor) |\n| Our product today: Agentforce for Sales | Agents for leads and deal work; Momentum, bought in March 2026, writes next steps and risk from calls into fields | Sales Cloud customers on the add-on | $125 a user a month add-on; Flex Credits $500 per 100,000 | Native, writes to the record | New; pricing hard to follow, per reviews quoted by a competitor | https://www.salesforce.com/agentforce/pricing/ · https://www.salesforce.com/news/stories/salesforce-signs-definitive-agreement-to-acquire-momentum/?bc=OTH · https://oliv.ai/blog/agentforce-sales-coach |\n| Gong | Records calls, updates fields, forecasts | Mid-market and enterprise sales teams | Not published; median deal about $55,000 a year (Vendr) | Conversation intelligence; forecasts grounded in calls | Cost and platform fee; forecasting sold separately | https://vendr.com/marketplace/gong |\n| Clari (now Clari + Salesloft) | Forecasting on top of the CRM | Sales leaders and revenue operations | Not published; median deal about $76,000 a year (Vendr) | Forecast roll-ups managers like | Only as good as the CRM data underneath | https://www.vendr.com/buyer-guides/clari · https://salesloft.com/company/newsroom/clari-salesloft-merger |\n| Activity capture tools | People.ai (now Backstory) captures email and meetings; Scratchpad gives reps a faster grid to update Salesforce | Larger teams on Salesforce; individual reps | Backstory not published, about $23,000 a year median per a third party; Scratchpad $16 a user a month annually | Less clicking | Heavy to set up (Backstory); still typing (Scratchpad) | https://leadhaste.com/blog/peopleai-review-2026 · https://www.scratchpad.com/pricing |\n| HubSpot Sales Hub | A different CRM; deal progression suggests stage and date from meeting notes for a rep to approve (beta in 2026) | Small and mid-market teams | Professional $90–$100 and Enterprise $150 a seat a month, plus onboarding | Simple; rep approves each change | Means leaving Salesforce | https://www.hubspot.com/pricing/sales · https://www.spotdev.co.uk/blog/hubspot-breeze-closing-and-data-agents |\n| AI-native CRMs | Attio, Day.ai, Lightfield: CRMs that fill records from email and meetings | New and smaller teams | Attio Pro $79 a seat a month annually; Day.ai from $24 a month; Lightfield Pro $999 a month per workspace | Records kept current without typing (Lightfield's claim) | Full migration; unproven at enterprise scale | https://attio.com/pricing · https://day.ai/pricing · https://lightfield.com/pricing |\n| Assistants and note-takers | Microsoft 365 Copilot sales agent; Salesforce in Claude; Fathom, Otter, Fireflies pushing notes to the CRM | Reps who record meetings | Fathom Business $25 a user a month annually; Otter Business $19.99; Copilot for Sales reported at $50 standalone *(third party)* | Cheap, quick notes | Notes, not a forecast; only covers recorded meetings | https://fathom.ai/pricing · https://otter.ai/pricing · https://www.salesforce.com/news/?p=94766 |\n| Outsource it | Virtual assistants update close dates and chase notes; fractional revenue operations fixes process | Teams without revenue operations | Virtual assistants from about $10–$15 an hour (a staffing firm's offer) | Cheap hands | No deal context; still chasing reps | https://stealthagents.com/virtual-assistant-salesforce-support |\n\n**What no option does well today:** keep every deal current from what actually happened, with the rep confirming rather than typing, and hand the manager a forecast that replaces the spreadsheet, inside the record everyone already uses. Tools on top see the calls but depend on the record; the record holds everything but waits for reps to type.\n\n## The segments\n\n| Segment | How many organisations | Who buys | Why it hurts now | Source |\n|---|---|---|---|---|\n| Our core segment: mid-market B2B companies on Sales Cloud with 8–40 sellers | Not reported by Salesforce. Technology trackers count between about 4,000 and 15,000 companies using Sales Cloud, too far apart to rely on *(search results only)* | VP of sales with revenue operations | AI-native CRMs and tools on top now fill fields from calls; leaders still don't trust commits | https://enlyft.com/tech/products/salesforce-com-sales-cloud · https://data.landbase.com/technology/salesforce-sales-cloud/ · `../problem/framings.md` |\n| Financial advisors (RIAs, broker-dealers) | About 299,400 personal financial advisor jobs in the US in 2025 (BLS); Cerulli counted 283,137 advisors at the end of 2023 | The advisor or the firm's operations lead | Notetakers spread fast; compliance and CRM integration decide the choice | https://www.bls.gov/ooh/business-and-financial/personal-financial-advisors.htm · https://www.wealthmanagement.com/industry/cerulli-advisor-headcount-stagnates |\n| Car dealership sales | Not measured | Sales manager | Managers inspect logging daily and tie leads to it | https://forum.dealerrefresh.com/threads/how-often-do-your-sales-reps-actually-update-the-crm-after-customer-calls.13520/ |\n| Recruiters and staffing firms | Not measured | Recruiting lead | Notes after every interview, kept current for the hiring manager | https://recruiterflow.com/blog/recruiter-time/ |\n\n## What we looked for and didn't find\n\n- Reddit threads and full G2, Capterra and TrustRadius reviews from Sales Cloud users: the pages couldn't be opened.\n- A first-hand account of a rep hiding bad news on purpose. What exists points to optimism, pressure and lack of time.\n- Any rep saying they would or wouldn't trust a record they didn't type.\n- Official prices for Gong, Clari, Backstory and Salesforce Revenue Intelligence: none are published.\n- A measured count of how long managers spend chasing and rebuilding the forecast.\n- What service managers are measured on, from job postings.\n", "research/panel.md": "# Salesforce Sales Cloud and Service Cloud · The panel\n\n> Illustrative. Built from public sources; not affiliated with or endorsed by Salesforce. The personas are synthetic and the product manager's choices are invented, tagged `[PM, illustrative]`.\n\nSynthetic personas generate hypotheses. A real customer's yes is evidence; a persona's yes is not. Each persona answered in its own subagent, seeing only its own file and the material being judged, the sceptic first. Run on 27 Oct 2026.\n\n## The roster\n\n| Persona | Role | Segment | How they see the problem | Would pay for | Won't tolerate | Share `[assumed]` |\n|---|---|---|---|---|---|---|\n| [Priya](personas/p1-priya.md) | VP of sales (buyer) | Mid-market B2B software | \"I can't believe the pipeline unless I've chased every rep myself\" | Knowing what changed and which deals need her, without asking | A forecast that changes without a reason she can repeat | 6% |\n| [Marcus](personas/p2-marcus.md) | Account executive (user) | Mid-market B2B software | \"Updating Salesforce is something I do for my manager\" | Never typing a stage or date again | His manager hearing about his deal before he does | 0% |\n| [Elena](personas/p3-elena.md) | Revenue operations lead (sceptic) | Mid-market B2B software | \"Junk data, junk forecast, and I get asked why\" | No more bulk resets or \"why doesn't this match?\" tickets | Changes to opportunity fields without a log | 0% |\n| [Sam](personas/p4-sam.md) | Financial advisor (adjacent) | Mid-size RIA | \"Every meeting creates follow-up, and I'm liable if it's wrong\" | Notes, tasks and the CRM done right after each meeting | A compliance record he hasn't reviewed | 11% |\n\nAcross the panel, 117 tagged fields: 47 sourced, 65 `[PM, illustrative]`, 5 `[assumed]` (4%). There are no customer documents in this example, so the product manager's input carries much of each persona; a real run would replace it with interview notes.\n\n## Interview: Marcus, account executive\n\nThe product manager asked the Mom Test questions from `../problem/problem.md`. Marcus answered in character, from his record; specific details such as the deal name are invented to fit it.\n\n**Tell me about the last deal that slipped without warning. When did you know?**\n\"It wasn't without warning, not for me. The logistics deal: the buyer told me on a call their budget was frozen, and I kept it in commit hoping it would thaw. My manager found out at the forecast call at quarter end. I'd known for weeks.\"\n\n**What was in the record the week before? Why?**\n\"Commit, the quarter-end close date, and a next step about a month old. My manager asks what closes this quarter, so that's the date I put in. Pulling it meant a conversation I didn't want to have yet.\"\n\n**What happened to you after it slipped?**\n\"My manager asked in Slack why the record didn't show it. I got pulled into a deal review, and for a few weeks I got 'where is this deal?' messages on everything I had.\"\n\n**Tell me about the last time you found a wrong number in the pipeline. How did you find it?**\n\"It wasn't a wrong number, it was nothing at all. Activity Capture stopped logging after a password reset and nobody told me. I found out when my manager asked why my deal had no activity.\"\n\n**When a tool logged activity for you, what did you still check by hand?**\n\"Whether the emails landed on the right deal, and whether it was still connected. Stage, close date and next step I always typed myself. The note-taker pushed summaries, never stages or dates.\"\n\n**What did you do after you found the mistake?**\n\"Reconnected it, then pasted the important threads in by hand that evening. Now I glance at the activity timeline before every forecast call. One more thing to check, which was the whole point of not having to.\"\n\n**Walk me through last week's forecast. Where did your numbers come from?**\n\"Late Thursday I batch-updated from my notes app and my memory of the calls. Gong had the recordings, but I didn't rewatch any. The close dates are mine, and they're optimistic. My manager messaged me about three deals anyway.\"\n\n**Would you use something that updated your deals for you?**\n\"Sure, maybe, if it really saves me clicks. Depends how it works. I'd have to see it.\"\n\n### Stepping out: feedback on the interview\n\n- **The three questions that got the most useful answers:**\n  1. \"When did you know?\" It surfaced that the rep knew weeks earlier and chose to keep the deal in commit: the riskiest assumption in `../problem/problem.md`, answered against us.\n  2. \"What was in the record the week before? Why?\" It showed why the date was wrong: the manager's question sets the date, not the buyer.\n  3. \"When a tool logged activity for you, what did you still check by hand?\" It showed the trust cost of silent failures: one outage, and he now checks every time.\n- **The polite non-answer:** \"Would you use something that updated your deals for you?\" A future, hypothetical question got \"sure, maybe\". Drop it from the real interviews.\n- **The one you should have asked:** \"When you kept that deal in commit, what would have made you pull it earlier?\" It tests whether the problem is time or motivation, and what an agent could change about it.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## Scoring the three framings\n\nEach persona rated pain (how much it hurts them today) and pay (how likely their organisation pays to fix it), 1 to 5, sceptic first.\n\n| Framing | Elena (sceptic) | Priya (buyer) | Marcus (user) | Sam (adjacent) | Average pain | Average pay | Spread |\n|---|---|---|---|---|---|---|---|\n| As stated | 3 / 2 | 3 / 2 | 4 / 1 | 2 / 1 | 3.0 | 1.5 | pain 2–4, pay 1–2 |\n| **The bigger job** (chosen) | 4 / 3 | 5 / 4 | 2 / 2 | 1 / 1 | 3.0 | 2.5 | pain 1–5, pay 1–4 |\n| The moonshot | 2 / 1 | 2 / 1 | 3 / 1 | 3 / 2 | 2.5 | 1.25 | pain 2–3, pay 1–2 |\n\nEach cell is pain / pay. Without the adjacent persona, the bigger job averages 3.7 for pain and 3.0 for pay.\n\nIn their words:\n\n- **Elena, the bigger job (4 / 3):** \"This is the 'why doesn't this match?' ticket. I'd fund it from the renewal or from what we pay for tools on top. But the VP signs, and I can still block it.\"\n- **Priya, the bigger job (5 / 4):** \"This is my week. It would come from my sales tools budget at the February renewal, but only if I can cut a tool on top.\"\n- **Marcus, the bigger job (2 / 2):** \"That's my manager's pain, not mine. If it's a manager dashboard built on my deals, I'll quietly undermine it.\"\n- **Sam, the bigger job (1 / 1):** \"Nobody chases me for deal updates. My clients chase me when a follow-up never happened.\"\n- **Marcus, as stated (4 / 1):** \"Two hours a week of typing for my manager. But I don't sign anything.\"\n- **Priya, the moonshot (2 / 1):** \"Nobody on my board is asking about 2031. There's no budget line for selling time.\"\n\n**Where they disagree:** the bigger job has the widest spread. The buyer and the sceptic feel it most and would pay; the rep, whose typing it depends on, feels it least and says he'd undermine a manager's view of his deals. \"As stated\" hurts the rep most, but nobody would pay for it. The adjacent persona doesn't recognise the bigger job at all: for advisors the problem is liability for notes, not a forecast.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## Reacting to the experiences\n\nEach persona walked through the five experiences in `experiences.md`, sceptic first.\n\n| Experience | Elena (sceptic) | Priya (buyer) | Marcus (user) | Sam (adjacent) |\n|---|---|---|---|---|\n| 1. The deal record that keeps itself | Helps if field history shows \"agent-proposed, rep-confirmed\". Stops when reps accept everything in one tap | Helps: no more \"scrub before the call\". Asks whose agent reads the calls already in Gong | **Backs it first.** Stops the first time it silently stops logging | **Backs it first**, as \"the household record that keeps itself\". Never links people on its own |\n| 2. The forecast call without the chase | Stops the first week the brief and the Forecasts tab show different totals | **Backs it first**, with experience 1's confirm step. Keeps her spreadsheet beside it until the brief proves itself | Never shows his manager a draft of his deal he hasn't seen | Doesn't apply |\n| 3. Step in before a deal slips | Needs job-change data we don't hold; won't let it email new contacts | \"It's the deal I lost.\" Never emails or books time with a buyer | Hard line: no flag reaches his manager before him | Barely applies: overdue follow-ups only |\n| 4. Pipeline hygiene without the bulk reset | **Backs it first**: it replaces her scheduled reset and nudge flow. Never edits values or her rules | Revenue operations' win, not hers to fund | Fine, until the third nag in a week | Mostly doesn't apply |\n| 5. Service signals reach the deal | Only if they run Service Cloud; never changes risk from a case count | Does nothing if support isn't on Service Cloud | Wants to know before his buyer brings it up | Doesn't apply |\n\n**Would the buyer pay about $48,000 a year for the agents?** Priya: not now. The labour saved isn't cash, because she isn't cutting people, and the agents sit on top of Salesforce and a call-recording tool. She'd pay from her sales tools budget at the February renewal if a pilot with one team showed managers stop chasing and the forecast landing within 5%, and only by cutting the call tool at its renewal. (The price for this product update is chosen in `../roadmap/roi.md`.)\n\n**The three changes that would win over the most personas:**\n\n1. **The rep sees and confirms everything first.** No change, flag or summary about a deal reaches the manager before the rep has seen it, and the tool says loudly when it stops capturing (Marcus, Sam, Priya).\n2. **One audit log in standard Salesforce reports, and one number.** Every agent action, with who confirmed it and why, reportable in ordinary reports and flows, not a separate store; the brief's totals always match the Forecasts tab (Elena, Priya).\n3. **Replace a tool, don't add one.** Read the calls customers already record, and price it as a fixed line at renewal, not unpredictable credits, so it can replace a tool on top rather than add a bill (Priya, Elena, Sam).\n\nThese are noted against each experience in `experiences.md`.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n\n## What changed, and the best objection\n\n**What changed:** the panel backs the chosen problem from the buyer's and the sceptic's side, but the rep's interview answered the riskiest assumption against us: he knew the deal had slipped and kept it in commit. If real reps say the same, the problem is partly motivation, not typing, and the experiences must make it safe for the rep to share bad news early (rep first, manager second) rather than simply read more of what the rep says.\n\n**The single best objection (Marcus):** \"My deals aren't stale because I can't type. Read my calls and show my manager first, and you've built surveillance: reps will stop putting the truth where your agent can see it.\"\n\nThe buyer's objection runs close behind: the truth about her lost deal was on a call recorded in Gong, not in Sales Cloud, so why pay twice to read the same conversation?\n\n`[PM, illustrative]` We'll offer to add a line to `../problem/problem.md` under what to learn before building: test with real reps whether a rep-first flow changes when they share bad news.\n\n*Synthetic panel: hypotheses, not evidence. Confirm with a real customer.*\n", "research/personas/p1-priya.md": "# p1 · Priya, VP of sales\n\n> Illustrative synthetic persona. Not a real person. Built from public sources and invented product-manager input, tagged `[PM, illustrative]`.\n\nmodelled_on: a mid-market B2B software company, about 300 employees, the ideal customer in `../icp.md` [PM, illustrative]\npanel_role: buyer\n\n## Background\n- organisation: B2B software, about 300 employees, North America [PM, illustrative]\n- group position: independent, investor-backed; sales tools come from her budget, finance signs above a threshold [assumed]\n- role and tenure: VP of sales, three years in role, reports to the CEO; four front-line managers and 25 account executives under her [PM, illustrative]\n- runs on: Sales Cloud with Forecasts and Activity Capture, Gong for calls, Slack, and her own forecast spreadsheet [PM, illustrative] [source: https://www.revopscoop.com/post/salesforce-forecasting]\n\n## Business\n- who signs: Priya up to her tools budget; CFO above it [assumed]\n- budget route: add-on at renewal, or money moved from a tool on top [PM, illustrative]\n- what they are measured on: the number she calls to the CEO and the board, and team quota [source: https://cmo2cro.substack.com/p/efficient-effective-forecast-calls]\n- renewal or contract moment: Salesforce renews in February; Gong in June [PM, illustrative]\n\n## Psychology\n- attitude to change: pragmatist; buys what peers already use [PM, illustrative]\n- trust in AI: uses AI summaries daily, but won't put a number in front of the board she can't explain [PM, illustrative]\n- burned by: a forecasting tool rolled out at her last company that nobody updated, so the numbers were as stale as the CRM [source: https://www.avoma.com/blog/clari-vs-gong] (reviews say Clari depends on CRM data quality; the incident itself is [PM, illustrative])\n- will not tolerate: a forecast that changes without a reason she can repeat to the CEO [PM, illustrative]\n- would pay for: walking into the forecast call knowing what changed and which deals need her, without a single \"where is this deal?\" message [source: https://news.ycombinator.com/item?id=33135245]\n\n## Capability\n- tech comfort: medium; lives in dashboards and Slack, not in Setup [PM, illustrative]\n- data they hold: opportunities and history in Sales Cloud, call recordings in Gong, her spreadsheet; close dates are often in the past [source: https://www.revopscoop.com/post/salesforce-forecasting]\n- time they can give a new tool: a short pilot with one team if it saves her managers time from week one [PM, illustrative]\n\n## The problem, through their eyes\n- the problem in their words: \"I can't believe the pipeline unless I've chased every rep myself.\" [source: https://news.ycombinator.com/item?id=33135245] (paraphrased)\n- how often it hits them, and what it costs them: every week, worst in the last month of the quarter; only 24% of sales leaders trust reps' commits [source: https://www.gong.io/press/as-economic-headwinds-grow-stronger-only-24-of-sales-leaders-are-confident-in-their-teams-revenue-forecast]\n- what they do about it today: managers message reps, she rebuilds the roll-up in her sheet, and runs a weekly forecast call [source: https://www.revopscoop.com/post/salesforce-forecasting]\n- options they've tried or considered: Gong for calls; looked at Clari but didn't want another roll-up on stale data [PM, illustrative]\n- what would make them switch: dropping her spreadsheet because the brief is better, and cutting a tool on top at renewal [PM, illustrative]\n- what worries them about a new way: an agent moving a deal into commit that her manager wouldn't have; reps feeling spied on [source: https://www.salesforceben.com/5-reasons-salesforce-professionals-distrust-ai/] (trust as top barrier among admins; her version is [PM, illustrative])\n\n## Behaviour\n- a normal day: checks Slack and the pipeline dashboard first thing, spends the middle of the day in deal reviews and one-to-ones, and updates her sheet before the forecast call [PM, illustrative]\n- workarounds: personal forecast spreadsheet; asks managers to \"scrub\" pipeline before each call [source: https://www.revopscoop.com/post/salesforce-forecasting]\n- last time it went wrong: a deal in commit slipped in the last week of the quarter; the rep had known the buyer's budget was frozen for weeks [PM, illustrative]\n- how they buy: asks two peer VPs, runs a pilot with one team, then revenue operations and finance review [PM, illustrative]\n\n## Buying insight\n- priority initiative: the board wants forecasts within 5% after two misses this year [PM, illustrative]\n- success factors: managers stop chasing; the forecast lands within 5%; one tool fewer [PM, illustrative]\n- perceived barriers: \"Salesforce AI\" has meant more add-ons and unclear pricing before [source: https://oliv.ai/blog/agentforce-sales-coach] (reviews quoted by a competitor)\n- decision criteria: compared with keeping Gong and adding Clari; accuracy of proposed updates; rep adoption [PM, illustrative]\n- buyer's journey: Priya, two front-line managers, revenue operations, finance; pilot, then decision at renewal [PM, illustrative]\n\n## Voice\n- sounds like: \"Don't give me another dashboard. Tell me which three deals need me this week, and why.\" [PM, illustrative]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| quote | \"Our reps have atrocious CRM hygiene.\" A manager who chases reps and insists on the forecast category | https://news.ycombinator.com/item?id=33135245 |\n| pain | 24% of sales leaders trust their reps' commits | https://www.gong.io/press/as-economic-headwinds-grow-stronger-only-24-of-sales-leaders-are-confident-in-their-teams-revenue-forecast |\n| workaround | Managers forecast from their own spreadsheet; bulk resets of past-due close dates | https://www.revopscoop.com/post/salesforce-forecasting |\n| workaround | Forecast dashboard emailed the night before; slow deals repeat last week's update | https://cmo2cro.substack.com/p/efficient-effective-forecast-calls |\n| objection | Clari depends on CRM data quality (G2 summary, via a vendor) | https://www.avoma.com/blog/clari-vs-gong |\n| budget signal | Gong median deal about $55,000 a year | https://vendr.com/marketplace/gong |\n\n**Grounding:** 33 tagged fields: 11 sourced, 20 `[PM, illustrative]`, 2 `[assumed]` (6%).\n", "research/personas/p2-marcus.md": "# p2 · Marcus, account executive\n\n> Illustrative synthetic persona. Not a real person. Built from public sources and invented product-manager input, tagged `[PM, illustrative]`.\n\nmodelled_on: a mid-market account executive at the ideal customer in `../icp.md` [PM, illustrative]\npanel_role: user\n\n## Background\n- organisation: B2B software, about 300 employees, North America [PM, illustrative]\n- group position: one of 25 account executives under four managers [PM, illustrative]\n- role and tenure: account executive, two years at the company, five in sales; reports to a front-line manager [PM, illustrative]\n- runs on: Sales Cloud, Activity Capture, Gong recording his calls, Slack, a notes app [PM, illustrative]\n\n## Business\n- who signs: not him; his VP [PM, illustrative]\n- budget route: not budgeted by him [PM, illustrative]\n- what they are measured on: quota; record upkeep only comes up when he misses it [source: https://news.ycombinator.com/item?id=33135245]\n- renewal or contract moment: none for him [PM, illustrative]\n\n## Psychology\n- attitude to change: early adopter for anything that saves clicks; resistant to anything that adds steps [source: https://news.ycombinator.com/item?id=33132951] (HN rep frustrated with clicks; his stance is [PM, illustrative])\n- trust in AI: uses AI to draft emails; doesn't trust it to put a close date in his name [PM, illustrative]\n- burned by: Activity Capture silently stopped logging after a password reset, and his manager asked why his deal had no activity [source: https://ideas.salesforce.com/s/idea/a0B8W00000GdVXoUAN/einstein-activity-capture-notification-of-disconnected-account] (seen in search results only)\n- will not tolerate: a tool that tells his manager about a problem in his deal before it tells him [PM, illustrative]\n- would pay for: not paying; he'd fight for whatever gives him back the hour a day of updates [source: https://beyondsnakeoil.substack.com/p/just-let-ai-help-you-sell-more]\n\n## Capability\n- tech comfort: medium [PM, illustrative]\n- data they hold: his deals in Sales Cloud, call recordings in Gong, notes in his own app; his close dates are optimistic [source: https://www.thesalesblog.com/blog/lies-mistruths-and-fabrications-in-your-sales-forecast]\n- time they can give a new tool: only if it saves time in the first week [PM, illustrative]\n\n## The problem, through their eyes\n- the problem in their words: \"Updating Salesforce is something I do for my manager, not for me.\" [source: https://beyondsnakeoil.substack.com/p/just-let-ai-help-you-sell-more] (paraphrased)\n- how often it hits them, and what it costs them: after every call, and in a batch before the forecast call; about 2 hours a week of data entry [source: https://www.salesforce.com/news/stories/state-of-sales-report-announcement-2026/]\n- what they do about it today: notes in his app, updates in a batch, answers his manager's Slack messages [source: https://www.scratchpad.com/blog/salesforce-issues] (vendor view)\n- options they've tried or considered: Activity Capture; a note-taker that pushed summaries but not stages or dates [PM, illustrative]\n- what would make them switch: never typing a stage or date again, and fewer \"where is this deal?\" messages [PM, illustrative]\n- what worries them about a new way: wrong updates in his name; being watched more closely; call recordings used against him [source: https://news.ycombinator.com/item?id=33132951] (recordings rarely reviewed; his worry is [PM, illustrative])\n\n## Behaviour\n- a normal day: calls and demos most of the day, emails between them, updates Salesforce late in the afternoon or not at all [PM, illustrative]\n- workarounds: notes app, batch updates, quarter-end close dates because the manager asks what closes this quarter [source: https://www.thesalesblog.com/blog/lies-mistruths-and-fabrications-in-your-sales-forecast]\n- last time it went wrong: he knew a buyer's budget was frozen but kept the deal in commit, hoping it would unfreeze [PM, illustrative]\n- how they buy: doesn't; tells his manager what the team likes [PM, illustrative]\n\n## Voice\n- sounds like: \"If it means I never type a close date again, fine. If it means my manager reads my deals before I do, no.\" [PM, illustrative]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| pain | Reps update Salesforce up to an hour a day, mainly to keep managers happy | https://beyondsnakeoil.substack.com/p/just-let-ai-help-you-sell-more |\n| pain | About 2 hours a week of manual data entry (Gen Z sellers) | https://www.salesforce.com/news/stories/state-of-sales-report-announcement-2026/ |\n| pain | A seller says Salesforce upkeep points hit especially hard | https://news.ycombinator.com/item?id=33132951 |\n| objection | Call recordings stored but almost never reviewed | https://news.ycombinator.com/item?id=33132951 |\n| workaround | Quarter-end close dates set to answer the manager | https://www.thesalesblog.com/blog/lies-mistruths-and-fabrications-in-your-sales-forecast |\n| pain | Activity Capture disconnects silently after a password reset (search result only) | https://ideas.salesforce.com/s/idea/a0B8W00000GdVXoUAN/einstein-activity-capture-notification-of-disconnected-account |\n\n**Grounding:** 28 tagged fields: 10 sourced, 18 `[PM, illustrative]`, 0 `[assumed]`.\n", "research/personas/p3-elena.md": "# p3 · Elena, revenue operations lead\n\n> Illustrative synthetic persona. Not a real person. Built from public sources and invented product-manager input, tagged `[PM, illustrative]`.\n\nmodelled_on: the revenue operations lead at the ideal customer in `../icp.md`, who is also the Salesforce admin [PM, illustrative]\npanel_role: sceptic\n\n## Background\n- organisation: B2B software, about 300 employees, North America [PM, illustrative]\n- group position: one of two revenue operations people; reports to the VP of sales, works closely with finance [PM, illustrative]\n- role and tenure: revenue operations lead, four years; certified Salesforce admin [PM, illustrative]\n- runs on: Sales Cloud Setup, reports and flows, validation rules, Gong admin, spreadsheets for reconciliation [source: https://revengine.substack.com/p/automatically-nudging-reps-to-update]\n\n## Business\n- who signs: she doesn't sign, but she can block anything that touches the data model [PM, illustrative]\n- budget route: renewal; she owns the Salesforce renewal paperwork [PM, illustrative]\n- what they are measured on: Salesforce data accuracy and completeness; forecast accuracy [source: https://builtin.com/job/manager-revenue-operations-analytics/7780783] [source: https://jobs.workable.com/jobs/732e5b77-61c5-404f-9e4f-538f937b6ef6.md]\n- renewal or contract moment: February [PM, illustrative]\n\n## Psychology\n- attitude to change: cautious [PM, illustrative]\n- trust in AI: low until she can audit it; trust ranks above cost as admins' biggest barrier [source: https://www.salesforceben.com/5-reasons-salesforce-professionals-distrust-ai/]\n- burned by: Activity Capture, whose captured email couldn't be used in reports, so she rebuilt activity reporting [source: https://revenuegrid.com/blog/einstein-activity-capture-limitations/] (competitor's account)\n- will not tolerate: anything writing to opportunity fields without a log of who confirmed it and why [PM, illustrative]\n- would pay for: no more bulk resets of close dates and no more \"why doesn't this match?\" tickets [source: https://www.revopscoop.com/post/salesforce-forecasting]\n\n## Capability\n- tech comfort: high [PM, illustrative]\n- data they hold: the whole org: opportunities, field history, validation rules, forecast settings; she knows which fields are junk [source: https://revengine.substack.com/p/automatically-nudging-reps-to-update]\n- time they can give a new tool: whatever the setup takes, but she has none to spare; admins manage more users than ever [source: https://www.appsruntheworld.com/survey-finds-agentforce-enriching-salesforce-admins-with-a-catch/]\n\n## The problem, through their eyes\n- the problem in their words: \"The data is junk, so the forecast is junk, and I'm the one who gets asked why.\" [source: https://revengine.substack.com/p/automatically-nudging-reps-to-update] (paraphrased)\n- how often it hits them, and what it costs them: weekly clean-ups and a reset each quarter; about 8 hours a week [PM, illustrative]\n- what they do about it today: validation rules, nudging flows that loop in the manager after three reminders, scheduled resets [source: https://revengine.substack.com/p/automatically-nudging-reps-to-update]\n- options they've tried or considered: Activity Capture; tested Agentforce in Setup and found it slower than doing it herself [source: https://www.getclientell.com/salesforce-blogs/what-salesforce-admins-are-saying-about-agentforce-2026] (vendor blog quoting admins)\n- what would make them switch: a log of every change, rules she controls, and fewer tickets within a quarter [PM, illustrative]\n- what worries them about a new way: errors she can't trace; another add-on with unclear credits; being the one who owns it when it breaks [source: https://oliv.ai/blog/agentforce-sales-coach] (unclear pricing per reviews quoted by a competitor)\n\n## Behaviour\n- a normal day: tickets from reps and managers in the morning, report fixes and a flow change in the afternoon, a reconciliation with finance before the forecast call [PM, illustrative]\n- workarounds: exports to spreadsheets to reconcile the forecast; a scheduled job for past-due dates [source: https://www.revopscoop.com/post/salesforce-forecasting]\n- last time it went wrong: a rule requiring a reason for a pushed close date broke on the second push, and reps learned to type anything [source: https://trailhead.salesforce.com/trailblazer-community/feed/0D54S00000A8Jy9SAF] (seen in search results only)\n- how they buy: reads Salesforce Ben and the Trailblazer Community, asks peers, tests in a sandbox before anyone signs [PM, illustrative]\n\n## Voice\n- sounds like: \"Show me the log. If I can't see who changed it and why, it doesn't go near the forecast.\" [PM, illustrative]\n\n## Evidence log\n| Kind | Evidence | Source |\n|---|---|---|\n| workaround | A flow nudges owners about past-due dates and adds the manager after three reminders | https://revengine.substack.com/p/automatically-nudging-reps-to-update |\n| workaround | Scheduled reset of past-due close dates | https://www.revopscoop.com/post/salesforce-forecasting |\n| objection | Trust is admins' top AI barrier (29.3% against 16.1% for cost) | https://www.salesforceben.com/5-reasons-salesforce-professionals-distrust-ai/ |\n| pain | Admins manage more users than in 2020; a solo admin is drowning | https://www.appsruntheworld.com/survey-finds-agentforce-enriching-salesforce-admins-with-a-catch/ |\n| objection | Admins found Agentforce in Setup slower than doing it themselves | https://www.getclientell.com/salesforce-blogs/what-salesforce-admins-are-saying-about-agentforce-2026 |\n| pain | Activity Capture email outside reports and flows (competitor) | https://revenuegrid.com/blog/einstein-activity-capture-limitations/ |\n| budget signal | Revenue operations postings measure data accuracy and forecast accuracy | https://builtin.com/job/manager-revenue-operations-analytics/7780783 |\n\n**Grounding:** 28 tagged fields: 13 sourced, 15 `[PM, illustrative]`, 0 `[assumed]`.\n", "research/personas/p4-sam.md": "# p4 · Sam, financial advisor\n\n> Illustrative synthetic persona. Not a real person. Built from public sources and invented product-manager input, tagged `[PM, illustrative]`.\n\nmodelled_on: a mid-size registered investment adviser (RIA) on a Salesforce-based CRM, from the adjacent segment in `../../problem/framings.md` [PM, illustrative]\npanel_role: influencer\n\n## Background\n- organisation: RIA with about 40 advisors across three offices, US [PM, illustrative]\n- group position: independent; the operations lead and managing partner choose the tech stack [assumed]\n- role and tenure: senior advisor, 12 years, about 150 client
